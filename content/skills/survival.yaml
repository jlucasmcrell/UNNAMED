name: Survival
family: world
notes: Wilderness competence, and the hide and cloth work of a camp - the leather and outfitting recipes and the repair of hide, wool and bow practise it. Gathering no longer does, because D13 SKILLS_AND_TECHNIQUES.md §2.7 gives the land to mining, herbalism, foraging, logging and skinning, so the level-3 gather_yield passive went to those skills with it. D13's own Survival rises on a night or a storm come through on what you had, which the build does not model yet.
teaches: "Mending hide and cloth, and carrying what you carry through country that does not want you in it."
