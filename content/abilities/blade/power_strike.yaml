id: ability.blade.power_strike
kind: ability
schema: 1
display_key: ability.blade.power_strike.name
tags: [ability]
name: Power Strike
notes: The blade's active technique (D11; DATA_MODEL.md §4.7's example). The sword's own swing, wound up longer and landed harder, and a cut that may bleed. Kera teaches it. Every number is provisional.
class: active
discipline: skill.one_hand_blade
cost: { stamina: 22 }
cooldown_s: 6
windup_multiplier: 1.5
payload:
  - { type: damage, multiplier_of_weapon: 1.6 }
  - { type: apply_effect, effect_ref: effect.bleeding, chance: 0.5 }
# PRG-29: the record every acquisition reads. A blade technique wants the arm to swing it; the bar is the lowest the game can give, so no
# starting character is refused, and a character built without an arm is refused in words ("Short of Might: 0 of 1").
requires:
  - { kind: attribute, attribute: Might, min: 1 }
