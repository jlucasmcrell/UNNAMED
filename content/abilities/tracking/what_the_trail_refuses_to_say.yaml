name: What the Trail Refuses to Say
notes: Canon E, the last rung - "know the limits of your own read - age, water, stone, and honest uncertainty". Without it a read over ground that keeps nothing, or a trail too old to date, comes back confident and wrong; with it, the read is marked uncertain and says which limit it ran into.
