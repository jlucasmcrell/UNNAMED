notes: "A slow mend (content bible §13 - Vital holds recovery). The ember salve's work done by hand: 36 health over six seconds, and it can be broken by a wound because it is slow. Costs more Focus than the Mending Thread and mends more; the Thread still stops what kills, and this does not. Complexity 3."
