name: Set the Bone
notes: "Tissue and bone (MAGIC_SUPERNATURAL_AND_COSMIC_SYSTEMS.md \"Core domains - Vital / Restoration\": bleeding control, tissue, bone...). The mend a body is taught before the thread: it puts the salve's own Mending on the caster and nothing else, so it closes no bleed and lifts no poison - it is the working that keeps a hurt caster on their feet, at half the Mending Thread's cost."
domain: skill.vital
