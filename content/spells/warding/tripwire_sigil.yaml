name: Tripwire Sigil
notes: "Alarms (MAGIC_SUPERNATURAL_AND_COSMIC_SYSTEMS.md \"Core domains - Warding\": ...alarms...). A ward a body sets and leaves: the Tripwire Ward, an alarm the moment it is crossed, undone by Quiet the Ward, a rune key or something crossing it first. Slower to draw than a seal and slower again to bring, because a placed alarm is meant to wait. Not offered before the Quiet Seal is known."
