name: Quiet Seal
notes: "Containment (MAGIC_SUPERNATURAL_AND_COSMIC_SYSTEMS.md \"Core domains - Warding\": barriers, seals, anti-scrying, containment, alarms). A seal drawn over the body that holds its own sound in: the Muffled effect, which is what makes a heavy boot quiet on stone and a working quiet in the next room. The first warding a body learns that keeps nothing out - it keeps the caster in."
