name: Loose the Root
notes: "A containment lifted (MAGIC_SUPERNATURAL_AND_COSMIC_SYSTEMS.md \"Core domains - Warding\": containment). A ward is a thing that holds a body where it stands; this working reads the one already on the caster and unpicks it, which is the same discipline turned around. Cheap for what it is, and the only answer a caster has to a herder's snare. Not offered before the Quiet Seal is known."
