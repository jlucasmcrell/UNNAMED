name: Herbalist
tagline: "You know which plants kill and which only taste like it."
description: "You know which plants kill and which only taste like it, and you know it by the leaf and the ground rather than by a book. You can take a cutting without spoiling its virtue, dry it so it keeps, and put it to work on a person without guessing at the dose."
recognition: { npc_ref: npc.ashen_hollow.sel_arien, line: "Don't wash it. I mean it. Washing it changes it and then I am measuring you." }
notes: "D14 Call (design, 2026-10-28) - the herbalism start (D13 §3.6, §3.5). Needs skill.herbalism and skill.herbal_medicine. Grants no recipe or formula: the salve recipes stay with Sel, Kera and Tam, as shipped."
attribute_bias: { insight: 2, will: 1, endurance: 1 }
skills: { skill.herbalism: 15, skill.herbal_medicine: 15 }
