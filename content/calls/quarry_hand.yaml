name: Quarry hand
tagline: "You worked a face until the face was worked out."
description: "You worked a seam until the seam was done. You know a face by its sound and its colour, you can prop a roof so it stays up, and you can tell where the next seam runs before anybody digs for it. You have also seen what happens when somebody hurries."
recognition: { npc_ref: npc.ashen_hollow.kera_voss, line: "Ha — that's a quarry shoulder. You've broken stone, not heated it. Come here, let me see your hands." }
notes: "D14 Call (design, 2026-10-28) - the mining and prospecting start (D13 §3.6). Needs skill.mining and skill.prospecting. Grants no technique."
attribute_bias: { might: 1, endurance: 2, insight: 1 }
skills: { skill.mining: 15, skill.prospecting: 15 }
kit:
  - { item_ref: item.material.iron_ore, count: 3 }
  - { item_ref: item.armor.hide_cap, count: 1, equip: true }
