name: Scholar
tagline: "You came to see the stone for yourself."
description: "The books disagree about the old stones out here, so you came to see one for yourself. You read old hands, and you know the Pacha account and the Other account for what they are: two vocabularies for one strangeness."
recognition: { npc_ref: npc.ashen_hollow.sel_arien, line: "You read. Thank the quiet for that. Most people who come off that road can't." }
