id: call.cartographers_apprentice
kind: call
schema: 1
display_key: call.cartographers_apprentice.name
tags: [call]
name: Cartographer's apprentice
tagline: "Somebody paid you to draw it properly."
description: "Somebody paid you to draw it properly, and you did, which is rarer than it sounds. You can follow a chain and a bearing, record a line so another person can walk it, and say how sure you are instead of guessing quietly. You have never handed in a map you would not walk by."
recognition: { npc_ref: npc.ashen_hollow.sel_arien, line: "You came over the ridge and you can already tell me which way it runs. Good. Write it down before somebody tells you what it was." }
notes: "D14 Call (design, 2026-10-28) - the cartography and navigation start (D13 §3.7, MAPS_CARTOGRAPHY_AND_WORLD_KNOWLEDGE §7). Needs skill.cartography and skill.navigation. Grants no technique."
attribute_bias: { will: 2, insight: 1, precision: 1 }
skills: { skill.cartography: 15, skill.navigation: 15 }
kit:
  - { item_ref: item.material.feathers, count: 3 }
  - { item_ref: item.consumable.salve_minor, count: 1 }
