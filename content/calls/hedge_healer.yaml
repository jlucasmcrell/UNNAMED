id: call.hedge_healer
kind: call
schema: 1
display_key: call.hedge_healer.name
tags: [call]
name: Hedge healer
tagline: "Someone always needs mending."
description: "Someone on the frontier always needs mending, and pays in whatever they have, so you learned to do the mending. You know the frontier herbs and what they do, and you know wounds and fevers when you see them."
recognition: { npc_ref: npc.ashen_hollow.renn_vale, line: "A healer? Then the salve in that chest is better in your hands than in mine." }
notes: A CC-0 Call (accepted OD-C03; C11:43-49, 109; OR:85-98). Built only from existing items, skills and NPCs; the contact is Cairnwold's well-keeper, who knows what grows on the moor. The bias, skills, kit and contact are working choices pending the C11 text, which is not in this repo. It knows no formula and carries no woundmoss, so Sel's survey is walked as before.
attribute_bias: { will: 2, endurance: 1, insight: 1 }
skills: { skill.vital: 15, skill.survival: 15 }
kit:
  - { item_ref: item.consumable.salve_minor, count: 2 }
contact: { npc_ref: npc.cairnwold.mara_ling, trust: 5 }
