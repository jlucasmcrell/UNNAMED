name: Hunter
tagline: "The game moved on, and so did you."
description: "The game moved on and you moved after it. You can read a trail, wait longer than a deer can be nervous, and put an arrow where you were looking; and you have butchered enough to know what a hide is worth before you cut it."
recognition: { npc_ref: npc.ashen_hollow.renn_vale, line: "You came over the ridge quiet. Charwood will suit you — mind the hound." }
notes: "D14 Call (design, 2026-10-28) - the pack's PT-era ranged start (11_CALLS 5.3), kept. Ships with existing skills, items and NPCs; grants no technique."
