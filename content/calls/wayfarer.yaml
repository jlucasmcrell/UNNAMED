name: Wayfarer
tagline: "The road kept going, so you did."
description: "The road was the only thing that kept going, and you went with it. You know the waystation customs and what the Waystones are, an old network of travellers' stones. It is not your first road, and the boots show it."
recognition: { npc_ref: npc.ashen_hollow.renn_vale, line: "Those boots have been further than this road. Not your first, then." }
