# WORLD HOOKS â€” the machine-readable minimums
#
# Brief D15. This file is the single machine-readable source for "what the world must place, for
# which skill or system to be usable anywhere". `canon/WORLD_HOOKS.md` is its prose half, the area
# dossiers under `canon/areas/` are its per-place half, and `content hooks` (src/Content
# WorldHookChecks.cs) is its checker. Change a minimum here and all three follow.
#
# THE GATE (owner, 2026-10-28), which every brief and every dossier repeats verbatim:
# "BEFORE FINISHED: run the hooks lint for the area you touched, update its dossier HOOKS CHECKLIST,
# and list every new skill/technique/system you added together with the hook you placed for it.
# Nothing ships with a skill that has nowhere to be used."
#
# THREE STATES, and why the third exists. A hook is reported OK when the content shows evidence of
# it, MISSING when the content could show it and does not, and UNMODELLED when today's content model
# cannot express it at all (no `lock_tier` field on a container, no water body, no carcass). An
# UNMODELLED hook is never "fine": it is a content-model task, and the audit prints it every run.
# That is the point â€” a hook the schema cannot hold is exactly how "lockpicking with no locked door"
# happens.

meta:
  schema: 1
  brief: D15
  owner_ask: "Agents must never forget the world hooks our systems need."
  sources:
    - canon/SKILLS_AND_TECHNIQUES.md      # 105 skills, 608 technique records (D13, accepted)
    - canon/CALLS.md                      # starting packages (D14)
    - SYSTEMS_CHECKLIST.md                # 1,369 system rows
    - content/ (regions, locations, spawns, nodes, stations, npcs, routines, quests, recipes, readables)
  companion_docs:
    - canon/WORLD_HOOKS.md
    - canon/areas/_TEMPLATE.md
    - canon/areas/INDEX.md

# How a required count is scaled by the area's level band. A band-1 hollow and a band-6 moor do not
# need the same number of ore nodes. Structural hooks (a waystone, a notice board) do not scale.
band_scales:
  "1-5": 1.0
  "6-10": 1.5
  "11-15": 2.0
  "16+": 2.5

# An area is one dossier. `region_ref` is the region the placements live in; `locations` are the
# location ids the dossier owns (a region can hold several areas: the frontier holds the road,
# Cairnwold, the Foldscar, Old Late and the Field). The lint reports any location no area claims, so
# nothing goes quietly unowned.
areas:
  - slug: ashen-hollow
    name: Ashen Hollow and the waystation
    region_ref: region.starting_frontier
    locations: [location.outpost]
    type: town
    status: development      # released | development | planned
    band: "1-5"
  - slug: the-road
    name: The Old East Road and its waysides
    region_ref: region.starting_frontier
    locations: [location.road.basin_rim, location.road.lantern_shrine, location.road.overturned_wain, location.road.sunk_barrow, location.ruined_cart, location.herb_patch]
    type: road
    status: development
    band: "1-5"
  - slug: cairnwold
    name: Cairnwold and its hinterland
    region_ref: region.starting_frontier
    locations: [location.cairnwold.village, location.cairnwold.lodge, location.cairnwold.the_bog, location.cairnwold.the_crags, location.cairnwold.the_gorge, location.cairnwold.ash_stand, location.cairnwold.iron_seam]
    type: town
    status: development
    band: "1-5"
  - slug: blackvein-cut-and-barrowworks
    name: Blackvein Cut and the Barrowworks
    region_ref: [region.starting_frontier, region.barrowworks]   # the Cut is open ground; the Barrowworks is its interior
    locations: [location.blackvein_cut, location.barrowworks.r01_threshold, location.barrowworks.intake_hall, location.barrowworks.r03_wash_passage, location.barrowworks.r04_drain_mouth, location.barrowworks.r05_sorting_floor, location.barrowworks.r06_still_bay, location.barrowworks.r08_return_gallery, location.barrowworks.r11_measuring_court, location.barrowworks.r13_inspection_bay, location.barrowworks.service_vestibule, location.barrowworks.gauge_archive, location.barrowworks.blind_store, location.barrowworks.headworks]
    portals_from: [region.starting_frontier]   # the way in (Threshold, Drain Mouth) is authored from outside
    type: dungeon
    status: development
    band: "1-5"
  - slug: foldscar
    name: The Foldscar
    region_ref: region.starting_frontier
    locations: [location.foldscar]
    type: wilderness
    status: development
    band: "1-5"
  - slug: old-late
    name: Old Late
    region_ref: region.starting_frontier
    locations: [location.old_late]
    type: wilderness
    status: development
    band: "1-5"
  - slug: den-gorge-and-rope-cave
    name: The Den gorge and the rope cave
    region_ref: [region.starting_frontier, region.den_gorge_cave]
    locations: [location.den_gorge, location.den_mouth, location.den_gorge.hollow, location.den_gorge.ledge]
    portals_from: [region.starting_frontier]   # Halda's rope and the cleft are authored from the gorge lip
    type: wilderness
    status: development
    band: "1-5"
  - slug: the-field-ruins
    name: The Field ruins (the Spill and the Stopped Gate)
    region_ref: region.starting_frontier
    locations: [location.field.the_spill, location.field.stopped_gate]
    type: ruin
    status: development
    band: "1-5"
  - slug: ashen-hollow-standalone
    name: Ashen Hollow (the standalone 200 m region)
    region_ref: region.ashen_hollow
    locations: []
    type: town
    status: development
    band: "1-5"

# The evidence vocabulary the checker understands. Every hook names one. `unmodelled` means the
# content model cannot carry it yet and says why, in words a task can be cut from.
#   any_field:      {section, field}                      entries in a region section that carry the field
#   any_field_min:  {section, field, at_least}            entries whose numeric field is >= at_least
#   field_equals:   {section, field, equals}              entries whose field equals a value
#   spawn:          {archetype?, level_min?, level_max?}  spawns in the region, filtered
#   spawn_pack:     {min_count}                           spawns that place at least min_count creatures
#   teaches:        {kind}                                NPCs (content scope) teaching that kind
#   npc_services:   {service}                             NPCs offering a service
#   location:       {kind_of_place}                       locations of a kind
#   node:           {prefix}                              region nodes by content-node prefix
#   readable_field: {field}                               readables carrying a field
#   unmodelled:     {why}                                 schema cannot hold it yet

hooks:

  # ---------------------------------------------------------------------------------------------
  # LOCKS, SEALS AND TRAPS â€” Locks and mechanisms (skill.lockpicking), traps, sealed doors
  # ---------------------------------------------------------------------------------------------
  - { id: HOOK.LOCK.CONTAINER.T1, class: placeable, scope: area, skills: [skill.lockpicking], evidence: {any_field: {section: containers, field: lock_tier}}, min: {town: 1, road: 1, wilderness: 1, ruin: 2, dungeon: 3, water: 2}, band_scaled: false, note: "A chest or cache with a pickable lock at tier 1-2. Today containers carry only loot_ref: a lock has nowhere to live." }
  - { id: HOOK.LOCK.CONTAINER.T3, class: placeable, scope: area, skills: [skill.lockpicking], evidence: {any_field_min: {section: containers, field: lock_tier, at_least: 3}}, min: {ruin: 1, dungeon: 2}, band_scaled: false, note: "A master-tier lock, the one that pays a specialist." }
  - { id: HOOK.LOCK.DOOR.T1, class: placeable, scope: area, skills: [skill.lockpicking], evidence: {any_field: {section: doors, field: lock_tier}}, min: {town: 1, ruin: 1, dungeon: 2}, band_scaled: false, note: "A door that opens to a pick rather than a flag or a fitted wedge. Doors today carry flag_ref, requirement and fitted: quest gates, not locks." }
  - { id: HOOK.SEAL.GATED, class: placeable, scope: area, skills: [skill.lockpicking, skill.lore], evidence: {any_field: {section: doors, field: requirement}}, min: {ruin: 1, dungeon: 1}, band_scaled: false, note: "A door that will not open for a lock but for knowledge, a wedge or a dead keeper. This is what the build has instead of locks." }
  - { id: HOOK.TRAP.SNARE, class: placeable, scope: area, skills: [skill.survival, skill.hunting, skill.foraging], evidence: {node: {prefix: trap}}, min: {wilderness: 2, road: 1, water: 1}, band_scaled: true, note: "Set and cleared snares (node.trap.*), the hunting and survival loop's floor." }
  - { id: HOOK.TRAP.MECHANISM, class: placeable, scope: area, skills: [skill.lockpicking, skill.mechanisms], evidence: {unmodelled: {why: "no traps section in a region and no trap kind in content/"}}, min: {ruin: 2, dungeon: 3}, band_scaled: false, note: "Pressure plates, dart runs, falling weights: what disarm and set need." }
  - { id: HOOK.LOCK.SEAL, class: placeable, scope: area, skills: [skill.lockpicking, skill.otherlore], evidence: {unmodelled: {why: "no seal kind; barriers are world-state folds, not seals"}}, min: {ruin: 1}, band_scaled: false, note: "A seal opened by knowledge and skill rather than by a pick." }

  # ---------------------------------------------------------------------------------------------
  # MINING, PROSPECTING, AND THE UNDERGROUND â€” skill.mining, skill.prospecting, skill.excavation
  # ---------------------------------------------------------------------------------------------
  - { id: HOOK.NODE.ORE, class: node, scope: area, skills: [skill.mining, skill.smithing], evidence: {node: {prefix: ore}}, min: {wilderness: 2, ruin: 1, dungeon: 3, water: 1}, band_scaled: true, note: "Any ore node. The build has iron only: loose_iron and the finite iron_seam." }
  - { id: HOOK.NODE.ORE.T2, class: node, scope: area, skills: [skill.mining, skill.prospecting], evidence: {any_field: {section: nodes, field: tier}}, min: {wilderness: 1, dungeon: 2}, band_scaled: true, note: "A second ore grade above iron (grey iron, then bog iron's betters), required for the crafting ladder above standard." }
  - { id: HOOK.NODE.GEM, class: node, scope: area, skills: [skill.mining, skill.jewelcraft], evidence: {unmodelled: {why: "no gem or crystal resource exists"}}, min: {ruin: 1, dungeon: 1}, band_scaled: false, note: "A gem or crystal deposit: jewelcraft and lapidary have no node at all." }
  - { id: HOOK.NODE.SALVAGE, class: node, scope: area, skills: [skill.salvage, skill.engineering], evidence: {unmodelled: {why: "no salvage node kind; salvage has no resource in content/resources"}}, min: {ruin: 2, dungeon: 1}, band_scaled: false, note: "A wreck, a dead engine, a plate to strip: the technology ladder's only door in." }
  - { id: HOOK.PROSPECT.SIGN, class: placeable, scope: area, skills: [skill.prospecting], evidence: {unmodelled: {why: "a prospectable seam would need a hidden-deposit flag on the node; nodes are placed visibly"}}, min: {wilderness: 2}, band_scaled: true, note: "Ground that reads as ore before it is dug: reading colour, weight and water is prospecting's whole activity." }
  - { id: HOOK.NODE.SKILL_BOUND, class: node, scope: area, skills: [skill.mining, skill.herbalism, skill.logging, skill.foraging, skill.skinning], evidence: {node_skill: {not_skill: "skill.survival"}}, min: {wilderness: 1}, band_scaled: false, note: "A node whose harvest_skill names the skill that should rise from it." }
  # ---------------------------------------------------------------------------------------------
  # GATHERING AND FOOD â€” herbalism, foraging, woodcutting, fishing, hunting, skinning, cooking
  # ---------------------------------------------------------------------------------------------
  - { id: HOOK.NODE.HERB, class: node, scope: area, skills: [skill.herbalism, skill.herbal_medicine], evidence: {node: {prefix: herb}}, min: {town: 1, road: 1, wilderness: 2, ruin: 1, water: 2}, band_scaled: true, note: "Herb nodes by name (woundmoss, boneleaf, ashbloom)." }
  - { id: HOOK.NODE.WOOD, class: node, scope: area, skills: [skill.logging, skill.woodworking], evidence: {node: {prefix: wood}}, min: {wilderness: 2, water: 2}, band_scaled: true, note: "Standing and fallen timber." }
  - { id: HOOK.NODE.FIBRE, class: node, scope: area, skills: [skill.foraging, skill.tailoring], evidence: {node: {prefix: fibre}}, min: {wilderness: 1, town: 1, water: 1}, band_scaled: true, note: "Fibre and cordage (bog cotton)." }
  - { id: HOOK.NODE.RESIN, class: node, scope: area, skills: [skill.foraging, skill.smithing], evidence: {node_ref: {ref: "node.wood.pine_resin"}}, min: {wilderness: 1, water: 1}, band_scaled: false, note: "Resin and pitch: the other half of the torch and the fire kit." }
  - { id: HOOK.NODE.CARCASS, class: node, scope: area, skills: [skill.skinning, skill.hunting, skill.cooking], evidence: {node: {prefix: "carcass"}}, min: {wilderness: 2, road: 1}, band_scaled: true, note: "A body worth skinning after the kill: skinning's only possible hook." }
  - { id: HOOK.WATER.FISH, class: node, scope: area, skills: [skill.fishing, skill.survival], evidence: {unmodelled: {why: "no water body in content; regions carry terrain heights and no water surfaces"}}, min: {wilderness: 1, road: 1, water: 3}, band_scaled: false, note: "A fishable water: river, pond, lake or coast, each with its own catch table." }
  - { id: HOOK.WATER.SIP, class: node, scope: area, skills: [skill.survival, skill.foraging], evidence: {water: {any: true}}, min: {town: 1, road: 1, wilderness: 2, ruin: 1, dungeon: 1, water: 2}, band_scaled: false, note: "Fresh water a body can reach and drink from: a declared water (waters:) whose bank is within reach, or a well blocker. The flask refill reads the same rule (Camps.WaterNear)." }
  - { id: HOOK.GATHER.REGION_YIELD, class: node, scope: area, skills: [skill.foraging, skill.farming], evidence: {unmodelled: {why: "no field, orchard or herd node kind; farming and husbandry have no ground"}}, min: {}, band_scaled: false, note: "An authored crop, herd or orchard for the farming and husbandry skills (expansion)." }

  # ---------------------------------------------------------------------------------------------
  # CRAFTING STATIONS â€” smithing, armoursmithing, weaponsmithing, alchemy, cooking, leatherwork,
  # tailoring, carpentry, mechanisms, engineering, electronics, fabrication, gunsmithing, medicine,
  # salvage, jewelcraft, artifice, bowyery, masonry, woodworking
  # ---------------------------------------------------------------------------------------------
  - { id: HOOK.STATION.FORGE, class: placeable, scope: area, skills: [skill.smithing, skill.armoursmithing, skill.weaponsmithing], evidence: {field_equals: {section: stations, field: kind, equals: forge}}, min: {town: 1, ruin: 1, dungeon: 1, water: 1}, band_scaled: false, note: "A forge hearth." }
  - { id: HOOK.STATION.ANVIL, class: placeable, scope: area, skills: [skill.smithing, skill.weaponsmithing], evidence: {field_equals: {section: stations, field: kind, equals: anvil}}, min: {town: 1, water: 1}, band_scaled: false, note: "An anvil; the mesh is audio-and-icon only today (SKILLS Â§10.4)." }
  - { id: HOOK.STATION.WORKBENCH, class: placeable, scope: area, skills: [skill.woodworking, skill.carpentry, skill.leatherworking, skill.tailoring, skill.bowyery], evidence: {field_equals: {section: stations, field: kind, equals: workbench}}, min: {town: 1, water: 1}, band_scaled: false, note: "A bench for the trades that are not hot metal." }
  - { id: HOOK.STATION.COOKFIRE, class: placeable, scope: area, skills: [skill.cooking], evidence: {field_equals: {section: stations, field: kind, equals: cookfire}}, min: {town: 1, road: 1, wilderness: 1, water: 1}, band_scaled: false, note: "A cookfire, including the camp's (brief C3)." }
  - { id: HOOK.STATION.ALEMBIC, class: placeable, scope: area, skills: [skill.alchemy, skill.herbal_medicine], evidence: {field_equals: {section: stations, field: kind, equals: alembic}}, min: {town: 1, ruin: 1, water: 1}, band_scaled: false, note: "An alembic or still for alchemy; no such station kind exists." }
  - { id: HOOK.STATION.TANNING, class: placeable, scope: area, skills: [skill.leatherworking, skill.skinning], evidence: {field_equals: {section: stations, field: kind, equals: tanning_rack}}, min: {town: 1}, band_scaled: false, note: "A tanning rack, for hides that a carcass hook would have produced." }
  - { id: HOOK.STATION.KILN, class: placeable, scope: area, skills: [skill.masonry, skill.smithing], evidence: {field_equals: {section: stations, field: kind, equals: kiln}}, min: {town: 1}, band_scaled: false, note: "A kiln for brick, lime and charcoal." }
  - { id: HOOK.STATION.LOOM, class: placeable, scope: area, skills: [skill.tailoring], evidence: {field_equals: {section: stations, field: kind, equals: loom}}, min: {town: 1}, band_scaled: false, note: "A loom." }
  - { id: HOOK.STATION.ENGINEERING, class: placeable, scope: area, skills: [skill.engineering, skill.mechanisms, skill.fabrication, skill.electronics, skill.gunsmithing], evidence: {field_equals: {section: stations, field: kind, equals: engine_bench}}, min: {town: 1, ruin: 1}, band_scaled: false, note: "A bench with a vice and a lathe, for the whole technology ladder. Nothing of the kind exists." }
  - { id: HOOK.STATION.SALVAGE_BENCH, class: placeable, scope: area, skills: [skill.salvage], evidence: {field_equals: {section: stations, field: kind, equals: salvage_bench}}, min: {ruin: 1}, band_scaled: false, note: "A place to take a thing apart without losing the parts." }
  - { id: HOOK.STATION.ARCHIVE, class: placeable, scope: area, skills: [skill.research, skill.lore, skill.siann_scholarship], evidence: {field_equals: {section: stations, field: kind, equals: archive}}, min: {town: 1, ruin: 1}, band_scaled: false, note: "An archive or table where study (the S learning source) can happen." }
  - { id: HOOK.STATION.NOTICE_BOARD, class: placeable, scope: area, skills: [skill.lore, skill.barter], evidence: {field_equals: {section: stations, field: kind, equals: notice_board}}, min: {town: 1, water: 1}, band_scaled: false, note: "The contracts board: bounty content's front door." }
  - { id: HOOK.RECIPE.STATION_BOUND, class: station, scope: content, skills: [skill.smithing, skill.cooking, skill.alchemy], evidence: {unmodelled: {why: "recipes name their station loosely; the hooks audit cannot prove each recipe resolves to a placed station in the area it is taught"}}, min: {}, band_scaled: false, note: "Every taught recipe has a station for it in the area it is taught in." }

  # ---------------------------------------------------------------------------------------------
  # TEACHING AND KNOWLEDGE â€” the nine learning sources of SKILLS Â§3.0
  # 452 of 608 techniques name a teacher; 48 a book; 62 a quest; 87 a study; 27 an artifact; 140 a culture.
  # ---------------------------------------------------------------------------------------------
  - { id: HOOK.TEACHER.TECHNIQUE, class: npc, scope: area, skills: [skill.teaching], evidence: {teaches: {kind: technique}}, min: {town: 1, road: 1, ruin: 1, water: 1}, band_scaled: true, note: "A teacher who teaches a technique, not a recipe. Two do today (Kera Voss, Tavar Orr, Durn Skell)." }
  - { id: HOOK.TEACHER.RECIPE, class: npc, scope: area, skills: [skill.smithing, skill.cooking, skill.alchemy], evidence: {teaches: {kind: recipe}}, min: {town: 1, water: 1}, band_scaled: true, note: "A trade teacher for recipes." }
  - { id: HOOK.TEACHER.PIECE, class: npc, scope: area, skills: [skill.carpentry], evidence: {teaches: {kind: building_piece}}, min: {town: 1}, band_scaled: false, note: "A teacher of building pieces (Berrin Garth)." }
  - { id: HOOK.TEACHING.BOOK, class: readable, scope: area, skills: [skill.research, skill.lore, skill.lockpicking], evidence: {knowledge_in_area: {books: true}}, min: {town: 1, ruin: 2, dungeon: 1}, band_scaled: false, note: "A book in the area that teaches: an item with use.grants lying in a container there, or handed over by an NPC in their own dialogue. The 79 readables are lore pages and teach nothing; the teaching carriers are items." }
  - { id: HOOK.TEACHING.STUDY, class: placeable, scope: area, skills: [skill.research], evidence: {unmodelled: {why: "study is a station plus a source; no station_kind or source field makes a study site"}}, min: {town: 1, ruin: 1}, band_scaled: false, note: "A station and a source together: the S learning source's only home." }
  - { id: HOOK.TEACHING.ARTIFACT, class: item, scope: content, skills: [skill.lore], evidence: {unmodelled: {why: "no item carries a teaches block; artifacts teach nothing yet"}}, min: {}, band_scaled: false, note: "An object that teaches. 27 techniques name the A source." }
  - { id: HOOK.TEACHING.CULTURE, class: npc, scope: area, skills: [skill.languages, skill.keeping], evidence: {unmodelled: {why: "no culture or faction teaching site; the C source has no institution in content"}}, min: {town: 1}, band_scaled: false, note: "A people or faction that trains its own, on terms. 140 techniques name the C source, the largest single gap in the catalogue." }
  - { id: HOOK.TEACHING.TRIAL, class: placeable, scope: area, skills: [skill.tactics], evidence: {unmodelled: {why: "no trial or master-gate kind; band-60 and band-75 lessons have no door"}}, min: {ruin: 1}, band_scaled: false, note: "The master's trial: the gate on every capstone." }

  # ---------------------------------------------------------------------------------------------
  # TRAVERSAL â€” climbing, swimming, ropes, and the way between places (brief D6)
  # ---------------------------------------------------------------------------------------------
  - { id: HOOK.TRAV.LADDER, class: placeable, scope: area, skills: [skill.climbing, skill.athletics], evidence: {unmodelled: {why: "climbing is a mesh-prefix rule (config.base_speeds: climbable_prefixes) read against structures, not an authored ladder with its own traversal, and D6's mantle now climbs it in game (accepted: a 1.33 m ladder against a 3.0 m wall, climbed rung by rung)"}}, min: {town: 1, ruin: 1, dungeon: 1, water: 1}, band_scaled: false, note: "A ladder, climbable at any height. None are authored." }
  - { id: HOOK.TRAV.ROPE, class: placeable, scope: area, skills: [skill.climbing], evidence: {any_field: {section: portals, field: gives_way}}, min: {}, band_scaled: false, note: "A rope or drop that gives way (Halda's rope at the Den). The only authored one." }
  - { id: HOOK.TRAV.CLIMB_FACE, class: placeable, scope: area, skills: [skill.climbing], evidence: {structure_prefix: {prefixes: [rock_, cw_crag_, den_rock_, cw_boulder_]}}, min: {wilderness: 2, ruin: 2, dungeon: 1}, band_scaled: false, note: "A face with handholds, climbable continuously." }
  - { id: HOOK.TRAV.GRAPPLE, class: placeable, scope: area, skills: [skill.climbing, skill.athletics], evidence: {unmodelled: {why: "no grapple anchor kind and no grapple animation"}}, min: {wilderness: 1, ruin: 1}, band_scaled: false, note: "A grapple point: the owner's own example of a skill with nowhere to be used." }
  - { id: HOOK.TRAV.VAULT_OBSTACLE, class: placeable, scope: area, skills: [skill.athletics], evidence: {unmodelled: {why: "vaultable height is a config number; no prop is tagged as an obstacle"}}, min: {town: 1, road: 2, ruin: 2}, band_scaled: false, note: "A fence, cart or low wall at walking height to vault." }
  - { id: HOOK.TRAV.SCRAMBLE_SLOPE, class: placeable, scope: area, skills: [skill.athletics, skill.climbing], evidence: {unmodelled: {why: "slope is terrain, not content; no authored steep grade with a scramble route"}}, min: {wilderness: 2}, band_scaled: false, note: "A steep grade the player scrambles rather than climbs." }
  - { id: HOOK.WATER.SWIM, class: placeable, scope: area, skills: [skill.swimming], evidence: {unmodelled: {why: "no water body"}}, min: {wilderness: 1, water: 2}, band_scaled: false, note: "Deep water to swim, with a shore on both sides." }
  - { id: HOOK.TRAV.WAYSTONE, class: placeable, scope: area, skills: [skill.navigation, skill.otherlore], evidence: {any_field: {section: waystones, field: key}}, min: {town: 1, road: 1, wilderness: 1, water: 1}, band_scaled: false, note: "An attunable waystone: fast travel's hook (brief D2)." }
  - { id: HOOK.TRAV.PORTAL, class: placeable, scope: area, skills: [skill.navigation], evidence: {any_field: {section: portals, field: key}}, min: {dungeon: 1, ruin: 1, water: 1}, band_scaled: false, note: "A door between spaces: the only way into an interior." }

  # ---------------------------------------------------------------------------------------------
  # COMBAT, DEATH AND THE CREATURES THAT TEACH IT â€” all 16 weapon skills, evasion, armour, tactics
  # ---------------------------------------------------------------------------------------------
  - { id: HOOK.ENEMY.T1, class: enemy, scope: area, skills: [skill.one_hand_blade, skill.unarmed, skill.evasion], evidence: {spawn: {level_max: 3}}, min: {road: 2, wilderness: 3, dungeon: 2, ruin: 2, water: 2}, band_scaled: true, note: "Something at level 1-3 to fight: the first lesson of every weapon skill." }
  - { id: HOOK.ENEMY.T2, class: enemy, scope: area, skills: [skill.two_hand_blade, skill.polearm, skill.armour_use], evidence: {spawn: {level_min: 4, level_max: 6}}, min: {wilderness: 1, dungeon: 2, ruin: 1, water: 1}, band_scaled: true, note: "A level 4-6 fight, where armour and committed blows matter." }
