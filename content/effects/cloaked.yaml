name: Cloaked
notes: "An optical cloak's shimmer (STEALTH.md 10): a body a quarter as likely to be read standing still, and six tenths while moving. It fails in rain, fog, dust and water, and it never makes a body invisible - an observer inside six metres sees the shimmer move."
