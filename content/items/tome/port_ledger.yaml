name: The Port Ledger
notes: >-
  The Tidepearl Exchange's working copybook: what the port's smiths and fletchers have been paid to make, season by season,
  with the patterns drawn out beside the tallies in a clerk's neat hand. Reading it teaches the trades it records - a
  merchant's book that happens to be a manual, because a merchant who cannot judge a smith's work pays too much for it.
