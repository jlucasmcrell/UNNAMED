name: Halda's Bow
notes: Halda Crowden's own bow, which Tam gives the character who brings Halda's tally home (Halda's Tally, the return choice). A notable bow a step past the hunting bow - 10 damage where it has 9, a 0.85 s draw where it has 0.9 - on the same rough arrows and the same might. Arrows that land train skill.bow, as the hunting bow's do. A notable find, it carries its own record (WP3a).
category: weapon
stack_max: 1
weight: 1.4
value_base: 70
item_class: notable
rarity: rare        # derived from item_class (DCP:903)
damage: [10, 10]
damage_type: physical_pierce
draw_time: 0.85
hands: two
ammo_item_ref: item.ammo.arrow_rough
skill_ref: skill.bow
sneak_multiplier: 2.0    # an arrow into a target that has not noticed the archer (STEALTH §7.1)
shot_noise_m: 6          # the twang, heard at the shooter (STEALTH §7.8)
requirements: { attribute.might: 9 }   # an attribute minimum, never a level (PROGRESSION.md §11.1)
durability_max: 200       # wear from use (WP3b, D5); worn out it counts as crude and is never lost
repair: { station: workbench, skill_ref: skill.survival, skill_min: 3, item_ref: item.material.bog_cotton }
