name: Hunting Bow
notes: Two-handed and ranged (PROTOTYPE.md §4.2) - 9 damage, 0.9 s draw, spends rough arrows. Arrows that land train skill.bow. An arrow into a body that has not noticed the archer is the bow's own double (STEALTH §7.1); the twang carries 6 m, a third of what a swung sword does (§7.8).
category: weapon
stack_max: 1
weight: 1.5
value_base: 36
rarity: common
damage: [9, 9]
damage_type: physical_pierce
draw_time: 0.9
hands: two
ammo_item_ref: item.ammo.arrow_rough
skill_ref: skill.bow
sneak_multiplier: 2.0    # an arrow into a target that has not noticed the archer (STEALTH §7.1)
shot_noise_m: 6          # the twang, heard at the shooter; not a swing (STEALTH §7.8)
requirements: { attribute.might: 9 }   # an attribute minimum, never a level (PROGRESSION.md §11.1)
durability_max: 200       # wear from use (WP3b, D5); worn out it counts as crude and is never lost
repair: { station: workbench, skill_ref: skill.survival, skill_min: 3, item_ref: item.material.bog_cotton }
