name: Light Crossbow
notes: The ambusher's bow (STEALTH §7.3, §7.11). Slower to loose than a bow and far harder when it lands; it can be carried cocked, which is the whole of its argument - a loaded crossbow is a shot already drawn. Loosed like a bow, so it is the bow's skill; 2.5x on a body that has not noticed the archer (§7.1), and its thunk carries 10 m where a bow's twang carries 6 (§7.8).
