notes: A short pipe and a glass dart of poppy and bog-myrtle (STEALTH 8; D23 S5). It does almost no harm - a scratch, a stumble - and puts what it hits to sleep where it stands, which on a route is worth more than a corpse. The pipe is quiet; the sleeper wakes fighting if anything wounds it.
