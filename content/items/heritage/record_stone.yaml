name: Record Stone
notes: In the game's voice, 'A palm-sized stone you have read many times. What is known is stone.' The Ondrek heritage item (owner, 2026-10-23, HERITAGE_ITEMS_PROPOSAL.md option A). From the Ondrek doctrine of the record - what is known is stone (MYTHOLOGY.md §Ondrek Belief). Identity, not power - no stat, no slot. Heritage (owner, 2026-10-24) - only its own people use, buy, sell, trade or are given it, and its value counts only among them; never dropped, and the people's keeper re-issues a lost one (HERITAGE_DESIGN.md §1.4). Whose stone it is stays open (LORE_OWNER_QUESTIONS.md Heritage H-7), so the words never say. The Ondrek are not playable, so nothing grants it yet.
