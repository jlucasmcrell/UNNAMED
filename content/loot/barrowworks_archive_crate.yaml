id: loot.barrowworks.archive_crate
kind: loot
schema: 1
display_key: loot.barrowworks.archive_crate.name
tags: [loot]
notes: "The gauge archive's service crate (M8-D1): the haft wood the ring's own ash stand could not supply in one day, and nothing else. It is convenience rather than the only supply - the stand at (24, 38) is authored and grows back daily, so the Unfinished Measure's acquire stage is reachable whether a character takes the crate, cuts the stand, or does both. All static: the contents are fixed, so a save that has opened it and one that has not roll the same table."
rolls: 0
guaranteed:
  - { item_ref: item.weapon.rusted_sword, count_range: [1, 1] }   # D21: a rolled piece, assembled in the chest
  - { item_ref: item.material.ash_haft, count_range: [2, 3] }
  - { item_ref: item.material.timber, count_range: [1, 1] }
  # D23 S7: what the storemen kept behind the gauge wall - a motion sensor and an optical cloak, both Keelward salvage, so the kit a stealth route
  # needs is findable in the place that most rewards it.
  - { item_ref: item.tool.detector_motion, count_range: [1, 1] }
  - { item_ref: item.armor.cloak_optical, count_range: [1, 1] }
  - { item_ref: item.tool.lure_stone, count_range: [2, 3] }
