display_key: chatter.b0003.name
tags: [chatter]
notes: AI-generated ambient corpus (batch b0003) - dry frontier small talk across four places and six time bands, carrying the world's calendar, peoples, stones, Calls and factions as passing remarks.
role: corpus
batch: b0003
lines:
  - { key: chat.b0003.0001, text: "Fine and light enough to see the crack over the shed door, and cold enough to care about it.", places: [ashen_hollow], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0002, text: "Touched the stone going in, the way you do. Nobody taught me that and I'd not stop.", speakers: [traveller], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0003, text: "Seam's coming up soft again. You hear it in the first blow and the whole morning goes slower.", speakers: [crafter], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0004, text: "Grey from the crags to the rim. The watch keeps the shrine lantern filled and the rest of us keep the gate.", speakers: [guard], places: [ashen_hollow], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0005, text: "Fog down in the low ground. You can hear the stop before you can see it.", places: [ashen_hollow], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0006, text: "Tally turned in the night. Half the stop's up early with no work to show for it.", speakers: [villager], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0007, text: "Rain since before light. The hens won't come off the perch and I don't blame them.", speakers: [herder], places: [ashen_hollow], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0008, text: "Wind's had my tarp loose twice. If it takes it a third time the tarp stays off.", speakers: [carter], places: [ashen_hollow], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0009, text: "Shed roof, then the culvert, then whatever the steward finds. The day was decided without me.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0010, text: "Two ways out of this stop and both were somebody's Call. Mine hasn't said which yet.", speakers: [adventurer], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0011, text: "Husks keep to the ring at the barrow. My traps are well off it and that's the arrangement.", speakers: [hunter], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0012, text: "Fine start and the ford's still running high. Anyone load-heavy wants company and the high track.", speakers: [villager], places: [ashen_hollow], times: [dawn], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0013, text: "Grey's settled in for the day. Everything soft, nothing drying, and the wood won't take a nail.", places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0014, text: "Iron's dear at Cairnwold and it stays dear. I mend what's here and lately I mend it twice.", speakers: [crafter], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0003.0015, text: "Load's down and the wain's up on blocks. Give me the morning and it's a cart again.", speakers: [carter], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0003.0016, text: "Sun on the wet stone. Half an hour of that and the yard's workable.", places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0017, text: "Folk who stop aging in their teens make poor drinking company. A Siann's heard it all before, and twice.", speakers: [traveller], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0003.0018, text: "Grey like this and the survey still asks its questions. Ask the watch instead and you'll get an answer.", speakers: [villager], places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0019, text: "Rain's in. The lambs have found the lee of the wall and won't be moved by me.", speakers: [herder], places: [ashen_hollow], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0020, text: "The sill stone in the new shed is Ondrek work. You don't ask what it was before, that's the courtesy.", speakers: [labourer], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0003.0021, text: "Listening grass is up in the wet bits. It bends when you talk and I've stopped talking to it.", speakers: [hunter], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0003.0022, text: "Hollow Day belongs to no tally. Everyone spends it like it's owed to them.", speakers: [adventurer], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0003.0023, text: "Fair, and the bellows are working. Smoke going up straight is the morning's good news and it'll do.", places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0024, text: "Anyone going west, the wind's against you the whole way to the rim. Go heavy now or go tomorrow.", speakers: [carter, traveller], places: [ashen_hollow], times: [morning], weather: [wind], channel: world, ai_generated: true }
  - { key: chat.b0003.0025, text: "Warm enough to work with the door open, which is more than yesterday managed.", places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0026, text: "Kal won't have quarry stone in the house. Mine's on the sill and I don't say where it came from.", speakers: [villager], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0027, text: "Fellhorn only ever on the high ground by the Foldscar. Nobody's driven one off it yet.", speakers: [hunter], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0028, text: "Grey, and the road's empty but for one cart's width of dust. The gate still wants a body on it.", speakers: [guard], places: [ashen_hollow], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0029, text: "Rain's through the roof over the bench. I'm working under a bucket and losing the argument.", speakers: [crafter], places: [ashen_hollow], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0030, text: "Leaves are down early and the wind's putting them in my ditches. Every one I clear is full by the next.", speakers: [labourer], places: [ashen_hollow], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0031, text: "Mist off the moss and the whole yard smells of iron and wet. You can taste the forge in it.", places: [ashen_hollow], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0032, text: "Man came through with the marks on him and the room went quiet. Nobody said a word against him either.", speakers: [traveller], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0033, text: "The survey wants the stones at the Foldscar set right. That's the whole of their plan and they'll not say more.", speakers: [adventurer], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0034, text: "A Call isn't chosen. My father's was the forge and mine's a field, and neither of us was asked.", speakers: [farmer], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0035, text: "Fair day and Cairnwold wants hides. I want company on the rim, and both can be arranged if you're going west.", speakers: [villager], places: [ashen_hollow], times: [afternoon], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0036, text: "Ewe's out again. She's not lost, she's visiting, and she'll be back when the grass is.", places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0037, text: "Dusk and the sky's the colour of wet slate. Cloud to the crags and nothing to be done about it.", places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0038, text: "Kal built the shed's frame and it'll be standing when the shed isn't. They build past the need.", speakers: [crafter], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0039, text: "Veth keep every birth and burial in the book. Want to know when a thing happened, ask the book.", speakers: [villager], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0040, text: "Wind's coming down the road out of the dark. Every gate in the valley will be shut early tonight.", speakers: [guard], places: [ashen_hollow], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0041, text: "Made the rim by last light with the weather holding. The drop's no place to be guessing at a path.", places: [ashen_hollow], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0042, text: "Third dusk the sky's not been right over the crags. The survey writes it down and I keep walking.", speakers: [adventurer], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0043, text: "Cloud's down and the healer's hands shook all evening. What she does costs her something and she'll not say what.", speakers: [villager], places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0044, text: "Rain's coming and the beast knows before I do. She's walked herself in and shut the matter.", speakers: [herder], places: [ashen_hollow], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0045, text: "Ember hound's been at the ash edge of the wood. It doesn't care whose fence it's on.", speakers: [hunter], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0046, text: "Road's clear to the rim and the watch has the fire lit. Anyone going west tonight, I'll wait the hour.", speakers: [carter], places: [ashen_hollow], times: [dusk], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0047, text: "Boneleaf grows in one place only and that place is the Foldscar's edge. Two leaves is a day's walk and a risk.", speakers: [traveller], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0048, text: "Nearly dark and the yard's not cleared. It'll be dark and still not cleared and that's how it goes.", places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0049, text: "Evening's gone still. You can hear the forge from the far side of the yard.", places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0050, text: "One of them came in with the evening and left no print in the yard dust. A Mor, the guard reckoned, and the guard was guessing.", speakers: [villager], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0003.0051, text: "Lamp's lit early against the grey. The hinge pins are still wrong and Blackvein Cut's giving up bad iron.", speakers: [crafter], places: [ashen_hollow], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0052, text: "Rain since dusk on the gate stones and nobody up the road. It'll be a long watch and a wet one.", speakers: [guard], places: [ashen_hollow], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0053, text: "Wind's under the door and the Ashcomb hen's up on the beam where she shouldn't be.", speakers: [herder], places: [ashen_hollow], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0054, text: "Fog's come up out of the moss and swallowed the shed. Work's finished whether I want it finished or not.", speakers: [labourer], places: [ashen_hollow], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0055, text: "Walked in with a man who steps sideways, as he put it. He'd lost a year of his life and couldn't say which.", speakers: [traveller], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0003.0056, text: "Took a Call I didn't choose and a road I did. Only one of them ever felt like mine.", speakers: [adventurer], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0003.0057, text: "Grain's up on the staddles and dry, and the granary wants hands tomorrow. Fair night for it and I'd not say no to company.", speakers: [farmer], places: [ashen_hollow], times: [evening], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0058, text: "Hollow Day's coming and nobody's counting down to it. It's the one day the tally's got nothing to say.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0003.0059, text: "Full dark and the smell from the ditch is getting bolder. Nobody's digging tonight and it knows it.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0003.0060, text: "Husks keep the barrow and the barrow's off my ground. That's as far as the arrangement goes.", speakers: [hunter], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0003.0061, text: "Cloud's shut the whole sky down. You'd not know the hour but for the noise out of the lodge.", places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0062, text: "Wind's down the chimney and the fire's sulking. Watch'll be colder than it needs to be.", speakers: [guard], places: [ashen_hollow], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0063, text: "Stopped under a clear sky and got colder for it. You can see every stone on the road from here.", speakers: [traveller], places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0064, text: "Two of us stood in the yard arguing about the colour of the sky. Grey, we agreed, and then argued anyway.", speakers: [crafter], places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0065, text: "Rain's hammering the shed roof like it's owed something. We're all sat under it, letting it make its point.", speakers: [labourer], places: [ashen_hollow], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0066, text: "Ember hound's been circling the stop since dark. It isn't hungry, it's curious, which is the worse of the two.", speakers: [adventurer], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0003.0067, text: "The survey's still out at the old workings. Night doesn't stop them and nothing here has yet.", speakers: [villager], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0003.0068, text: "Third tally of this Reckoning and I've not had one whole night's sleep in it.", speakers: [herder], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0003.0069, text: "Night's clear and I'm out at first light with a light cart. Anyone wanting word carried west, tell me now.", speakers: [carter], places: [ashen_hollow], times: [night], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0070, text: "Bed's a pile of coats and the coats are damp. Still the best offer in the valley.", places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0003.0071, text: "Barrow husks stood at the ring all evening and none of them moved. You get used to it, and then you don't.", speakers: [villager], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0003.0072, text: "Someone's dog has decided this is its door and I've stopped arguing about it.", places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0003.0073, text: "First light on the crags and the whole basin white with it. Cold, clean, and no wind to spoil it.", places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0074, text: "Iron's dear here and getting dearer. The granary hoops have been mended twice and both times were mine.", speakers: [farmer], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0075, text: "Forge won't draw with the air this damp and grey. I've swept the floor twice out of spite.", speakers: [crafter], places: [cairnwold], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0076, text: "Births, burials, and who owes who a ewe. All of it's in the Veth book and the book doesn't lose things.", speakers: [villager], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0077, text: "Rain coming up the basin and I'd sooner be out of it. The traps will keep till it's past.", speakers: [hunter], places: [cairnwold], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0078, text: "Wind's had the gate off the pen again. Hens are out and very pleased with themselves.", speakers: [herder], places: [cairnwold], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0079, text: "Fog sitting in the low ground and the walls going out one by one. The village gets smaller in it.", places: [cairnwold], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0080, text: "The stone on the rim's been cold as long as anyone can remember. You still touch it on the way past.", speakers: [guard], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0081, text: "Cairnwold wants hides and the Old East Road's dry. I'm leaving once the well's been drawn.", speakers: [carter], places: [cairnwold], times: [dawn], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0082, text: "Walked away from a bench and a Call both. The bench was the harder of the two to leave.", speakers: [adventurer], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0083, text: "Well's low and the rope's fraying at the same height it always does. That's the whole of the news.", places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0084, text: "Seam's thinner every year and the carts bring what the crags won't give. Iron's the one thing here that isn't made here.", speakers: [labourer], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0085, text: "Sky's low and the smoke won't lift off the roofs. Grey morning, grey work.", places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0086, text: "Kal set the smithy footings and they'll outlast the smithy. That's their whole idea of a favour.", speakers: [crafter], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0003.0087, text: "Ashcomb hen's off the lay and cross about it. She's taken to standing on the wall and staring at me.", speakers: [herder], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0003.0088, text: "Wind up on the moor and the ash coming down in the lane. Sweeping's a fool's morning.", speakers: [villager], places: [cairnwold], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0089, text: "Sun's on the field and the field's taking it. First proper drying this tally.", speakers: [farmer], places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0090, text: "The stone in the new sill came up from the cut and nobody asked what it was first. That's the courtesy.", speakers: [labourer], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0003.0091, text: "Grey morning and the tracks through the ash stand run in a straight line. Nothing walks a straight line.", speakers: [hunter], places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0092, text: "The survey's after the old pages and nobody here has an answer they'd like. They'll ask again tomorrow.", speakers: [guard], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0003.0093, text: "Rain's set in on the basin and the road down's greasy. If you're going out, go early and go slow.", speakers: [traveller], places: [cairnwold], times: [morning], weather: [rain], channel: world, ai_generated: true }
  - { key: chat.b0003.0094, text: "A Siann can't be read off the face, so you wait for the sentence. The sentence can take a while.", speakers: [adventurer], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0003.0095, text: "Well's drawn and the yard's dry. A morning that starts like this one can't be argued with.", places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0096, text: "Two more of these and the wall's done. Two more of these has been true for a week.", places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0003.0097, text: "Afternoon's come over warm. The walls hold the heat and give it back at dusk.", places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0098, text: "At noon the light over the crags went wrong, then right. Half the village saw it and the other half will argue.", speakers: [villager], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0099, text: "Cloud's closed over and the hay's still out. It'll be out tomorrow too, the way this is going.", speakers: [farmer], places: [cairnwold], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0100, text: "Rain through the shutter and onto the loom. The wool's wet and I'm the one who'll hear about it.", speakers: [crafter], places: [cairnwold], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0101, text: "Wind's filling the ditch as fast as I clear it. I'm losing to leaves and I know it.", speakers: [labourer], places: [cairnwold], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0102, text: "Ondrek work is the finest there is. Nobody asks what the stone was before and they don't offer.", speakers: [traveller], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0103, text: "Fog's eaten the wall round the west end. Two of us are walking it twice as slow as it needs.", speakers: [guard], places: [cairnwold], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0104, text: "Fellhorn off the high ground by the Foldscar is a beast you don't drive. You wait and it goes when it wants.", speakers: [herder], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0105, text: "Nobody chooses a Call. You find out what it was by what you couldn't leave alone.", speakers: [adventurer], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0106, text: "Fair day and hides and ash both moving in Cairnwold. A load standing idle anywhere else won't be idle here.", speakers: [villager], places: [cairnwold], times: [afternoon], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0107, text: "Listening grass is in the wet ground by the moss and it turns at a voice. You learn to walk quiet round it.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0108, text: "Took the long way through the ash stand to miss one conversation. Worth the afternoon.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0109, text: "Dusk and the crags gone flat grey. The night's coming in with no argument about it.", places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0110, text: "Wind's carried the smoke flat across the yard. Somebody's chimney wants looking at and it isn't mine.", speakers: [crafter], places: [cairnwold], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0111, text: "Something sat at the end of the table all evening with no shadow to it. Nobody asked it to leave.", speakers: [villager], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0112, text: "Fair evening and the sky's got its colour back. Worth standing out for a minute.", places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0113, text: "Grey dark falling and the wall's the same colour as the sky. Easier to watch a road than a wall.", speakers: [guard], places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0114, text: "The survey's at the stones again with their little book. Whatever's wrong there, they'll have it in a line.", speakers: [labourer], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0115, text: "Rain's closing in and the cow's stood in the field daring me to come out.", speakers: [herder], places: [cairnwold], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0116, text: "Cold stone on the rim, and the old way of waking it goes by three hands and a name. Nobody tries, so it stays cold.", speakers: [adventurer], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0117, text: "Wayhold keeps the shrine lantern filled and asks nothing for it. Worth a thought when the road's bad.", speakers: [villager], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0118, text: "Load's ready to go west at first light and I'd take a hand if one's offered. Fair night and a dry road under it.", speakers: [carter], places: [cairnwold], times: [dusk], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0119, text: "Half this Reckoning's gone and the wall's only got longer.", places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0120, text: "Wolves are down off the high ground early. Tracks come in from the ash stand and stop at the wall.", speakers: [hunter], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0121, text: "Evening's warm enough to sit out. First time this tally and half the village has taken advantage.", places: [cairnwold], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0122, text: "Tally turns in a few days and the hay's not in. It'll be in, or I'll be sleeping in it.", speakers: [farmer], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0003.0123, text: "A Constructed took work at the lodge and doesn't sleep. Written, not born, and still going long after whoever wrote it.", speakers: [villager], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0003.0124, text: "Cloud's back over and the light's gone before the mending's done. Same as every grey evening.", speakers: [crafter], places: [cairnwold], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0125, text: "Rain's set in for the night and the hens have gone up early. They know something about it.", speakers: [herder], places: [cairnwold], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0126, text: "Wind's up on the moor and it's brought the cold down with it. Digging keeps you warm if you keep digging.", speakers: [labourer], places: [cairnwold], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0127, text: "Fog's come across the moss and the wall's gone soft at the edges. You hear the well before you see it.", speakers: [villager], places: [cairnwold], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0128, text: "Word's gone to the watch and the watch has the lantern filled. That's all the road gets from us and it's more than most.", speakers: [guard], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0003.0129, text: "Ondrek work's the best made and the Kal won't have it in the house. You can be right twice about the same stone.", speakers: [adventurer], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0003.0130, text: "Iron's dear in this village and they'd rather mend than buy. I walked in with three broken things and left with one.", speakers: [traveller], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0003.0131, text: "Fair morning and the cart's going out on the Old East Road half full. Hides, or anything bound for the waystation.", places: [cairnwold], times: [evening], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0132, text: "Table's set and the lodge is loud. Somebody's brought a story they've told before.", places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0003.0133, text: "Cloud's shut the stars out. Nothing to read the night by but the noise out of the lodge.", places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0134, text: "Boar in the ash stand and he's had two of my snares for a game. Bristleback, and he knows what a fence means.", speakers: [hunter], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0003.0135, text: "Wind's round the gable and every shutter in the row is talking. Nobody's sleeping through this.", speakers: [villager], places: [cairnwold], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0136, text: "Clear night and the frost will be on the field by morning. Fair for the grain and hard on the hands.", places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0137, text: "Grey night and the wall's walking itself in my head. Second round done and nothing to show for it.", speakers: [guard], places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0138, text: "Barrowback's a hill with tusks and it keeps to the ground by the stones. Nowhere else will show you one.", speakers: [adventurer], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0003.0139, text: "Rain for the night. Fronts like this run four hours or twelve and there's no telling which till it's done.", speakers: [herder], places: [cairnwold], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0140, text: "The Reckoning runs thirteen tallies and then gives a day that isn't counted. Folk sleep that one away.", speakers: [crafter], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0003.0141, text: "Fair dawn for it: out with the iron and back light. Anyone wanting to ride with the cart, be at the road early.", speakers: [carter], places: [cairnwold], times: [night], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0142, text: "There are roads that don't come out where they should, and no two people will tell you the same about them.", speakers: [villager], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0003.0143, text: "Wall wants mending at the west end and it'll want it tomorrow. That's the whole of my week.", speakers: [labourer], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0003.0144, text: "Table by the fire's got my name on it and my name's on a lot of things tonight.", places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0003.0145, text: "Light's coming up the road ahead of me and the mist going off it. Good walking while it lasts.", places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0146, text: "Stopped at the stone on the rim and put a hand to it. It's cold and it's still where it's supposed to be.", speakers: [traveller], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0147, text: "Watch-fire's down to ash and the road's empty. The barrow keeps its own and we keep ours.", speakers: [guard], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0148, text: "Grey start. The wain's still on its side up the bank and it'll be there when I'm not.", speakers: [labourer], places: [old_east_road], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0149, text: "Ruts are holding the rain and every wheel will cut. The axles will complain before the rim comes.", speakers: [carter], places: [old_east_road], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0150, text: "Wind's off the high ground and the tracks on the road are the wind's, not anything's.", speakers: [hunter], places: [old_east_road], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0151, text: "Fog's sat on the road from the shrine to the rim. You can lose a wain in it and hear it before you see it.", speakers: [adventurer], places: [old_east_road], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0152, text: "Tally's got a day or two left on it and the road's busier for it. Everyone hurries at the same time.", speakers: [villager], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0153, text: "There was boneleaf in that wain's load, spoiled where it lay. Nobody came back for it and nobody will.", speakers: [crafter], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0154, text: "Road's dry out to the rim and the watch has water on the camp. Anyone coming west today has the weather for it.", speakers: [villager], places: [old_east_road], times: [dawn], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0155, text: "Boot's gone at the heel and I've walked on the sole since the last rise. A Wayfarer's Call doesn't keep your feet.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0156, text: "First light and the sky's the same colour it was at last dusk. It's been doing that and nobody's said a word.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0157, text: "Grey morning on the road and nothing on it but me and yesterday's tracks.", places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0158, text: "Lantern post is rocking in the wind. Go over on a night like this and the road has nothing to steer by.", speakers: [guard], places: [old_east_road], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0159, text: "Sun's out and the road's drying in patches. You can tell which patches by the ones that aren't.", speakers: [traveller], places: [old_east_road], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0160, text: "The survey stopped me in the grey to ask how the road drains. Twenty years of walking it and nobody's ever wanted to know.", speakers: [labourer], places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0161, text: "Anything sold as boneleaf that didn't come off the Foldscar's edge is another plant with a similar leaf.", speakers: [crafter], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0003.0162, text: "Rain's on the road and I've got a load that doesn't like it. Fronts here run four hours or twelve and I'm behind either way.", speakers: [carter], places: [old_east_road], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0163, text: "Read-stone doesn't chip like other stone. You can put an edge on it and the edge stays put.", speakers: [hunter], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0003.0164, text: "Kal on the road with the wings folded under a pack, and nobody said anything. It's a long walk and a heavy one.", speakers: [adventurer], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0003.0165, text: "Waystation wants two hands for the shed roof today. Fair day for it and the road's drying out.", speakers: [villager], places: [old_east_road], times: [morning], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0166, text: "Two carts past before I'd the fire lit, and one of them was the survey's. They don't stop for talk.", speakers: [villager], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0003.0167, text: "Half the morning gone and I've walked the same mile twice, once up and once down.", places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0003.0168, text: "Somebody's left a handcart wheel in the ditch. It's been through two lots of rain and nobody's come back.", places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0003.0169, text: "Afternoon sun on the road and the whole stretch steaming. You can smell the wet coming out of it.", places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0170, text: "Carting iron up to Cairnwold because theirs is running out. A strange trade, carrying iron uphill to a place with a seam.", speakers: [carter], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0171, text: "Cloud's come over the rim and the road's gone the colour of the sky again.", speakers: [villager], places: [old_east_road], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0172, text: "Rain out of the west and the shrine's lantern post is the only thing standing upright. The watch keeps it filled.", speakers: [guard], places: [old_east_road], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0173, text: "Wind across the open stretch and taking the top off the road with it. Dust in your teeth all afternoon.", speakers: [labourer], places: [old_east_road], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0174, text: "Fog's filled the low stretch and you can't tell road from verge. I'll wait it out at the shrine.", speakers: [traveller], places: [old_east_road], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0175, text: "Veth keep the count of everything born and everything killed. There's a line about this road I never gave them.", speakers: [hunter], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0176, text: "Kal calls the quarry a grave. The Ondrek say they're what the Kal become. Both are polite and neither is moving.", speakers: [adventurer], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0177, text: "Every road worker on this stretch has a Call behind them. Mine was a bench and a patient master.", speakers: [crafter], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0178, text: "Stretch from the shrine to the rim is clear and dry. If you've a load to move before the weather, this is the afternoon.", speakers: [villager], places: [old_east_road], times: [afternoon], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0179, text: "Sat down on the verge for a moment and the moment's gone an hour.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0180, text: "There's a marker stone at the bend that's been knocked over twice. Somebody keeps putting it back and it isn't the watch.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0181, text: "Dusk on the road with no colour in it at all. Grey ground, grey sky, one grey bird going somewhere.", places: [old_east_road], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0182, text: "Wind's up and the watch-fire's throwing sparks across the road. We'll be beating that out half the night.", speakers: [guard], places: [old_east_road], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0183, text: "Made the rim before the light went with the weather holding. The basin opens up under you and that's the reward.", speakers: [traveller], places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0184, text: "Past the barrow there's a bend where your own boots come back late. Everyone's got a reason for it and none of them agree.", speakers: [labourer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0185, text: "Light went wrong at dusk, in the wrong place on the cloud. The whole cart saw it and had nothing to say after.", speakers: [villager], places: [old_east_road], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0186, text: "Rain's coming down the road behind me. The beast walked herself in before I'd the gate open.", speakers: [herder], places: [old_east_road], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0187, text: "Listening grass by the low ground turns to a voice and not to the wind. I've tested it and I'd rather not have.", speakers: [hunter], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0188, text: "Hollow Day isn't in any tally and the road's quiet for it. Quiet's a strange thing on this road.", places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0189, text: "Wain's going down to the waystation at first light and coming back with iron. Fair weather for it and room for a passenger.", speakers: [carter], places: [old_east_road], times: [dusk], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0190, text: "One of the stolen walked a stretch with me and left no mark in the mud. Good company, and I couldn't tell you the face now.", speakers: [adventurer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0191, text: "Light's gone and I've a mile of this left. It'll be a mile whether I think about it or not.", places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0192, text: "Husk was stood at the barrow in the dusk and it's stood there yet. That's the whole of what it does and it does it well.", speakers: [villager], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0193, text: "Evening's come down warm and the road's still holding the day. Best hour of the whole one.", places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0194, text: "Watch-fire's throwing in the wind and the barrow's quiet. Whatever's up there isn't coming down for weather.", speakers: [guard], places: [old_east_road], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0195, text: "Rain's come up behind me and I've walked out of one lot into the next. Boots haven't been dry since the rim.", speakers: [traveller], places: [old_east_road], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0196, text: "Cloud's sitting on the crags and the evening's gone early. The whole village is in before its time.", speakers: [villager], places: [old_east_road], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0197, text: "Fog down the low stretch and the dust going soft under it. Whatever I dug today will be filled by tomorrow.", speakers: [labourer], places: [old_east_road], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0198, text: "An Orenth walks sideways and pays for it in years off the end. The ones I've met were cheerful about it, which is the strange part.", speakers: [adventurer], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0003.0199, text: "The survey wants the stones at the Foldscar set right and has wanted it a long while. Nobody's seen them get near.", speakers: [crafter], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0003.0200, text: "Reckoning's not half done and I've walked this road more than the year before it. No wonder the boots are thin.", speakers: [herder], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0003.0201, text: "Empty wain going west at first light on a fair night, and it wants filling. Anybody with a load, speak now.", speakers: [carter], places: [old_east_road], times: [evening], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0202, text: "Three stones stand at the Foldscar and people walk well round them. That's been the arrangement my whole life.", speakers: [villager], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0003.0203, text: "Sat on the shrine step to eat and the light went while I was chewing.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0003.0204, text: "There's a fire at the rim camp and a mile of dark between here and it.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0003.0205, text: "No stars tonight. Just a grey lid over the road and the sound of the barrow.", places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0206, text: "Wind's coming down the road at us and the fire's gone to embers. Watch will be a cold one.", speakers: [guard], places: [old_east_road], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0207, text: "Clear night and a cold one. You can see the road ahead of you better than you could at dusk.", speakers: [traveller], places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0208, text: "Cloud's over and the cart's stuck under it. There's no moving a wheel in this dark without a lamp.", speakers: [carter], places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0209, text: "Nothing to shelter under on this road but the shrine, and the shrine's taken. Rain's got the night to itself.", speakers: [crafter], places: [old_east_road], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0210, text: "A Constructed came up the road with no lamp and no fear of the dark. Written people don't tire and don't say much about it.", speakers: [adventurer], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0003.0211, text: "Vaskaal gear measures the air and its owner can't raise a spark. Didn't hold with those who do, either.", speakers: [labourer], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0003.0212, text: "Man had the marks on him and slept by the fire but not too near. Nobody made him sit apart, which is something.", speakers: [herder], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0003.0213, text: "Fellhorn on the high ground again, in a herd of their own and nowhere else. Nobody's ever seen them low.", speakers: [hunter], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0003.0214, text: "Road's clear to the waystation and the watch-fire's lit on the rim. Anyone wanting to move tonight has a fair night for it.", speakers: [villager], places: [old_east_road], times: [night], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0215, text: "You walk a road like this by remembering it. That's most of what a wayfarer's Call ever taught anybody.", places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0003.0216, text: "Somewhere ahead there's a fire and behind me there isn't. That settles which way I'm going.", places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0003.0217, text: "First light out here and the whole moor white to the knee. Nothing's been through it before me.", places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0218, text: "There's one bush worth the walk and it's at the Foldscar's edge. A leaf a day and not without looking behind you.", speakers: [hunter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0219, text: "Grey over the cut and the seam's as soft as yesterday. Some of that stone was somebody, if the Ondrek have it right.", speakers: [labourer], places: [wilds], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0220, text: "Rain crossing the moss towards us, and no shelter on this side of anything. Fronts come in and go in four hours or twelve.", speakers: [herder], places: [wilds], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0221, text: "Wind across the open ground and nothing to put your back to. You keep low and keep going.", speakers: [guard], places: [wilds], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0222, text: "Fog in the low ground and the path lost in it. I've marked the way with stones and I'm still not happy.", speakers: [traveller], places: [wilds], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0223, text: "Barrowback's a hill with a temper and it lives only by the Foldscar. Nobody's driven one off that ground.", speakers: [adventurer], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0224, text: "Anybody hunting the north moor today, the ground's dry and the moss is bearing. Sun's out and it'll last the day.", speakers: [villager], places: [wilds], times: [dawn], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0225, text: "Poles on the moor since dark and a small book out of a coat every so often. The survey's measuring something nobody asked about.", speakers: [crafter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0226, text: "Tally's turning and the wolves are moving with it. They've been down on the wet ground all week.", speakers: [hunter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0227, text: "Cold enough that the ground argues with the boot. Nothing out here to argue back.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0228, text: "Everything's wet and nothing's deep. Beats the moss either way.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0003.0229, text: "Grey out here and no horizon to it. The moor just goes into the cloud and stops.", places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0230, text: "Wind's wiping the tracks out as fast as I find them. A morning spent reading the same ground twice.", speakers: [hunter], places: [wilds], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0231, text: "Kal came out to look at the seam and put a hand on the rock and left. Wouldn't say what he found.", speakers: [labourer], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0003.0232, text: "Sun's out and the wet coming off everything. You can watch the moss steam from here.", speakers: [crafter], places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0233, text: "Two days of the same flat sky and I've stopped being surprised by it.", speakers: [traveller], places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0234, text: "Flock's got its backs to the rain on the open ground. Fronts like this pass in four hours or hold on for twelve.", speakers: [herder], places: [wilds], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0235, text: "Ondrek read stone the way we read a face. A courteous people, and ending, and they'll tell you so.", speakers: [adventurer], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0003.0236, text: "Moss has a dry skin on it and the sun's holding. Anyone wanting the wet ground, do it before noon.", speakers: [villager], places: [wilds], times: [morning], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0237, text: "The quarry's taking hands and half the hands won't ask what they're cutting. The Kal won't come near the place.", speakers: [guard], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0003.0238, text: "Veth wrote down what the moor was like before anyone here could read. Whatever's changed is written down somewhere.", speakers: [hunter], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0003.0239, text: "Sit down for a mouthful and the flies find you before the bread's out.", places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0003.0240, text: "Nothing out here but the noise the wind makes in the grass. It's a good noise and it's free.", places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0003.0241, text: "Afternoon and the sun's got some weight in it. Warm on the moor for once, and I'll take it.", places: [wilds], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0242, text: "Three stones at the Foldscar. I've seen them from the high ground and I've no wish to see them closer.", speakers: [hunter], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0243, text: "Cloud's low over the crags and the light's gone flat. The survey's out in it with their poles and their patience.", speakers: [guard], places: [wilds], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0244, text: "Rock turns greasy in the rain and every wedge wants two goes at it.", speakers: [labourer], places: [wilds], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0245, text: "Ash off the stand is in everything and the wind's still carrying it. It's in my collar and it'll be in my bed.", speakers: [traveller], places: [wilds], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0246, text: "Fog in the low ground like something spilled. I've no work that can't wait for it.", speakers: [crafter], places: [wilds], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0247, text: "Walked a stretch with one of the stolen and she put no weight on the planks. Good company, and no proof she was there at all.", speakers: [adventurer], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0248, text: "Fair afternoon and the ground's holding. If a body's after the wolves on the north moor, today's the day for it.", speakers: [villager], places: [wilds], times: [afternoon], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0249, text: "Fellhorn on the high ground and the herd keeps to it. You can watch them all afternoon and they won't come down.", speakers: [herder], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0250, text: "A Waystone out on the moor with nothing to mark it but its own shape. You know it when you see it and not before.", speakers: [farmer], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0251, text: "Nothing to do out here but the thing I came to do, and I'm in no rush about it.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0252, text: "Two hours of walking and the only thing I've found is a better view of where I was.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0003.0253, text: "Dusk out here is one long grey thought. Then it's dark and the thought's over.", places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0254, text: "Husks at the barrow don't move for dusk or dawn. They're the only thing on this moor you can set your watch by.", speakers: [hunter], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0255, text: "Crags are making a noise like water in this wind. Fronts come off them in four hours or they sit on you all night.", speakers: [guard], places: [wilds], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0256, text: "Stood off from the stones at dusk and watched them do nothing for an hour. It was the nothing that was wrong.", speakers: [adventurer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0257, text: "Light's holding and the last wedge is in. The rock'll be there at first light and so, probably, will I.", speakers: [labourer], places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0258, text: "Cloud's come down over the crags and the light's gone early. Another hour of work lost to a grey sky.", speakers: [crafter], places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0259, text: "Rain's walking up the moss towards us. The beast knows and she's already turning for home.", speakers: [herder], places: [wilds], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0260, text: "Fair evening and a clear way off the moor on the north side. Anyone coming down tonight wants the north track and not the moss.", speakers: [traveller], places: [wilds], times: [dusk], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0261, text: "Sky over the crags had two edges to it at dusk. Half of us saw it and half of us are lying.", speakers: [villager], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0262, text: "The survey says the stones want setting right. Nobody asks what set right would look like, in case there's an answer.", speakers: [farmer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0263, text: "Dark on the moor comes up out of the ground rather than down out of the sky.", places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0264, text: "There's a bird out there that's been saying the same thing since I stopped walking.", places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0003.0265, text: "Evening's gone gold and everything out here is stood still for it. You'd think the moor had stopped working.", places: [wilds], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0266, text: "A Siann out here will watch a thing for an hour and then tell you in a sentence. Patience like that isn't natural and I'm glad of it.", speakers: [hunter], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0003.0267, text: "Cloud's come up out of the west and put the evening out. Another night of this and the seam's under water.", speakers: [labourer], places: [wilds], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0268, text: "Rain's coming and there's no roof between here and the road. I'll be wet before the light's gone.", speakers: [traveller], places: [wilds], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0269, text: "Wind's taken the offcuts I'd set aside. They'll be in the grass tomorrow and so will I.", speakers: [crafter], places: [wilds], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0270, text: "Fog's come up the moss and every shape in it is the wrong shape for a moment. Then it's a bush again.", speakers: [villager], places: [wilds], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0003.0271, text: "Vaskaal gear measures weather and holds nothing for magic. Its owner couldn't raise a spark and called that the point of it.", speakers: [adventurer], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0003.0272, text: "The Constructed with the survey doesn't sleep or eat. Written, not born, and the work's the only thing it was made for.", speakers: [farmer], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0003.0273, text: "Fair evening and the moor's quiet on the north side. Whoever's out on it tonight, the weather's giving you one more night.", speakers: [guard], places: [wilds], times: [evening], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0274, text: "Every family's got a story about the stones and no two share a beginning. Nobody's story has an end.", speakers: [herder], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0003.0275, text: "Tally's near done and I've been out here most of it. The moor doesn't notice either way.", places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0003.0276, text: "Long walk back and no hurry in me. I'll get there when the legs say so.", places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0003.0277, text: "Cloud's over the whole moor and the dark's got nothing in it to see by. You walk by the sound of your own feet.", places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0278, text: "Wind's up and every sound in it is a beast till you get close enough to be sure.", speakers: [hunter], places: [wilds], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0003.0279, text: "Clear night and the cold comes down on the moor like water. Two of us on the watch and neither of us talking.", speakers: [guard], places: [wilds], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0003.0280, text: "Ember hound's been at the crag edge since dark. It doesn't run from a fire and it doesn't come to one.", speakers: [adventurer], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0003.0281, text: "Rain all night and no cover but the old stones. One of them's a waystone and a wet one's still a landmark.", speakers: [labourer], places: [wilds], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0003.0282, text: "Grey dark and nothing moving. That's when the moor gets its voice back.", speakers: [villager], places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0003.0283, text: "Hollow Day comes at the end of the thirteenth tally and belongs to none of them. Folk spend it sleeping and nobody counts it.", speakers: [crafter], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0003.0284, text: "The Ondrek say they're ending, and they say it the way you'd say the weather. There are no more of them being made.", speakers: [herder], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0003.0285, text: "Fair night, no cloud, and the north track's dry as a floor. Anybody moving before the weather turns has a clear run.", speakers: [traveller], places: [wilds], times: [night], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0003.0286, text: "A Call is what you were going to do anyway, only named. Mine was hauling and I've hauled ever since.", speakers: [farmer], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0003.0287, text: "Half the night gone and I've done nothing but listen. Listening's a job out here and nobody pays for it.", places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0003.0288, text: "Cold's got into the wool and won't be got out till morning. I'll sleep in it and call that warmth.", places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0003.0289, text: "It turned in the night and the road's drying already. I'll take the cart out while that holds.", speakers: [carter], places: [ashen_hollow], times: [dawn], events: [weather_turned], ai_generated: true }
  - { key: chat.b0003.0290, text: "The sky went and changed on us at noon. Whatever's out in the field is staying out there.", speakers: [farmer, herder], places: [cairnwold], times: [afternoon], events: [weather_turned], ai_generated: true }
  - { key: chat.b0003.0291, text: "It turned on the rim just before dusk and it's still at it. Everything on this road gets wetter from here.", speakers: [traveller], places: [old_east_road], times: [evening], events: [weather_turned], ai_generated: true }
  - { key: chat.b0003.0292, text: "The {creature} is down by the ash edge with one arrow in it. Nobody's owned up and nobody's complaining.", speakers: [hunter], places: [ashen_hollow], times: [night], events: [creature_slain], ai_generated: true }
  - { key: chat.b0003.0293, text: "The {creature} is off the road and left where it fell. Whoever did it didn't stay for the thanks.", speakers: [guard, carter], places: [old_east_road], times: [morning], events: [creature_slain], ai_generated: true }
  - { key: chat.b0003.0294, text: "Found the {creature} dead in the low ground with nothing taken off it. Somebody was working and not for meat.", speakers: [hunter, adventurer], places: [wilds], times: [dusk], events: [creature_slain], ai_generated: true }
  - { key: chat.b0003.0295, text: "Market's settled and the hides went with the carters. Iron's the one thing this village can't make and it shows at every market.", speakers: [villager], places: [cairnwold], times: [evening], events: [market_day], ai_generated: true }
  - { key: chat.b0003.0296, text: "Markets settled in the basin last night. I've been out here the whole time and heard it from a man walking the other way.", speakers: [traveller], places: [wilds], times: [dawn], events: [market_day], ai_generated: true }
  - { key: chat.b0003.0297, text: "Market day done and the stall's picked over. The carters got what they came for and left the rest.", speakers: [carter, crafter], places: [ashen_hollow], times: [afternoon], events: [market_day], ai_generated: true }
  - { key: chat.b0003.0298, text: "They're saying {claimant} finished the bounty on {bounty}. That's one less name on the board and one more on the road.", speakers: [traveller, adventurer], places: [old_east_road], times: [dusk], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0003.0299, text: "{claimant} came off the moor with the bounty on {bounty} closed. Word got out here before they did.", speakers: [hunter, adventurer], places: [wilds], times: [night], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0003.0300, text: "Bounty on {bounty} is gone to {claimant}. Lodge will have the tale out of them by dark.", speakers: [villager, guard], places: [cairnwold], times: [morning], events: [bounty_claimed], ai_generated: true }
