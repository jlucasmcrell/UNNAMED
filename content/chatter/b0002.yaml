schema: 1
display_key: chatter.b0002.name
tags: [chatter]
notes: AI-generated ambient corpus (batch b0002) - dry frontier small talk across four places and six time bands, carrying the world's calendar, peoples, stones, Calls and factions as passing remarks.
role: corpus
batch: b0002
lines:
  - { key: chat.b0002.0001, text: "Forge fire's barely up and the shed's colder than the yard. Clear light, and my last quiet hour.", speakers: [crafter], places: [ashen_hollow], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0002, text: "Slept beside the Ashen Waystone and nobody minded. Fair light, and it cost me nothing.", speakers: [traveller], places: [ashen_hollow], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0003, text: "Whole stop looks newer than it is in this light.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0004, text: "Road east off the rim is passable. Under this grey, anyone taking a load up should go by the high side.", speakers: [guard], places: [ashen_hollow], times: [dawn], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0005, text: "Kal came through two days back with the wings under a pack, and nobody here said a word about it.", speakers: [villager], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0006, text: "Rain in the night's filled the ditch behind the shed. Barrow and spade before breakfast.", speakers: [labourer], places: [ashen_hollow], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0007, text: "Coat still smells of the road.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0008, text: "Iron's dear at the top of the basin, and that's my reason for being up this early.", speakers: [carter], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0009, text: "Stopped at the stall for salves and arrows. Everything going out to the old workings gets bought here.", speakers: [adventurer], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0010, text: "Wind came down the valley in the night and the hens won't come off the perch.", speakers: [herder], places: [ashen_hollow], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0011, text: "Half the lodge is up and the other half is pretending not to be.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0012, text: "Stone out front's gone grey in the fog. Waystones don't care what the sky does.", speakers: [traveller], places: [ashen_hollow], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0013, text: "Metal's cold enough to take the skin off a knuckle. Still and grey and nothing drying.", speakers: [crafter], places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0014, text: "Long Survey's out the door and up the cut again, grey weather and all. Whatever they ask the rock, it keeps its answer.", speakers: [villager], places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0015, text: "Two loads, one cart.", places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0002.0016, text: "Taking moor gear up the road at noon. Slow going, and I'll want a hand at the rim.", speakers: [carter], places: [ashen_hollow], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0002.0017, text: "Iron off the seam comes up greasy this stretch. The sun's on the shed and it still feels soft under the hammer.", speakers: [crafter], places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0018, text: "Rehung the traps along the wood edge. Last night's catch was one very surprised hare.", speakers: [hunter], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0002.0019, text: "Mud's steaming off the road and nobody's in a hurry to start. Sun suits it.", places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0020, text: "A Veth at the stall read my map and found two things wrong with it in a breath.", speakers: [adventurer], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0002.0021, text: "Wind's up out of the valley. The stone on the rim's cold and quiet, which is how I like it.", speakers: [guard], places: [ashen_hollow], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0022, text: "Hauling stone off the back of the shed. There's a wall under there nobody's seen in years.", speakers: [labourer], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0002.0023, text: "Rain came on at the wrong hour and everything's under a tarp now.", places: [ashen_hollow], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0024, text: "Every waystation on this road keeps the same customs, and I've never been told who set them.", speakers: [traveller], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0002.0025, text: "Stall's been picked over since noon, and it's a fair afternoon for it.", speakers: [villager], places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0026, text: "Quarry stone in the new step, and it's drying weather for it. Nice to work, and nobody asks where it was before.", speakers: [labourer], places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0027, text: "Sat on the wall with a cup and watched the road for an hour. Nothing came.", places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0028, text: "Cart's down past the forge with a cracked hub. Grey over the stop, and if you're waiting on a load, it's here.", speakers: [carter], places: [ashen_hollow], times: [afternoon], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0029, text: "They'll tell you the Ondrek are courteous and don't haggle. Both true, and neither is the whole of it.", speakers: [adventurer], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0030, text: "Rain on and the beasts have turned their backs to it. They've more sense than I have about weather.", speakers: [herder], places: [ashen_hollow], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0031, text: "Half a day gone and nothing decided.", places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0032, text: "Ondrek stone takes a polish nothing quarried here will take. I'd not ask what it was first.", speakers: [crafter], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0033, text: "Hollow Day's the one day a Reckoning nobody counts. Half the stop treats it as a licence.", speakers: [villager], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0034, text: "Wind's come round and the gate's propped open. It'll stay propped till it falls down.", speakers: [guard], places: [ashen_hollow], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0035, text: "Somebody left a crate on the step and it's been sat there since morning.", places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0036, text: "Waystone's just a shape in the low fog. You put your hand on it and go on.", speakers: [traveller], places: [ashen_hollow], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0037, text: "My kit's dry and that's the day's one win. Grey all afternoon and greyer now.", speakers: [adventurer], places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0038, text: "Grey dusk and the tally's got two days left on it. Everybody's remembering what they said they'd have done.", speakers: [villager], places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0039, text: "Light's going and the forge is still going. One of us will stop first.", places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0040, text: "Gate shuts at dark and the watch has the road side. Anything past the shrine tonight, wait for morning.", speakers: [guard], places: [ashen_hollow], times: [dusk], channel: world, ai_generated: true }
  - { key: chat.b0002.0041, text: "First fair evening in days and I'm at the bench. They call a smith's hand a Call, not a rank.", speakers: [crafter], places: [ashen_hollow], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0042, text: "Filled a barrow and a half before the light went. The other half's still standing there.", speakers: [labourer], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0043, text: "First dry evening in three and the whole stop is out of doors for it.", places: [ashen_hollow], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0044, text: "Tracks came off the fog side toward the stone and stopped dead at it. I've no story for that.", speakers: [hunter], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0045, text: "They'll tell you a Kal caught in a turning sets where he stands. Nobody says it loud in this valley.", speakers: [villager], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0046, text: "Roped the load twice with the wind taking at it. The second rope's for my peace of mind.", speakers: [carter], places: [ashen_hollow], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0047, text: "Nobody's arguing about the fire tonight. Rain on the roof settles that.", places: [ashen_hollow], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0048, text: "Waystone's grey in this light. Every dusk it does that and every dusk somebody remarks on it.", speakers: [villager], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0049, text: "Lodge has the door propped and the evening's quiet. Fair as this valley gets.", speakers: [villager], places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0050, text: "A Siann trader no older than me remembered a road I've only heard of. Fair evening for a long memory.", speakers: [adventurer], places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0051, text: "Evening's in and my hands have stopped being useful. That's the signal.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0002.0052, text: "Empty cart going down to the basin at first light. Grey or not, anyone wanting a place should be at the gate.", speakers: [carter], places: [ashen_hollow], times: [evening], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0053, text: "Shrine lantern's filled and the oil's counted. Wayhold's work, and tonight it's mine.", speakers: [guard], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0002.0054, text: "Rain's set in and the beasts have the dry corner. One hen's off her feed and it's the good layer.", speakers: [herder], places: [ashen_hollow], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0055, text: "Somebody's singing badly in the lodge and somebody's telling them to stop.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0002.0056, text: "The Kal won't take quarried stone into the house. They don't say why and they don't have to.", speakers: [villager], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0002.0057, text: "An Orenth took the short way over the crags and came back remembering a different week.", speakers: [hunter], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0002.0058, text: "Wind's up and the road out of here's the only thing I've thought about all evening.", speakers: [traveller], places: [ashen_hollow], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0059, text: "Nobody's asked me where I'm bound and I'm grateful for it.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0002.0060, text: "Every arrival comes in by the waystone and stops to look at it, fog or no fog.", speakers: [villager], places: [ashen_hollow], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0061, text: "Gate lamp's doing all the work tonight. Grey, no stars, and nothing to see by it either.", speakers: [guard], places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0062, text: "Tally ends in two days. The sky's been off over the crags since the last turn, and there's no break in the cloud for it.", speakers: [villager], places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0063, text: "Sat up later than I meant to and now it's properly dark.", places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0002.0064, text: "Something's working the hen sheds after dark. Worth a lamp and a dog if you keep birds.", speakers: [adventurer], places: [ashen_hollow], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0002.0065, text: "Three stones at the Foldscar with a shaft between them, and no two people agree what it's for. Clear night for it.", speakers: [villager], places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0066, text: "Dog's asleep with one eye open. He's been like that since dark.", speakers: [herder], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0002.0067, text: "Clear night and the frost will be on everything by morning.", places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0068, text: "Husks were out on the barrow road, so I came back the long way and said nothing about it.", speakers: [hunter], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0002.0069, text: "Wind's up and the shed roof's loose on one side. I'll tie it and not mend it.", speakers: [labourer], places: [ashen_hollow], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0070, text: "Touched the stone on the way in. Habit, and the waystation customs run the length of the road.", speakers: [traveller], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0002.0071, text: "First sound I've heard in an hour is rain on the shutters.", places: [ashen_hollow], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0072, text: "Iron's dear on this side of the basin and the last good billet is on my bench.", speakers: [crafter], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0002.0073, text: "Granary door was stiff with the cold and the grain's dry under the staddles. Fair morning for once.", speakers: [farmer], places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0074, text: "Thirteen tallies and then a Hollow Day. You hear the count in your sleep by the last, and it's a fair cold morning for it.", speakers: [villager], places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0075, text: "Woke before the light and lay there listening to the well chain.", places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0076, text: "Ash and hides going up the road at first light. Grey morning, and anybody with a load wants it at the wall.", speakers: [carter], places: [cairnwold], times: [dawn], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0077, text: "A Siann keeps sheep up the crags and has done since before this village had walls, or says so.", speakers: [herder], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0078, text: "Wet's into the wall foot down the west end. Third time this tally and it's the same stone.", speakers: [labourer], places: [cairnwold], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0079, text: "Smoke going up straight from every house and one that's late.", places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0080, text: "Outfall's running high off the moss. Everything the basin doesn't want goes that way.", speakers: [villager], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0081, text: "Grain's counted as it comes in and counted again up on the staddles. That's how a granary stays honest.", speakers: [farmer], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0082, text: "Wind's off the crags and the smithy's full of it. Every spark goes sideways.", speakers: [crafter], places: [cairnwold], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0083, text: "Somebody's hen is on the wall and somebody's going to be told about it.", places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0084, text: "There's a Call for the road and a Call for the bench, and nobody's asked which is better. Fog in the basin for it.", speakers: [villager], places: [cairnwold], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0085, text: "Whole village smells of wet stone this morning, and the basin's grey to the far side.", speakers: [villager], places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0086, text: "Everyone says the survey asks questions nobody wants answered. Nobody says which, and the basin's grey on it.", speakers: [villager], places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0087, text: "Sat on the wall for a minute and lost the morning to it.", places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0002.0088, text: "Wall's down at the west end of Cairnwold, so bring the cart round the long way till it's up.", speakers: [guard], places: [cairnwold], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0002.0089, text: "One fire here, and bog iron and grey iron want different ones. Sun's out and that's the whole of my luck.", speakers: [crafter], places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0090, text: "Found a fox's line along the ash stand and left it. A fox is worth more alive for the rabbits it takes.", speakers: [hunter], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0002.0091, text: "Sun's come up over the Outfall side and every roof in the row is steaming.", places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0092, text: "Cairnwold's own iron is going and the carters have worked that out before the rest of us.", speakers: [villager], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0002.0093, text: "Wind's got the ash stand roaring, and there's a Veth down the row who learned the loom in a fortnight.", speakers: [villager], places: [cairnwold], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0094, text: "Opened the granary and the rats have had a go at one sack. One sack, and it'll be the bottom one.", speakers: [farmer], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0002.0095, text: "Nobody can decide whether to start anything. Rain's on and off and the day's not committing.", places: [cairnwold], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0096, text: "Came up the road behind a Kal carter who wouldn't pass a waystone without a hand on it.", speakers: [traveller], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0002.0097, text: "Whole village has found work that keeps it outdoors. Fair and warm and nobody indoors for it.", speakers: [villager], places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0098, text: "Hides, ash and moor gear, that's the market here, and I've a hand in two of the three. Fair drying afternoon.", speakers: [hunter], places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0099, text: "Afternoon's gone soft. Nobody's going to finish anything now.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0100, text: "Market's got hides on the stall and no ash at all. Grey sky or not, if you've ash to move, come now.", speakers: [villager], places: [cairnwold], times: [afternoon], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0101, text: "Don't ask what the quarry stone was before. The Kal won't have it in the house and won't say why.", speakers: [villager], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0102, text: "Rain's come on and the timber's soaking it up as fast as I can cut it.", speakers: [labourer], places: [cairnwold], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0103, text: "Somebody's hammering and it isn't a sound anyone's going to complain about.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0104, text: "Survey wants a look at the old works and the watch goes with them when they ask. Nobody's asked yet.", speakers: [guard], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0105, text: "Fellhorn's off the high ground and into the wet. He knows the moss better than any of us.", speakers: [herder], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0106, text: "Wind's in the smoke and the fire won't draw right. I'll be blowing at it till dark.", speakers: [crafter], places: [cairnwold], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0107, text: "Two of us have been at the same beam since noon and it's still a beam.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0108, text: "You can hear the Outfall but not see it in this fog.", speakers: [adventurer], places: [cairnwold], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0109, text: "Smoke's coming down with the light. Grey going dark and it'll be a close night.", speakers: [villager], places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0110, text: "Lodge has both fires going. Talk's all quarry stone and what the Ondrek are still digging for, grey dusk and all.", speakers: [villager], places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0111, text: "Dusk, first smoke, last of the day's noise.", places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0112, text: "Road up from the basin's had nothing on it all day. Whatever was coming has stopped somewhere.", speakers: [guard], places: [cairnwold], times: [dusk], channel: world, ai_generated: true }
  - { key: chat.b0002.0113, text: "Grain's up on the staddles and the granary's honest for another tally. Fair evening to shut the door on.", speakers: [farmer], places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0114, text: "Set the last bar of the wall before the light went and left the tools where they fell.", speakers: [labourer], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0115, text: "Clear going dark and the crags the last thing to lose the light.", places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0116, text: "Second fire for the stone work. Ondrek goods don't take the same heat as ours and that cost me a day.", speakers: [crafter], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0117, text: "Wind's down off the crags and the Foldscar side of the fell sounds different for it.", speakers: [villager], places: [cairnwold], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0118, text: "Axle's been squealing since the rim and it'll want grease before I take it up again.", speakers: [carter], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0119, text: "Roofs will tell you when the rain's here. They always do.", places: [cairnwold], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0120, text: "Everyone in this village knows what a waystone is for and not one of them can tell you how.", speakers: [villager], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0121, text: "Whole row's out on their steps with a cup. Fair evening, and nobody's calling anybody in.", speakers: [villager], places: [cairnwold], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0122, text: "The survey pays for stories about the stones but not the ones it's heard before. Fair evening for the telling of them.", speakers: [adventurer], places: [cairnwold], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0123, text: "Long day. The fire's the only thing I've wanted since noon.", places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0002.0124, text: "Market's settled. There'll be hides and ash on the stall at first light, grey evening or not, so bring yours.", speakers: [villager], places: [cairnwold], times: [evening], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0125, text: "Iron's dear here and getting dearer. The seam's nearly out and the carters have the trade sewn up.", speakers: [crafter], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0002.0126, text: "Rain's through the roof of the lean-to and the flock's crowded into the one dry end.", speakers: [herder], places: [cairnwold], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0127, text: "Two chairs by the fire and one of them's got a coat on it.", places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0002.0128, text: "The Ondrek have been courteous to this village as long as anyone's kept count, and they're not many now.", speakers: [villager], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0002.0129, text: "Half the row's work is their Call and the other half just works. Nobody makes a thing of it.", speakers: [villager], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0002.0130, text: "Wind's coming up the row and the lamp on the wall's already out.", speakers: [guard], places: [cairnwold], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0131, text: "Somebody's arguing about a fence and the rest of us are listening to it.", places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0002.0132, text: "Granary's locked and there's a tally's worth of argument behind that door. Fog coming up the basin for it.", speakers: [farmer], places: [cairnwold], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0133, text: "Wall's a darker line than the grey it's stood in. Round twice and then I'm in.", speakers: [guard], places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0134, text: "Sky's been wrong over the crags all tally and there's no break in the cloud over them. Nobody's got a word for how.", speakers: [villager], places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0135, text: "Sat up with the fire until it stopped being worth keeping.", places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0002.0136, text: "Wall's quiet and the gate's barred. Anyone on the basin road tonight is on their own till light.", speakers: [guard], places: [cairnwold], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0002.0137, text: "Beasts are all in. There's a Fellhorn out there somewhere and it's not mine, and it's a clear night to be out.", speakers: [herder], places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0138, text: "Woke at the dogs and it was nothing. So I'm up and the night's half gone.", speakers: [farmer], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0002.0139, text: "Stars out. First clear night this tally.", places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0140, text: "Worked late on a Kal order. Everything they want is built to outlast the roof it goes under.", speakers: [crafter], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0002.0141, text: "Wind's got the ash stand moving and I can't tell what's in it from here.", speakers: [hunter], places: [cairnwold], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0142, text: "Came back off the crags with a shadow a half-step late. Nobody at the lodge wanted to hear about it.", speakers: [adventurer], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0002.0143, text: "Sound worth staying awake for, rain on the roof.", places: [cairnwold], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0144, text: "Tally ends tomorrow. Then a Hollow Day, and then the counting starts again like it never stopped.", speakers: [villager], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0002.0145, text: "Road's a pale line and the rest of the world is nothing yet. Fair at the first of it.", speakers: [traveller], places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0146, text: "Slept at the rim in the lee of a waystone, the only stone this road gets tended. Fair light when I woke.", speakers: [adventurer], places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0147, text: "Walked an hour before I thought about breakfast.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0148, text: "Wain's coming down off the rim with a heavy load, grey morning and a wet rim under it. Keep to the outside of the bend.", speakers: [carter], places: [old_east_road], times: [dawn], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0149, text: "Lantern's still burning at the shrine, and the oil's nobody's business but the watch's.", speakers: [villager], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0150, text: "Rain in the night has the ditch running and the culvert full of it. That's my morning.", speakers: [labourer], places: [old_east_road], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0151, text: "Two days of this road and I've stopped counting the miles.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0152, text: "Barrow road's been quiet and the husks are still up there. Quiet isn't the same as empty.", speakers: [guard], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0153, text: "Left what I could spare at the shrine stone. That's the custom and it's older than any of us.", speakers: [traveller], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0154, text: "Wind's up and the road's gathering everything loose on it into one corner.", speakers: [hunter], places: [old_east_road], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0155, text: "Boot's gone at the heel. Everything else is still holding.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0156, text: "Stone at the rim's no help in this fog. You walk the ruts and trust the ruts.", speakers: [guard], places: [old_east_road], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0157, text: "Road goes on and on and says nothing new. No wind, no sun, just grey and the walk.", speakers: [villager], places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0158, text: "Survey's been down the barrow road with poles and a lamp. Grey morning, and they'll want the cist measured.", speakers: [villager], places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0159, text: "Saw nobody all morning and heard nothing but my own boots.", places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0002.0160, text: "Waystone's clear and the posts are marked to the rim. Keep to the road side of the barrow and you'll do.", speakers: [guard], places: [old_east_road], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0002.0161, text: "Bench's worth of iron on my back and the smithy wants billets. Drying weather for a heavy walk.", speakers: [crafter], places: [old_east_road], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0162, text: "Moved the flock over the road before the light was useful. One ewe took three of us.", speakers: [herder], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0002.0163, text: "Sun's out and the ruts have gone hard already. Weather does what it likes with a road.", places: [old_east_road], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0164, text: "Stone on the road came out of the cut, and it's going where the survey wants it. I pull the barrow.", speakers: [labourer], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0002.0165, text: "Wind's up, and a Kal's come past with the wings tight under a cloak and a load of stone.", speakers: [traveller], places: [old_east_road], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0166, text: "Two hours to the rim at this pace, and the horse knows it better than I do.", speakers: [carter], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0002.0167, text: "Road's gone from dust to grease in an hour of rain.", places: [old_east_road], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0168, text: "Everyone who passes the shrine leaves something, even if it's a knot of string. That's the way of it.", speakers: [villager], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0002.0169, text: "Road ahead of me is a long grey nothing. Fair afternoon, and I've the whole of it.", speakers: [traveller], places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0170, text: "Culvert's quarry stone and it'll outlast the road and everyone walking on it. Fair afternoon for the digging.", speakers: [labourer], places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0171, text: "Sat on the wall by the shrine and ate what I had.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0172, text: "Barrow road's had nothing come down it since noon. Grey over the north side, so if you're going, go in daylight.", speakers: [villager], places: [old_east_road], times: [afternoon], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0173, text: "The husks up at the barrow don't leave it and don't want company. Nobody's sure they could leave it.", speakers: [adventurer], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0174, text: "Rain's flattened every track on the road edge. I'll be reading mud for nothing till dusk.", speakers: [hunter], places: [old_east_road], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0175, text: "Half a day of walking and the horizon hasn't moved.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0176, text: "Survey's had a man at the Quiet Stones since noon. He's on the high ground and he's not going nearer.", speakers: [villager], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0177, text: "Wayhold's put the post markers up as far as the shrine. After that the road's the survey's problem.", speakers: [guard], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0178, text: "Wind's across the road and the load's taking it broadside. Slow afternoon.", speakers: [carter], places: [old_east_road], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0179, text: "Somebody's left a boot on the post and nobody's claimed it.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0180, text: "Lantern at the shrine is the only thing that shows in the fog on the low stretch, and it shows late.", speakers: [traveller], places: [old_east_road], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0181, text: "Mud's the same colour as the sky and that's grey all the way down.", speakers: [guard], places: [old_east_road], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0182, text: "Fire's lit on the rim and it'll burn till morning. Grey dusk, and the watch does that whether it's seen or not.", speakers: [villager], places: [old_east_road], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0183, text: "Dusk is the hour the road gets longer than it was.", places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0184, text: "Got a wain down to the flat before dark and I'm stopping here. Road below the rim's soft all the way.", speakers: [carter], places: [old_east_road], times: [dusk], channel: world, ai_generated: true }
  - { key: chat.b0002.0185, text: "Light's going gold on the rim stone and it still won't say anything. They don't, whatever people hope.", speakers: [adventurer], places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0186, text: "Cut and set three posts and the fourth is in the ditch where I left it.", speakers: [labourer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0187, text: "Clear to the west and the road shining where the wet's still on it.", places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0188, text: "Tracks at the barrow turn off the road and go up. Something's been going up and not coming down.", speakers: [hunter], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0189, text: "Wind's off the basin and you can hear the barrow beams knocking. They've stood this long.", speakers: [villager], places: [old_east_road], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0190, text: "Half an hour of light left, and the shrine's the only place I'd want to be in it.", speakers: [traveller], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0191, text: "Something's coming down the road behind me. Rain, and it's gaining.", places: [old_east_road], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0192, text: "Nothing's ever been found in that cist, and the husks keep it anyway. Nobody's argued them out of it.", speakers: [adventurer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0193, text: "Road's gone quiet the way it does at this hour. Fair evening for it.", speakers: [villager], places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0194, text: "Watch fire's banked and the camp swept. Wayhold likes its fires left the way it found them, fair evening or foul.", speakers: [guard], places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0195, text: "Evening on a road is the same anywhere.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0002.0196, text: "Walking down to the basin at first light and glad of company. Grey evening, and I'll be at the rim before the sun is.", speakers: [traveller], places: [old_east_road], times: [evening], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0197, text: "There's three stones at the Foldscar and the survey wants them set right. The rest of us want them left alone.", speakers: [villager], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0002.0198, text: "Rain's got into the new post footings and they'll want redoing.", speakers: [labourer], places: [old_east_road], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0199, text: "Nowhere to sleep on this stretch but the camp, and the camp's taken.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0002.0200, text: "A Barrowback was on the road at dusk. They only ever turn up near that side and nobody knows why.", speakers: [hunter], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0002.0201, text: "The survey's got charts of ground I've walked all my life and I've never seen the charts.", speakers: [adventurer], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0002.0202, text: "Wind's bringing the smoke down the road and my hands are too cold to care.", speakers: [crafter], places: [old_east_road], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0203, text: "Took my boots off at the fire and that was the whole evening.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0002.0204, text: "Shrine lantern shows as one soft smear of light through the fog on the drop.", speakers: [traveller], places: [old_east_road], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0205, text: "Light at the shrine is small and a long way off. Grey night for a long walk.", speakers: [traveller], places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0206, text: "Watch is on the rim till light. The waystone's dormant and it's been dormant all my time here, grey or starry.", speakers: [guard], places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0207, text: "Dark enough that the road's a sound.", places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0002.0208, text: "Nothing on the road east of the shrine and nothing in the camp. The watch is up if anything moves.", speakers: [guard], places: [old_east_road], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0002.0209, text: "A man who went down off the rim last tally came back at the waystone. Clear night, and nobody explains it.", speakers: [adventurer], places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0210, text: "Something crossed the road an hour back and left nothing in the mud to argue with.", speakers: [hunter], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0002.0211, text: "Clear night and cold enough that the mud's gone hard.", places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0212, text: "Hinge work for the shrine post. Wayhold paid in iron and didn't count it out loud.", speakers: [crafter], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0002.0213, text: "Wind's got the tarp going and every strap I've got is on it.", speakers: [carter], places: [old_east_road], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0214, text: "The husks keep the barrow and the watch keeps the road. Between the two is a stretch nobody walks at night.", speakers: [villager], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0002.0215, text: "Mile of road either way and the rain's set in for the night.", places: [old_east_road], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0216, text: "Every Reckoning's thirteen tallies and a Hollow Day, and no road's ever felt shorter for knowing it.", speakers: [villager], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0002.0217, text: "Mist's lying in every dip the ground's got, and it's fair and cold above it.", speakers: [hunter], places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0218, text: "There's boneleaf in the wet corner, pale as a knuckle, veins running backward. Fair morning to find it by.", speakers: [villager], places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0219, text: "Up before the light. Nothing else is.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0220, text: "Track out to the cut's holding, but the wet bit past the ash stand will take a wheel. Grey sky and no drying in it.", speakers: [carter], places: [wilds], times: [dawn], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0221, text: "Woundmoss Patch has been picked over already. Everyone got the same idea about the same damp corner.", speakers: [villager], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0222, text: "Rain in the night and the timber's too wet to move. It'll lie where it's cut.", speakers: [labourer], places: [wilds], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0223, text: "Two hours out and my boots are already carrying the moor.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0224, text: "Found a den mouth in the wood with the ground beaten flat in front of it. Wolves don't tidy up.", speakers: [hunter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0225, text: "The survey's stakes are up along the old workings. They've marked ground I wouldn't stand on.", speakers: [adventurer], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0226, text: "Wind's off the tops and the beasts are all facing into it. They do that and I've never asked why.", speakers: [herder], places: [wilds], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0227, text: "One of the dogs has gone off and won't answer. He'll be back when he's bored.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0228, text: "Foldscar side and the rest of the moor sound the same in this fog.", speakers: [traveller], places: [wilds], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0229, text: "Ground's still holding yesterday's weather in it, and the moor's grey to the tops.", speakers: [labourer], places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0230, text: "There's listening grass in the wet bits. It bends at a voice and not at the wind, and the day's gone still and grey.", speakers: [villager], places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0231, text: "Morning's the only time you can see the lie of the ground out here.", places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0002.0232, text: "Cutting timber in the north stand again today. If you're on the track, there'll be a barrow coming down it.", speakers: [guard], places: [wilds], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0002.0233, text: "Seams don't care about the sun. Soft stretch, then flint, and the hammer finds both.", speakers: [crafter], places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0234, text: "A boar's been at the fallen mast. The tracks are deep and I'd rather they were shallower.", speakers: [hunter], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0002.0235, text: "Sun's up and the mist is going off the bog like it's being poured out.", places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0236, text: "Any stone you buy off the Ondrek came out of a quarry and they'll tell you so, patient as you like.", speakers: [villager], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0002.0237, text: "Wind's up. Out past the ash stand the road's a suggestion and the waystone's the only landmark.", speakers: [guard], places: [wilds], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0238, text: "Came out after a heifer and found her in the wet, calm as anything.", speakers: [farmer], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0002.0239, text: "Only dry place out here is under a fallen trunk, and the rain's coming sideways.", places: [wilds], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0240, text: "Slept at the waystone. It's a poor bed and the only one on this side of the moor.", speakers: [traveller], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0002.0241, text: "Every fly on the moor has found me personally. Fair and hot and they've no reason to leave.", speakers: [hunter], places: [wilds], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0242, text: "Caves off the crags are webbed over. Big spiders, and the web's the only warning you get on a fair afternoon.", speakers: [adventurer], places: [wilds], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0243, text: "Afternoon out here is a long argument with the ground.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0244, text: "Bog's crept over the low crossing. Under this grey it'll rise again by morning, so there's a way round on the east side.", speakers: [villager], places: [wilds], times: [afternoon], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0245, text: "There's grass out here that answers to a voice, and I've watched a man argue with it.", speakers: [villager], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0246, text: "Rain's turned the cut track to something you carry rather than walk on.", speakers: [labourer], places: [wilds], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0247, text: "Two hours of hauling and the load's the same distance from anywhere.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0248, text: "Boar's been through the ash stand and left the ground like it was ploughed for him.", speakers: [hunter], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0249, text: "The survey's stakes go up past the crags and come back again. They've no more idea than we do.", speakers: [guard], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0250, text: "Wind's got up and the flock's gone to the lee side of the wall without being told.", speakers: [herder], places: [wilds], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0251, text: "Nothing for it but to sit until the light's better for the walk back.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0252, text: "Waystone walks up on you out of the fog on the high ground. Always a shock, always the same one.", speakers: [traveller], places: [wilds], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0253, text: "Trees are giving up their shapes one at a time, and the sky's grey going darker.", speakers: [hunter], places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0254, text: "Light goes strange over the Foldscar side before it goes anywhere else. Grey dusk, and it does that most evenings.", speakers: [villager], places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0255, text: "Dusk and nothing to do but find the fire before the dark does the finding.", places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0256, text: "Wain's stopped at the crest and I'm not taking it down in the dark. Anybody coming up, come in the morning.", speakers: [carter], places: [wilds], times: [dusk], channel: world, ai_generated: true }
  - { key: chat.b0002.0257, text: "Whole sky was doing something it shouldn't. Clear dusk, and nobody up here remarks on it any more.", speakers: [adventurer], places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0258, text: "Cut and stacked and left. Carrying it out is tomorrow's argument.", speakers: [labourer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0259, text: "Clear evening and the far side of the moor gone gold for about a minute.", places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0260, text: "A hedge healer's kit out here would be worth more than a blade. I've neither.", speakers: [hunter], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0261, text: "Wind's up with the dark. Anything that wants to be quiet will manage it easily.", speakers: [guard], places: [wilds], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0262, text: "There's a Call for walking, and mine put me on this moor and hasn't taken me off it yet.", speakers: [traveller], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0263, text: "Half a mile from anything and the rain's just starting.", places: [wilds], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0264, text: "Whatever's in the ground out here, the survey wants it mapped before anyone else sees it.", speakers: [labourer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0265, text: "Moor's gone all purple and quiet. Fair evening, and nothing on it worth hurrying for.", speakers: [villager], places: [wilds], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0266, text: "Scholars say a Pacha, priests say a boundary, and I say it's a fair night and cold.", speakers: [adventurer], places: [wilds], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0267, text: "Sat down before dark. Haven't got up.", places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0002.0268, text: "Something's working the stands on the east side. Worth a lamp if you're cutting there tomorrow, grey evening and all.", speakers: [hunter], places: [wilds], times: [evening], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0002.0269, text: "An Othermarked woman came down the road and folk found reasons not to be standing there.", speakers: [villager], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0002.0270, text: "Rain on the leaves is louder than rain on a roof and it never stops.", speakers: [labourer], places: [wilds], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0271, text: "Fell asleep against a trunk and woke up cold. That's the whole evening.", places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0002.0272, text: "Woundmoss off the patch and into the salves. The waystation sells it before it's dry.", speakers: [crafter], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0002.0273, text: "The Otherwake is what they call the mess a crossing leaves behind. Nobody up here is short of a word for it.", speakers: [hunter], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0002.0274, text: "Wind's got the fire flat and I'll be eating smoke or nothing.", speakers: [guard], places: [wilds], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0275, text: "The dark out here comes on all at once and then it's just you and the fire.", places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0002.0276, text: "A waystone's worth more than a lamp out here, in among the trees and this fog.", speakers: [traveller], places: [wilds], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0002.0277, text: "Fire's only worth what it reaches. Grey night out here and that isn't far.", speakers: [villager], places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0278, text: "Between the barrow and the rim there's two of us and a lamp. It's the watch's hour and the night's grey for it.", speakers: [guard], places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0002.0279, text: "Nothing to do but listen to the ground.", places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0002.0280, text: "Something's been at the pens up the valley. Anyone sleeping out tonight, keep the fire up.", speakers: [adventurer], places: [wilds], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0002.0281, text: "There's no counting a Reckoning out here. You count the nights and the nights count back, and it's a clear one.", speakers: [villager], places: [wilds], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0282, text: "Beasts won't settle and I've run out of reasons to give them.", speakers: [herder], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0002.0283, text: "Clear night and the cold coming down off the tops like water.", places: [wilds], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0002.0284, text: "A bone walker husk was on the barrow side. They don't come down and they don't go away either.", speakers: [hunter], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0002.0285, text: "Wind's up and the fire throws sparks a long way. That's a decision I'll regret.", speakers: [guard], places: [wilds], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0002.0286, text: "Nobody will guide you to the Foldscar at night. They'll tell you where not to walk and leave it.", speakers: [adventurer], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0002.0287, text: "Not a star to be had and rain on the leaves all night.", places: [wilds], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0002.0288, text: "Sleep with the stone at your back out here. It's not comfort, it's the only fixed thing.", speakers: [traveller], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0002.0289, text: "Front's come down the valley in the last hour and it's brought the cold in with it.", speakers: [guard], places: [ashen_hollow], times: [dawn], events: [weather_turned], ai_generated: true }
  - { key: chat.b0002.0290, text: "Turned about an hour ago. The basin's got a different sky over it now.", speakers: [villager], places: [cairnwold], times: [afternoon], events: [weather_turned], ai_generated: true }
  - { key: chat.b0002.0291, text: "Weather changed while I was on the rim stretch, and it changed fast.", speakers: [traveller], places: [old_east_road], times: [evening], events: [weather_turned], ai_generated: true }
  - { key: chat.b0002.0292, text: "The {creature}'s dead out past the wood edge. I'll not be the one carrying it back.", speakers: [hunter, guard], places: [ashen_hollow], times: [night], events: [creature_slain], ai_generated: true }
  - { key: chat.b0002.0293, text: "There's a dead {creature} at the verge past the shrine. Somebody did for it in the night.", speakers: [carter], places: [old_east_road], times: [morning], events: [creature_slain], ai_generated: true }
  - { key: chat.b0002.0294, text: "Found the {creature} down where the run crosses the wet. Clean work, and not mine.", speakers: [hunter], places: [wilds], times: [dusk], events: [creature_slain], ai_generated: true }
  - { key: chat.b0002.0295, text: "Market's settled and the stall's bare. Anything not sold today goes back up the road.", speakers: [villager], places: [cairnwold], times: [evening], events: [market_day], ai_generated: true }
  - { key: chat.b0002.0296, text: "Missed the market and I've been out here since. There's a lesson in that I'll not learn.", speakers: [adventurer], places: [wilds], times: [dawn], events: [market_day], ai_generated: true }
  - { key: chat.b0002.0297, text: "Day's trade is settled and the stall's down to what nobody wanted. Same as every time.", speakers: [crafter], places: [ashen_hollow], times: [afternoon], events: [market_day], ai_generated: true }
  - { key: chat.b0002.0298, text: "Word's come up the road that {claimant} brought in {bounty}. That's one less thing out here.", speakers: [traveller], places: [old_east_road], times: [dusk], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0002.0299, text: "They're saying {claimant} took {bounty}. Doesn't change my night and I'm glad of it.", speakers: [hunter], places: [wilds], times: [night], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0002.0300, text: "{claimant} is done with {bounty} and paid for it. The watch had the wall and no part in it.", speakers: [guard], places: [cairnwold], times: [morning], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0002.0910, text: "Kal came through with three loads and paid in coin, which is more than the wayhold's done this season.",
       speakers: [villager], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0911, text: "Kal won't take quarried stone. Won't say why, either. I've stopped offering and they've stopped not explaining.",
       speakers: [crafter], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0002.0912, text: "The Ondrek read a stone the way we read a debt. Difference is they're polite about it.",
       speakers: [adventurer], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0002.0913, text: "Hollow folk call us tight with the tally. We're not tight, we've just been short before and they haven't.",
       speakers: [farmer], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0914, text: "Survey came up from the Hollow with charts of our own basin. Our own. Nobody in this village knew we had charts.",
       speakers: [villager], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0002.0915, text: "Veth don't move and Kal do. That's the whole of the argument and neither side thinks they started it.",
       speakers: [traveller], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0916, text: "Hollow's got the iron and the wayhold. Cairnwold's got the grain and the manners. Guess which one a carter prefers.",
       speakers: [carter], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0002.0917, text: "Cairnwold'll feed you and ask what you're doing here in the same breath. I'd rather be asked than not fed.",
       speakers: [traveller], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0002.0918, text: "The Siann at the Hollow don't guess out loud. After a week up here that's restful.",
       speakers: [adventurer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0002.0919, text: "Wayhold marks the posts and the Survey marks the ground and both of them expect thanks for it.",
       speakers: [villager], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0002.0920, text: "Hollow folk think the moor's empty. It's not empty, it's just not theirs.",
       speakers: [hunter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0002.0921, text: "The Survey pays on time and asks questions after. I'd rather the other way round and I'd still take the money.",
       speakers: [labourer], places: [wilds], times: [afternoon], ai_generated: true }
