display_key: chatter.b0008.name
tags: [chatter]
notes: AI-generated ambient corpus (batch b0008) - dry frontier small talk across four places and six time bands, carrying the world's calendar, peoples, stones, Calls and factions as passing remarks.
role: corpus
batch: b0008
lines:
  - { key: chat.b0008.0001, text: "Frost on the water butt and frost on the slate. Bright, and cold with it.", places: [ashen_hollow], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0002, text: "Bog iron's the devil to work and grey iron's no bargain. My master's Call covered both and I'd as soon have had one.", speakers: [crafter], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0003, text: "Rain since dark and the yard's a pond. The woodpile's wet two layers in.", speakers: [labourer], places: [ashen_hollow], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0004, text: "Fog's taken the gate posts. I'm standing where I know they are.", speakers: [guard], places: [ashen_hollow], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0005, text: "Wind's up off the north-west. Loads over the rim today want to give it till noon.", speakers: [carter], places: [ashen_hollow], times: [dawn], weather: [wind], channel: world, ai_generated: true }
  - { key: chat.b0008.0006, text: "Stall's arrows, salves and the smith's iron. Hides you'll have to go to Cairnwold for.", places: [ashen_hollow], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0007, text: "Husks hold the barrow ring and don't come off it. My snares are set inside the line and stay there.", speakers: [hunter], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0008, text: "A newcomer's told to touch the Ashen Waystone. Nobody says why, and nobody asks past the once.", speakers: [traveller], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0009, text: "Sun's up early and the bellows are cold. Those two between them will decide the morning.", speakers: [crafter], places: [ashen_hollow], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0010, text: "Nothing's about but the birds, and they've been about since before the light.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0011, text: "Fourteen days to a tally. I've spent three of them drying grain that came in wet.", speakers: [farmer], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0012, text: "Nobody's up yet and the gate's had a long night of nothing. I'd take a long night of nothing.", speakers: [guard], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0013, text: "Grey's come down and settled. Second lot of washing is out and the first lot's still wet.", places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0014, text: "Road's soft past the shrine and the ruts have no bottom to them. Heavy loads want the high track till it drains.", speakers: [carter], places: [ashen_hollow], times: [morning], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0008.0015, text: "Wind's in the flue again. Every fire I light goes sideways and the shed fills up with smoke.", speakers: [crafter], places: [ashen_hollow], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0016, text: "Sun's on the wall and the wall's the better for it. Nobody's been by since the gate opened.", speakers: [guard], places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0017, text: "Rain's found the shed roof over the stall. Buckets out, canvas over the goods, and me between them.", speakers: [labourer], places: [ashen_hollow], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0018, text: "Sun's out and the hens are out. The morning's argument has gone their way entirely.", speakers: [herder], places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0019, text: "Survey came through asking about the old workings. Questions nobody here wants answered, and they ask them anyway.", speakers: [traveller], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0008.0020, text: "Every billet at this stop came up the road. Cairnwold's own seam is running thin, so the carters carry the iron in.", speakers: [villager], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0008.0021, text: "Resonance is what the work runs on. Strain is what it takes out of you, and the good ones talk about the second.", speakers: [adventurer], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0008.0022, text: "Veth eyes catch the lamp and hold it a beat too long. You stop noticing after a year and then you notice again.", speakers: [villager], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0008.0023, text: "A Kal's coat hangs wrong at the back unless the wings are folded tight. They'd rather you didn't bring it up.", places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0008.0024, text: "Half the morning gone and the list's got one thing off it. The list was optimistic.", places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0008.0025, text: "Sun's got the shed warm enough to work in. You forget what that's like until it's back.", places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0026, text: "Grey again, and the bench light with it. I'm working by the shape of things.", speakers: [crafter], places: [ashen_hollow], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0027, text: "Rain at midday and no stopping in it. The ditch I cut this morning is a ditch full of water.", speakers: [labourer], places: [ashen_hollow], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0028, text: "Wind's flat against you on the rise all afternoon. Loads that can wait should wait for it to turn.", speakers: [carter], places: [ashen_hollow], times: [afternoon], weather: [wind], channel: world, ai_generated: true }
  - { key: chat.b0008.0029, text: "Fog's off the low ground and into the road. The gate's all sounds now and the rest is guessing.", speakers: [guard], places: [ashen_hollow], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0030, text: "Fair's held all day. The beasts have had the best of it and I've had the wall and a cold back.", speakers: [herder], places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0031, text: "Bristleback's been at the far fence and it doesn't lean on a post, it takes the post with it.", speakers: [hunter], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0032, text: "A Mor's got no weight to them. Bench, floor and cart tailboard, none of it knows they're there.", speakers: [traveller], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0033, text: "Survey says the Veil's thin out past the cut. My grandmother said it's thin everywhere, and she never drew anything.", speakers: [villager], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0034, text: "The books have disagreed about the old stones for as long as there've been books. A Scholar walks out to look at one instead.", speakers: [adventurer], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0035, text: "Hollow Day doesn't sit in any tally. Some folk use it to settle what they owe and some to owe nothing.", places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0036, text: "Two strangers through, both hurrying, neither buying. The stall's got a fly on it and that's the afternoon.", places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0037, text: "Dusk and the grey's coming down with the light. The shed shuts when the shadows do.", places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0038, text: "Wind's bringing the smoke back down the flue. Door's shut and my eyes are watering either way.", speakers: [crafter], places: [ashen_hollow], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0039, text: "Clear to the rim and glad of it. The last mile is no place to be guessing at the light.", speakers: [traveller], places: [ashen_hollow], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0040, text: "Grey's closing in. The gate will want the bar down early and I'll want my coat.", speakers: [guard], places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0041, text: "Rain's come across the yard sideways. Every tool I own is in the wrong place for it.", speakers: [labourer], places: [ashen_hollow], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0042, text: "Fair evening and the beasts are down. One's off her feed and I'll be up with her half the night.", speakers: [herder], places: [ashen_hollow], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0043, text: "Husk on the barrow ground at dusk. It didn't move for me and I didn't move for it.", speakers: [hunter], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0044, text: "Stood at the Foldscar wall and the shadows came a half beat late. Nobody there would say what that means.", speakers: [adventurer], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0045, text: "Stones like that go back further than the roads do. The customs came with the stone, not with the stop.", speakers: [villager], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0046, text: "Road's clear through to the rim and I'm taking a load west at first light. Room for one on the box.", speakers: [carter], places: [ashen_hollow], times: [dusk], channel: world, ai_generated: true }
  - { key: chat.b0008.0047, text: "Ask a Kal about the quarry and the talk stops. It isn't rudeness. A grave's a grave, even in a sill.", places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0048, text: "Third day of the tally and the first two didn't finish either.", places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0049, text: "Still evening and the smoke goes straight up. The yard smells of tar and cold iron.", places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0050, text: "Grey evening. The hinge under my hands is three traditions in one piece, and none of them will own the other two.", speakers: [crafter], places: [ashen_hollow], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0051, text: "Rain's in and the beasts are in. Anything still out there is out on its own account.", speakers: [herder], places: [ashen_hollow], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0052, text: "Wind's got the lantern swinging and it's still lit. Wayhold fills it and the wind does what it likes.", speakers: [guard], places: [ashen_hollow], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0053, text: "Fog's come up the road behind me. I'd not want to be walking into it at this hour.", speakers: [traveller], places: [ashen_hollow], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0054, text: "Fair night and the lodge door's open. Anyone off the road is owed a chair and a dry hour.", speakers: [villager], places: [ashen_hollow], times: [evening], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0008.0055, text: "A Vaskaal's gear does what a working does and does it without one. Their owner will explain the difference at length.", speakers: [adventurer], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0008.0056, text: "A Call isn't handed out and it isn't a rank. You find out what you're for by being bad at it for a while.", speakers: [villager], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0008.0057, text: "Half the yard's cleared and it'll be half cleared in the morning. I'll be the one saying so, too.", speakers: [labourer], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0008.0058, text: "The Ondrek say they're what a Kal turns into. The Kal say that's a story told to sell a quarry. Both stay polite.", speakers: [crafter], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0008.0059, text: "Two chairs by the fire and one's got a coat over it. That's the lodge's whole evening accounted for.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0008.0060, text: "Sleep's the only thing left on the list and the list is going to lose again.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0008.0061, text: "Grey night and no stars to speak of. The yard's darker than the road is.", places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0062, text: "Wind's round the corner of the shed all night. You can't work to it and you can't sleep to it.", speakers: [crafter], places: [ashen_hollow], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0063, text: "Clear and cold and the gate's quiet. That's about as good as a night on watch gets.", speakers: [guard], places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0064, text: "No lamp and no stars on that stretch. You walk it by feel and you're wrong about the verge twice.", speakers: [traveller], places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0065, text: "Rain's on the roof and the beasts are restless with it. I've been out twice and I'll be out again.", speakers: [herder], places: [ashen_hollow], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0066, text: "Siann stop aging while they're still young. You can be talking to a face older than the lodge.", speakers: [villager], places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0067, text: "An Orenth pays for every crossing, in years or in names. Nobody's worked out which of those is the worse rate.", speakers: [adventurer], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0008.0068, text: "Husks on the barrow don't leave it and don't let a body settle near it. I've moved my line twice already.", speakers: [hunter], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0008.0069, text: "A Wayfarer knows the customs at each stop and what a stone is for. That's the whole of it and it keeps you dry.", speakers: [villager], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0008.0070, text: "Fourteen days in a tally, thirteen tallies in a Reckoning, and one day left over that nobody counts.", places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0008.0071, text: "Nothing moving out there but the shed door when the wind takes it. I'm not going out to look.", places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0008.0072, text: "Load's under the tarp and I'm going west at first light. Anyone wanting the road and a spare seat, be at the gate before it.", speakers: [carter], places: [ashen_hollow], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0008.0073, text: "Light's on the crags first and the village a while after. Fair, and cold coming off the moss.", places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0074, text: "Grey off the east side. The grain's been in since before the light and it can stay in.", speakers: [farmer], places: [cairnwold], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0075, text: "Rain on the moor and the flock isn't for moving. Backs to it, heads down, and me stood here arguing.", speakers: [herder], places: [cairnwold], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0076, text: "Wind comes over the crags and down between the walls. The watch on the road has it worse and won't be told.", speakers: [villager], places: [cairnwold], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0077, text: "Fog's sat in the moss and none of it lifting. Traps will be wet and the morning's longer for it.", speakers: [hunter], places: [cairnwold], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0078, text: "Fair start. The wall's been down since the last rain and I'll have half of it up before anyone decides it's needed.", speakers: [labourer], places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0079, text: "Market's hides and ash and moor gear. Nothing on that table came from further off than the ash stand.", speakers: [villager], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0080, text: "The anvil's older than the smithy built round it. Ondrek stone reads every blow and never passes the reading on.", speakers: [crafter], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0081, text: "Seam's thin and the carters bring the iron up this road. Every load gets counted at the gate, mine included.", speakers: [guard], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0082, text: "The beasts had the hour before the light did. Out here that's the only clock anyone trusts.", speakers: [farmer], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0083, text: "Ash stand's dry enough to cut and the north wall wants hands. An hour and a bar out of anyone who's got both.", places: [cairnwold], times: [dawn], channel: world, ai_generated: true }
  - { key: chat.b0008.0084, text: "Nothing's started and nothing's finished and the day's been decided without anybody saying so.", places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0085, text: "Grey's settled over the basin and the ash stand is dripping. Nothing dries today, so the roads go soft by afternoon.", places: [cairnwold], times: [morning], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0008.0086, text: "Wind's coming down the basin and taking the smoke with it. The west end gets it first and complains last.", speakers: [labourer], places: [cairnwold], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0087, text: "Sun's on the walls and half the village is stood about in it, doing nothing at speed.", speakers: [villager], places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0088, text: "Grey and the ewes have found the lee of the wall. I'll be looking for them in the same place for a fortnight.", speakers: [herder], places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0089, text: "Rain's on the fields and the grain's off the ground at the west end. Hollow Day's near and it wants to be dry for it.", speakers: [farmer], places: [cairnwold], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0090, text: "Sun's in at the forge door and the smoke goes out where it should. First warm morning of the tally.", speakers: [crafter], places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0091, text: "Long Survey was through asking about the outcrop above the village. Nobody could tell them anything and they wrote that down too.", speakers: [guard], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0008.0092, text: "Fourth day of the tally and the grain count's been done twice over. I'd rather it were dry than exact.", speakers: [farmer], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0008.0093, text: "Fellhorn only ever on the high ground near the stones. Nobody's driven one off it and I've watched men try.", speakers: [hunter], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0008.0094, text: "A Call's not a thing you pick. You find out you've got one the way you find out your boots leak.", speakers: [traveller], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0008.0095, text: "Everybody's out, nobody's finished, and the morning's gone.", places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0008.0096, text: "Two things to do before midday and one of them's a walk to the north side.", places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0008.0097, text: "Sun's over the Outfall and the whole basin's bright. You can see the wet patches from the wall.", places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0098, text: "Grey on the south edge. The crags will be getting rain on them long before we do.", speakers: [farmer], places: [cairnwold], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0099, text: "Rain's set in over the moss. The ewes have found what lee there is and I'm stood in the rest of it.", speakers: [herder], places: [cairnwold], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0100, text: "Wall's been down twice in this wind. A Kal built the stretch that's still standing and you can see which is which.", speakers: [labourer], places: [cairnwold], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0101, text: "Fog came up the Outfall and sat in the low end. Nothing's tracking in that and neither am I.", speakers: [hunter], places: [cairnwold], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0102, text: "Sun's warm and the forge is too warm. I'll take the bench outside and lose an hour to it.", speakers: [crafter], places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0103, text: "Hedge healer's got more trade than the market. Fevers mostly, and wounds that wanted looking at a day earlier.", speakers: [villager], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0104, text: "A downed man comes back at the Ashen Waystone, not where he fell. That's the stone's business and it's older than ours.", speakers: [guard], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0105, text: "The Constructed that worked the ash stand didn't sleep and didn't eat and didn't once ask why. Still running.", speakers: [adventurer], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0106, text: "A Siann won't be hurried into an answer. Give her the afternoon and she'll give you a year's worth of thinking.", speakers: [villager], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0107, text: "Cart's coming up the west road with iron on it. Anyone wanting any wants to be at the stall early.", places: [cairnwold], times: [afternoon], channel: world, ai_generated: true }
  - { key: chat.b0008.0108, text: "Half the afternoon's gone into finding a thing I was already holding.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0109, text: "Grey's coming down into the basin. Whoever's on the road tonight walks into it, and the Outfall side floods first.", places: [cairnwold], times: [dusk], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0008.0110, text: "Wind's up the Outfall and the smoke's gone sideways. Every door on the east side is shut.", speakers: [villager], places: [cairnwold], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0111, text: "Fair and the flock's in. The ewes were at the wall before I'd got my boots on, and they were right about it.", speakers: [herder], places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0112, text: "Grey evening and the wall's still short. It'll be short tomorrow and I'll be stood here again.", speakers: [labourer], places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0113, text: "Rain's in for the night. Grain's up off the ground and the rest of the village can get wet.", speakers: [farmer], places: [cairnwold], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0114, text: "Fair evening and the forge is the last thing working. You can hear the hammer from the well.", speakers: [crafter], places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0115, text: "Fellhorn stay on their own ground and don't come down into the basin for anything. That's all I know of them.", speakers: [hunter], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0116, text: "The well's kerb is Ondrek cut and older than the well. Nobody's asked what it was before and the well isn't telling.", speakers: [villager], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0117, text: "Gate shuts at dusk. Wayhold leaves two on the wall through the night and none of us has wanted more.", speakers: [guard], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0118, text: "Veth learn a trade faster than they've any right to and then stop learning it. Ask one why and you'll get a shrug.", speakers: [adventurer], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0119, text: "Nothing's been by the well since the light went, and the bucket's still out.", places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0120, text: "Supper's the same as it was and I'm grateful for it in a way I wasn't an hour ago.", places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0121, text: "Still evening. The Long Lodge is loud and the walls are carrying it as far as the well.", places: [cairnwold], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0122, text: "Grey's come in with the dark. Nobody's got a lamp lit that isn't needed.", speakers: [villager], places: [cairnwold], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0123, text: "Rain on the roofs and the beasts are settled. That's the evening's one good turn and I'll take it.", speakers: [herder], places: [cairnwold], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0124, text: "Wind's down the basin and the gate's banging. I've put the bar in twice and it'll want doing again.", speakers: [guard], places: [cairnwold], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0125, text: "Fog's filled the low end. The waystone down the road is the only thing out here that stays put.", speakers: [traveller], places: [cairnwold], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0126, text: "Market's done and the hides went well. What didn't sell goes up the road with the carters in the morning.", speakers: [farmer], places: [cairnwold], times: [evening], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0008.0127, text: "Long Survey asked the village for the loan of a cart and got two. They'll be at the old workings before the weather turns.", speakers: [crafter], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0008.0128, text: "Marks you're born with are one thing. Marks that come later are another and folk make a face about those.", speakers: [villager], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0008.0129, text: "Wall's short by an arm's length and the light's gone. Tenth day of the tally and it was started on the first.", speakers: [labourer], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0008.0130, text: "Half the valley has an opinion about the Foldscar and none of them has stood in it. That includes the ones with drawings.", speakers: [adventurer], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0008.0131, text: "Hollow Day's the one nobody counts and everybody plans. The village will argue about the plans and not the day.", places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0008.0132, text: "Somebody's brought a jug out and the evening's got longer by it.", places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0008.0133, text: "No stars and the basin's black. The walls you know are still there and that's what you go by.", places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0134, text: "Wind's down the crags all night. Wayhold keeps two on the wall, the gate's barred, and that's the whole of it.", speakers: [guard], places: [cairnwold], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0135, text: "Clear and cold. Eleventh day of the tally and the beasts are finally sleeping the night through.", speakers: [herder], places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0136, text: "Grey night. The well's gone quiet, which is how you know it's late.", speakers: [villager], places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0137, text: "Rain on the granary roof all night. Grain's dry under it and I'll still walk over and look.", speakers: [farmer], places: [cairnwold], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0138, text: "Fair night and the forge banked. Nothing wants doing and I don't trust a night that doesn't.", speakers: [crafter], places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0139, text: "Wolves in the ash stand, and more than the two I counted. Anyone taking the north side tomorrow goes in numbers.", speakers: [hunter], places: [cairnwold], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0008.0140, text: "Vaskaal can't hold a working at all. They measure what we do instead, and their numbers come out better than ours.", speakers: [villager], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0008.0141, text: "A Kal told me the quarry takes the dead out of the ground. The Ondrek said they are the dead, still walking. Both stayed calm.", speakers: [adventurer], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0008.0142, text: "Ondrek don't have children, and they know what that means. Everything they make is made careful and costs accordingly.", speakers: [crafter], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0008.0143, text: "Lodge is dark and the fire's down to nothing. Somebody should have banked it and nobody did.", places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0008.0144, text: "Two hours of quiet and then the cockerel. The quiet was the good part.", places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0008.0145, text: "Light's on the rim and the road's still in shadow. Half an hour and the ruts will show.", places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0146, text: "Grey from the shrine onwards. You can tell where the road dips by where the mist sits.", speakers: [carter], places: [old_east_road], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0147, text: "Rain all night and no shelter worth the word. Past the shrine the road bends further than it ought, and an Otherfold is what they call that.", speakers: [traveller], places: [old_east_road], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0148, text: "Wind's down off the rim and cold with the drop behind it. The fire will want feeding twice tonight.", speakers: [guard], places: [old_east_road], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0149, text: "Fog on the low stretch. You hear a cart before you see the horse and that's the whole of the warning.", speakers: [labourer], places: [old_east_road], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0150, text: "Fair and the light's flat. Prints on that verge read clean at this hour and that's the only good reason to be out.", speakers: [hunter], places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0151, text: "Touched the stone at the shrine going past. Travellers leave what they can spare and the watch keeps the light in it.", speakers: [traveller], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0152, text: "Wain's still on its side at the bend and half the load spoiled. Anyone with a cart could do better out of it than the owner did.", speakers: [carter], places: [old_east_road], times: [dawn], channel: world, ai_generated: true }
  - { key: chat.b0008.0153, text: "Making a thing behave other than it would is the whole of magic. The rest is standing in the right place and paying for it after.", speakers: [villager], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0154, text: "There's a waystone on the rim and a long drop beside it. The stone's older than the road and it doesn't shorten anything.", speakers: [adventurer], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0155, text: "Nothing on the road but the wind's leavings. A strap, a nail, and half a boot.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0156, text: "First light and the fire's down. Somebody had the last of the warmth and it wasn't me.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0157, text: "Grey and the road going the colour of the sky. Nothing to see and a long way to see it.", places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0158, text: "Wind's across the road and the load's pulling sideways. I've strapped it twice and I'll strap it again.", speakers: [carter], places: [old_east_road], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0159, text: "Sun's up and the road's clear to the rim. If anyone's been waiting on the weather to move a load, this is the hour.", speakers: [guard], places: [old_east_road], times: [morning], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0008.0160, text: "Grey all the way. The shrine's a smudge, the rim's a guess, and the stones are the only things holding their ground.", speakers: [traveller], places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0161, text: "Rain's taken the verge. Whatever crossed last night is a day ahead of me now.", speakers: [hunter], places: [old_east_road], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0162, text: "Sun's out and the culvert's full of last night's water. It'll take me till noon and then it'll rain again.", speakers: [labourer], places: [old_east_road], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0163, text: "Lantern on the shrine's been filled and the fire on the rim's still in. Two kindnesses the watch does nobody any explaining about.", speakers: [guard], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0008.0164, text: "Ondrek sell you a gate hinge, thank you for the trade, and say nothing else at all. They're the politest people on this road.", speakers: [villager], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0008.0165, text: "Walked the Foldscar wall at midday and the echo came back off the wrong stones. Nobody up there would name a reason.", speakers: [adventurer], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0008.0166, text: "Nobody's got the whole of it. The scholar gives one account, the healer another, my grandmother a third, and each keeps to their own.", speakers: [crafter], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0008.0167, text: "Two hours on the road and nothing's passed either way. That's not peace, that's luck.", places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0008.0168, text: "Boot's come apart at the welt. I'll walk it to the next fire and think about it there.", places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0008.0169, text: "Sun's high and the road's white with it. You can see the whole rise to the rim and nothing on it.", places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0170, text: "Grey ahead and blue behind. I'll be under the grey before the load's had its dinner.", speakers: [carter], places: [old_east_road], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0171, text: "Rain on the open stretch and nowhere to stand out of it. The shrine's the first stone and it isn't a roof.", speakers: [traveller], places: [old_east_road], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0172, text: "Wind's got the shrine post creaking. The light's in it and the post will hold or it won't.", speakers: [guard], places: [old_east_road], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0173, text: "Fog's come up off the drop and swallowed the rim. Barrow ground's north of here and I'd not go up in this to prove it.", speakers: [hunter], places: [old_east_road], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0174, text: "Sun's dried the top of the road and left the bottom of it a bog. Loads going west want the crown or they'll be digging out by dark.", speakers: [labourer], places: [old_east_road], times: [afternoon], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0008.0175, text: "Iron's dear at Cairnwold and dearer every tally the seam thins. The carters are making a living out of it and good luck to them.", speakers: [villager], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0176, text: "The stop's stall holds arrows, salves and the smith's iron, and no hides at all. Hides go the other way along this road.", speakers: [crafter], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0177, text: "The survey's drawn the Quiet Stones from every side and the drawings don't agree. Three stones and a shaft and none of it sits still.", speakers: [adventurer], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0178, text: "Fire on the rim's lit early and there's wood stacked by it. That's the Wayhold doing the one thing everyone wants done.", speakers: [guard], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0179, text: "Long afternoon and the road's gone the colour of the sky again. Nothing's passed since the middle of it.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0180, text: "Half a mile more and then the rise, and then the rise again until it's done.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0181, text: "Dusk and the grey's coming up the road to meet us. Half a mile and we'll be inside it.", places: [old_east_road], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0182, text: "Wind's off the drop and cold with it. Whoever's standing the rim tonight gets the worse half of the bargain.", speakers: [guard], places: [old_east_road], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0183, text: "Fair light going down and the rim's a black line against it. I'll not be walking the last of it in the dark.", speakers: [traveller], places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0184, text: "Grey's thickening and if it comes down to fog I'm stopping short with the load. Anyone behind me should know it.", speakers: [carter], places: [old_east_road], times: [dusk], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0008.0185, text: "Rain and a beast that won't be led. Fifth day of the tally and every one of them has been this road.", speakers: [herder], places: [old_east_road], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0186, text: "Fair evening and something's been on the verge since morning. The tracks go up the rise and I've not found where they come down.", speakers: [hunter], places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0187, text: "You leave what you can spare at the shrine and nobody keeps a count of it. That's most of the point of leaving it.", speakers: [villager], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0188, text: "A Kal won't be led into talking about a Pacha turning. What they do about it is build, and they build as though it's coming.", speakers: [adventurer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0189, text: "Dusk. The pothole's deeper than it was this morning and I've made it worse twice.", speakers: [labourer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0190, text: "Lantern's lit at the shrine and the fire's up on the rim. Two lights on one road and both of them the watch's.", speakers: [guard], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0191, text: "Nobody's come up the road since the light started going. You hear a cart a long way on a still evening.", places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0192, text: "Supper's cold and the fire's worth more than it is. I'll take both and not complain about either.", places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0193, text: "Still evening on the road. The post at the shrine throws its light a long way when there's nothing in the air.", places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0194, text: "Grey closing in. Wayhold's fire is the only thing on this rise that isn't the colour of the sky.", speakers: [guard], places: [old_east_road], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0195, text: "Rain on the road and the tarp's losing. Anything on the west stretch tonight will be wet through by the rim.", speakers: [carter], places: [old_east_road], times: [evening], weather: [rain], channel: world, ai_generated: true }
  - { key: chat.b0008.0196, text: "Wind's up and the fire's not happy about it. Ash everywhere and none of the warmth where it's wanted.", speakers: [traveller], places: [old_east_road], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0197, text: "Fog off the drop and into the camp. The barrow's north of here and the husks keep to it, so it's a quiet night either way.", speakers: [hunter], places: [old_east_road], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0198, text: "Fair evening and there's a little light left in the road. Enough to get down to the fire and no more.", speakers: [villager], places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0199, text: "A Kal at a fire folds the wings flat and sits forward, and takes up more room than the fire's prepared to give.", speakers: [adventurer], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0008.0200, text: "Every billet up this road is Cairnwold's iron coming in because its own seam is going. The carts are the seam now.", speakers: [crafter], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0008.0201, text: "Evening and the barrows are where I left them. That's not progress and it's not nothing.", speakers: [labourer], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0008.0202, text: "Fire's up and the kettle's on and the day can do what it likes now.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0008.0203, text: "Somebody's left a boot by the fire and nobody's claimed it. It'll still be there in the morning.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0008.0204, text: "Leave a thing at the shrine and it stays till somebody needs it more. That's the whole custom and it works well enough.", speakers: [villager], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0008.0205, text: "No stars and no lamp and the road's a rumour under your feet.", places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0206, text: "Wind's over the rim all night. The fire's banked, the watch is two, the road is one, and that's the arithmetic.", speakers: [guard], places: [old_east_road], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0207, text: "Clear night and cold with it. The beasts are warm enough, I'm not, and the load doesn't care either way.", speakers: [carter], places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0208, text: "Grey night and the shrine's light is a smudge from a distance. Close to, it's the whole of the world.", speakers: [traveller], places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0209, text: "Rain in the dark and nothing to be read in it. The barrow ring's up the rise and the husks don't mind weather.", speakers: [hunter], places: [old_east_road], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0210, text: "Fair night and two fires burning on this road. Anyone still out on it should aim for the higher one and not the drop.", speakers: [villager], places: [old_east_road], times: [night], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0008.0211, text: "A Siann at a night fire will sit through the whole of it and say four words. Three of them are worth the evening.", speakers: [adventurer], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0008.0212, text: "A Kal won't lift quarry stone and I've carried it for two of them now. They square it in labour and never once in words.", speakers: [labourer], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0008.0213, text: "Night at the bench and the lamp's doing the arguing. Everything I cut is a hand's width wrong and I'll find it by light.", speakers: [crafter], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0008.0214, text: "Beasts are quiet and the grain's accounted for. That's a night I can sleep through, if the sky will let me.", speakers: [farmer], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0008.0215, text: "Somebody's snoring in the camp and it isn't the one who's on watch.", places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0008.0216, text: "Cold's got into my boots and it isn't leaving before the sun does.", places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0008.0217, text: "Light comes up the moor in a line and takes its time about the rest.", places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0218, text: "Grey before the light and the ground's wet through. Snares will be full or they won't and I'm walking the line either way.", speakers: [hunter], places: [wilds], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0219, text: "Rain on the open moor and no wall to put anything behind. Ninth dawn of the tally and the flock's had all of them standing in it.", speakers: [herder], places: [wilds], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0220, text: "Wind's off the crags and straight across everything. Nothing stands up on this moor that isn't stone.", speakers: [labourer], places: [wilds], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0221, text: "Fog in the low ground and the moor's got a shape you can't trust. Every rise is a step you didn't plan on.", speakers: [traveller], places: [wilds], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0222, text: "Fair coming up and the ground will take a boot without a fight. That's as much as I ask of a morning.", speakers: [farmer], places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0223, text: "Ask where the good stone comes from and you'll meet people who don't answer letters. Folk here have stopped asking.", speakers: [adventurer], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0224, text: "A Mor walked the moor edge for an hour with no print and no shadow. They're a guest and the moor doesn't argue with guests.", speakers: [crafter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0225, text: "Market day at Cairnwold and the hides are in. Anyone with a pelt worth trading wants to be at that table before the light's high.", speakers: [villager], places: [wilds], times: [dawn], channel: world, ai_generated: true }
  - { key: chat.b0008.0226, text: "Nothing out here but what was here last tally and the year before that.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0227, text: "Nobody's got the whole of it and the moor doesn't offer opinions. That's why folk come out here to argue.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0228, text: "Fellhorn on the high ground and no reason for it. I've been told they keep to the stones and that's all anyone's told me.", speakers: [guard], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0008.0229, text: "Grey over the whole moor and no edge to it anywhere. You walk by the wet and not by the sky.", places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0230, text: "Wind's carrying my scent back down the rise. The barrow keeps its husks, I keep my line, and we've never had words.", speakers: [hunter], places: [wilds], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0231, text: "Sun's out and the ground's soft enough to cut. Turf comes up in sods instead of crumbs and that's a good morning.", speakers: [labourer], places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0232, text: "Grey and the flock's spread out. Anyone driving stock today wants them close and a count before dark.", speakers: [herder], places: [wilds], times: [morning], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0008.0233, text: "Rain and no shelter for a mile in any direction. You stand in it, you get used to it, and then you're wet.", speakers: [traveller], places: [wilds], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0234, text: "Fair and the ground's drying at the top. Turn it now and it comes up kind; leave it and it bakes.", speakers: [farmer], places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0235, text: "Half the moor has a story about the Foldscar and no two of them end the same. Nobody's settled it and nobody's going to.", speakers: [adventurer], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0008.0236, text: "The sky sets the hour out here and the beasts keep to it better than I do. You feel the day turn without a bell.", speakers: [crafter], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0008.0237, text: "Survey had pegs out along the moor in a line and left them there. Nobody's asked what the line is for.", speakers: [guard], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0008.0238, text: "Nobody's come past since dawn. Out here that's not quiet, that's just how it is.", speakers: [villager], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0008.0239, text: "Thirteenth tally next and the moor counts nothing. That's most of why I'm out here.", places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0008.0240, text: "Half the morning gone in walking and none of it in getting anywhere.", places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0008.0241, text: "Sun's on the moor and every wet place in it is shining. You can see the bog from a mile off when it's like this.", places: [wilds], times: [afternoon], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0008.0242, text: "Grey and the light's flat. Better for seeing a thing move and worse for telling what it is.", speakers: [hunter], places: [wilds], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0243, text: "Rain and the flock's down in the dip. They'll not come up for me and they don't have to.", speakers: [herder], places: [wilds], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0244, text: "Wind's up and the peat's blowing off the cut in sheets. You work with your back to it or you don't work.", speakers: [labourer], places: [wilds], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0245, text: "Fog's come down on the moor from three sides. The fourth side's the way I came and I'd not swear to it now.", speakers: [traveller], places: [wilds], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0246, text: "Fair and the ground's warm a hand deep. Twelfth day of the tally and the peat's finally giving.", speakers: [farmer], places: [wilds], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0247, text: "The stones at the Foldscar are three with a shaft between them. The survey is sure that matters, and sure isn't the same as right.", speakers: [adventurer], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0248, text: "Ondrek read stone the way a smith reads iron, by the ring of it. They'll tell you what a wall has been through and be right.", speakers: [crafter], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0249, text: "There's no healer within a day of here and everyone knows it. On the moor you carry what you'd want somebody to have.", speakers: [villager], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0250, text: "Watch doesn't come out this far. Ask them about the moor and they'll tell you the road's their worry, and they'll mean it.", speakers: [guard], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0251, text: "Nothing's moved since noon except the light and a bird that didn't like me.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0252, text: "Two hours of walking and the same view from a different wet patch.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0008.0253, text: "Grey going down and no colour in it anywhere. The moor's the same grey as the sky and the sky wins.", places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0254, text: "Wind's turned and it's coming off the crags. The barrow's the other way and the husks are the barrow's.", speakers: [hunter], places: [wilds], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0255, text: "Fair dusk and the whole moor goes gold for a quarter of an hour. Then it's grey and then it's dark.", speakers: [traveller], places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0256, text: "Grey and the light's going early. I'll finish the cut tomorrow and it'll be no worse for a night.", speakers: [labourer], places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0257, text: "Rain at dusk and the flock's in the fold. Ninth day of the tally and the fold has been wanted every one of them.", speakers: [herder], places: [wilds], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0258, text: "Fair dusk and there's weather in the west that hasn't reached us. Anyone on the far moor tonight wants to be back before it does.", speakers: [farmer], places: [wilds], times: [dusk], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0008.0259, text: "An Orenth steps out of one place and into another and pays for it every time. I've watched one come back with fewer names than he left with.", speakers: [adventurer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0260, text: "The Ondrek are patient with everyone and sad about most things. They'll mend a tool and never say what it cost them to do it.", speakers: [crafter], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0261, text: "Market wants hides and moor gear and the moor's the only place that makes either. There's a living in the wet if you've the patience.", speakers: [villager], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0262, text: "Nobody's asked the watch to come out this far and nobody will. I'm here because the road is and the road's the job.", speakers: [guard], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0263, text: "Light's gone and the moor's still light a while after. You get a second dusk up here and it's better than the first.", places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0264, text: "Nothing to build and nothing to mend. A body can get used to that faster than is decent.", places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0008.0265, text: "Still evening and the moor's listening. The beasts set the hour out here and I've never known them wrong about it.", places: [wilds], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0266, text: "Grey evening and the wind's dropped. That's when you hear a thing before you see it and that's the whole of the trade.", speakers: [hunter], places: [wilds], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0267, text: "Rain out here and the low ground's filling. Anyone crossing the moss tonight keeps to the high edge or doesn't cross.", speakers: [traveller], places: [wilds], times: [evening], weather: [rain], channel: world, ai_generated: true }
  - { key: chat.b0008.0268, text: "Wind's throwing sparks across the heather. A Kal would have had a wall round this camp days ago and it would still be standing.", speakers: [labourer], places: [wilds], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0269, text: "Fog's come up and the flock's somewhere in it. They'll be there in the morning and so will the fog most likely.", speakers: [herder], places: [wilds], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0008.0270, text: "Fair evening and the heather's dry to the touch. The moor's a different place when it's like this and it doesn't last.", speakers: [farmer], places: [wilds], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0271, text: "Veth fingers are longer than they've any business being and they'll take a knot apart without looking. Good hands in a wet camp.", speakers: [adventurer], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0008.0272, text: "Survey's got a peg line out on the moor and a plan nobody's read. They'll come back for the pegs and not for the plan.", speakers: [crafter], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0008.0273, text: "Hollow Day's a day out of the count and out here that's every day. It's the village that makes a fuss of it.", speakers: [villager], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0008.0274, text: "I'll have the fire low tonight. Nothing's about and nothing's coming, and low is safer than warm.", speakers: [guard], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0008.0275, text: "Supper's a hard biscuit and a strip of something. The fire makes it a meal and the fire's nearly out.", places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0008.0276, text: "Half the evening gone and the boots are steaming by the fire. They'll be wet again by the second hour of walking.", places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0008.0277, text: "No stars and no wind. Thirteenth tally tomorrow, then a day nobody counts, and the moor won't mark either.", places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0278, text: "Wind's up and it's taken the fire's smoke sideways. Nothing will come near this camp tonight and nothing needs to.", speakers: [hunter], places: [wilds], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0008.0279, text: "Clear and cold and the flock's quiet. Twelfth night of the tally and they've had worse ones than this.", speakers: [herder], places: [wilds], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0008.0280, text: "Grey night and the ground's the only thing that's certain. You walk it by the slope of it and hope the slope agrees.", speakers: [traveller], places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0008.0281, text: "Rain all night and no shelter but what I've built. It's not much, it's mine, and it keeps the worst of it off.", speakers: [labourer], places: [wilds], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0008.0282, text: "Fair night and the stars are out. Weather's held for tomorrow and the moss will be passable at the high edge.", speakers: [farmer], places: [wilds], times: [night], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0008.0283, text: "Marks come later for some and they're not a thing you can point at and settle. Half the valley has a rule about it and no two rules match.", speakers: [adventurer], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0008.0284, text: "Ondrek read stone for what it remembers and they're never wrong about it. That's why a wall of theirs is worth more than a wall.", speakers: [crafter], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0008.0285, text: "Nobody out here asks where the good stone came from. That's not manners, it's the whole of the arrangement.", speakers: [villager], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0008.0286, text: "I'm on watch till the light and nothing will come. That's been true of most nights and I've not stopped standing it.", speakers: [guard], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0008.0287, text: "Bed's a stone's throw from the fire and the fire's the only warm thing for a day in any direction.", places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0008.0288, text: "Two hours before light and the cold's got in everywhere it can. There's no arguing with it and I've stopped.", places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0008.0289, text: "Weather's turned. Rain in from the west and it'll be on the rim by noon.", speakers: [carter], places: [ashen_hollow], times: [dawn], events: [weather_turned], ai_generated: true }
  - { key: chat.b0008.0290, text: "Front's in. Grey from the crags to the Outfall and the wind coming with it.", speakers: [farmer], places: [cairnwold], times: [afternoon], events: [weather_turned], ai_generated: true }
  - { key: chat.b0008.0291, text: "Weather's turned on the road. Whatever was fair this morning isn't, and the shrine's the only light in it.", speakers: [traveller], places: [old_east_road], times: [evening], events: [weather_turned], ai_generated: true }
  - { key: chat.b0008.0292, text: "Something's been killed out past the shrine. A {creature}, by the state of the ground.", speakers: [hunter], places: [ashen_hollow], times: [night], events: [creature_slain], ai_generated: true }
  - { key: chat.b0008.0293, text: "They got the {creature} on the low stretch. It's left a mark across the road and nobody's cleared it.", speakers: [carter], places: [old_east_road], times: [morning], events: [creature_slain], ai_generated: true }
  - { key: chat.b0008.0294, text: "There's a {creature} dead out on the moor and the crows had found it before I did.", speakers: [hunter], places: [wilds], times: [dusk], events: [creature_slain], ai_generated: true }
  - { key: chat.b0008.0295, text: "Market day's done and the table's cleared. Hides went, the ash went, and the moor gear mostly went.", speakers: [villager], places: [cairnwold], times: [evening], events: [market_day], ai_generated: true }
  - { key: chat.b0008.0296, text: "Market's settled at Cairnwold and the pelts came off the table before the light was high.", speakers: [hunter], places: [wilds], times: [dawn], events: [market_day], ai_generated: true }
  - { key: chat.b0008.0297, text: "Market's settled and the stall's had its day. Arrows went and the salves went and the iron's still sitting there.", speakers: [crafter], places: [ashen_hollow], times: [afternoon], events: [market_day], ai_generated: true }
  - { key: chat.b0008.0298, text: "{claimant} has claimed {bounty}, and the road's got one less thing on it tonight.", speakers: [carter], places: [old_east_road], times: [dusk], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0008.0299, text: "Word came up that {claimant} took {bounty}. Whoever wanted that done went a long way out of their way for it.", speakers: [adventurer], places: [wilds], times: [night], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0008.0300, text: "{claimant} claimed {bounty} before the light was up. The lodge will be talking about it over breakfast.", speakers: [villager], places: [cairnwold], times: [morning], events: [bounty_claimed], ai_generated: true }
