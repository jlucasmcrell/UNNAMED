schema: 1
display_key: chatter.b0010.name
tags: [chatter]
notes: AI-generated ambient corpus (batch b0010) - dry frontier small talk across four places and six time bands, carrying the world's calendar, peoples, stones, Calls and factions as passing remarks.
role: corpus
batch: b0010
lines:
  - { key: chat.b0010.0001, text: "Somebody's been at the woodpile in the night. Whoever it was stacked it neater than I do.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0002, text: "Grey right down to the roofs and no wind in it. The smoke goes up straight and stays there.", places: [ashen_hollow], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0003, text: "A Mor's got no weight and no face it has to keep. You get used to that quicker than you'd think.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0004, text: "Watch-fire's out and the yard's dry underfoot. Fair till noon if the smoke's telling the truth.", speakers: [guard], places: [ashen_hollow], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0005, text: "Rain's got into the load already. The front half of this tally's gone on wet hides.", speakers: [carter], places: [ashen_hollow], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0006, text: "Wind's through the shed door and the coals are going soft. Two bars and neither of them right.", speakers: [crafter], places: [ashen_hollow], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0007, text: "Fog's sat on the moss and there's not a print in it. Nothing crossed that I could follow.", speakers: [hunter], places: [ashen_hollow], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0008, text: "Ditch east of the yard is open and the road's dry over it. Anything held up by the muck can shift today.", speakers: [labourer], places: [ashen_hollow], times: [dawn], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0010.0009, text: "First roof in a Reckoning's walking, and I'd forgotten how quiet a straw tick is.", speakers: [traveller], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0010, text: "Two of the Long Survey are up and out before the lodge fire's lit. Whatever they're at, they're at it early.", speakers: [villager], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0011, text: "Hens are down and the ewes are down, and neither of them wants to be first out of the door.", speakers: [herder], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0012, text: "An ember hound's been at a byre and the door's got a burn on it the shape of a jaw.", speakers: [adventurer], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0013, text: "Tally turns in two days. You can tell by the way the lodge fills up an hour earlier every night.", places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0010.0014, text: "Sun's behind a flat roof of cloud and nothing's going to dry today.", places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0015, text: "Been stood in the wet so long it's coming through from the inside of my coat.", places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0010.0016, text: "Wind's got the shrine lantern swinging and the flame down to a stub. It wants filling before noon.", speakers: [guard], places: [ashen_hollow], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0017, text: "There's iron going east on my cart and the road's hard the whole way to the rim. Another pair of hands would get it there by dark.", speakers: [carter], places: [ashen_hollow], times: [morning], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0010.0018, text: "Cloud's the colour of a cold forge and my hands have gone the same.", speakers: [crafter], places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0019, text: "Rain's taken the scent off the ground and put it up in the air. Nothing walks into a snare in this.", speakers: [hunter], places: [ashen_hollow], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0020, text: "Sun's out and the mortar's going off before I've got the stone sat.", speakers: [labourer], places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0021, text: "These stones are older than the road they stand beside, and no two of them are cut alike.", speakers: [traveller], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0010.0022, text: "There's a Kal at the lodge door asking after a blade with a broad spine, and won't come in out of the wind.", speakers: [villager], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0010.0023, text: "Grain's come in two sacks light of the last tally and nobody's saying it out loud yet.", speakers: [farmer], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0010.0024, text: "Hens won't come off the roost for me, and they've a better ear for what's coming than I have.", speakers: [herder], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0010.0025, text: "Waystones don't do anything you can see. Folk touch them going past anyway, and I'm one of them.", places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0026, text: "Afternoon's gone bright and the whole yard's out squinting at nothing in particular.", places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0027, text: "Carried the same bucket four ways and none of them was the way I meant.", places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0028, text: "Shrine's a stone and a lit post and no roof over either, and the Wayhold keeps it that way.", speakers: [guard], places: [ashen_hollow], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0029, text: "Rain's come up from the south and the low stretch east is holding water again. Third time this tally and the carters are sick of it.", speakers: [carter], places: [ashen_hollow], times: [afternoon], weather: [rain], channel: world, ai_generated: true }
  - { key: chat.b0010.0030, text: "Wind's got the shed door banging and the timber's come off the stack twice.", speakers: [labourer], places: [ashen_hollow], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0031, text: "Fog's up and the road's the same colour as the sky. You walk by the ruts and hope.", speakers: [traveller], places: [ashen_hollow], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0032, text: "Sun's on the bench for once and the glue's going off before I can get the clamp on.", speakers: [crafter], places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0033, text: "The Long Survey pays for what it takes. Whether it pays enough is a different question.", speakers: [villager], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0034, text: "Three stones at the Foldscar stand round a shaft and the survey wants them set right. Nobody's told me what right means.", speakers: [adventurer], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0035, text: "Spiders in the caves off the cut are bigger this tally than last and I'd sooner not be the one counting.", speakers: [hunter], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0036, text: "Ewe's lame on the near side and won't be told which foot it is.", speakers: [herder], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0037, text: "Light's going grey and the yard's full of people finishing what they should've finished at noon.", places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0038, text: "Last night of the tally, and there'll be a row at the lodge about who's owed what.", places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0039, text: "Dusk comes down grey and the whole place stops pretending it's still working.", places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0040, text: "Wind's taken the shrine post's flame twice today and I've filled it twice. The Wayhold counts that.", speakers: [guard], places: [ashen_hollow], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0041, text: "Rain's on, wheels are chocked, and there's nothing to do but watch the bed fill.", speakers: [carter], places: [ashen_hollow], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0042, text: "Dusk's clear and the wall's four courses up. I'll have it at five before the light goes.", speakers: [labourer], places: [ashen_hollow], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0043, text: "Stall's got arrows and salves and iron and not a hide in it, and every second traveller asks for hides.", speakers: [villager], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0044, text: "Husks are up at the barrow and the ground's been turned between it and the road. Anyone going that way, go up in daylight.", speakers: [adventurer], places: [ashen_hollow], times: [dusk], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0010.0045, text: "Husks don't eat and don't sleep and don't leave the barrow. There's nothing to hunt there and the trade knows it.", speakers: [hunter], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0046, text: "The stones were here before the road was. The road just went between them, and that's all anyone knows.", speakers: [traveller], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0047, text: "Bench swept and tools up and one hinge that's had the whole day without being finished.", speakers: [crafter], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0048, text: "Grain wagon's in and the sacks are stacked and I've no notion whose they are.", speakers: [farmer], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0049, text: "Evening's clear and the cold's coming down off the tops. Good night to be on the right side of a door.", places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0050, text: "Sat down to get my boots off and that was the evening.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0010.0051, text: "Folk here count the year in tallies and would stare at you if you asked them for a date.", places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0010.0052, text: "Fog's thick enough that the shrine post's glow is the whole road. The watch keeps it fed.", speakers: [guard], places: [ashen_hollow], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0053, text: "Iron's short in the basin and the carters are running east with it. If you've a cart standing idle, it won't stand long.", speakers: [carter], places: [ashen_hollow], times: [evening], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0010.0054, text: "Rain on the shed roof all evening and the forge is the only dry heat in the valley.", speakers: [crafter], places: [ashen_hollow], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0055, text: "Wind's taken the smell of the traps and spread it everywhere. Nothing's coming near them tonight.", speakers: [hunter], places: [ashen_hollow], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0056, text: "Clear evening and the lodge door's propped open to let the smoke out and the noise in.", speakers: [villager], places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0057, text: "Every one of these waystations keeps the same three customs and none of them are written down anywhere.", speakers: [traveller], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0010.0058, text: "Ondrek work comes up the road once in a while and it's better than anything made here. You don't ask what it was.", speakers: [adventurer], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0010.0059, text: "Pulled the old sill out of the shed door and it was worked stone, and it wasn't from here.", speakers: [labourer], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0010.0060, text: "Ewes are in and the hens are in and I'm the last one out in it. Wrong way round, as usual.", speakers: [herder], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0010.0061, text: "Cloud's shut the sky and the lodge windows are the only light in the yard.", places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0062, text: "Somewhere a dog's decided the dark's got to be answered, and it's been at it an hour.", places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0010.0063, text: "The Hollow Day's not on any tally, which is the only reason anyone here knows what a day off is.", places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0010.0064, text: "Wind's round the watch-fire and the flame's gone sideways. I'll sit up with it.", speakers: [guard], places: [ashen_hollow], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0065, text: "Rain's come in hard and it'll be on the east road by morning. Anyone bound for the basin should wait for it to lift.", speakers: [traveller], places: [ashen_hollow], times: [night], weather: [rain], channel: world, ai_generated: true }
  - { key: chat.b0010.0066, text: "Horse's fed and the wheels are chocked and the sky's clear enough to leave at first light.", speakers: [carter], places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0067, text: "Grey night and one lamp, and the lamp's on the wrong side of the work.", speakers: [crafter], places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0068, text: "Went as far as the ruin stones in clear weather once. Every sound came back a heartbeat late and I came away.", speakers: [adventurer], places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0069, text: "Nobody sleeps the first night after the tally turns. I don't know why and neither does anyone else.", speakers: [villager], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0010.0070, text: "Set the snares by dark and I'll not walk them till there's light to see what's in them.", speakers: [hunter], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0010.0071, text: "Seam's got water in it again and the pumps are the only thing between us and a short tally.", speakers: [labourer], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0010.0072, text: "Grain's under cover and counted and the tally hasn't turned, so nobody's to add to it.", speakers: [farmer], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0010.0073, text: "Dry dawn over the basin and a thin mist on the low ground that'll be off by the time the wood's in.", places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0074, text: "Third tally of this Reckoning and I've not had one morning yet that started in daylight.", places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0075, text: "The house gets colder in the hour before the light than it does all night.", places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0076, text: "Fog's down in the basin and the wall walk can't see the well from the gate.", speakers: [guard], places: [cairnwold], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0077, text: "Wind's off the crags and the ash in the stack has shifted again. Nothing I stack stays stacked.", speakers: [crafter], places: [cairnwold], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0078, text: "Cloud's sat on the basin like a lid and the grain's no drier on the staddle for it.", speakers: [farmer], places: [cairnwold], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0079, text: "One hen's off the lay and it's the Ashcomb that's never off the lay. Nothing's ever simple.", speakers: [herder], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0080, text: "Rain's been through the night and every track by the ash stand has gone to mud.", speakers: [hunter], places: [cairnwold], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0081, text: "Stone's off the south crags and sat at the roadside wanting shifting before the road fills. Two backs would do it.", speakers: [labourer], places: [cairnwold], times: [dawn], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0010.0082, text: "The smith works what the carters bring and keeps his opinion of it to himself.", speakers: [villager], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0083, text: "Load's hides down and ash up, and I'd sooner the hides. Ash is light and light isn't what pays.", speakers: [carter], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0084, text: "Bristleback's been through the moss and left a wall open behind it. I'll not be the one who fills it.", speakers: [adventurer], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0085, text: "Grey's got the basin and it's not shifting. The whole village is working slowly and blaming the sky.", places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0086, text: "You can't tell a Siann's age by looking, so you go by the work and keep your mouth shut about the rest.", places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0010.0087, text: "Sat down to eat and found the bread was already a day old. Same as yesterday's.", places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0088, text: "Wind's got the gate swinging and I've wedged it twice since the watch changed.", speakers: [guard], places: [cairnwold], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0089, text: "Carters bring the iron in and take the hides out, and the road's the same both ways. That's the trade.", speakers: [carter], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0010.0090, text: "Sun's on the anvil and the metal's taking it kindly, which it doesn't often do.", speakers: [crafter], places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0091, text: "Rain's on the barley and the barley's got to take it. Grain gets counted as it comes in, wet or not.", speakers: [farmer], places: [cairnwold], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0092, text: "Trap's been sprung and emptied and the hare's gone out of it without leaving a hair.", speakers: [hunter], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0010.0093, text: "Well's drawing low and the wall's got a crack a bar would go down. The village wants hands on both before the tally turns.", speakers: [labourer], places: [cairnwold], times: [morning], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0010.0094, text: "Granary's up on its stones at the quiet end, and nothing's ever got into it that wasn't meant to.", speakers: [villager], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0010.0095, text: "Came in off the road with wet boots and got a bowl and a bench and no questions.", speakers: [traveller], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0010.0096, text: "Some take the healer's Call and some take the scholar's, and both end up out here sooner or later.", speakers: [adventurer], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0010.0097, text: "Afternoon's gone warm and the village is out in it pretending there's work to be doing.", places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0098, text: "A Vaskaal can't work a thing the way we do and can still measure it better than the one who made it.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0099, text: "Two pots on the fire and neither of them for me.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0100, text: "Fog's come up from the moss and swallowed the crags. The watch puts two on the gate when it does that.", speakers: [guard], places: [cairnwold], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0101, text: "Rain's in and the load's under a sheet. Iron doesn't care and hides do, so the hides are in the middle.", speakers: [carter], places: [cairnwold], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0102, text: "Wind's up and the ash dust is in everything, including the finish I just took off the bench.", speakers: [crafter], places: [cairnwold], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0103, text: "Grain's out on the cloth in the sun, and it gets turned and counted and turned again.", speakers: [farmer], places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0104, text: "Cloud's flat and the flock's flat with it. Nothing's moving that doesn't have to.", speakers: [herder], places: [cairnwold], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0105, text: "Wolves' Den's got young in it and the ash stand has got the tracks to prove it.", speakers: [hunter], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0106, text: "Seam's running thin and every bar out of it wants twice the hammering. No wonder the carters have a trade.", speakers: [labourer], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0107, text: "Ash and hides go out and iron comes in, and the market's never once had enough iron.", speakers: [villager], places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0108, text: "There's a boar gone through the moss wall and out the far side. Anyone with a spear and a free afternoon, the west end wants it dead.", speakers: [adventurer], places: [cairnwold], times: [afternoon], channel: world, ai_generated: true }
  - { key: chat.b0010.0109, text: "Dusk's gone grey and the crags have gone into it. Every door on the street is shut.", places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0110, text: "A Reckoning's thirteen tallies and then a day that isn't counted, and I've never once got the thirteenth right.", places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0111, text: "Stood in the doorway with wet boots and no reason to go back out.", places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0112, text: "Wind's come round the wall and the gate's got to be barred twice of an evening when it does.", speakers: [guard], places: [cairnwold], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0113, text: "Grey's settled and the cart's sheeted and I'll be down in the basin before the light's fully gone.", speakers: [carter], places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0114, text: "Light's going gold along the wall and there's just enough of it to see the last hoop closed.", speakers: [crafter], places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0115, text: "Rain's back and the grain's in and the staddle will keep it dry. That's the whole of my evening.", speakers: [farmer], places: [cairnwold], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0116, text: "Fellhorn's gone up to the high ground with the light going and won't be called down.", speakers: [herder], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0117, text: "Set the last snare as the light went. The barrow's off my ground and I keep it that way.", speakers: [hunter], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0118, text: "Survey's been asking the village about the crags again. There's nothing new to tell them and there won't be.", speakers: [villager], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0119, text: "Clear dusk and the wall's got three more courses to it. Another day and it'll be higher than the gate.", speakers: [labourer], places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0120, text: "Road west out of the basin is dry to the rim and the watch-fire's lit at the top. Anyone meaning to leave tonight can leave now.", speakers: [traveller], places: [cairnwold], times: [dusk], channel: world, ai_generated: true }
  - { key: chat.b0010.0121, text: "Evening's gone mild and the noise out of the lodge is carrying all the way to the west end.", places: [cairnwold], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0122, text: "Cloud's come over and the basin hasn't got any edges left in it.", places: [cairnwold], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0123, text: "Grew up thinking a Call was a choosing, and it turns out it's just what you did next.", places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0010.0124, text: "Wind's got the gate creaking and it'll creak all night. I'll hear it in my sleep and I won't be asleep.", speakers: [guard], places: [cairnwold], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0125, text: "Fog's in the basin and the lamp's got a halo round it the size of a cart wheel.", speakers: [crafter], places: [cairnwold], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0126, text: "Rain's on the roof and the grain's dry and counted. There's nothing left to do about either.", speakers: [farmer], places: [cairnwold], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0127, text: "Flock's down and quiet and the ewes have stopped arguing about the corner.", speakers: [herder], places: [cairnwold], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0128, text: "Hollow Day's the one day nothing's counted, and there's some here would count it anyway.", speakers: [villager], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0010.0129, text: "An Ondrek read the stone by the well and said it remembered a river. It's been left alone since.", speakers: [hunter], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0010.0130, text: "Hides and ash going west on the morning cart, with room for anything small. The road's dry and I'm not waiting on the tally.", speakers: [carter], places: [cairnwold], times: [evening], channel: world, ai_generated: true }
  - { key: chat.b0010.0131, text: "Half the wall's up and half the village has an opinion about how.", speakers: [labourer], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0010.0132, text: "An Orenth came through and couldn't remember the road he'd just walked. They pay for it in ways I can't price.", speakers: [adventurer], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0010.0133, text: "Cloud's shut the basin and there's no light but the lodge and no sound but the Outfall.", places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0134, text: "Veth pick a trade up faster than you'd credit and then stop getting better at it. That's the whole of what's known.", places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0010.0135, text: "Lay awake working out how to say a thing I'll never say.", places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0010.0136, text: "Wind's coming down the Outfall and the gate's got a rattle in it I can't find.", speakers: [guard], places: [cairnwold], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0137, text: "Grey night and a cart full of someone else's iron. I'd rather be asleep and I'd rather be paid.", speakers: [carter], places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0138, text: "Clear night and the fire's banked and the last hoop's on. That's the tally's work done.", speakers: [crafter], places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0139, text: "Rain's in the thatch and the grain's dry under the staddle. One out of two isn't bad.", speakers: [farmer], places: [cairnwold], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0140, text: "Ewe's taken her lamb early and the lamb's alive, which is the whole of the luck.", speakers: [herder], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0010.0141, text: "Clear night and every snare on the moor will have something in it by morning.", speakers: [hunter], places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0142, text: "Some say the Veil's thin out at the ruin and some say there's no Veil at all. Nobody's been out to check.", speakers: [villager], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0010.0143, text: "Wall at the west end is down again and there's a gap a flock could walk through. The village wants hands on it at first light.", speakers: [labourer], places: [cairnwold], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0010.0144, text: "Husks keep the barrow and the barrow's on the road and the road's got to be walked anyway. That's the trade.", speakers: [adventurer], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0010.0145, text: "Light's coming up behind the rim and the road's the only thing out here with an edge to it.", places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0146, text: "Road's been here longer than anyone's name for it, and it doesn't go the way you'd put a road.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0147, text: "Slept in a ditch and it was the driest bed I've had since the last one.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0148, text: "Fog's on the road and the shrine post is a smudge of light and nothing else. Walk by the ruts.", speakers: [guard], places: [old_east_road], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0149, text: "Wind's up the rise and the shrine post is swaying with the flame inside it. It'll be out before dark.", speakers: [traveller], places: [old_east_road], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0150, text: "Rain's got the ruts running and the low stretch is a trap, and the wain at the verge has been there long enough to say so.", speakers: [carter], places: [old_east_road], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0151, text: "Grey morning and the verge wants cutting back. Same verge, same cutting, same tally as last.", speakers: [labourer], places: [old_east_road], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0152, text: "Fresh scrape on a post and a stag's been rubbing it. Nothing bigger than a hare on the road all night.", speakers: [hunter], places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0153, text: "Every tally somebody says they'll right that wain, and every tally it's still on its side.", speakers: [villager], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0154, text: "Fellhorns won't be driven past the barrow and I've stopped arguing with them about it.", speakers: [herder], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0155, text: "Needle's gone blunt on leather and the awl's lost. The road is not a bench.", speakers: [crafter], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0156, text: "Road east is open to the shrine and the lantern's lit. Past the barrow the verge is broken, so keep to the crown.", speakers: [guard], places: [old_east_road], times: [dawn], channel: world, ai_generated: true }
  - { key: chat.b0010.0157, text: "Grey morning and the road's gone the colour of the sky. Nothing to steer by but the ruts.", places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0158, text: "Waystone on the rim went up for the same reason as the rest of them, and folk still stop and put a hand on it.", places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0010.0159, text: "Walked an hour and the only thing I've passed is a boot with no owner in it.", places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0010.0160, text: "Wind's coming down the pass and the camp's got its back to it. Nothing's on the road but the wind.", speakers: [guard], places: [old_east_road], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0161, text: "Dry road, light bed, and the basin's waiting on what's in the back of this cart.", speakers: [carter], places: [old_east_road], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0162, text: "Rain's on the verge and the ditch has filled and I'm back where I was yesterday.", speakers: [labourer], places: [old_east_road], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0163, text: "Grey morning and no scent holding. Whatever came through here went through fast.", speakers: [hunter], places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0164, text: "There's a stone and a post at the shrine and travellers leave what they can. Nobody counts what you leave.", speakers: [traveller], places: [old_east_road], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0165, text: "Finished six straps on the walk and sold none of them. A road is not a market.", speakers: [crafter], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0010.0166, text: "Watch keeps the shrine lantern filled and nobody has ever had to remind them.", speakers: [villager], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0010.0167, text: "Wolves have been on the road twice this tally, both times by the barrow. Anyone walking it with a load wants company.", speakers: [adventurer], places: [old_east_road], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0010.0168, text: "Fields on this side of the road get the wind and nothing else, and the grain comes off them light every tally.", speakers: [farmer], places: [old_east_road], times: [morning], ai_generated: true }
  - { key: chat.b0010.0169, text: "Sun's out, the road's drying in patches, and there's heat coming off the stone of the verge.", places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0170, text: "Two bites into the bread and a wasp took an interest. We both left disappointed.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0171, text: "Nobody knows who put the stones up and nobody's stopped asking. That's what the survey is for, near enough.", places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0172, text: "Fog's in and the road's gone short. You see the next post and nothing after it.", speakers: [guard], places: [old_east_road], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0173, text: "Rain's in and the low stretch is holding. A loaded cart goes round by the verge or it waits.", speakers: [carter], places: [old_east_road], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0174, text: "Wind's up and the verge grass is all one way. Third tally of cutting it back and it's never once stayed cut.", speakers: [labourer], places: [old_east_road], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0175, text: "Set the traps this side of the barrow. Nothing up there is worth a snare and the husks don't like company.", speakers: [hunter], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0176, text: "Cloud's down to a flat lid and there's no shadow on the road at all.", speakers: [villager], places: [old_east_road], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0177, text: "Every smith on this road has a different trick with bad iron and not one of them will say what it is.", speakers: [crafter], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0178, text: "Went up to the Quiet Stones once and counted three, and counted three again on the way back.", speakers: [adventurer], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0179, text: "Anybody wanting to walk to the waystation, I'm going at first light and I'd sooner not go alone.", speakers: [traveller], places: [old_east_road], times: [afternoon], channel: world, ai_generated: true }
  - { key: chat.b0010.0180, text: "Sun's on the high field and the grain's going in dry, and it gets counted either way.", speakers: [farmer], places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0181, text: "Light's gone off the road and the rims of everything have gone soft.", places: [old_east_road], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0182, text: "A waystation's customs go with the stones, and the stones go back further than the customs.", places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0183, text: "Two days out and I've stopped noticing what the pack weighs.", places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0184, text: "Wind's down the pass and the camp's fire is going sideways. There's not a soul on the road to see it.", speakers: [guard], places: [old_east_road], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0185, text: "Front's coming down the pass and it'll be on the road before dark. Anyone with a load out west, sheet it now.", speakers: [carter], places: [old_east_road], times: [dusk], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0010.0186, text: "Rain's on, and I'm stood under the shrine's post with a bag of wet bread and no complaints worth making.", speakers: [traveller], places: [old_east_road], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0187, text: "Light's gone gold on the rim and I've one more bar to set before it's gone altogether.", speakers: [labourer], places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0188, text: "Husks keep the barrow and they don't come down to the road, and I've been telling myself that for a tally.", speakers: [hunter], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0189, text: "The wain's been on its side so long the verge has grown round it.", speakers: [adventurer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0190, text: "Dusk's clear and the rim's cut out of the sky like somebody drew it.", speakers: [villager], places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0191, text: "Every tally the same journey and every tally the road's longer than I remember it.", speakers: [farmer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0192, text: "Bench in the pack and the pack's wet. Tomorrow's work will have a warp in it.", speakers: [crafter], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0193, text: "Evening's warm for the hour and the road's still got the day in it. Walking's a pleasure and I don't trust it.", places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0194, text: "Three days of this and I've begun naming the stones I pass.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0010.0195, text: "Half the folk on the road are going to a Call and the other half are coming back from one.", places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0010.0196, text: "Fog's up and the shrine's a glow with no post under it. The watch fills that lantern every night.", speakers: [guard], places: [old_east_road], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0197, text: "Grey's settled and the horse has had enough and I've had more than enough.", speakers: [carter], places: [old_east_road], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0198, text: "Wind's up the rise and the tools are packed twice and it still gets in.", speakers: [labourer], places: [old_east_road], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0199, text: "Rain's in for the night and the ground will be a bog by morning. Nothing to do but sit it out and eat badly.", speakers: [hunter], places: [old_east_road], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0200, text: "Slept out by the shrine post and the watch came and went with the lantern and never said a word.", speakers: [traveller], places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0201, text: "Everything's packed and everything's damp and the awl's somewhere in it.", speakers: [crafter], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0010.0202, text: "The rim's got a fire on it and a camp and a stone, and the stone's the oldest of the three.", speakers: [villager], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0010.0203, text: "There's a bounty up on a beast that's been at the road twice this tally. Anyone taking it should know it isn't a wolf.", speakers: [adventurer], places: [old_east_road], times: [evening], channel: world, ai_generated: true }
  - { key: chat.b0010.0204, text: "Cart's loaded and the field's given what it'll give and the count's already in the lodge.", speakers: [farmer], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0010.0205, text: "Cloud's on the road and there's no sky in it. You find your way by where the ruts stop.", places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0206, text: "Heard nothing at all and woke up for it anyway.", places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0010.0207, text: "The stone on the rim is a waystone like any other, and folk still stop at it. It's the stopping that's the custom.", places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0010.0208, text: "Wind's got under the fire and the embers are going up the rise. Nothing else is moving out here.", speakers: [guard], places: [old_east_road], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0209, text: "Clear night, cold in the hands, and the horse is taking the hill better than I am.", speakers: [carter], places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0210, text: "Grey night and the snares by the verge are all still set and all still empty.", speakers: [hunter], places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0211, text: "Rain's on and the stone's too wet to lay. I'll sit under the wain and feel sorry for myself.", speakers: [labourer], places: [old_east_road], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0212, text: "Slept under the wain once. It's a roof if you don't mind the roof being a wain.", speakers: [traveller], places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0213, text: "Cold's got into the thread and the thread's got into the wind. Nothing's working.", speakers: [crafter], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0010.0214, text: "There's a lantern burning at the shrine all night because the watch fills it, and half the road thinks it's magic.", speakers: [villager], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0010.0215, text: "Two on the rim tonight and the road's clear to the shrine. Anyone on it after dark, keep the lantern in sight and don't leave the ruts.", speakers: [guard], places: [old_east_road], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0010.0216, text: "Something's been at the verge traps and left ash in the jaws. Ember hound's the only thing that does that.", speakers: [adventurer], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0010.0217, text: "First light on the moor and everything's the same distance away as everything else.", places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0218, text: "Some roads out here are wrong and you know it in the legs before you know it in the head.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0219, text: "Fog's filled the bog and left the tops bare. Long way round is the dry way.", places: [wilds], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0220, text: "Rain's on and the moss is taking it like a sponge. Nothing's finding a trail in this.", speakers: [hunter], places: [wilds], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0221, text: "Wind's brought a stone down onto the moor track and it's blocking the crossing. Anyone with a sledge and a back, it wants shifting.", speakers: [labourer], places: [wilds], times: [dawn], weather: [wind], channel: world, ai_generated: true }
  - { key: chat.b0010.0222, text: "Took a shortcut over the top once and arrived an hour before I left. I don't use that one any more.", speakers: [traveller], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0223, text: "Woundmoss comes up easy when the ground's wet and the ground's always wet. That's the patch's whole character.", speakers: [crafter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0224, text: "Sun's got the moss steaming and the basket's still full of nothing useful.", speakers: [villager], places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0225, text: "Between the road and the ruin there's no post and no fire, and the watch goes out there in twos.", speakers: [guard], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0226, text: "Husks don't chase. They stand and they wait, and whatever they're waiting for it isn't you.", speakers: [adventurer], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0227, text: "Fellhorn's at the front and the flock follows it and I follow the flock. Nobody's decided anything.", speakers: [herder], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0010.0228, text: "Field's on the low side and the moss is creeping at the top of it. Every tally a row fewer.", speakers: [farmer], places: [wilds], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0229, text: "Cloud's sat down on the moor and the horizon's moved in to about ten paces.", places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0230, text: "Coat's wet through at the shoulder and that's a Reckoning's wear I won't get back.", places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0010.0231, text: "Nothing to eat that isn't bread and nothing to look at that isn't wet.", places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0010.0232, text: "Wind's carrying the scent away from the snares and toward the den. Wrong way round, and it does it every time.", speakers: [hunter], places: [wilds], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0233, text: "Rain came across at the wrong time and the trench has filled twice.", speakers: [labourer], places: [wilds], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0234, text: "Dry hands and a dry thread. That's the whole of what I wanted out of today.", speakers: [crafter], places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0235, text: "The Ondrek say they're what the Kal become, and the Kal say that's a lie told to justify a quarry. Both of them mean it.", speakers: [adventurer], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0010.0236, text: "Grey from the start and no road out here but the one I'm making. That'll be the tally's work.", speakers: [traveller], places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0237, text: "Sun's got the heather humming and the sheep have found the only shade there is.", speakers: [villager], places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0238, text: "Lambs are coming early this tally and one of them came early enough to be a problem.", speakers: [herder], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0010.0239, text: "Watch off the rim at first light, road clear, barrow quiet. That's the whole of the account and it's the account I like.", speakers: [guard], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0010.0240, text: "Grain's off the high field and down at the lodge and the moor track held all the way. Anyone waiting on theirs can come for it.", speakers: [farmer], places: [wilds], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0010.0241, text: "Light's gone hard and the moor has no shade in it anywhere.", places: [wilds], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0242, text: "A Mor doesn't take up room and doesn't leave one. You share a fire with one and it's like sharing with the wind.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0243, text: "Sat on a stone to eat and the stone was the drier of the two of us.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0244, text: "Woundmoss Patch is up to the boot this tally, and the stuff comes away in handfuls when it is.", speakers: [hunter], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0245, text: "Wind's up and the sledge is skidding on wet stone. Two steps forward and a slide.", speakers: [labourer], places: [wilds], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0246, text: "Rain all afternoon and the work's in a bag and the bag's wet.", speakers: [crafter], places: [wilds], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0247, text: "Fog's on the high ground, which is the wrong way round, and nobody's got a reason for it.", speakers: [adventurer], places: [wilds], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0248, text: "Grey's come over the tops and it's still sunny down in the basin. It won't stay that way.", speakers: [guard], places: [wilds], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0249, text: "Flock's strung out and the sun's got them lazy, and half of them are on the seam side where they shouldn't be.", speakers: [herder], places: [wilds], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0250, text: "There's been a boar on the moor track three mornings running and it's not moving off it. Anyone walking that way wants to make a noise.", speakers: [villager], places: [wilds], times: [afternoon], channel: world, ai_generated: true }
  - { key: chat.b0010.0251, text: "Moss has taken another two rows off the top of the field this tally and there's no arguing with it.", speakers: [farmer], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0252, text: "Two straps cut and the third cut wrong. The light's the excuse and it isn't the reason.", speakers: [crafter], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0010.0253, text: "Light's going and the ground and the sky have gone the same colour.", places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0254, text: "Wrong side of the bog with the light nearly gone. That's the bog's whole trick and it works every time.", places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0255, text: "Clear dusk and the shadow of the crags has gone halfway across the moor.", places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0256, text: "Rain's coming and the traps want lifting. Nothing worse than a wet deadfall.", speakers: [hunter], places: [wilds], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0257, text: "Wind's come round and it's got weather in it. The watch will be off the high ground before it lands.", speakers: [guard], places: [wilds], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0258, text: "Cart's going down off the moor at dusk and there's space on it. Anyone stuck up here can come down with me.", speakers: [carter], places: [wilds], times: [dusk], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0010.0259, text: "You can see the ruin's stones from the high ground and they're stood so your eye keeps going back to them.", speakers: [adventurer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0260, text: "Two hours of good light and I've had both of them. The rest was holding things up.", speakers: [crafter], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0261, text: "Grey's gone brown and the tally's got two days on it and I've a mile to walk.", speakers: [villager], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0262, text: "Field edge has been walked over in the night and nothing's eaten. Husks don't come down this far, or they didn't.", speakers: [farmer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0263, text: "Flock's in the dip and quiet, and I'll sit here a while before I count them.", speakers: [herder], places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0264, text: "Pulled a bar out of the seam and it came away in three pieces. Seam's got no manners left in it.", speakers: [labourer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0010.0265, text: "Evening's warm enough that the midges have come out in a body.", places: [wilds], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0266, text: "Sat down and everything I'm carrying suddenly weighs what it weighs.", places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0010.0267, text: "Fog's up the low side and the horizon's been taken away.", places: [wilds], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0010.0268, text: "Sleeping out again. A Reckoning of this and you can sleep on a slope with a stone in your back.", speakers: [traveller], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0010.0269, text: "Rain's on and the tools are out and the tools are getting it. That's my tally's evening.", speakers: [labourer], places: [wilds], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0270, text: "Wind's got through the pack and the wool's wet and the wool's what I sleep in.", speakers: [crafter], places: [wilds], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0271, text: "Slept near the ruin once. Woke to my own shadow arriving a moment after I did, and went home by the road.", speakers: [adventurer], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0010.0272, text: "Grey's settled and there's no air moving anywhere. The smoke just hangs where it's made.", speakers: [villager], places: [wilds], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0273, text: "Grain's under cover and the count's in and I'd like it to stay the count.", speakers: [farmer], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0010.0274, text: "Clear evening and the flock's making that noise they make when nothing's wrong.", speakers: [herder], places: [wilds], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0275, text: "Nothing sets a snare on the barrow side and nothing asks me why. You learn the ground you're allowed.", speakers: [hunter], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0010.0276, text: "Wolves are working the high side of the moor tonight. Anyone camped out there wants a fire and a dog and to be up before light.", speakers: [guard], places: [wilds], times: [evening], channel: world, ai_generated: true }
  - { key: chat.b0010.0277, text: "Cloud's shut the sky and a man's own feet are the only proof of the ground.", places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0278, text: "There's an Othermarked in the basin and folk won't have him over a door. That's folk for you.", places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0010.0279, text: "Clear night and the sky's doing nothing at all, which is worth remarking on.", places: [wilds], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0280, text: "Nobody's moving the stones at the ruin and nobody's saying why not. That's the shortest argument in the valley.", speakers: [adventurer], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0010.0281, text: "Wind's been at the sledge sheet since dark and it hasn't won yet.", speakers: [labourer], places: [wilds], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0010.0282, text: "Rain on the moor all night and the snares will be full of leaves and nothing else.", speakers: [hunter], places: [wilds], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0010.0283, text: "Cloud's down on the ground and the flock's in it somewhere. Morning's the only way to know.", speakers: [herder], places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0010.0284, text: "Husks keep the barrow and the barrow's no distance from the field, and I've stopped thinking about it.", speakers: [farmer], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0010.0285, text: "Watch wants one more for the night round, east of the crags. Something's been working that ground and it isn't a fox.", speakers: [guard], places: [wilds], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0010.0286, text: "Horse won't stand where he can't see, so the cart's stopped here and the load's iron and iron's dear this side of the basin.", speakers: [carter], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0010.0287, text: "Road behind me and a stone ahead. You stop at the stone and then you walk on.", speakers: [traveller], places: [wilds], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0010.0288, text: "Cold enough that the needle's sticking to my fingers and the fingers are sticking to the work.", speakers: [crafter], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0010.0289, text: "It turned before light. The cloud came down and the wind with it and the smoke's gone flat.", speakers: [villager], places: [ashen_hollow], times: [dawn], events: [weather_turned], ai_generated: true }
  - { key: chat.b0010.0290, text: "It came over the crags at noon and the basin's gone dark. Every beast I've got is stood with its back to it.", speakers: [farmer], places: [cairnwold], times: [afternoon], events: [weather_turned], ai_generated: true }
  - { key: chat.b0010.0291, text: "Turned an hour back and the road's gone from dust to a stream. I'm not taking a load up that.", speakers: [carter], places: [old_east_road], times: [evening], events: [weather_turned], ai_generated: true }
  - { key: chat.b0010.0292, text: "The {creature}'s down by the wall with its head stove in. Nobody's sorry and nobody's asking who did it.", speakers: [villager], places: [ashen_hollow], times: [night], events: [creature_slain], ai_generated: true }
  - { key: chat.b0010.0293, text: "The {creature}'s dead on the verge and the crows are on it. Road's clear now and it wasn't clear an hour ago.", speakers: [guard, carter], places: [old_east_road], times: [morning], events: [creature_slain], ai_generated: true }
  - { key: chat.b0010.0294, text: "Found the {creature} where it fell and it's been dead since dawn. Whoever did it left the whole of it lying.", speakers: [hunter, adventurer], places: [wilds], times: [dusk], events: [creature_slain], ai_generated: true }
  - { key: chat.b0010.0295, text: "Market's settled. The hides went and the ash stayed and that's the way of it here.", speakers: [crafter, villager], places: [cairnwold], times: [evening], events: [market_day], ai_generated: true }
  - { key: chat.b0010.0296, text: "Market's done and I'm up on the moor with a full pack. Somebody bought nothing and it was me.", speakers: [carter, hunter], places: [wilds], times: [dawn], events: [market_day], ai_generated: true }
  - { key: chat.b0010.0297, text: "Trade's settled and the stall's got more room than it started with. The arrows went and the salves stayed.", speakers: [villager, crafter], places: [ashen_hollow], times: [afternoon], events: [market_day], ai_generated: true }
  - { key: chat.b0010.0298, text: "{claimant} took {bounty} and the board's clear of it. Whatever was out there has somebody else's name on it now.", speakers: [traveller, adventurer], places: [old_east_road], times: [dusk], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0010.0299, text: "{claimant} brought in {bounty} and there's not a fire on the moor that isn't arguing about how.", speakers: [hunter, adventurer], places: [wilds], times: [night], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0010.0300, text: "{claimant}'s down for {bounty} and the lodge has been going at it since first light.", speakers: [villager, guard], places: [cairnwold], times: [morning], events: [bounty_claimed], ai_generated: true }
