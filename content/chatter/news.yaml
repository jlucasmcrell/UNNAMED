id: chatter.news
kind: chatter
schema: 1
display_key: chatter.news.name
tags: [chatter]
notes: Hand-written (WP16). Bounty news on World when someone else claims one, and the System channel's plain statements of bounties and offers to set out together. Extended 2026-10-18 to about forty news and twenty system variants per use, so a player does not read the same sentence twice; every line is a hand-written template, never corpus.
role: templates
lines:
  - { key: news.bounty_claimed.01, use: news.bounty_claimed, ai_generated: false, text: "Word is {claimant} has finished the bounty on {bounty}." }
  - { key: news.bounty_claimed.02, use: news.bounty_claimed, ai_generated: false, text: "{claimant} came back with proof. {bounty} is done and paid." }
  - { key: news.bounty_claimed.03, use: news.bounty_claimed, ai_generated: false, text: "The bounty on {bounty} is taken - {claimant} got there first." }
  - { key: news.bounty_claimed.04, use: news.bounty_claimed, ai_generated: false, text: "Talk on the road: {claimant} has claimed {bounty}." }
  - { key: news.bounty_claimed.05, use: news.bounty_claimed, ai_generated: false, text: "Somebody's purse is heavier tonight. {claimant} settled {bounty}." }
  - { key: news.bounty_claimed.06, use: news.bounty_claimed, ai_generated: false, text: "{bounty} is closed. {claimant} did the work and took the coin." }
  - { key: news.bounty_claimed.07, use: news.bounty_claimed, ai_generated: false, text: "Anyone still asking after {bounty} can stop. {claimant} has it." }
  - { key: news.bounty_claimed.08, use: news.bounty_claimed, ai_generated: false, text: "It was {claimant} who finished {bounty}, and looked pleased about it." }
  - { key: news.bounty_claimed.09, use: news.bounty_claimed, ai_generated: false, text: "The board's clear of {bounty}. {claimant} saw to it." }
  - { key: news.bounty_claimed.10, use: news.bounty_claimed, ai_generated: false, text: "{claimant} is drinking on {bounty} tonight. Nobody begrudges it." }
  - { key: news.bounty_claimed.11, use: news.bounty_claimed, ai_generated: false, text: "So {bounty} is done. {claimant} got there before the rest of us." }
  - { key: news.bounty_claimed.12, use: news.bounty_claimed, ai_generated: false, text: "News from the road: {claimant}, and {bounty} is off the board." }
  - { key: news.bounty_claimed.13, use: news.bounty_claimed, ai_generated: false, text: "If you were thinking about {bounty}, think again. {claimant} has claimed it." }
  - { key: news.bounty_claimed.14, use: news.bounty_claimed, ai_generated: false, text: "{claimant} brought in {bounty} and made it look easy, which it wasn't." }
  - { key: news.bounty_claimed.15, use: news.bounty_claimed, ai_generated: false, text: "One less thing waiting out there. {claimant} finished {bounty}." }
  - { key: news.bounty_claimed.16, use: news.bounty_claimed, ai_generated: false, text: "Word came in with the last cart: {bounty} taken, by {claimant}." }
  - { key: news.bounty_claimed.17, use: news.bounty_claimed, ai_generated: false, text: "They're saying {claimant} claimed {bounty}. They're right." }
  - { key: news.bounty_claimed.18, use: news.bounty_claimed, ai_generated: false, text: "{bounty} has a name against it now, and the name is {claimant}." }
  - { key: news.bounty_claimed.19, use: news.bounty_claimed, ai_generated: false, text: "That's {bounty} settled. {claimant} won't say how, exactly." }
  - { key: news.bounty_claimed.20, use: news.bounty_claimed, ai_generated: false, text: "{claimant}, then. {bounty} is theirs and the road's quieter." }
  - { key: news.bounty_claimed.21, use: news.bounty_claimed, ai_generated: false, text: "Whatever {bounty} was, it isn't any more. {claimant} has finished it." }
  - { key: news.bounty_claimed.22, use: news.bounty_claimed, ai_generated: false, text: "Ask about {bounty} and you'll be told to ask {claimant}." }
  - { key: news.bounty_claimed.23, use: news.bounty_claimed, ai_generated: false, text: "The bounty on {bounty} went to {claimant}, which surprises nobody who was watching." }
  - { key: news.bounty_claimed.24, use: news.bounty_claimed, ai_generated: false, text: "{claimant} came in off the moor with {bounty} done and the mud still on him." }
  - { key: news.bounty_claimed.25, use: news.bounty_claimed, ai_generated: false, text: "That's two this tally for {claimant}, with {bounty} finished." }
  - { key: news.bounty_claimed.26, use: news.bounty_claimed, ai_generated: false, text: "{bounty} is spoken for. {claimant} was quicker about it than anyone expected." }
  - { key: news.bounty_claimed.27, use: news.bounty_claimed, ai_generated: false, text: "Somebody claimed {bounty} and it was {claimant}, and no one's surprised about that either." }
  - { key: news.bounty_claimed.28, use: news.bounty_claimed, ai_generated: false, text: "There's a new story about {bounty} and it ends with {claimant} being paid." }
  - { key: news.bounty_claimed.29, use: news.bounty_claimed, ai_generated: false, text: "{claimant} has closed {bounty}. The notice is coming down." }
  - { key: news.bounty_claimed.30, use: news.bounty_claimed, ai_generated: false, text: "{bounty}. {claimant}. Done, and paid, and the rest of us can get on." }
  - { key: news.bounty_claimed.31, use: news.bounty_claimed, ai_generated: false, text: "They tell me {claimant} is the one who settled {bounty}. I'd believe it." }
  - { key: news.bounty_claimed.32, use: news.bounty_claimed, ai_generated: false, text: "{claimant} got to {bounty} first and the board's better for it." }
  - { key: news.bounty_claimed.33, use: news.bounty_claimed, ai_generated: false, text: "No more {bounty} to worry at. {claimant} saw to it this morning." }
  - { key: news.bounty_claimed.34, use: news.bounty_claimed, ai_generated: false, text: "Pass the word: {bounty} is finished, and {claimant} is the reason." }
  - { key: news.bounty_claimed.35, use: news.bounty_claimed, ai_generated: false, text: "The purse for {bounty} went to {claimant} and the purse wasn't small." }
  - { key: news.bounty_claimed.36, use: news.bounty_claimed, ai_generated: false, text: "If the tale's true, {claimant} brought in {bounty} alone. If." }
  - { key: news.bounty_claimed.37, use: news.bounty_claimed, ai_generated: false, text: "It's {claimant} who claims {bounty}, and it's {claimant} who'll be asked about it." }
  - { key: news.bounty_claimed.38, use: news.bounty_claimed, ai_generated: false, text: "{bounty} off the board and {claimant} on the road back. That's the news." }
  - { key: news.bounty_claimed.39, use: news.bounty_claimed, ai_generated: false, text: "Settle an argument for me: was it {claimant} who claimed {bounty}, or someone else in the same coat?" }
  - { key: news.bounty_claimed.40, use: news.bounty_claimed, ai_generated: false, text: "There's coin moving tonight and it's {claimant}'s, for {bounty}." }
