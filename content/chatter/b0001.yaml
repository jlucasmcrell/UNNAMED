notes: AI-generated ambient corpus (batch b0001, 300 lines, revised) - dry frontier small talk across four places and six time bands, carrying the world's own calendar, peoples, stones, Calls and factions as passing remarks. No named person speaks, is quoted, or is placed anywhere.
role: corpus
batch: b0001
lines:
  - { key: chat.b0001.0001, text: "Fair at first light. The whole stop comes up out of the mist like it was never gone.", places: [ashen_hollow], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0002, text: "Some roads are wrong and some doors shouldn't be opened. My grandmother's whole wisdom, that.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0003, text: "Nothing's stirring but the smoke and one hen with an opinion.", places: [ashen_hollow], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0004, text: "Tally's turning tomorrow. You can tell by who's suddenly got errands.", speakers: [villager], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0005, text: "Came in before light and put a hand on the stone going past. Old habit, and it costs nothing.", speakers: [traveller], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0006, text: "Watch is set and the stone's stood there all night doing nothing, same as the rest of us.", speakers: [guard], places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0007, text: "Rain on the roofing and the birds won't come off the perch. So I stand and listen.", speakers: [herder], places: [ashen_hollow], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0008, text: "Wind's round to the north. The shed smells of cold iron and wet stone.", speakers: [crafter], places: [ashen_hollow], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0009, text: "Fog this low, I'll not take a load down the road till it lifts.", speakers: [carter], places: [ashen_hollow], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0010, text: "Two hours of light before the cut wants me. I'll put my name in the book and be off.", places: [ashen_hollow], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0011, text: "Traps set along the wood edge. Something had at one of them in the night.", speakers: [hunter], places: [ashen_hollow], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0012, text: "Anybody taking a load east today, the low track's still holding water. Go by the rim.", speakers: [villager], places: [ashen_hollow], times: [dawn], channel: world, ai_generated: true }
  - { key: chat.b0001.0013, text: "Iron out of Blackvein comes up soft in one stretch and flint in the next. The forge knows before I do.", speakers: [crafter], places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0014, text: "The anvil's older than the shed round it. Whoever made it, they made it once.", speakers: [crafter], places: [ashen_hollow], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0015, text: "Survey's been out at the old workings since the tally turned. They'll be at it till the stone gives up answering.", speakers: [villager], places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0016, text: "Third tally out here and I've learned the survey's the only one who'll tell you a thing straight.", speakers: [adventurer], places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0017, text: "Gate's stood open since the last rain and nobody wants to argue the point.", places: [ashen_hollow], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0018, text: "Ground took the water at last. I can put a fork in it once the light's up.", speakers: [farmer], places: [ashen_hollow], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0019, text: "Iron's wanted in Cairnwold. I'm going light and I'd rather go heavy.", speakers: [carter], places: [ashen_hollow], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0001.0020, text: "Half the morning gone and the book's had three names in it. Three's a good week.", speakers: [villager], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0001.0021, text: "Stone at the cut works like bread this week. Cuts too easy, and easy stone fails.", speakers: [labourer], places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0001.0022, text: "Something went through the wood in the night. Every branch by the path is broke the same way.", places: [ashen_hollow], times: [morning], ai_generated: true }
  - { key: chat.b0001.0023, text: "Rain's got into the shed and the bellows are wet through. Everything's waiting on the sun.", speakers: [crafter], places: [ashen_hollow], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0024, text: "Grey on grey. The survey's gone out anyway. They don't stop for weather.", places: [ashen_hollow], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0025, text: "Survey's been up past the cut since noon. You can hear them knocking at the stone from here.", speakers: [villager], places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0026, text: "The Ondrek don't buy stone, they read it. That's what an old guide told me and I've no way to check it.", speakers: [adventurer], places: [ashen_hollow], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0027, text: "Stone out of a quarry is a question nobody here wants asked twice. I buy it, I work it, I ask nothing.", speakers: [crafter], places: [ashen_hollow], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0028, text: "The survey wants the Quiet Stones set right. Nobody's in a hurry to help carry the tools.", speakers: [guard], places: [ashen_hollow], times: [afternoon], weather: [wind], channel: world, ai_generated: true }
  - { key: chat.b0001.0029, text: "Two hours on the same stone and the wedge is duller than I am.", speakers: [labourer], places: [ashen_hollow], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0030, text: "The survey will give you odds on a guess. They won't give you a guess without odds.", places: [ashen_hollow], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0031, text: "Tracks came in from the west and went back the same way. Nothing taken.", speakers: [hunter], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0032, text: "Hens are over by the wall where the ground stays dry. They know the place better than I do.", speakers: [herder], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0033, text: "Anybody's beasts out by the Blackvein road, bring them in. The hound's been about.", speakers: [farmer], places: [ashen_hollow], times: [afternoon], channel: world, ai_generated: true }
  - { key: chat.b0001.0034, text: "Fog's come up the valley from the water side. Sound carries strange in it.", places: [ashen_hollow], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0035, text: "Wind's got the shed door banging. Wayfarers' marks are all up the road post and not one of us can read them.", places: [ashen_hollow], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0036, text: "Half a day in the stop and the load's still on the wain. That's the afternoon gone.", speakers: [carter], places: [ashen_hollow], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0037, text: "Lamp's lit at the gate and the watch is set. Two of us tonight instead of a sensible number.", speakers: [guard], places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0038, text: "A Reckoning's a bad way to measure a road. I've been walking this one since the third tally.", speakers: [traveller], places: [ashen_hollow], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0039, text: "Hollow Day's coming round and half this place will find an excuse to do nothing for a day.", speakers: [villager], places: [ashen_hollow], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0040, text: "The Siann don't age past their twenties, which makes an argument with one a long business.", speakers: [adventurer], places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0041, text: "Fences checked and the gate tied. Now I can think about eating.", places: [ashen_hollow], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0042, text: "Grey all day and grey now. The wayhold keeps the road and the stone, and today the road's the harder one.", places: [ashen_hollow], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0043, text: "The stone hums under the hand, same as always. Nobody's ever said why and nobody's asked twice.", places: [ashen_hollow], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0044, text: "Beasts are all in and counted. One short of last week and I don't like it.", speakers: [herder], places: [ashen_hollow], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0045, text: "Rain's coming up the valley and I've traps out I'd rather not leave.", speakers: [hunter], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0046, text: "Tools are up and the iron's cooling. It'll be there in the morning like it always is.", speakers: [crafter], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0047, text: "Wain's loaded for an early start on the basin road. Room for a passenger if they can be up.", speakers: [carter], places: [ashen_hollow], times: [dusk], channel: world, ai_generated: true }
  - { key: chat.b0001.0048, text: "Hands are done in. They still want the last barrow moved before we eat.", speakers: [labourer], places: [ashen_hollow], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0049, text: "My brother's Call took him east and we've had one letter since.", speakers: [villager], places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0050, text: "Smith's hand, that one. You can tell by how he holds a hammer he didn't buy.", speakers: [crafter], places: [ashen_hollow], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0051, text: "There was a Mor through here in the summer. No reflection in the trough and no end of talk about it.", speakers: [villager], places: [ashen_hollow], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0052, text: "Orenth guide took my cousin over the crags and brought him back a day early and a year older.", speakers: [hunter], places: [ashen_hollow], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0053, text: "There's a fire going. Everyone who comes through goes in the book, and tonight it's a short one.", places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0054, text: "A Siann won't give you a guess. What she'll stand behind is all you'll get out of her.", places: [ashen_hollow], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0055, text: "Rain on the gate post and me on the wrong side of it for another four hours.", speakers: [guard], places: [ashen_hollow], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0056, text: "Sat down and my legs informed me they were done. Fine, then. Sit.", speakers: [herder], places: [ashen_hollow], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0057, text: "Wind's dropped with the light. First quiet hour I've had all day.", speakers: [traveller], places: [ashen_hollow], times: [evening], ai_generated: true }
  - { key: chat.b0001.0058, text: "Fog's taken the road. You hear someone coming long before you see them.", places: [ashen_hollow], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0059, text: "Rest of the road's quiet tonight. Anything moving on it after dark, it isn't a cart.", speakers: [villager], places: [ashen_hollow], times: [evening], channel: world, ai_generated: true }
  - { key: chat.b0001.0060, text: "Ask three people what the Foldscar is and you'll get three answers and no two of them agree.", speakers: [adventurer], places: [ashen_hollow], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0061, text: "Lamp's low and the dog won't settle. He's been at the door since dark.", speakers: [villager], places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0062, text: "There's husks on the old barrow road, so the watch walks the stone side of it now.", speakers: [guard], places: [ashen_hollow], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0063, text: "No stars at all. You could be anywhere under that.", places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0064, text: "Wind in the shutters. The stone's cold under the hand tonight and it doesn't answer.", places: [ashen_hollow], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0065, text: "Iron's cold by the fire and I'm keeping my hands off it till morning.", speakers: [crafter], places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0066, text: "Night work on the seam. You see things in a lamp's worth of light that aren't there.", speakers: [labourer], places: [ashen_hollow], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0067, text: "Something's been at the traps on the wood edge two nights running. Worth a look before it gets bolder.", speakers: [hunter], places: [ashen_hollow], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0001.0068, text: "They say the marked ones can feel a fold before it opens. I've never met one and I don't want to.", speakers: [villager], places: [ashen_hollow], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0069, text: "Marked or born to it, there's a difference, and nobody in this valley can tell you which is which.", speakers: [adventurer], places: [ashen_hollow], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0070, text: "Clear night. Barrowbacks are only ever seen near the Foldscar, and nowhere else in the world.", speakers: [farmer], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0001.0071, text: "One of the birds won't settle. Whatever she's hearing, I'm not.", speakers: [herder], places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0001.0072, text: "Away from the fires the night's not quiet, it's busy. It's just busy about other things.", places: [ashen_hollow], times: [night], ai_generated: true }
  - { key: chat.b0001.0073, text: "Grain's in off the moor and tallied to the last sack. The tally turns tomorrow and it has to add up.", speakers: [farmer], places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0074, text: "Tally turns tomorrow. That's when the arguments about the granary start, and they'll run a fortnight.", speakers: [villager], places: [cairnwold], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0075, text: "Anybody with hides to move, I'm going up the road at first light and I'll take a load.", speakers: [carter], places: [cairnwold], times: [dawn], channel: world, ai_generated: true }
  - { key: chat.b0001.0076, text: "Fair sky and the village coming up grey and gold. Veth keep the records, births and burials and who owes who a ewe.", places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0077, text: "Grey over the basin. The moor will be holding the night's wet for hours yet.", speakers: [crafter], places: [cairnwold], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0078, text: "Cold enough that the bucket had a skin on it. Tally turns tomorrow and the counting isn't done.", places: [cairnwold], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0079, text: "Wind came off the crags in the night. You can see where it's taken the roof muck.", speakers: [farmer, herder], places: [cairnwold], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0080, text: "Fog in the low end of the basin. Nothing's out in that, me included.", speakers: [guard], places: [cairnwold], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0081, text: "Veth built this village and the walls still aren't straight. It's been four hundred years.", speakers: [villager], places: [cairnwold], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0082, text: "Rain on drystone. Half of it goes into the wall and comes out somewhere by noon.", speakers: [villager], places: [cairnwold], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0083, text: "Up before the light. Something's been working the moor edge and it's not a fox.", speakers: [hunter], places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0084, text: "Every morning the same. Somebody's up the rise before the rest of us with a load on.", places: [cairnwold], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0085, text: "Well's clean and the chain holds. Nothing down there but water and a long drop.", speakers: [villager], places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0086, text: "Everything iron's dear here. The last of our own seam goes to the smith and the rest comes up the road.", speakers: [villager], places: [cairnwold], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0087, text: "Bog iron or grey iron, the old ones could tell by the ring of it. I can't, and it costs me.", speakers: [crafter], places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0088, text: "Opened the granary and the grain's dry. Some mornings that's the whole of the good news.", speakers: [farmer], places: [cairnwold], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0089, text: "Flock's on the high side where the wind keeps the wet off. They'd rather be in and so would I.", speakers: [herder], places: [cairnwold], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0090, text: "Morning's half gone and the book at the Hollow has my name in it, which is the whole of my business here.", places: [cairnwold], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0091, text: "Word to anybody selling stone up here, the Kal won't have quarried stuff and won't say why.", speakers: [villager], places: [cairnwold], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0001.0092, text: "Wall's down at the west end again. Same stretch, same argument about whose.", speakers: [labourer, crafter], places: [cairnwold], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0093, text: "Half the morning gone to a hinge that wouldn't sit. The wayhold keeps the road. Nobody keeps this hinge.", places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0001.0094, text: "Survey asks at the door about the old workings. Nobody here can tell them a thing and we say so.", speakers: [villager], places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0001.0095, text: "Road to the Hollow's clear as far as the rim. After that it's the drop and your own business.", speakers: [carter], places: [cairnwold], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0001.0096, text: "Tracks all over the moor edge this morning. Nothing's been left alone out there.", places: [cairnwold], times: [morning], ai_generated: true }
  - { key: chat.b0001.0097, text: "Hides and ash, hides and ash. That's the market and it's the same as the last one.", speakers: [villager], places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0098, text: "You buy the good stone and you don't ask whose hands it came through. That's the whole of it.", speakers: [crafter], places: [cairnwold], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0099, text: "I've carried stone out of the Cut and stone in here, and I've never been told what it was before.", speakers: [adventurer], places: [cairnwold], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0100, text: "Market's thin on ash this time. If you've any to move, it'll go today.", speakers: [villager], places: [cairnwold], times: [afternoon], channel: world, ai_generated: true }
  - { key: chat.b0001.0101, text: "Sun's over the basin and the crags have gone pale. The survey maps folds and old works and asks what it costs after.", places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0102, text: "Long part of the day. Knowledge first, consequences later. That's the survey's way and it's not mine.", places: [cairnwold], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0103, text: "Brought the wall stone in through the wet. The gate's a mess for it and there's nobody to blame but the sky.", speakers: [labourer], places: [cairnwold], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0104, text: "Sparks all afternoon off one piece and it still won't take an edge.", speakers: [crafter], places: [cairnwold], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0105, text: "Patrol's done and the wall's sound. I'll say that much for the wall.", speakers: [guard], places: [cairnwold], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0106, text: "Flock's come off the high ground early. They do that when the weather means it.", speakers: [herder, farmer], places: [cairnwold], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0107, text: "Fog came down off the crags and the whole village went quiet with it.", places: [cairnwold], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0108, text: "Nothing on the road in or out since noon. If you're waiting on a cart, it isn't coming today.", speakers: [guard], places: [cairnwold], times: [afternoon], channel: world, ai_generated: true }
  - { key: chat.b0001.0109, text: "Lodge'll be full tonight. The tally's turning and everyone's got an opinion about the granary.", speakers: [villager], places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0110, text: "Kal stone in that wall. Older than the house round it, and it'll be there when the house isn't.", speakers: [crafter], places: [cairnwold], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0111, text: "A Veth learns a trade in a fortnight and then can't be taught another thing. I've watched it happen twice.", speakers: [traveller], places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0112, text: "Anybody going down the basin road in the morning, the wall's down at the west end. Go round it.", speakers: [villager], places: [cairnwold], times: [dusk], channel: world, ai_generated: true }
  - { key: chat.b0001.0113, text: "The Kal buy from us and don't come to funerals. Nobody takes it personally, it's just how it is.", places: [cairnwold], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0114, text: "Light going off the crags and the smoke going straight up. Some roads are wrong, my mother said, and she walked most of them.", places: [cairnwold], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0115, text: "Turned the beasts in and the gate's tied twice. The second one's for me, not them.", speakers: [farmer], places: [cairnwold], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0116, text: "Rain's coming and the flock's already facing away from it. Wish I knew how they know.", speakers: [herder], places: [cairnwold], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0117, text: "Two of us walked the wall at dark and neither of us saw anything. That's a good walk.", speakers: [guard, labourer], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0118, text: "Fires lit early all down the row. The walls hold the day's heat for about an hour.", speakers: [villager], places: [cairnwold], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0119, text: "Wain's under the lean-to and the load's well tied. Whatever the night does, it can do it.", speakers: [carter], places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0120, text: "Someone's got a pot going that you can smell from the middle of the village.", places: [cairnwold], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0121, text: "Lodge talk tonight was the Foldscar and whether the survey's got any right to it. It didn't get settled.", speakers: [villager], places: [cairnwold], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0122, text: "Grandmother saw the stones at the Foldscar once. Never said anything else about it in fifty years.", speakers: [hunter], places: [cairnwold], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0123, text: "Hollow Day. One day a Reckoning where nothing you do counts. The village is very fond of it.", speakers: [villager], places: [cairnwold], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0124, text: "Sat down and the day caught up. Learn a trade in a fortnight and everyone knows you're Veth.", places: [cairnwold], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0125, text: "Fog's coming up the low end. The survey has charts of this basin that nobody here has ever seen.", places: [cairnwold], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0126, text: "Grain's bagged and up on the stones. Whatever the weather does now, it stays dry.", speakers: [farmer], places: [cairnwold], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0127, text: "Beasts settled, birds shut up. Makes a change from the rest of the day.", speakers: [herder], places: [cairnwold], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0128, text: "One round of the wall and I'm in for a while. Wind's got the fire going sideways anyway.", speakers: [guard], places: [cairnwold], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0129, text: "Sorted the day's pieces and only two went in the scrap. Better than yesterday.", speakers: [crafter], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0001.0130, text: "Barley and mutton. Same as always.", speakers: [labourer], places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0001.0131, text: "Bed for the night at Cairnwold and I'm up the road at first light. Company welcome as far as the rim.", speakers: [traveller], places: [cairnwold], times: [evening], channel: world, ai_generated: true }
  - { key: chat.b0001.0132, text: "Somebody's boy came back from the Cut with stone dust in his hair and won't say what he was at.", places: [cairnwold], times: [evening], ai_generated: true }
  - { key: chat.b0001.0133, text: "Nobody's out but me and one dog. The Siann say the record starts too late, and they say it without any shame.", places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0134, text: "Black as a bag out there. An Orenth would walk it anyway and come back a year short.", places: [cairnwold], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0135, text: "There's a tale that a Kal caught in a turning doesn't die, it sets. You don't tell that one to children.", speakers: [villager], places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0136, text: "Gate's shut and barred. Nothing's come up the rise all night and I'd like it to stay that way.", speakers: [guard], places: [cairnwold], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0137, text: "Heard something out past the wall and went to look. Wind, and a lot of it.", speakers: [hunter], places: [cairnwold], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0138, text: "Woken by the rain on the shutters. The beasts will be in the mud corner and I'll be out at first light.", speakers: [farmer], places: [cairnwold], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0139, text: "Rain on the roof and tomorrow's work is indoors whatever happens. A wet night's no loss to me.", speakers: [crafter], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0001.0140, text: "Nothing up the road tonight and that's my report. If you're on it after dark, walk wide of the barrow.", speakers: [guard], places: [cairnwold], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0001.0141, text: "Smith's been at his fire two nights running. Whatever came up the road, it's kept him busy.", places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0001.0142, text: "Half the night gone and the wall's two courses along. Two's better than none.", speakers: [labourer], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0001.0143, text: "Feet up in the dry and my boots off for the first time since the road.", speakers: [traveller], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0001.0144, text: "Year's turning at the Hollow Day and the beasts don't care either way. I'll take the day off though.", speakers: [farmer], places: [cairnwold], times: [night], ai_generated: true }
  - { key: chat.b0001.0145, text: "Road's empty and the sky's going grey. Nothing behind me and nothing ahead either.", places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0146, text: "Watch fire on the rim's out. Somebody had the last of it in the night and didn't bank it.", speakers: [guard], places: [old_east_road], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0147, text: "Iron goes up this road because Cairnwold's own seam is going. Best trade on the road and everybody knows it.", speakers: [carter], places: [old_east_road], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0148, text: "Heavy load going up to Cairnwold from the Hollow at first light. If you're walking it, keep to the edge.", speakers: [carter], places: [old_east_road], times: [dawn], weather: [wind], channel: world, ai_generated: true }
  - { key: chat.b0001.0149, text: "Nothing moving on the road but a crow. The stone at the rim's dormant and nobody's woken it in years.", places: [old_east_road], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0150, text: "Walked out at first light to look at the ditches. They're running and the road's taking it.", speakers: [traveller], places: [old_east_road], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0151, text: "Fields either side of the road had the worst of it. The road drains and they don't.", speakers: [farmer], places: [old_east_road], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0152, text: "Moved the flock across the road before the day got up. Took three of us and a good dog.", speakers: [herder], places: [old_east_road], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0153, text: "Tracks on the road and none from a cart. Somebody came past in the night on foot.", speakers: [hunter, guard], places: [old_east_road], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0154, text: "Carry my tools and hope the road's kind. A wayfarer's boots are the whole of his character.", speakers: [crafter], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0155, text: "First light on the wet stone and the whole road shines. It's the prettiest it gets.", places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0156, text: "Mending a road's an argument between the mud and me, and the mud's winning this week.", speakers: [labourer], places: [old_east_road], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0157, text: "Lantern's still lit at the shrine. Somebody went down in the dark and saw to it.", speakers: [villager], places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0158, text: "Left a bit of bread under the shrine stone. That's the custom and I'd not be the one to break it.", speakers: [traveller], places: [old_east_road], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0159, text: "Shrine's had offerings in it overnight. If you're carrying anything spare this way, it's the place for it.", speakers: [villager], places: [old_east_road], times: [morning], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0001.0160, text: "Road's holding. I've come up it with half the load. Cairnwold's iron is going and the coast carts come up for it.", speakers: [carter], places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0161, text: "Road's had the night on it. The stone at the rim is cold and doesn't answer, and a dead stone means a long walk.", places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0162, text: "Road's clear as far as the drop. I'd call that a good morning if it were my road.", speakers: [guard], places: [old_east_road], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0163, text: "Patching the culvert again. Water's the one thing on this road you can't argue with.", speakers: [labourer], places: [old_east_road], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0164, text: "Passed a wain going the other way with a load of ash. Sniffed of it for a mile after.", places: [old_east_road], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0165, text: "The wain's still on its side and its load's spoiling. Somebody's lost a week of work.", places: [old_east_road], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0166, text: "Rain's got every track on the road running together. Nothing to read out here now.", speakers: [hunter], places: [old_east_road], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0167, text: "Waystone's stood at the rim long enough that nobody remembers putting it there. You touch it going past.", speakers: [villager], places: [old_east_road], times: [morning], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0168, text: "Culvert's half done and the road's down to one cart's width. Don't be in a hurry coming up.", speakers: [labourer], places: [old_east_road], times: [morning], weather: [fair], channel: world, ai_generated: true }
  - { key: chat.b0001.0169, text: "Husks on the barrow have been moving about again. Two of them, and neither in a hurry.", speakers: [guard], places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0170, text: "There's grave goods in that cist and there's husks in that barrow. That's the whole argument and nobody wins it.", speakers: [adventurer], places: [old_east_road], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0171, text: "Barrow's still held by husks, so keep to the road side of it and don't go up for a look.", speakers: [guard], places: [old_east_road], times: [afternoon], weather: [rain], channel: world, ai_generated: true }
  - { key: chat.b0001.0172, text: "Sun's on the shrine stone and the lantern's burning daylight. Still, it's kept lit.", places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0173, text: "Sitting on the shrine wall. Offerings go in, the wayhold keeps the lantern filled, and that's the religion of this road.", places: [old_east_road], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0174, text: "Caught out in the open when it came down. Barely worth running and I didn't.", speakers: [traveller], places: [old_east_road], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0175, text: "Wains come up loaded, go down light. You can tell the trade by how deep the ruts are.", places: [old_east_road], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0176, text: "On the road with a bench's worth of tools and no bench. You make do with a rock and a rag.", speakers: [crafter], places: [old_east_road], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0177, text: "Last of the light and something's moving in the scrub past the barrow. It can move.", speakers: [hunter], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0178, text: "Flock got across the road and one of them stopped in the middle of it. There's always one.", speakers: [herder], places: [old_east_road], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0179, text: "Half a day on the culvert. The survey asks what the old works were for and nobody here has an answer that helps them.", speakers: [labourer], places: [old_east_road], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0180, text: "The rim's the only place you see the whole basin and the Foldscar at once. I don't go up there for the view.", speakers: [villager], places: [old_east_road], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0181, text: "Light's off the road and the cold comes up out of the mud.", places: [old_east_road], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0182, text: "Grey going to dark grey. The road stops being a road about now.", places: [old_east_road], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0183, text: "Fire's lit on the rim and I'm sat where I can see the drop and the barrow both.", speakers: [guard], places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0184, text: "Watch is set on the rim for the night. Anything on the road east of the barrow after dark, shout.", speakers: [guard], places: [old_east_road], times: [dusk], weather: [overcast], channel: world, ai_generated: true }
  - { key: chat.b0001.0185, text: "Sunset from the rim's worth the climb. Getting back down in the dark isn't.", speakers: [adventurer], places: [old_east_road], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0186, text: "Drove the beasts back across the road before dark. Took twice as long as it should.", speakers: [farmer], places: [old_east_road], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0187, text: "Rain's set in for the night and I'm a mile from anything dry. So it's the wain's lee side.", speakers: [herder, labourer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0188, text: "Got the wain down to the flat before dark. I'd not take it down the rim in this.", speakers: [carter, traveller], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0189, text: "Somebody's lit the shrine lantern and you can see it from halfway down. That's the point of it.", speakers: [villager], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0190, text: "Fog's come over the rim. Align the Quiet Stones and the ground holds. Turn them out of line and it wanders. So they say.", places: [old_east_road], times: [dusk], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0191, text: "Finished the stretch I was set. There's another past the bend and the stone beyond that, dead as a nail.", speakers: [labourer], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0192, text: "Best hour for the barrow road is the one before light, and it's still a bad hour to be alone on it.", speakers: [hunter], places: [old_east_road], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0193, text: "From up here the Foldscar's just a gap between trees. You'd not know there was anything wrong with it.", speakers: [villager], places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0194, text: "Stood at the rim and watched the light go strange in the Foldscar for about the length of a breath.", speakers: [adventurer], places: [old_east_road], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0195, text: "Somebody keeps this fire and it isn't the watch. It's banked, and it's not my doing.", speakers: [guard], places: [old_east_road], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0196, text: "Sat by the fire on the rim with the whole basin under me going dark.", places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0197, text: "Nobody's come up the road all evening. The wayhold would know. They mark every post and keep the stone clear.", places: [old_east_road], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0198, text: "Fire's a mistake tonight. Wind takes the smoke down the road and anything downwind knows where I am.", speakers: [hunter], places: [old_east_road], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0199, text: "Wain's under a tarp and the fire's going. Morning's a problem for the morning.", speakers: [carter, traveller], places: [old_east_road], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0200, text: "Fire's going and the whole valley's below. Best view on the road and it costs nothing.", places: [old_east_road], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0201, text: "Somebody left bread at the shrine and a nail. A nail's a strange thing to leave, unless it wasn't.", speakers: [traveller], places: [old_east_road], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0202, text: "Fog's come up over the rim from the Foldscar side. It moves against the wind, and I'd rather it didn't.", speakers: [villager], places: [old_east_road], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0203, text: "Foldscar's been bad this evening, by all accounts. Nothing's happened and nothing usually does.", speakers: [villager], places: [old_east_road], times: [evening], channel: world, ai_generated: true }
  - { key: chat.b0001.0204, text: "Getting a load up the rim is a day's work. Waystones are ordinary old infrastructure and nobody's told me more.", speakers: [labourer], places: [old_east_road], times: [evening], ai_generated: true }
  - { key: chat.b0001.0205, text: "Middle of the night on the road and a fire's the only thing I've got.", places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0206, text: "No moon at all. The road's a darker line in a dark field.", places: [old_east_road], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0207, text: "Touched the stone going past, same as everybody. It's the custom and it costs nothing.", speakers: [traveller], places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0208, text: "Downed a man on this stretch last tally and he came back at the stone. Don't ask me how.", speakers: [adventurer], places: [old_east_road], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0209, text: "Wind's got the tarp flapping and there's no sleeping through that. So I'm up.", speakers: [carter], places: [old_east_road], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0210, text: "Working the road at night because the day was too wet. Most of what I do is choosing which wet.", speakers: [labourer], places: [old_east_road], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0211, text: "Hammer's over my shoulder and the fire's lit. That's as far as today got.", speakers: [crafter], places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0212, text: "Something went past the camp in the rain. Could have been a dog and I'm not going to find out.", speakers: [hunter, adventurer], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0001.0213, text: "Took the lantern down to the shrine at dark. The wayhold keeps it filled and the road's better for it.", speakers: [villager], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0001.0214, text: "Beasts are loose along the road. Listening grass grows in the wet bits and it bends at your voice, not the light.", speakers: [farmer, herder], places: [old_east_road], times: [night], ai_generated: true }
  - { key: chat.b0001.0215, text: "Road east is clear to the shrine and the watch fire's lit. Nothing else to report.", speakers: [guard], places: [old_east_road], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0001.0216, text: "Everything's dripping off the trees. You can walk this road by ear tonight.", places: [old_east_road], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0217, text: "Fair sky over the moor and mist lying in every low place there is.", places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0218, text: "Ash hound's been through Charwood. You can tell by the way the hares are all sat facing one way.", speakers: [hunter], places: [wilds], times: [dawn], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0219, text: "Ash stand's the best wood in this valley and there's never enough of it cut.", speakers: [labourer], places: [wilds], times: [dawn], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0220, text: "First light out here and everything's wet. Boneleaf only grows round the Foldscar and its veins run the wrong way.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0221, text: "Went out for woundmoss and found some. Should have come yesterday, from the look of it.", speakers: [villager], places: [wilds], times: [dawn], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0222, text: "Out before the light for a thing left out overnight. Cold work, and the thing was ruined.", speakers: [crafter, adventurer], places: [wilds], times: [dawn], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0223, text: "Wind off the high ground goes straight through a coat and out the other side.", speakers: [herder], places: [wilds], times: [dawn], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0224, text: "Fog out here takes your bearings off you. Walk an hour and you find your own tracks.", speakers: [hunter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0225, text: "Went out with a basket and came back with rain and no basket.", speakers: [villager], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0226, text: "Slept out. A stone hums under the hand and you'd think that would be a comfort. It isn't.", speakers: [traveller], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0227, text: "Escorting a load through the fog. Slow, but nothing's going to see us coming.", speakers: [guard, carter], places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0228, text: "Track out here goes to mud and the mud goes to axle. Wish I'd come by the road.", places: [wilds], times: [dawn], ai_generated: true }
  - { key: chat.b0001.0229, text: "Seam's running thin at the far end. The quarry master says it's the same seam, so it's the same seam.", speakers: [labourer], places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0230, text: "Iron out of the south crag seam comes up softer than Blackvein's. Two seams, two hammers, two tempers.", speakers: [crafter], places: [wilds], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0231, text: "The Ondrek pay well for quarried stone and don't haggle. That's reason enough for most people.", speakers: [adventurer], places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0232, text: "Morning's the only time out here you can see where the ground lets you walk.", places: [wilds], times: [morning], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0233, text: "Cloud's down and the far side of the moor is gone. An Orenth knows the ground's thin before anyone else does.", places: [wilds], times: [morning], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0234, text: "Found where a boar's been feeding in the night. Fresh, and deeper than I'd like.", speakers: [hunter], places: [wilds], times: [morning], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0235, text: "Cutting timber out here is carrying timber out here. The cutting's the easy half.", places: [wilds], times: [morning], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0236, text: "Tool's got a burr on it from that wet wood. I'll be at this stone half the morning.", speakers: [crafter], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0001.0237, text: "Took the flock out the dry way and it's still ankle deep in one place I'll remember.", speakers: [farmer, herder], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0001.0238, text: "Wind's come round the hill and the flock's turned into it. Half of them won't face away.", speakers: [herder], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0001.0239, text: "Cart's stuck at the wet bit. The survey would want to know why the ground's soft here, and I'd want to be moving.", speakers: [carter], places: [wilds], times: [morning], ai_generated: true }
  - { key: chat.b0001.0240, text: "Boar's been at the ash stand two nights running. If you're cutting there, cut in daylight.", speakers: [hunter], places: [wilds], times: [morning], channel: world, ai_generated: true }
  - { key: chat.b0001.0241, text: "Spider's webbed the easy way round to the Foldscar. Short route, and you're not the one deciding.", speakers: [hunter], places: [wilds], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0242, text: "Armour walking about the Cut with nobody inside it. It's been there as long as anyone's been looking.", speakers: [adventurer], places: [wilds], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0243, text: "Sun's full on the moor. Touch a stone and it's a return point after. That's all anybody knows about it.", places: [wilds], times: [afternoon], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0244, text: "Long afternoon. The survey finds something in the ground and then the ground is interesting again.", places: [wilds], times: [afternoon], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0245, text: "Been out in this since noon. There's no shelter out here that isn't a hole.", speakers: [traveller, labourer], places: [wilds], times: [afternoon], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0246, text: "Hauling cut timber on my back and the barrow's an ornament I can't use.", speakers: [labourer], places: [wilds], times: [afternoon], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0247, text: "Wood's got the wet in it. Every cut's rough and the saw's said so twice.", speakers: [crafter], places: [wilds], times: [afternoon], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0248, text: "Fog on this side of the hill and the beasts won't move in it. So we wait, and I'm patient about it.", speakers: [farmer], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0249, text: "Hound's found something it won't leave. I'd rather not know and I'd rather it left it.", speakers: [herder, hunter], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0250, text: "Set the snares along the run and left them. Checking them too often is what spoils them.", speakers: [hunter], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0251, text: "Bog cotton's up all through the low ground. It's no good for cloth and everybody still picks it.", places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0252, text: "Walked the crag side and there's nothing to report. Nothing to report isn't nothing there.", speakers: [guard], places: [wilds], times: [afternoon], ai_generated: true }
  - { key: chat.b0001.0253, text: "Light going off the moor. Three quiet stones round something that isn't there any more.", places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0254, text: "Wind's up with the dark and it's the only thing making noise. That and the stones, if you put a hand on one.", places: [wilds], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0255, text: "Came off the Foldscar side at dusk and my shadow was a half-step behind me the whole way.", speakers: [adventurer], places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0256, text: "Whatever the Foldscar does to a shadow, it does nothing to a snare. I set them and they fill.", speakers: [hunter], places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0257, text: "People say the veil's thin out here. People say a lot of things up a hill in the rain.", speakers: [villager], places: [wilds], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0258, text: "Beasts are down the wet way and I'll be getting them back in the dark. Again.", speakers: [farmer], places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0259, text: "Low corner's taking the wet and the flock keeps away from it. They've no argument with it.", speakers: [herder, hunter], places: [wilds], times: [dusk], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0260, text: "Watch on the high ground tonight. Nothing to do but listen to wind and watch for a light.", speakers: [guard], places: [wilds], times: [dusk], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0261, text: "Got out to the flat before dark and I'd not push a wain further tonight.", speakers: [carter, traveller], places: [wilds], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0262, text: "Rain's come on and the trees are doing their best. It's not shelter, but it's a direction.", speakers: [traveller], places: [wilds], times: [dusk], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0263, text: "Dropped the last of the timber at the edge of the wet ground. Morning can have the rest.", speakers: [labourer], places: [wilds], times: [dusk], ai_generated: true }
  - { key: chat.b0001.0264, text: "Somewhere out there the last of the light is on water and it looks like something it isn't.", places: [wilds], times: [dusk], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0265, text: "Sat down with the fire. The wayhold keeps the road and the stone, and neither is any use to me tonight.", places: [wilds], times: [evening], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0266, text: "Ask what a Pacha is and you'll get four answers. Ask what happens when one turns and you'll get silence.", speakers: [villager], places: [wilds], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0267, text: "The scholar account and the Other account. Two words for the same strangeness and neither one gets you warm.", speakers: [adventurer], places: [wilds], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0268, text: "Nobody out here will tell you they know what the other place is. They'll tell you where not to walk.", speakers: [hunter], places: [wilds], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0269, text: "Rain's turned the ground to a sponge. The Siann record has a gap at the front of it and nobody speaks the gap.", places: [wilds], times: [evening], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0270, text: "Rain's coming down flat and the fire's doing its best. It's losing.", places: [wilds], times: [evening], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0271, text: "Hound's asleep with his nose in my coat. He's had the better day of the two of us.", speakers: [herder, hunter], places: [wilds], times: [evening], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0272, text: "Skinned out the day's catch and my hands are the wrong side of cold for it.", speakers: [hunter], places: [wilds], times: [evening], weather: [fog], ai_generated: true }
  - { key: chat.b0001.0273, text: "Fire won't take with the wood this wet. So it's a cold watch and a long night about it.", speakers: [guard], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0001.0274, text: "Made the edge of the moors before dark and that's as far as I'm going.", speakers: [carter, traveller], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0001.0275, text: "Legs are done. The timber isn't.", speakers: [labourer], places: [wilds], times: [evening], ai_generated: true }
  - { key: chat.b0001.0276, text: "Moor's wet through and the low crossing's gone. If you're coming out here, come by the high ground.", speakers: [villager], places: [wilds], times: [evening], channel: world, ai_generated: true }
  - { key: chat.b0001.0277, text: "Night out here. Fold's a word people use and nobody defines it twice.", places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0278, text: "No stars, no moon, no horizon. Just the fire and about two feet of ground.", places: [wilds], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0279, text: "Something walked past the fire and left no mark in the ash. I've been awake since.", speakers: [adventurer], places: [wilds], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0280, text: "They'll tell you the Otherways are roads, a road you can walk. I've never met anyone came back to say.", speakers: [villager], places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0281, text: "Everything's wet, including the tools. Whatever the Foldscar does, it does it to the light, not the rain.", places: [wilds], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0282, text: "Birds are asleep and the flock's asleep and I'm sat here for no reason I can point at.", speakers: [herder], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0001.0283, text: "Night's the only time the wood's honest. Everything in it stops pretending to be a shape.", speakers: [hunter], places: [wilds], times: [night], weather: [fair], ai_generated: true }
  - { key: chat.b0001.0284, text: "Worked by lantern light till it made me stupid, then stopped.", speakers: [labourer], places: [wilds], times: [night], weather: [overcast], ai_generated: true }
  - { key: chat.b0001.0285, text: "Out in the dark after the beasts again. They're well pleased with themselves about it.", speakers: [farmer, herder], places: [wilds], times: [night], ai_generated: true }
  - { key: chat.b0001.0286, text: "Tools in the bag, bag under me, and me awake all night anyway.", speakers: [crafter, adventurer], places: [wilds], times: [night], weather: [rain], ai_generated: true }
  - { key: chat.b0001.0287, text: "Away out here the night's not peaceful, it's busy. It's just busy about other things.", places: [wilds], times: [night], weather: [wind], ai_generated: true }
  - { key: chat.b0001.0288, text: "Nothing on the wilds side tonight. Watch'll be on the high ground till light.", speakers: [guard], places: [wilds], times: [night], channel: world, ai_generated: true }
  - { key: chat.b0001.0289, text: "Weather's turned in the night. You can smell it before you can see it.", places: [ashen_hollow], times: [dawn], events: [weather_turned], ai_generated: true }
  - { key: chat.b0001.0290, text: "It came over about noon and changed the whole day. Everyone's gone quiet about it.", places: [cairnwold], times: [afternoon], events: [weather_turned], ai_generated: true }
  - { key: chat.b0001.0291, text: "Turned on us an hour back. On this road that's one sky, then another.", places: [old_east_road], times: [evening], events: [weather_turned], ai_generated: true }
  - { key: chat.b0001.0292, text: "The {creature}'s dead and it won't be at the hens again. Nobody's sorry.", speakers: [hunter], places: [ashen_hollow], times: [night], events: [creature_slain], ai_generated: true }
  - { key: chat.b0001.0293, text: "The {creature} from past the wain is dead and left where it lay. Somebody did us a good turn.", speakers: [carter], places: [old_east_road], times: [morning], events: [creature_slain], ai_generated: true }
  - { key: chat.b0001.0294, text: "Came on the {creature} where it had been killed and left. Whatever did it wasn't hungry.", speakers: [hunter, adventurer], places: [wilds], times: [dusk], events: [creature_slain], ai_generated: true }
  - { key: chat.b0001.0295, text: "Market's settled and there's coin moving. Several people are very pleased with themselves.", speakers: [villager], places: [cairnwold], times: [evening], events: [market_day], ai_generated: true }
  - { key: chat.b0001.0296, text: "Market settled and I'm out here before anything opens. Bad timing, that.", speakers: [carter], places: [wilds], times: [dawn], events: [market_day], ai_generated: true }
  - { key: chat.b0001.0297, text: "They settled the day's trade and now the stall wants seeing to. Always after the fact, that.", speakers: [crafter], places: [ashen_hollow], times: [afternoon], events: [market_day], ai_generated: true }
  - { key: chat.b0001.0298, text: "{claimant} brought in {bounty} and it's done. Road's quieter for it and the purse isn't mine.", speakers: [traveller, adventurer], places: [old_east_road], times: [dusk], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0001.0299, text: "Word is {claimant} finished {bounty}. Word travels out here quicker than a man on foot.", speakers: [hunter], places: [wilds], times: [night], events: [bounty_claimed], ai_generated: true }
  - { key: chat.b0001.0300, text: "Heard {claimant} claimed {bounty}. Fair enough. I'd not have gone after it myself.", speakers: [villager], places: [cairnwold], times: [morning], events: [bounty_claimed], ai_generated: true }
