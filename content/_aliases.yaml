# Game content renames (M2b's alias mechanism): a save that names the old ID loads under the new one.
# M6 moved the region to the content bible's four cells: the M3 iron shelf became Blackvein Cut.
aliases:
  location.iron_shelf: location.blackvein_cut
  # Playtest 2: the D19 bosses replaced the plain creatures, so a Playtest 1 save of the Matriarch, the Gate Warden or the Doubled Hart loads as the boss.
  creature.beast.hunting_spider_matriarch: creature.boss.den_gorge.matriarch
  creature.construct.gate_warden: creature.boss.field_ruins.gate_warden.deep
  creature.grazer.doubled_hart: creature.boss.foldscar.doubled_hart
  loot.hunting_spider_matriarch: loot.boss.den_gorge.matriarch
  loot.gate_warden: loot.boss.field_ruins.gate_warden.deep
  loot.doubled_hart: loot.boss.foldscar.doubled_hart
