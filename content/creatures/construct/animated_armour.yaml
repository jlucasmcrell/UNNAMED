weak_point: { region: head, from_behind: true }
move_speed_m_s: 1.8
turn_deg_s: 90   # a heavy body swings round slowly: get behind it
body_radius_m: 0.45
xp_value: 60
loot_table: loot.animated_armour
perception: { sight_m: 15, hearing_m: 18, fov_deg: 100 }   # the visor narrows its sight
