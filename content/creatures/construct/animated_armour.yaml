name: Animated Armour
notes: Armored heavy (content bible §10 - armor and weak-point logic). Plate takes most of a blow from the front; the open back of the helm takes all of one from behind. Slow, heavy, bloodless.
family: construct
archetype: construct
level_band: [5, 5]
