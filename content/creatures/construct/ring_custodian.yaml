id: creature.construct.ring_custodian
kind: creature
schema: 1
display_key: creature.construct.ring_custodian.name
tags: [creature, construct, boss]
name: Ring Custodian
notes: "The service ring's own keeper (M8 I4), and the ring was built to gauge something and never finished the job - so what stands in the measuring court is a machine still waiting for a reading that stopped coming. Plate front and sides takes most of a blow; the back of the housing is open where the index mechanism runs, and that is where it comes apart. Three attacks, each with a telegraph a body can read: the long sweep, the overhead fall, and the short grasp. Slow to turn, which is the whole fight - stay behind it. Bloodless, and it does not pursue far past its own court. Level 5 and 150 health as the brief sets; its pace, turn and blows are calibrated to M8 08 (four to six blows fell the level-5 reference) and measured in docs/BARROWWORKS_BALANCE.md."
family: construct
archetype: construct
level_band: [5, 5]
pools: { health: 150 }
attack_set: [ability.creature.gauge_sweep, ability.creature.measure_fall, ability.creature.index_grasp]
armor: { head: 30, torso: 50, limbs: 40 }
resistances: { physical_pierce: 0.5, physical_slash: 0.25 }
weak_point: { region: torso, from_behind: true }
move_speed_m_s: 2.0
turn_deg_s: 75   # slower than the animated armour: the fight is about staying behind it
body_radius_m: 0.6
xp_value: 150
loot_table: loot.ring_custodian
perception: { sight_m: 18, hearing_m: 22, fov_deg: 120 }
tier_hint: B
tameable: false

# CMB-43: the measuring court answers a court's own three ways. Its words are the survey's formula for a reading; its rite is the
# measurement itself, which is the thing the ring was built to take; its token is the right the Barrowworks issues to whoever keeps
# the measure. Killing it takes its loot; standing it down takes the reading, which is what Kera actually wants.
duty:
  routes: [word, token, rite]
  token: item.quest.halda_token
  words:
    - "the measure is kept"
    - "I am the reading you were waiting for"
  rites:
    - { id: name_the_court, asked: "It waits. A bar of brass slides out of the housing: a lectern, offered at chest height." }
    - { id: stand_the_measure, asked: "The court is cold on three sides and warm on the fourth. It wants a body where the measure stands." }
    - { id: keep_the_reading, asked: "The index turns a full quarter and stops. It is listening for the reading it never got." }
  voice:
    called: "The housing turns without hurrying. 'A visitor. The court is not open. State a reading or state a name.'"
    accepted: "'Kept.' The bar withdraws. The court stays where it stands, and stops being a thing that measures you."
    refused: "'Not a reading.' The housing turns away, and the sweep begins."
