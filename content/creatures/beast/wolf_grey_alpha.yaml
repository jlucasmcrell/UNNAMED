name: Grey Alpha
notes: The den's leader (owner finding 29) - the grey wolf's own archetype one level up, and deliberately NOT a health pool. wolf_grey's note holds for this one too "dangerous in a pack by numbers and bleeding, never by a health pool", so its toughness is armour, reach and the pack it calls - 110 health where the pack has 50, hide where the pack has fur. It is drawn at 1.29x the wolf's size because the view scales a creature by body_radius_m, so the silhouette reads before the nameplate does. A name is provisional - the owner names characters.
family: beast
