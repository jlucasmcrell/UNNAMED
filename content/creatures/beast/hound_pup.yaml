notes: A young hound of the hollow's own breeding - spec 43's first route, buy or raise. Sold at the waystation's market and raised from there; it is weak, it is steady-tempered because it was handled early, and it grows into the grey wolf's animal over two days of real time. It is not tamed - nobody has to creep up on a pup.
