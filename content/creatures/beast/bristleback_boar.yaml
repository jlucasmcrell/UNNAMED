id: creature.beast.bristleback_boar
kind: creature
schema: 1
display_key: creature.beast.bristleback_boar.name
tags: [creature, beast]
name: Bristleback Boar
notes: Charging brute (content bible §10 - lateral movement and terrain). It lowers its head, then runs straight and cannot turn - step aside, or put a rock in its way and it stuns itself. It defends its wallow and ignores those who leave it be.
family: beast
archetype: prey
level_band: [4, 4]
pools: { health: 70 }
attack_set: [ability.creature.boar_gore, ability.creature.boar_charge, ability.creature.bristleback_boar_heavy]
armor: { head: 4, torso: 8, limbs: 3 }   # bristles
move_speed_m_s: 4.0
turn_deg_s: 240   # quick in a line, slow to turn
body_radius_m: 0.55
xp_value: 45
loot_table: loot.bristleback_boar
carcass_ref: node.carcass.boar
perception: { sight_m: 20, hearing_m: 25, fov_deg: 150 }
# The eye is the only way through the skull, and the eye is at the front (STEALTH §7.2): a boar shot from behind the shoulder is a
# bristled, armoured animal that is now angry.
hit_zones:
  head: { multiplier: 2.5, front_only: true }
  torso: { multiplier: 0.9 }
  limbs: { multiplier: 0.7 }
tier_hint: A
tameable: false
