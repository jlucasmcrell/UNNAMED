id: creature.beast.wolf_grey
kind: creature
schema: 1
display_key: creature.beast.wolf_grey.name
tags: [creature]
name: Grey Wolf
notes: The prototype's one archetype (PROTOTYPE.md §4.1) at its authored level. Dangerous in a pack by numbers and bleeding, never by a health pool. Spec 43 makes the grey wolf tameable - the hunter's hound is this animal, brought in with meat and a steady approach - and this is the pet it becomes when it is.
family: beast
archetype: predator
level_band: [2, 2]
pools: { health: 50, stamina: 60 }
attributes: { might: 10, endurance: 10, agility: 14, precision: 10, will: 6, insight: 8, presence: 6 }
attack_set: [ability.creature.wolf_bite, ability.creature.wolf_grey_heavy, ability.creature.wolf_grey_rush]
armor: { head: 1, torso: 2, limbs: 1 }   # fur
move_speed_m_s: 4.5        # faster than a run, slower than a sprint
body_radius_m: 0.45
xp_value: 30
loot_table: loot.wolf_grey # its corpse holds this until searched
carcass_ref: node.carcass.grey_wolf
perception: { sight_m: 25, hearing_m: 30, fov_deg: 140 }   # sight in a cone, hearing all round (STEALTH §2)
tier_hint: A
tameable: true             # spec 43: wolves are one of the tameable kinds; ember hounds and bosses are not
pet:
  name: Wolf
  role: fighter            # the role its own kit is built around (owner ruling 3)
  skills: [bite, lure]     # the fighting skill, and the control one: draw one creature off to a place the handler chose
  temperament: wary
  foods:                   # what it takes, and what one offer of it is worth in the odds (quality points)
    item.material.raw_meat: 15
    item.consumable.roast_meat: 25
  home: location.outpost   # where it mends when it is badly wounded (owner ruling 1)
