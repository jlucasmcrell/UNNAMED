notes: "Cairnwold's market (WP14, SYSTEMS_COMPLETENESS_PLAN §2.14): a moorland village's hides and ash, and Durn's moor gear. Its own iron is running out (Durn's merchant notes), so iron is dear here and the Old East Road carrier brings Ashen Hollow's surplus - travel has economic value (DATA_MODEL.md §4.15's rural example). Production and consumption are working numbers pending WP12's job hooks."
