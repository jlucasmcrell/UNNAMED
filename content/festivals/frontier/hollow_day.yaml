notes: >
  The Hollow Day, the canon's big festival (the Sworn Counties' Hollow Day: the city renews its oaths aloud at noon and the
  tally-towers are restrung). Here it is the frontier's day: no tally owns it, so the hollow keeps it at the waystation's yard, and
  everyone who is awake comes. The hour band holds noon inside it.
