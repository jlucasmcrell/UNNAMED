id: quest.bounty.moor_billets
kind: quest
schema: 1
display_key: quest.bounty.moor_billets.name
tags: [quest, bounty]
notes: 'Canon firstplay moor_billets, ported: smelt one billet while the work is taken, and hand it over.'
title: Iron for the Repairs
summary: Make a fresh billet, then deliver it to Durn. His stock does not count as work.
track: bounty
giver_ref: npc.cairnwold.durn_skell
entry_objective: o_make
objectives:
  - id: o_make
    type: craft_item
    description: Smelt a fresh billet at a forge.
    params: { item_ref: item.material.iron_ingot, count: 1 }
    next: [o_deliver]
  - id: o_deliver
    type: deliver_item
    description: Bring 1 iron billet to Durn Skell.
    params: { npc_ref: npc.cairnwold.durn_skell, item_ref: item.material.iron_ingot, count: 1 }
rewards:
  - { kind: xp, amount: 30 }
  - { kind: currency, amount: 10 }
repeat_policy: { repeatable: true, cooldown_min: 1440 }   # one world day (48 real minutes) after it is done, the work is posted again
