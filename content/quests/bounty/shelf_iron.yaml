tags: [quest, bounty]
notes: Kera's repeatable ore run. The spoil at Blackvein and the rotten east crags (node.ore.loose_iron) renew daily, so the work never strands.
title: Iron off the Shelf
summary: Kera always needs ore - two lumps, from the seam, the spoil or the crags.
track: bounty
giver_ref: npc.ashen_hollow.kera_voss
entry_objective: o_deliver
objectives:
  - id: o_deliver
    type: deliver_item
    description: Bring 2 raw iron ore to Kera Voss.
    params: { npc_ref: npc.ashen_hollow.kera_voss, item_ref: item.material.iron_ore, count: 2 }
rewards:
  - { kind: xp, amount: 25 }
  - { kind: currency, amount: 10 }
repeat_policy: { repeatable: true, cooldown_min: 1440 }   # one world day (48 real minutes) after it is done, the work is posted again
