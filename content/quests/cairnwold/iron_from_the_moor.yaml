id: quest.cairnwold.iron_from_the_moor
kind: quest
schema: 1
display_key: quest.cairnwold.iron_from_the_moor.name
tags: [quest]
notes: Durn Skell's smithing quest, and Cairnwold's own - it names Cairnwold's iron seam and Cairnwold's ash stand, both of them placed by this region rather than borrowed from the demo's Blackvein Cut and Charwood. No objective to kill anything, nothing assumes an order the fiction does not need, and ore got without a fight counts; each item objective also counts what its item is made into, so working ahead cannot strand it (the Phase-1 technical audit, C-01).
title: Iron From The Moor
summary: Durn Skell will make a smith of you, if the iron comes out of Cairnwold's own crag and the haft comes off Cairnwold's own ash.
track: side
giver_ref: npc.cairnwold.durn_skell
entry_objective: o_speak
objectives:
  - id: o_speak
    type: talk_to
    description: Speak to Durn at the forge.
    params: { npc_ref: npc.cairnwold.durn_skell, nodes: [lesson] }
    next: [o_seam]
  - id: o_seam
    type: visit_location
    description: Reach the seam in the south crags.
    params: { location_ref: location.cairnwold.iron_seam }
    next: [o_ore]
  - id: o_ore
    type: acquire_item
    description: Break raw iron ore out of the seam.
    params: { item_ref: item.material.iron_ore, or_item_refs: [item.material.iron_ingot, item.weapon.march_spear], count: 1 }
    next: [o_home]
  - id: o_home
    type: explore_location
    description: Bring it back to the village.
    params: { location_ref: location.cairnwold.village, within_m: 30 }
    next: [o_billet]
  - id: o_billet
    type: acquire_item
    description: Smelt an iron billet at the forge hearth.
    params: { item_ref: item.material.iron_ingot, or_item_refs: [item.weapon.march_spear], count: 1 }
    next: [o_ash]
  - id: o_ash
    type: visit_location
    description: Cut an ash haft at the stand north of the basin.
    params: { location_ref: location.cairnwold.ash_stand }
    next: [o_spear]
  - id: o_spear
    type: acquire_item
    description: Forge a march spear at the anvil.
    params: { item_ref: item.weapon.march_spear, count: 1 }
    next: [o_show]
  - id: o_show
    type: talk_to
    description: Show Durn the finished spear.
    params: { npc_ref: npc.cairnwold.durn_skell, nodes: [praised, judged] }
rewards:
  - { kind: xp, amount: 120 }
  - { kind: currency, amount: 25 }
  - { kind: relationship, npc_ref: npc.cairnwold.durn_skell, dimension: respect, amount: 5 }
