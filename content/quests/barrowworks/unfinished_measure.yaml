id: quest.barrowworks.unfinished_measure
kind: quest
schema: 1
display_key: quest.barrowworks.unfinished_measure.name
tags: [quest]
notes: "The Barrowworks quest of the frozen M8 design (2026-09-26), ported stage for stage from canon_readonly/implemented/content/quests/barrowworks/unfinished_measure.yaml (P4). Nothing here assumes an order the fiction does not need: a reading done before the quest is offered counts, and so does a wedge made ahead of being asked, because the readings are world flags a cell holds and the craft step reads the durable production record rather than a counter that only runs while the quest is watching (M8 S-34, P8A). The choice is the design's two endings - preserve or dismantle the headworks (M8-D2 option A) - and either completes the quest: neither is a failure. K1 and K2 are the required readings; K3 is the optional one and no objective asks for it. The combat stage is the Ring Custodian, whose defeat is read as a durable fact rather than as a kill count. NOT BALANCE-APPROVED: every number below is PROVISIONAL and exists so the graph can be exercised. ONE PORT CHANGE: the source names the Custodian fact 'fact:defeat.creature.boss.ring_custodian', and DefinitionId admits no colon - its pattern is ^[a-z0-9]+(\\.[a-z0-9_]*[a-z_][a-z0-9_]*)+(\\.[0-9]{2})?$ and no id in the content uses one. It is world.barrowworks.ring_custodian_defeated, same meaning, and it stays a durable flag rather than a kill_creature objective so the design's order-independence survives the rename."
title: "The Unfinished Measure"
summary: "Under the Ashen Hollow hill, a service ring of thirteen rooms was built to gauge something and never finished the job. The readings are still on the walls. Kera Voss wants to know what they measure - and what she should do about the machine that measures it."
giver_ref: npc.ashen_hollow.kera_voss
entry_objective: o_offer
objectives:
  # ── research ────────────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: o_offer
    type: talk_to
    description: Ask Kera Voss about the sealed service ring under the hill.
    params: { npc_ref: npc.ashen_hollow.kera_voss, nodes: [barrowworks, barrowworks_again] }
    next: [o_read_notice, o_reach]
  # The one reading the design puts in the first room a body walks into, so it can be satisfied by walking in.
  - id: o_read_notice
    type: world_state
    description: Read the withdrawal notice in the intake hall.
    params: { flag_ref: world.barrowworks.withdrawal_notice_read, location_ref: location.barrowworks.intake_hall, value: 1 }
    next: [o_read_fitting, o_read_diagram]
  # ── locate ──────────────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: o_reach
    type: visit_location
    description: Find the way into the service ring.
    params: { location_ref: location.barrowworks.intake_hall }
    next: [o_read_fitting, o_read_diagram]
  # ── the two required readings (K1 is above; K2 and P are these) ─────────────────────────────────────────────────────────
  - id: o_read_fitting
    type: world_state
    description: Read the fitting note in the gauge archive.
    params: { flag_ref: world.barrowworks.fitting_note_read, location_ref: location.barrowworks.gauge_archive, value: 1 }
    next: [o_custodian]
  - id: o_read_diagram
    type: world_state
    description: Read the diagram rack in the gauge archive.
    params: { flag_ref: world.barrowworks.diagram_rack_read, location_ref: location.barrowworks.gauge_archive, value: 1 }
    next: [o_custodian]
  # ── combat: the Ring Custodian ──────────────────────────────────────────────────────────────────────────────────────────
  # Read as a durable fact rather than as a kill count, so a defeat that happened before the quest was offered still counts
  # and the quest cannot be stranded by doing things out of order. The creature and its fight are M8 I4's: what the quest
  # depends on is the fact's name, and the encounter that owns the thing is what writes it.
  #
  # It is the join of the two readings, because they are what a character has to have understood before the court means
  # anything - and a join is where the objectives it waits on lead to.
  - id: o_custodian
    type: world_state
    description: Put down the Ring Custodian.
    params: { flag_ref: world.barrowworks.ring_custodian_defeated, location_ref: location.barrowworks.service_vestibule, value: 1 }
    all_of: [o_read_fitting, o_read_diagram]
    next: [o_haft]
  # ── acquire ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: o_haft
    type: acquire_item
    description: Take a length of ash haft out of the ring - the archive's stand, or the crate beside it.
    params: { item_ref: item.material.ash_haft, count: 1 }
    next: [o_wedge]
  # ── craft ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
  # The join: a wedge is worth fitting once the readings say what it fits, so it waits on both of them as well as on what a
  # character came back out of the ring holding.
  - id: o_wedge
    type: craft_item
    description: Fit a wedge to the measure at the waystation's anvil.
    params: { item_ref: item.tool.fitting_wedge, count: 1 }
    all_of: [o_haft]
    next: [o_open]
  # ── the door the measuring court is behind ──────────────────────────────────────────────────────────────────────────────
  - id: o_open
    type: world_state
    description: Open the headworks door beyond the measuring court.
    params: { flag_ref: world.barrowworks.gate_g3_open, location_ref: location.barrowworks.headworks, value: 1 }
    next: [o_measure]
  # ── choice ──────────────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: o_measure
    type: explore_location
    description: See what the headworks measures.
    params: { location_ref: location.barrowworks.headworks, within_m: 10 }
    next: [o_preserve, o_dismantle]
  - id: o_preserve
    type: world_state
    description: Tell Kera to leave the mechanism whole.
    params: { flag_ref: world.barrowworks.headworks_preserved, location_ref: location.barrowworks.headworks, value: 1 }
    next: [o_done]
  - id: o_dismantle
    type: world_state
    description: Tell Kera to break the mechanism up for what it is made of.
    params: { flag_ref: world.barrowworks.headworks_dismantled, location_ref: location.barrowworks.headworks, value: 1 }
    next: [o_done]
  # ── close, and the optional report ──────────────────────────────────────────────────────────────────────────────────────
  # Closing waits on whichever ending was answered, so telling Kera what the ring was, and what to do with it, both happen
  # before the quest is complete.
  - id: o_done
    type: talk_to
    description: Tell Kera what the ring turned out to be, and what to do with it.
    params: { npc_ref: npc.ashen_hollow.kera_voss, nodes: [barrowworks_told] }
    all_of: [o_preserve, o_dismantle]
    next: [o_report]
  # The optional report: the design's beat for a character who went further than they were asked to. It asks for no fight and
  # no new thing, so a player who never finds the blind store is never blocked by it - and a player who does is paid for it.
  - id: o_report
    type: world_state
    description: Report what the blind store was for.
    params: { flag_ref: world.barrowworks.blind_store_read, location_ref: location.barrowworks.blind_store, value: 1 }
# PROVISIONAL - NOT BALANCE-APPROVED. The graph is what is being proved here; these numbers exist to be exercised.
rewards:
  - { kind: xp, amount: 200 }
  - { kind: currency, amount: 40 }
  - { kind: item, item_ref: item.tool.fitting_wedge, count: 1 }
  - { kind: relationship, npc_ref: npc.ashen_hollow.kera_voss, dimension: respect, amount: 8 }
