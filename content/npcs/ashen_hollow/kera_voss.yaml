id: npc.ashen_hollow.kera_voss
kind: npc
sex: f
schema: 1
display_key: npc.ashen_hollow.kera_voss.name
tags: [npc]
name: Kera Voss
notes: The smith (content bible §9) - first crafting quest, equipment, the resource-to-object loop. Works the forge shed; teaches the two recipes and trades. PROTOTYPE.md's smith.
role: craftsperson
services: [trade, repair]
merchant_ref: merchant.ashen_hollow.kera_voss
dialogue_ref: dialogue.ashen_hollow.kera_voss
unique: true
people_ref: people.kal   # content bible §9
faction_ref: faction.ashen_hollow.wayhold
# What she teaches (WP9, C10): the forge and the fletching bench by her own lines, free, as she always has; the blade's technique to
# anyone familiar with a blade, for a fee into her purse. Fees are provisional.
teaches:
  - { kind: recipe, recipe_ref: recipe.smithing.torch, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.cooking.torch, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.cooking.boil_water, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.cooking.herb_tea, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.herbal.salve_minor_boiled, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.smithing.iron_billet, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.smithing.march_spear, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.fletching.arrows, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.fletching.hunting_bow, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.fletching.hunting_bow_silk, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.smithing.lamework_jack, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.smithing.lame_coif, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.smithing.lame_sabatons, by_dialogue: true }
  # The Barrowworks wedge: only where the ring can be reached (its portal seeds the flag), as Kera's ring replies are.
  - kind: recipe
    recipe_ref: recipe.smithing.fitting_wedge
    by_dialogue: true
    requires: { flag: { flag_ref: world.barrowworks.ring_accessible, location_ref: location.barrowworks.intake_hall, min: 1 } }
  - kind: technique
    ability_ref: ability.blade.power_strike
    fee: 25
    requires: { skill: { skill_ref: skill.one_hand_blade, band: familiar } }
  - kind: technique
    ability_ref: ability.blade.guarded_cut
    fee: 20
    requires: { skill: { skill_ref: skill.one_hand_blade, band: untrained } }
  - kind: technique
    ability_ref: ability.blade.hamstring
    fee: 20
    requires: { skill: { skill_ref: skill.one_hand_blade, band: proficient } }
  - kind: technique
    ability_ref: ability.bow.steady_aim
    fee: 20
    requires: { skill: { skill_ref: skill.bow, band: untrained } }
  - kind: technique
    ability_ref: ability.bow.parting_shot
    fee: 20
    requires: { skill: { skill_ref: skill.bow, band: proficient } }
