id: npc.ashen_hollow.tavar_orr
kind: npc
sex: m
schema: 1
display_key: npc.ashen_hollow.tavar_orr.name
tags: [npc]
name: Tavar Orr
notes: Guide and the first companion (content bible §9, §17), Orenth - Sel's survey guide, caught in the Foldscar until its heart is steadied. The perspective of someone the Other has touched, kept plain.
role: villager
dialogue_ref: dialogue.ashen_hollow.tavar_orr
unique: true
people_ref: people.orenth   # content bible §9
# His look (F1 Gate C): a walker in his thirties (NPC_PERSONALITY_BIBLE.md:257), gaunt, stubbled, in the leather jerkin his own notes
# give him. An Orenth's phase scars are the old's (RACES.md:298-305), so nothing of them here.
appearance:
  stature_cm: 180
  face: face.m.caucasian_presets.caucasian_1
  hair: hair.short.short_combed
  facial_hair: facehair.other.stubble_long
  outfit: outfit.casual.smart_casual
  footwear: footwear.outdoor.garden_boot
  sliders:
    face.age: 34
    body.skinny: 300
    face.cheek_zygomatic_proc: 220     # the gaunt walker
    face.eye_depth: -180
    look.trouser_colour: 0             # Brown: the leather he wears
# He can join the character (M6): a guide's spear, a traveller's health, a leather jerkin.
companion:
  health: 100
  weapon_item_ref: item.weapon.march_spear
  armor: { head: 0, torso: 3, limbs: 1 }
# What he teaches (WP9, C10): the bow's technique to anyone familiar with a bow, for a fee. Fees are provisional.
teaches:
  - kind: technique
    ability_ref: ability.bow.aimed_shot
    fee: 25
    requires: { skill: { skill_ref: skill.bow, band: familiar } }
# What he values (WP15b; provisional, and only what his established part already shows - Sel's guide, who keeps the Orenth ledger of what each
# crossing cost): helping the survey he guides, and putting down what should already have stayed dead.
values:
  - deed: delivered
    npc_ref: npc.ashen_hollow.sel_arien
    changes: { trust: 2, respect: 1 }
    remark: "Sel will write that down. So will I - on the good side of the ledger. It's the short side."
  - deed: killed
    tag: undead
    changes: { respect: 2 }
    remark: "That one was dead already. Now it agrees with us."
