id: npc.cairnwold.durn_skell
kind: npc
sex: m
schema: 1
display_key: npc.cairnwold.durn_skell.name
tags: [npc]
name: Durn Skell
notes: Cairnwold's smith. Keeps the forge at the village smithy - the region's station.forge_hearth at (84, 84) and station.forge_anvil at (80.5, 80.5) - and works the iron that comes out of the south crag seam. Teaches the two recipes and trades. Gives Iron From The Moor.
role: craftsperson
services: [trade, repair]
merchant_ref: merchant.cairnwold.durn_skell
dialogue_ref: dialogue.cairnwold.durn_skell
unique: true
people_ref: people.veth   # Veth, by the bible's Cairnwold cast list (NPC_PERSONALITY_BIBLE.md:88-91)
# His look (F1 Gate C): in his fifties (NPC_PERSONALITY_BIBLE.md:327), thick through the arms and shoulders. The bald head is the art
# team's, not canon, and `look.native_bald` is what keeps the preset's own groom off it.
appearance:
  stature_cm: 178
  face: face.m.caucasian_presets.caucasian_3
  facial_hair: facehair.other.stubble_short
  outfit: outfit.extra_outfits_pack.pirate
  footwear: footwear.outdoor.garden_boot
  sliders:
    face.age: 52
    body.muscular: 620
    body.shoulder_muscles: 400      # broad across the shoulders, which is as far as the offered dials reach
    face.browridge_center_size: 320
    look.native_bald: 1
    look.shirt_colour: 3            # Ochre
    look.trouser_colour: 1          # Charcoal
# What he teaches (WP9, C10): the forge and hides by his own lines, free, as he always has; the polearm's technique to anyone familiar
# with a spear, for a fee into his purse. Fees are provisional.
teaches:
  - { kind: recipe, recipe_ref: recipe.smithing.iron_billet, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.smithing.march_spear, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.leatherwork.hide_cap, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.leatherwork.hide_vest, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.leatherwork.hide_vest_barrowback, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.leatherwork.hide_cap_fellhorn, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.outfitting.satchel, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.outfitting.pack_large, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.outfitting.reagent_satchel, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.outfitting.quiver, by_dialogue: true }
  - { kind: recipe, recipe_ref: recipe.outfitting.herb_pouch, by_dialogue: true }
  - kind: technique
    ability_ref: ability.polearm.long_thrust
    fee: 25
    requires: { skill: { skill_ref: skill.polearm, band: familiar } }
