name: Durn Skell
notes: Cairnwold's smith. Keeps the forge at the village smithy - the region's station.forge_hearth at (84, 84) and station.forge_anvil at (80.5, 80.5) - and works the iron that comes out of the south crag seam. Teaches the two recipes and trades. Gives Iron From The Moor.
role: craftsperson
services: [trade, repair]
merchant_ref: merchant.cairnwold.durn_skell
