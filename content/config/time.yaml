id: config.time
kind: config
schema: 1
display_key: config.time.name
tags: [config]
# Game-time units (DATA_MODEL.md §4.19). Every duration elsewhere is expressed in them.
ticks_per_second: 20              # the fixed domain tick (SYSTEMS.md §1)
seconds_per_game_minute: 2.0      # 1 game minute = 2 real seconds
game_minutes_per_hour: 60
game_hours_per_day: 24            # => one game day = 1440 game minutes = 2880 real seconds = 57600 ticks
clock_at_world_start_h: 7.5       # what the world clock reads at tick 0: early morning (owner, 2026-10-06 and 2026-10-16); the sky and the creatures' hours both read it
offline_cap_game_days: 183        # the most of an absence the world catches up on login: one Reckoning (DN1, owner 2026-10-17); a longer absence counts as exactly this
login_grace_seconds: 10           # after a login, creatures neither see nor hear the character for this long (WP11, SYSTEMS_COMPLETENESS_PLAN §2.12)
notes: Game-time units. AG-2 counts kills per world_time day in these units, never per wall-clock day.
