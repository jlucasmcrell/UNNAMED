id: config.base_speeds
kind: config
schema: 1
display_key: config.base_speeds.name
tags: [config]
notes: Movement tuning (PROTOTYPE.md §4.4). Placeholder values until playtest.
base_m_s: 3.2            # PROTOTYPE.md §3: about 90 s to walk the 283 m diagonal of the hollow
walk_percent: 50         # the walk toggle
sprint_percent: 160      # spends stamina (config.damage_constants); an empty pool runs
body_radius_m: 0.35      # the body's footprint for collision
interact_reach_m: 1.6    # measured from the body, never from the camera (CAMERA_PERSPECTIVE_AND_PRESENTATION.md §6)
# The jump and the crouch (the owner's M6 playtest), tuned on the hollow's own geometry (JumpAndCrouchTests): from a run, a
# jump clears the fallen timber (0.8 m tall, 0.8 m through) over a window of take-offs, and it never clears anything as tall
# as the smithy fence (1.2 m) - nor the cart, a wall, a door or the fold. Nothing is stood on.
jump_apex_m: 1.15        # how high the feet go: under the fence's 1.2 m
jump_rise_s: 0.42        # to the top of the arc; the fall takes as long
jump_tuck_radius_m: 0.2  # in the air, a structure lower than the apex meets the tucked legs, not the shoulders
step_up_m: 0.4           # a structure top this far above the feet is walked onto; higher ones are jumped onto (owner finding 50)
mantle_reach_m: 1.6      # a jump that meets a ledge whose top is this far above the take-off feet climbs onto it
climbable_prefixes: [cw_boulder_, cw_crag_, rock_, den_rock_, ladder_]   # what is stepped onto, stood on and climbed: rock and ladders, never fences, carts, walls or doors (the climbable_prefixes rule is how a climb finds its face - Kinematics.ClimbFaceAt)
climb_percent: 30        # of base_m_s: how fast the feet take a climbable face. Slower than the walk on purpose - the climb loop covers two rungs (about 0.6 m) in its 0.8 s, so 0.96 m/s is the clip's own cadence
stand_height_m: 1.8      # what an overhang is measured against
crouch_height_m: 1.15
crouch_percent: 50       # of base_m_s, whatever the gait
# The scramble (D21, HOOK.TRAV.SCRAMBLE_SLOPE): the ground's own grade, rise over run, in per cent. Up to the walkable grade a slope costs
# nothing; above it the body is scrambling, at scramble_percent of its own pace - so a steep bank is climbed slowly and crested, and no
# terrain is ever refused. 55 % is about 29 degrees, 100 % about 45.
walkable_grade_percent: 55
scramble_percent: 45     # of the body's own pace, on ground steeper than the walkable grade
# The grapple (D21, HOOK.TRAV.GRAPPLE): which structures a line may be thrown to, how high above the feet an anchor is worth a throw, and how far
# the line carries. An anchor's own top is the hook point; the pull puts the body on the surface the anchor stands on.
grapple_prefixes: [grapple_]   # an anchor id starts one of these, and a body with one in reach can be pulled up to it
grapple_reach_min_m: 2.0       # above a mantle's reach of the feet: below this it is a step, not a throw
grapple_reach_max_m: 10.0      # the highest hook and the longest throw, measured from the body both ways
