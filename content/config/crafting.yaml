id: config.crafting
kind: config
schema: 1
display_key: config.crafting.name
tags: [config]
notes: How crafting decides quality (M3f; DATA_MODEL.md quality_curve). The weakest material caps the work, then the smith's hand moves it a step - up more often the further skill is past the recipe's complexity, down more often the further the recipe is past the skill. No rank gates a recipe.
quality:
  fine_percent_at_complexity: 10   # at the recipe's complexity, one piece in ten comes out a step finer
  fine_percent_per_point: 2        # +2% per point of skill past the complexity
  fine_percent_max: 60
  crude_percent_per_point: 3       # +3% per point of complexity past the skill
  crude_percent_max: 40
  weapon_damage_per_step: 2        # a fine weapon hits 2 harder, a crude one 2 softer
  armor_per_step: 1                # a fine piece of armour gives 1 more, a crude one 1 less (WP3a)
# Masterwork (WP3a; C12:186-205): craft-only. A fine roll of a recipe flagged masterwork_possible, worked at a station of at least this
# grade, comes out masterwork this share of the time - two steps past standard, with the maker's mark. No drop is ever masterwork.
masterwork:
  percent_of_fine: 25
  station_grade_min: 1
# The experiment set (WP3a; C12:263-302): how many of a station kind's candidate recipes each station of that kind holds, seeded from
# the world and the station, so a reload changes nothing.
experiments:
  workbench: 2
  forge: 2   # the torch and the assembled sword (D21 G3) are both found at a forge
  tanning_rack: 1
# Drop quality by the creature's level (WP3a; DCP:662): from each level up, this share of a body's stacks is crude and this share fine.
# Never masterwork.
drop_quality:
  - { level_min: 1, crude_percent: 30, fine_percent: 0 }
  - { level_min: 3, crude_percent: 20, fine_percent: 10 }
  - { level_min: 5, crude_percent: 10, fine_percent: 20 }

# A fraction of authored recipe materials (or one repair-supply unit), scaled by skill and condition.
salvage:
  base_percent: 25
  percent_per_skill: 2
  max_percent: 75
  broken_condition_percent: 20
  hint_percent: 5

# Reforging (queue #5; canon 13 §6.2): a weapon or piece of armour reworked a tier up at its own repair station, with its repair skill and
# repair material. Each tier asks skill_per_tier more skill than the piece's repair least, spends material_per_tier more material than the
# tier before, and adds its damage or armour. Nothing is rolled and the piece is never at risk (canon 12 §5.4); a working on it loses a
# point of stability, because reforging the core tests the pattern (canon 13 §6.2).
upgrade:
  max_tier: 3
  skill_per_tier: 10
  material_per_tier: 2
  damage_per_tier: 1
  armor_per_tier: 1

# Enchanting (queue #5; crafting_webs/enchanting_runecraft, SKILLS_AND_TECHNIQUES §Enchanting): a working cut into a weapon or a piece of
# armour at an enchanting bench. Rune cutting (pattern only) is the 0-14 band's practice; anchor seating opens at 15. A working's stability is
# its own, +1 a quality step past standard (-1 crude), +1 for every skill_per_stability levels past its least; use drifts it a point every
# wear_per_stability points of wear, and at none it fades and the piece is plain again. Cutting a new working cuts the old one away.
enchanting:
  station: enchanting_bench
  skill_ref: skill.enchanting
  wear_per_stability: 20
  skill_per_stability: 15
  workings:
    - { id: working.keen_edge, name: Keen Edge, target: weapon, skill_min: 0, item_ref: item.trinket.wolf_fang, count: 1, stability: 3, damage: 1 }
    - { id: working.warding_weave, name: Warding Weave, target: armor, skill_min: 0, item_ref: item.material.spider_silk, count: 2, stability: 3, armor: 1 }
    - { id: working.ember_anchor, name: Ember Anchor, target: weapon, skill_min: 15, item_ref: item.material.cinder_sac, count: 2, stability: 4, damage: 1, damage_type: fire }
    - { id: working.anchored_ward, name: Anchored Ward, target: armor, skill_min: 15, item_ref: item.material.spider_silk, count: 4, stability: 4, armor: 2 }
