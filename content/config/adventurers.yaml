id: config.adventurers
kind: config
schema: 1
display_key: config.adventurers.name
tags: [config]
notes: "NPC adventurers (WP13, SYSTEMS_COMPLETENESS_PLAN Â§2.13; canon NPC_SIMULATION 'Adventurer Agent'). Each settlement keeps target_per_settlement adventurers: a target refilled by arrivals 3-7 game days after a death or a retirement, never a cap (DN5: 4 in each town, 8 in region 1). They level on the character's own curve and skill rules, own real gear (the ladder, bought from the market or commissioned from the smith out of market stock), hunt the grounds listed, take competitive bounties (first claimant wins), sell what they bring back, travel the Old East Road, and retire past a wealth or an age. Off-screen outcomes are resolved by the fixed table below, never by a simulated fight (DN2 canon amendment): the row is the margin of their power (level, ladder pieces, companions) over the ground's danger (creature level, plus one for each more that comes at once). Names come from the people's Suggest list (WP2). Every number here is provisional, for the owner to tune."
target_per_settlement: 4
starting_level: [1, 5]
starting_coin: [10, 40]
risk_percent: [20, 80]        # how far below an even margin each will go: 25 points of risk a step
arrival_days: [3, 7]          # DN4: a slot fills this many game days after its holder left
injury_days: [2, 5]
power_per_gear: 1
power_per_companion: 2
sell_permille: 500            # of an item's base value: what the town pays them
buy_permille: 1000            # what they pay for a piece or a supply
commission_permille: 1500     # a commission costs its recipe's inputs at this
supply_item_ref: item.consumable.salve_minor   # one bought before each day out, and used when hurt
field_skill_ref: skill.survival
hunt_xp_permille: 1000        # a kill is worth this much of the creature's xp_value
carry_before_travel: 4        # items the market here will not take before they carry them to the other town
retire: { coin: 600, days: 180 }
lfg: { percent: 50, depart_hour: 8, lead_minutes: 30 }   # SettingOut is posted at least 20 game minutes ahead (the WP12 contract)
# The fixed rule table (DN2): from this margin up to the next row's, the chance in percent of death, injury and success. The rest of 100 is a
# day that came to nothing.
outcomes:
  - { margin_at_least: -99, death: 15, injury: 40, success: 20 }
  - { margin_at_least: -3, death: 8, injury: 30, success: 40 }
  - { margin_at_least: -1, death: 3, injury: 20, success: 60 }
  - { margin_at_least: 1, death: 1, injury: 10, success: 80 }
  - { margin_at_least: 4, death: 0, injury: 4, success: 92 }
# Worked up in order: a piece is bought or commissioned once the one before it is owned, a later piece for a slot replacing an earlier one.
gear_ladder:
  - item.weapon.rusted_sword
  - item.armor.hide_cap
  - item.armor.hide_vest
  - item.armor.hide_boots
  - item.armor.wool_trousers
  - item.armor.cloak
  - item.weapon.march_spear
# The body a hired adventurer fights with before their gear: their gear and level are kept when hired (WP15a, Â§2.15).
hire: { health: 90, weapon_item_ref: item.weapon.rusted_sword, roles: [guard, porter] }
settlements:
  - id: ashen_hollow
    location_ref: location.outpost        # where they lodge, by name
    market_ref: market.ashen_hollow
    smith_merchant_ref: merchant.ashen_hollow.kera_voss
    lodge: { position_m: [460, 752], facing_deg: 0 }   # off the outpost's ways through: the row stood across the path from the spawn to the forge
    target: 1                           # C2: one road traveller; seven residents have their own rooms.
    # Spec 15 (owner finding 15): Renn Vale's waystation IS the inn, and these are its places - measured off the props the region already
    # places (beds 01-03, tables 01-02, stools 01-03, the hearth, the east door) so a body sits ON a stool and sleeps IN a bed rather than
    # beside one. Hours are the game clock; the walk windows are how long they are seen walking to and from the gate.
    inn:
      door: { position_m: [450.6, 728.0], facing_deg: 270 }     # inside the east doorway, facing back into the room
      keeper: { position_m: [441.0, 725.3], facing_deg: 90 }    # the counter end of table 01, facing the room and the door
      board: { position_m: [449.6, 727.0], facing_deg: 90 }     # at the notice board, west of the door
      hearth: { position_m: [447.2, 728.6], facing_deg: 350 }   # warming at the fire in the north-east corner
      seats:
        - { position_m: [440.7, 728.1], facing_deg: 180 } # Guest stool; residents have reserved supper chairs.
      beds:
        - { position_m: [445.0, 719.05], facing_deg: 180 } # Guest cot, facing along its mattress.
      gate: { position_m: [464, 748], facing_deg: 90 }          # where the Old East Road leaves the hamlet
      room_coin: 5                                              # what a bed for the night costs the character, paid to the keeper (spec 15)
      keeper_npc_ref: npc.ashen_hollow.renn_vale                    # the one who keeps the inn, and the only voice that lets its rooms
      # The inn's hours: the game clock, and the walk windows that make the day's leaving and coming back visible. They live under the inn,
      # where the content reads them - authored beside it, they were silently the defaults.
      hours:
        sleep_from: 22              # asleep at their bed from this hour
        breakfast_from: 6           # up and at the tables from this hour
        board_from: 7               # at the notice board from this hour, forming up
        walk_minutes: 20            # seen walking to the gate over this long before they leave at the LFG hour (the world starts at 07:30, so they are still at the board then)
        return_walk_minutes: 30     # and back in from the gate over this long when they return
        return_hours: 9             # out for this many hours: away at 08:00, back at 17:00
    grounds:
      - spawn.hollow.valley_strays
      - spawn.hollow.east_pack
      - spawn.hollow.den_pack
      - spawn.hollow.hares
      - spawn.hollow.charwood_deer
      - spawn.hollow.boar_wallow
      - spawn.hollow.charwood_hound
      - spawn.road.wayside_pack
  - id: cairnwold
    location_ref: location.cairnwold.lodge
    market_ref: market.cairnwold
    smith_merchant_ref: merchant.cairnwold.durn_skell
    lodge: { position_m: [956, 681], facing_deg: 0 }   # south of the cookfire, clear of its eating ring (WP12b's 3.3 m)
    grounds:
      - spawn.cairnwold.moor_strays
      - spawn.cairnwold.moor_hares
      - spawn.cairnwold.birch_deer
      - spawn.cairnwold.birch_boar
      - spawn.cairnwold.gorge_spiders
      - spawn.cairnwold.crag_walker
      - spawn.road.barrow_husks
  # Sedge Gate 4: staffed rest uses the same no-time-skip inn contract.
  - id: sedge_tollpiles
    location_ref: location.sedge_tollpiles
    market_ref: market.sedge_tollpiles
    smith_merchant_ref: merchant.sedge.oren_pin
    lodge: { position_m: [4989, 1082], facing_deg: 180 }
    target: 0
    grounds: []
    inn:
      keeper_npc_ref: npc.sedge.nessa_reed
      room_coin: 5
      door: { position_m: [4991, 1080], facing_deg: 180 }
      keeper: { position_m: [4989, 1080], facing_deg: 180 }
      board: { position_m: [4991, 1082], facing_deg: 180 }
      hearth: { position_m: [4989, 1079], facing_deg: 180 }
      seats: [{ position_m: [4989, 1081], facing_deg: 180 }]
      beds: [[4989, 1077.5]]
      gate: { position_m: [5000, 1110], facing_deg: 0 }
      hours: { sleep_from: 22, breakfast_from: 6, board_from: 7, walk_minutes: 20, return_walk_minutes: 30, return_hours: 9 }
roads:
  - { from: ashen_hollow, to: cairnwold }   # the Old East Road, walked in a day
