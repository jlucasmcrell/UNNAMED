id: config.creature_behaviour
kind: config
schema: 1
display_key: config.creature_behaviour.name
tags: [config]
notes: How creatures perceive and behave (STEALTH_DETECTION_AND_THREAT.md; M3d). Roles are a layer over creature archetypes - each reads its senses the same way and differs in what it does about them.
awareness:                    # STEALTH §3: awareness is not binary - 0 to 100
  suspicious: 30              # stops to look
  sight_per_s_at_range: 40    # seen at the edge of sight: 2.5 s to be sure
  sight_per_s_close: 200      # seen close: half a second
  decay_per_s: 10             # unseen, it fades
  heard_noise: 60             # a sound gives a place to look, never the target itself
  heard_call: 80              # a packmate's howl brings it at a run
  search_s: 6                 # how long it searches where the target was last known
noise_m:                      # STEALTH §7: how far each sound carries
  walk: 3
  run: 8
  sprint: 16
  swing: 10
  blow: 20
  call: 45                    # a howl
  kill: 2                     # a body going down where it stood: what a silent kill makes, and all it makes (§7.7)
  impact_flesh: 1.5           # an arrow arriving in flesh, heard at the target (§7.8)
  impact_solid: 4             # a shot arriving in wood, stone or ground, heard where it landed
  shot: 6                     # a weapon that authors no shot_noise_m of its own: a bow's twang at the shooter
  creep: 0.5                  # the deliberate creep gait (§2.6)
  crouch: 1.5                 # crouch-walking, quieter than a walk (§2.6)
  prone: 0.25                 # crawling (§2.6)
corpse: { decay_s: 600, stack_slots: 8 }
# Seeing, as physics rather than a stealth meter (STEALTH §2.1-§2.6). Every number here is a condition the player can read and change:
# the light they stand in, what they are behind, and how tall they are. The dark shortens a sight line; it never makes anyone invisible.
light:
  bands: { dark: 150, dim: 400, lit: 750 }              # per-mille ceilings: at or below is that band
  sight: { dark: 0.35, dim: 0.6, lit: 1.0, bright: 1.15, night_sight_dark: 0.9 }   # what the band multiplies a sight line by
  ambient: { day: 800, night: 90, interior: 120 }        # by the sky clock outside, and what a room keeps without a window
  carrier_sight_multiple: 8                              # a held light is seen from this many times its own radius (the Thief rule)
  postures:                                              # eye height, how much harder the posture is to pick out, and its own height
    standing: { eye_m: 1.8, sight_gain: 1.0, height_m: 1.8 }
    crouched: { eye_m: 1.1, sight_gain: 0.7, height_m: 1.1 }
    prone: { eye_m: 0.5, sight_gain: 0.35, height_m: 0.5 }
# When roles that keep hours rest, by the world clock (config.time's clock_at_world_start_h at tick 0, the sky's clock too). Note 23: the sky's sun
# is the midsummer one (a92fcd7e), so real dark runs 20:30-03:30 with twilight 19:45-20:30 and 03:30-04:15. Night starts at dusk (19:45) and day
# at the end of dawn (04:15), so a night walker is out for the whole dark and every day creature is in its bed by dusk instead of prowling at 05:00.
hours: { night_from_h: 19.75, day_from_h: 4.25 }
roles:
  den_alpha: { unaware: hold, territory_m: 18, calls_for_help: true, answers_calls: true, call_m: 70, focus_weakest: true, hunts_handler: true }   # the den's leader: howls wider than its kind, so the packs beyond its own come (owner finding 29), and reads the fight it is in
  den_guardian: { unaware: hold, territory_m: 16, calls_for_help: true, answers_calls: true }   # holds the den mouth and howls
  pack_hunter: { unaware: hold, answers_calls: true, flank_m: 3, focus_weakest: true, hunts_handler: true }   # comes to a howl, closes from the side, finishes the hurt one and goes for the handler behind the animal (spec 43 ruling 5)
  sleeper: { unaware: sleep, sleep_hearing_percent: 40, answers_calls: true }                   # blind until woken; a sprint wakes it, a walk may not
  stray: { unaware: wander, wander_m: 8, keep_distance_m: 7, strike_within_m: 3, flee_below_percent: 30 }   # wary loner that runs when badly hurt
  roamer: { unaware: patrol, answers_calls: true }                                                # walks its spawner's route
  hunter: { unaware: wander, wander_m: 10 }                                                       # ranges its patch alone
  sentinel: { unaware: hold, territory_m: 10 }                                                    # guards its post and no further
  territorial: { unaware: wander, wander_m: 5, territory_m: 15 }                                  # roots about its wallow, defends it
  ambusher: { unaware: hold, territory_m: 14, pounce_on_noise: true }                             # waits in its lair; goes for what it feels
  wildlife: { unaware: wander, wander_m: 6, peaceful: true, flee_within_m: 12, flee_below_percent: 99, rests: night }   # canon's peaceful wildlife: drifts about, bolts from people and wounds, beds down at night
  skittish: { unaware: wander, wander_m: 10, peaceful: true, flee_within_m: 20, flee_below_percent: 99, rests: night }  # deer: a wide drift, gone at twenty metres - a hunter crouches
  yard_fowl: { unaware: wander, wander_m: 4, peaceful: true, flee_within_m: 3, flee_below_percent: 99, rests: night }   # hens: scratch about the yard, scatter underfoot, roost at dark
  herd: { unaware: wander, wander_m: 18, peaceful: true, calls_for_help: true, answers_calls: true, rests: night }        # the great grazers (E4): ignore you, and all turn on whoever strikes one
  herd_shy: { unaware: wander, wander_m: 14, peaceful: true, calls_for_help: true, answers_calls: true, flee_below_percent: 40, rests: night }   # fellhorns: stand with the herd, break when badly hurt
  night_walker: { unaware: patrol, rests: day }                                                   # lies still by day and walks its line at night (Durn's crags)
  prowler: { unaware: wander, wander_m: 14, rests: day }                                          # lies up by day, ranges its ground by night
