id: config.party
kind: config
schema: 1
display_key: config.party.name
tags: [config]
notes: The party (SYSTEMS_COMPLETENESS_PLAN §2.15, WP15a). The character travels with up to max_members others - companions, hirelings and allies share the slots, and a combat animal or a summon would take one too (DN11). A hireling is paid each day's wage in advance at midnight from the character's purse; with too little in it they wait grace_days, then the contract lapses and they go home. Wages are per role (DN11's first proposal, 4-8 coin a day, for the owner to tune). A named companion who falls is gravely wounded and recovers at home for grave_wound_days; a hireling who falls dies, and is told so when hired (DN9). Every number here is provisional.
max_members: 3
grace_days: 1
grave_wound_days_min: 2
grave_wound_days_max: 4
contract_days_min: 1
contract_days_max: 30
roles:
  guard:    { wage_per_day: 8, stance: aggressive }                       # fights: the companion behaviour
  porter:   { wage_per_day: 4, carry_bonus_kg: 30, stance: passive }      # adds to what the character carries while following
  gatherer: { wage_per_day: 5, yields_per_day: 3, stance: passive }       # harvests their node each day, delivered to the character
  crafter:  { wage_per_day: 7, crafts_per_day: 2, stance: passive }       # works a recipe at a station from what they were handed
# How the party comes to go along with the character, or not (WP15b; canon EXT/COMPANIONS :38-58). No single approval score: loyalty grows a
# point for each midnight a companion spends on their feet in the party and for each wage a hireling is paid, and falls for each wage owed;
# a deed that touches a member's values (their npc file) moves the dimensions it names. Past any one bound a member hesitates (says so, then
# does it), refuses what they are asked, or leaves. Every number is provisional, for the owner to tune.
approval:
  loyalty_per_day: 1
  loyalty_wage_paid: 1
  loyalty_wage_unpaid: -5
  hesitate:
    - { dimension: loyalty, below: -20 }
    - { dimension: grudge, above: 40 }
    - { dimension: fear, above: 60 }
  refuse:
    - { dimension: loyalty, below: -50 }
    - { dimension: grudge, above: 70 }
  leave:
    - { dimension: loyalty, below: -80 }
    - { dimension: grudge, above: 90 }
# Party banter (WP15b): every every_s, a member following on their feet with a line to say says one, chance_percent of the time; after a
# line or a value's remark the party keeps quiet for quiet_s.
banter: { every_s: 120, chance_percent: 35, quiet_s: 45 }
