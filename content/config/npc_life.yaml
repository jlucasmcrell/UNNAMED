id: config.npc_life
kind: config
schema: 1
display_key: config.npc_life.name
tags: [config]
notes: "NPC life (WP12, SYSTEMS_COMPLETENESS_PLAN §2.13). Owner, 2026-10-17: fixed daily schedules, no needs simulation, no meals or visits; each routine works its work hours, sleeps at home at night, and spends the rest at home or at the spots its schedule names. Merchants trade 06:00-20:00 (the v1 D7 rule, kept). A role slot left empty is filled by an arrival 3-7 game days later (DN4, provisional). Every value here is a provisional tuning number; nothing here caps how many NPCs there are."
night_hours: [22, 6]         # asleep at home from the first hour to the second, unless the schedule says otherwise
trading_hours: ["06:00", "20:00"]
arrival_days: [3, 7]         # DN4: a vacancy fills this many game days after its resident left, drawn per vacancy
# Town roles (WP12b): what a routine's `roles` may name. A role hires out as the hireling roles listed (config.party's), and talks in
# ambient chatter as the speaker type given (content/chatter/_schema.yaml). Whether someone can be hired is derived, never authored:
# a vendor or a quest giver never is, whatever else they are; anyone else is when a role of theirs hires out and they are about their
# own life (living, in town, not injured, not already hired, not setting out on a trip).
roles:
  vendor:        { speaker: villager }                    # trades: never hired
  quest_giver:   { speaker: villager }                    # gives quests: never hired
  steward:       { speaker: villager }
  smith:         { speaker: crafter }
  scholar:       { speaker: villager }
  guide:         { speaker: traveller }
  herbalist:     { speaker: villager }
  quartermaster: { speaker: villager }
  cook:          { hires_as: [porter], speaker: villager }
  fletcher:      { hires_as: [crafter], speaker: crafter }
  guard:         { hires_as: [guard], speaker: guard }
  hunter:        { hires_as: [guard, gatherer], speaker: hunter }
  trapper:       { hires_as: [gatherer], speaker: hunter }
  miner:         { hires_as: [gatherer, porter], speaker: labourer }
  woodcutter:    { hires_as: [gatherer, porter], speaker: labourer }
  porter:        { hires_as: [porter], speaker: labourer }
  herder:        { hires_as: [porter], speaker: herder }
  carter:        { hires_as: [porter], speaker: carter }
# The body a hired resident works and fights with (residents have no NPC file of their own): as an NPC's hireling block, without roles.
resident_hireling: { health: 60, weapon_item_ref: item.weapon.march_spear, armor: { torso: 2, limbs: 1 } }
trip_lead_minutes: 40        # an offer to set out together goes up this many game minutes before they leave (20 to 60)
