id: content.audio_gaps
kind: audio_gaps
schema: 1
display_key: content.audio_gaps.name
tags: [audio]
name: Sound ids with no delivered recording
notes: >-
  Every id the game asks for that has no file under the audio root, with what it is. The audio coverage test fails on any id that is
  missing and NOT listed here, so this list can only shrink by recording the sound, and cannot quietly grow. Music is the largest gap:
  no music has been recorded or delivered at all, so every mus.* entry is silence in every build, packaged or not.
