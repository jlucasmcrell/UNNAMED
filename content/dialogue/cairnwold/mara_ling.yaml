id: dialogue.cairnwold.mara_ling
kind: dialogue
schema: 1
display_key: dialogue.cairnwold.mara_ling.name
tags: [dialogue]
notes: Mara Ling at the well. She has one thing on her mind and it is not the well. Asking her what is wrong starts What The Bog Kept, which sends the player to the low north-east ground the region calls the Sinking Moss; three ashbloom handed over (bog_return, the quest-fix agent's repair, ported from canon) is what reaches `told` and closes it. Voice (NPC_PERSONALITY_BIBLE.md) - brisk, tart, and right before anyone listened.
participants: [npc.cairnwold.mara_ling]
root_node: greet
nodes:
  greet:
    text: "Mind the rope, it's wet through - which, if you're wondering, is the only thing round here that is. Mara. You'll be wanting water. Everyone does, and I've less of it every week."
    once: true
    next_if_exhausted: again
    choices:
      - id: bog_return
        text: "I brought three ashbloom."
        conditions:
          - { kind: quest_state, quest_ref: quest.cairnwold.what_the_bog_kept, objective: o_return, is: active }
          - { kind: has_item, item_ref: item.material.herb_ashbloom, count: 3 }
        consequences:
          - { command: transfer_item, item_ref: item.material.herb_ashbloom, count: 3, to: npc }
        next: told
      - id: ask
        text: "Less of it?"
        next: complaint
      - id: leave
        text: "Not today."
  again:
    text: "Still drawing. Still thinner than it was. Still nobody listening - present company possibly excepted."
    choices:
      - id: bog_return
        text: "I brought three ashbloom."
        conditions:
          - { kind: quest_state, quest_ref: quest.cairnwold.what_the_bog_kept, objective: o_return, is: active }
          - { kind: has_item, item_ref: item.material.herb_ashbloom, count: 3 }
        consequences:
          - { command: transfer_item, item_ref: item.material.herb_ashbloom, count: 3, to: npc }
        next: told
      - id: ask
        text: "Tell me about the water."
        conditions: [{ kind: visited, node: complaint, not: true }]
        next: complaint
      - id: ask_again
        text: "About the moss, then."
        conditions:
          - { kind: visited, node: complaint }
          - { kind: quest_state, quest_ref: quest.cairnwold.what_the_bog_kept, is: available }
        consequences:
          - { command: start_quest, quest_ref: quest.cairnwold.what_the_bog_kept }
        next: errand
      - id: herbs
        text: "What grows up on the moor?"
        conditions: [{ kind: visited, node: herbs, not: true }]
        next: herbs
      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_sinking_moss_p2
        text: "Tell me about the sinking moss."
        next: tell_sinking_moss_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_ashbloom_p2
        text: "Tell me about ashbloom."
        next: tell_ashbloom_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_what_the_bog_kept_after_p2
        text: "Tell me about What the Bog Kept."
        next: tell_what_the_bog_kept_after_p2

      - id: leave
        text: "Later."
      - id: story_lights
        text: Can I compare the moss lights with the wet ground?
        next: story_lights
        conditions:
        - kind: quest_state
          quest_ref: quest.cairnwold.what_the_bog_kept
          is: completed
        - kind: quest_state
          quest_ref: quest.main.moss_lights
          is: available
        consequences:
        - command: start_quest
          quest_ref: quest.main.moss_lights
      - id: story_waterline
        text: I followed the wet edge of the Sinking Moss.
        next: story_waterline
        conditions:
        - kind: quest_state
          quest_ref: quest.main.moss_lights
          is: satisfied
          objective: o_moss
  complaint:
    text: "The well's forty feet of good stone and it has never once run low, and this spring it comes up brown at the end of the rope. Everyone says the well. I'd stake my life on that well. It's where the water comes FROM - north-east, the low ground, the moss that never drains. Something up there has changed. And before you ask: no, I'm not walking it alone. I'm stubborn, not daft."
    # NOT `once`. The loader refused this file with QST001 and it was right: this node is where the errand is offered,
    # so a character who heard her out and then walked away would have spent the line and lost the quest for good.
    # She is a woman with one thing on her mind and she will say it again.
    choices:
      - id: offer
        text: "I'll walk it."
        conditions: [{ kind: quest_state, quest_ref: quest.cairnwold.what_the_bog_kept, is: available }]
        consequences:
          - { command: start_quest, quest_ref: quest.cairnwold.what_the_bog_kept }
        next: errand
      - id: later
        text: "Another day."
  errand:
    text: "Good. Up into the moss, and bring me back three ashbloom - the grey leaf; it grows where the ground's wettest. If the bloom's wrong I'll know it from the bloom, and then we'll know how much trouble we're in. Take the long way round the walls. The near way's bog, and I'm not fishing you out."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Three ashbloom."
        next: again
  told:
    text: "She has a root split with her thumbnail before you've let go of it. Root, stem and leaf: all grey, all exactly as they've always been. \"So the plant's well and the water's not.\" She drops the pieces in the bucket and stares at them. \"Which means it's coming from deeper than the plant reaches. Brilliant. I hate being right.\" Then, not looking at you: \"Thank you. Genuinely. Come back when the rope comes up clean.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I will."
        next: again
  herbs:
    text: "\"Ashbloom in the wet, heather on the dry, and bog-cotton wherever you'll sink if you stand still to admire it.\" She ticks them off on wet fingers. \"And up in the moss, some nights, something that glows that I've no name for and don't intend to pick. Tam tried counting the lights. I'd rather know what they are than how many.\""
    choices:
      - id: back
        text: "Sensible."
        next: again
# Said in passing, unprompted, when the character comes near (the bark patch): each line while its conditions hold.
  story_lights:
    text: Everyone says the well. Want to test it? Follow the wet edge in the Sinking Moss. The lights are clearer at night. In daylight, compare
      the damp plant with the dry bank in shade. You don't need me standing beside you to look.
    choices:
    - id: back
      text: I'll take the long bank round.
      next: again
  story_waterline:
    text: There. Wet, light. Dry, dark. Can the whole village manage that much? Berrin's old records are at the lodge. Ask him about them when you
      find him; I'm not doing his remembering as well as the water.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  tell_sinking_moss_p2:
    text: "Mara Ling keeps the well, and she will tell you the trouble is not the well. The water comes from the north-east, from the low ground and the moss that never drains, and this spring it has come up brown at the end of the rope. She asks for three ashbloom from the wettest ground, and splits the first with her thumbnail - root, stem and leaf all grey, all exactly as they have always been. So the plant is well and the water is not, which means it comes from deeper than the plant reaches. She hates being right, and she says so."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.sinking_moss }]
        next: again

  tell_ashbloom_p2:
    text: "Mara Ling keeps the well, and she will split an ashbloom with her thumbnail before you have let go of it. Root, stem and leaf, all grey, all exactly as they have always been, and that is the answer she did not want. So the plant is well and the water is not, she says, which means it comes from deeper than the plant reaches. She drops the pieces in the bucket and hates being right. The bloom told her the trouble is not in the wet ground she can see, and it told her nothing else."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.ashbloom }]
        next: again

  tell_what_the_bog_kept_after_p2:
    text: "Mara Ling drops the split pieces in the bucket and stares at them, and says the plant is well and the water is not, which means it comes from deeper than the plant reaches. Brilliant, she says, and she hates being right. Then she thanks you, genuinely, and tells you to come back when the rope comes up clean. That is the whole of it with her: the ashbloom did not mend the well, it only proved the well was never the part that was broken, and she will keep drawing the brown water and keeping count until it clears."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.what_the_bog_kept_after }]
        next: again

barks:
  - { text: "Brown again. Of course it is." }
  - { text: "Everyone says the well. Everyone's wrong." }
  - { text: "Mind the rope. No - the other rope." }
  - text: "Three ashbloom. Grey leaf. Wettest ground. Off you go."
    conditions: [{ kind: quest_state, quest_ref: quest.cairnwold.what_the_bog_kept, objective: o_return, is: active }]
  - text: "Still brown. Still right. Still hate it."
    conditions: [{ kind: visited, node: told }]
