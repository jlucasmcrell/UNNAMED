id: dialogue.cairnwold.durn_skell
kind: dialogue
schema: 1
display_key: dialogue.cairnwold.durn_skell.name
tags: [dialogue]
notes: Durn Skell, Cairnwold's smith - teaches the forge, trades, and has an opinion of what you make. Asking him to teach starts Iron From The Moor. The seam he names is the region's OWN node at (58, 3); the ash he names is the region's own stand at (75, 114). Voice (NPC_PERSONALITY_BIBLE.md) - four words a day, no contractions, no humour but one line about Kera; he works while you talk, and he is watching Cairnwold's own iron run out.
participants: [npc.cairnwold.durn_skell]
root_node: greet
nodes:
  greet:
    text: "He does not look up from the anvil. \"Durn.\" The hammer comes down twice. \"Anvil is mine. Stand there.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me the forge."
        consequences:
          - { command: teach, refs: [recipe.smithing.iron_billet, recipe.smithing.march_spear] }
          - { command: record_relationship_event, npc_ref: npc.cairnwold.durn_skell, dimension: trust, delta: 5, event: asked_to_learn }
          - { command: start_quest, quest_ref: quest.cairnwold.iron_from_the_moor }
        next: lesson
      - id: trade
        text: "What have you got?"
        consequences: [{ command: open_service, service: trade }]
      - id: leave
        text: "Another time."
  again:
    text: "He glances up, once. \"Back.\""
    choices:
      - id: teach
        text: "Teach me the forge."
        conditions: [{ kind: visited, node: lesson, not: true }]
        consequences:
          - { command: teach, refs: [recipe.smithing.iron_billet, recipe.smithing.march_spear] }
          - { command: record_relationship_event, npc_ref: npc.cairnwold.durn_skell, dimension: trust, delta: 5, event: asked_to_learn }
          - { command: start_quest, quest_ref: quest.cairnwold.iron_from_the_moor }
        next: lesson
      - id: where
        text: "Where is this seam of yours?"
        conditions:
          - { kind: quest_state, quest_ref: quest.cairnwold.iron_from_the_moor, is: active }
          - { kind: quest_state, quest_ref: quest.cairnwold.iron_from_the_moor, objective: o_ore, is: satisfied, not: true }
        next: where
      - id: show_fine
        text: "This spear is my best work. Will you judge it?"
        conditions:
          - { kind: has_item, item_ref: item.weapon.march_spear, quality_min: 1 }
          - { kind: visited, node: praised, not: true }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.cairnwold.durn_skell, dimension: respect, delta: 10, event: showed_fine_work }
        next: praised
      - id: show_spear
        text: "I made a spear. Look at it."
        conditions:
          - { kind: has_item, item_ref: item.weapon.march_spear }
          - { kind: has_item, item_ref: item.weapon.march_spear, quality_min: 1, not: true }
          - { kind: visited, node: judged, not: true }
        next: judged
      - id: seam
        text: "How long will the seam last?"
        conditions:
          - { kind: visited, node: lesson }
          - { kind: visited, node: seam, not: true }
        next: seam
      - id: kera
        text: "Kera sends her regards."
        conditions: [{ kind: visited, node: kera, not: true }]
        next: kera
      - id: trade
        text: "What have you got?"
        consequences: [{ command: open_service, service: trade }]
      - id: work
        text: "Any work going?"
        next: work
      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_the_crags_p2
        text: "Tell me about the south crags."
        next: tell_the_crags_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_iron_p2
        text: "Tell me about iron."
        next: tell_iron_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_crag_walker
        text: "Tell me about the crag walker."
        next: tell_crag_walker

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_north_ash_stand_p2
        text: "Tell me about the north ash stand."
        next: tell_north_ash_stand_p2

      - id: leave
        text: "Nothing today."
      - id: story_packing
        text: How would you tell packing from a fallen face?
        next: story_packing
  lesson:
    text: "\"Iron. Our own.\" He points the hammer south. \"Crags. Far west end of the line. Black in the face. Three good strikes, then it is done. Do not waste them.\" The hammer moves to the hearth. \"Ore in there. Billet out.\" Then north. \"Ash, where the ground rises. For the haft.\" He goes back to work. After a while: \"Make a spear. Bring it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: thanks
        text: "I will bring you a spear."
        next: again
  where:
    text: "\"South. Past the last wall. Along the crags till the face goes black.\" A pause. \"West end. East is rotten. Comes away in your hand.\" Another. \"Something walks that line at night. Leave it be.\""
    choices:
      - id: back
        text: "I will find it."
        next: again
  praised:
    text: "He turns the spear over once. Sights down it once. Nods once. \"Good.\" He holds it out to you, and does not let go straight away. \"Keep it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Thank you."
        next: again
  judged:
    text: "He turns it over once. \"It will hold.\" He taps the socket with the hammer, and it rings wrong. \"There.\" He hands it back. \"Next one.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I will try again."
        next: again
  seam:
    text: "\"Three strikes. Four.\" The hammer stops, which it has not done since you came in. \"My father took iron off that face. His father. After me, Cairnwold buys its iron off the road.\" The hammer starts again."
    choices:
      - id: back
        text: "I'll make them count."
        next: again
  kera:
    text: "\"Kera talks. I hit things.\" Something happens at the corner of his mouth, and is gone. \"We both get iron out of it.\""
    choices:
      - id: back
        text: "I'll tell her you said so."
        next: again
# Said in passing, unprompted, when the character comes near (the bark patch): each line while its conditions hold.
  work:
    text: "He doesn't stop hammering. \"Billets.\" A while later: \"Fresh. Not from your pack.\" He points the hammer south, at the crags, and holds it there. \"After dark. Put it down.\" Then at the bench by the south wall. \"Hides. If you want.\""
    choices:
      - id: take_billet
        text: "I'll smelt you a billet."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.moor_billets, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.moor_billets }]
        next: billet_taken
      - id: give_billet
        text: "One billet. Fresh."
        conditions:
          - { kind: quest_state, quest_ref: quest.bounty.moor_billets, objective: o_deliver, is: active }   # only once the fresh one is smelted: a stock billet before then is taken uncounted
          - { kind: has_item, item_ref: item.material.iron_ingot, count: 1 }
        consequences: [{ command: transfer_item, item_ref: item.material.iron_ingot, count: 1, to: npc }]
        next: billet_paid
      - id: take_walker
        text: "I'll go and look at your crags after dark."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.crag_walker, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.crag_walker }]
        next: walker_taken
      - id: hides
        text: "Show me how to work hides."
        conditions: [{ kind: visited, node: hide_lesson, not: true }]
        consequences:
          - { command: teach, refs: [recipe.leatherwork.hide_cap, recipe.leatherwork.hide_vest] }
        next: hide_lesson
      - id: heavy_hides
        text: "What about the heavy hides? Fellhorn. Barrowback."
        conditions:
          - { kind: visited, node: hide_lesson }
          - { kind: visited, node: heavy_hide_lesson, not: true }
        consequences:
          - { command: teach, refs: [recipe.leatherwork.hide_vest_barrowback, recipe.leatherwork.hide_cap_fellhorn] }
        next: heavy_hide_lesson
      - id: bags
        text: "Can you show me how to make a bag? I carry too much loose."
        conditions: [{ kind: visited, node: bag_lesson, not: true }]
        consequences:
          - { command: teach, refs: [recipe.outfitting.satchel, recipe.outfitting.pack_large, recipe.outfitting.reagent_satchel, recipe.outfitting.quiver, recipe.outfitting.herb_pouch] }
        next: bag_lesson
      - id: back
        text: "Not now."
        next: again
  billet_taken:
    text: "\"Smelt it. Then bring it.\" He looks at you once. \"I will know.\""
    choices:
      - id: back
        text: "You will."
        next: again
  billet_paid:
    text: "He turns the billet over once. \"Hinge.\" Coin on the anvil's edge."
    choices:
      - id: back
        text: "A hinge, then."
        next: again
  walker_taken:
    text: "\"East of the seam. Foot of the crags.\" The hammer stops. \"It does not hurry.\" It starts again. \"Neither do you.\""
    choices:
      - id: back
        text: "I'll take a light."
        next: again
  heavy_hide_lesson:
    text: "The hammer stops. \"Barrowback.\" He holds his arms apart, and then a little further. \"One fleece. A wolf for the shoulders. Vest.\" The hammer starts. Stops. \"Fellhorn. The hump. Cut it whole. Cap.\" He looks at you. \"Fewer seams. Fewer mistakes.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Fewer seams."
        next: again
  bag_lesson:
    text: "He turns a deer hide over, finds the seam he wants, and lays it flat. \"Two hides and thread. Satchel.\" A heavier fold. \"Wolf for the frame. Pack.\" He taps the bench. \"A pocket for each kind of thing: herbs, makings, arrows. Sorted, it weighs the same. You find it faster.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Sorted. Weighs the same."
        next: again
  hide_lesson:
    text: "He hands you a hide without looking. \"Wolf and a small pelt. Cap.\" Another. \"Two wolves, one deer. Vest.\" He points at the bench. \"There. Not my anvil.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Not your anvil."
        next: again
  story_packing:
    text: Packed. Not fallen.
    choices:
    - id: open
      text: Would you open it?
      next: story_breach
    - id: back
      text: Then I will leave it intact.
      next: again
  story_breach:
    text: I open no man's door.
    choices:
    - id: back
      text: I will inspect it myself.
      next: again
  tell_the_crags_p2:
    text: "Durn Skell works the seam at the crags' west end, and he says it in few words. Iron, our own: three good strikes, then it is done, so do not waste them. His father took iron off that face, and his father before him, and after Durn the village buys its iron off the road - there is no second seam in the basin. And something walks the foot of the crags at night, he says, east of the seam where the stone is rotten. It does not hurry. Neither, he adds, do you."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_crags }]
        next: again

  tell_iron_p2:
    text: "Durn Skell works the Cairnwold seam and counts it in strikes. Three, he says, or four, and then it is done. His father took iron off that face, and his father before him, and after him the village buys its iron off the road. There is no second seam in the basin, and he does not say it sadly, only as a fact a smith keeps track of. Do not waste them, he says, and then the hammer comes down again, and the counting goes on. He works while he talks, and he is watching the last of the village's own iron run out."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.iron }]
        next: again

  tell_crag_walker:
    text: "The crag walker is Durn Skell's name for whatever walks the foot of the south crags after dark, and he will not describe it beyond a few words: east of the seam, at the foot of the crags, where the stone is rotten. It does not hurry, he says. A traveller going up there should leave it be — unless they mean to put it down, in which case he says go after dark and take a light. He pays for whatever walks that line at night, and he counts any bone-walker husk put down toward it, so the name is the work, not the beast."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.crag_walker }]
        next: again

  tell_north_ash_stand_p2:
    text: "Durn Skell points north from the anvil and names the stand in a few words: ash, where the ground rises, for the haft. He sends a smith there for the wood the same way he sends them to the crags for the iron, and he counts it the same way — a thing that must last, and must not be wasted. The haft is the part the hand remembers, he would say, and a bad haft breaks the work before the iron ever will. So the stand is not scenery to him; it is the other half of every tool he has ever put into a pair of hands."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.north_ash_stand }]
        next: again

barks:
  - { text: "Mind the sparks." }
  - { text: "Hm." }
  - { text: "Anvil is mine." }
  - text: "Spear holding?"
    conditions: [{ kind: visited, node: praised }]
  - text: "West end. Not east."
    conditions:
      - { kind: quest_state, quest_ref: quest.cairnwold.iron_from_the_moor, is: active }
      - { kind: quest_state, quest_ref: quest.cairnwold.iron_from_the_moor, objective: o_ore, is: satisfied, not: true }
  - text: "East. After dark."
    conditions: [{ kind: quest_state, quest_ref: quest.bounty.crag_walker, is: active }]
