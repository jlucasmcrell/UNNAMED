id: dialogue.cairnwold.berrin_garth
kind: dialogue
schema: 1
display_key: dialogue.cairnwold.berrin_garth.name
tags: [dialogue]
notes: "Berrin Garth, who keeps the long lodge and remembers the village. The place-lore node - why the walls are drystone, why the granary stands on staddles, what in the basin is older than the village - and the one who hands over the Resonance Primer, because a hall with a fire in it is where a village keeps its books. Offering the primer is NOT a once-only line: hearing the offer is not getting the book, so `books` stays open until `primer_given` has been reached, which is the only thing that marks it given (the Phase-1 technical audit, H-01). Voice (NPC_PERSONALITY_BIBLE.md): warm, rambling, fond of his village and his own stories, losing the thread and finding it again; Veth, and afraid of forgetting, so everything goes in the lodge book - strangers included."
participants: [npc.cairnwold.berrin_garth]
root_node: greet
nodes:
  greet:
    text: "Come in, come in, out of that wind - it's been at the door all morning like a dog that wants feeding. Berrin. I keep the lodge. Sweep it, mostly. And remember what it's for, which is the harder half."
    once: true
    next_if_exhausted: again
    choices:
      - id: books
        text: "Is there anything here I could learn from?"
        next: primer
      - id: walls
        text: "Why drystone? There is no mortar in any of it."
        next: walls
      - id: granary
        text: "The granary stands on stones."
        next: granary
      - id: book
        text: "What's the big book by the fire?"
        next: lodge_book
      - id: rim_stone
        text: "There's a standing stone up on the Rim. It's cold, and it doesn't answer."
        consequences: [{ command: start_quest, quest_ref: quest.main.road_east }]
        next: rim_stone
      - id: leave
        text: "Later."
  again:
    text: "Sit, sit. The fire doesn't mind company, and at my age neither do I."
    choices:
      - id: books
        text: "Is there anything here I could learn from?"
        conditions:
          - { kind: visited, node: primer_given, not: true }
        next: primer
      - id: walls
        text: "About the walls."
        conditions: [{ kind: visited, node: walls, not: true }]
        next: walls
      - id: granary
        text: "About the granary."
        conditions: [{ kind: visited, node: granary, not: true }]
        next: granary
      - id: older
        text: "What is older than the village?"
        conditions: [{ kind: visited, node: older, not: true }]
        next: older
      - id: book
        text: "About the lodge book."
        conditions: [{ kind: visited, node: lodge_book, not: true }]
        next: lodge_book
      - id: personal
        text: "What keeps you here?"
        conditions: [{ kind: visited, node: personal, not: true }]
        next: personal
      - id: rim_stone
        text: "The standing stone up on the Rim."
        conditions: [{ kind: visited, node: rim_stone, not: true }]
        consequences: [{ command: start_quest, quest_ref: quest.main.road_east }]
        next: rim_stone
      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_cairnwold
        text: "Tell me about cairnwold"
        next: tell_cairnwold

      - id: leave
        text: "Later."
      - id: story_note
        text: Renn read your name on this note.
        next: story_note
        conditions:
        - kind: has_item
          item_ref: item.story.folded_note
      - id: story_records
        text: What do the old records say about the moss lights?
        next: story_records
        conditions:
        - kind: quest_state
          quest_ref: quest.main.moss_lights
          is: satisfied
          objective: o_lodge
      - id: story_doors
        text: How do you tell which door an old record means?
        next: story_doors
  primer:
    text: "Ah - now. Behind you, top shelf, the cupboard with the warped door. Nobody's opened it since we buried Wenna, and Wenna was the last of us who could make sense of what's in it. There's a primer - three small workings, one to strike, one to brace, one to mend. Take it. A book on a shelf is a promise nobody's keeping."
    choices:
      - id: take
        text: "Thank you. I will be careful."
        consequences:
          - { command: transfer_item, item_ref: item.tome.resonance_primer, count: 1, to: player }
          - { command: record_relationship_event, npc_ref: npc.cairnwold.berrin_garth, dimension: trust, delta: 5, event: given_the_primer }
        next: primer_given
      - id: not_yet
        text: "Not yet."
        next: again
  primer_given:
    text: "He watches you put it away and nods, as if something has been put back where it belongs. \"Mind the third working. The first two are honest. The third asks something of you. Wenna used to say it asks first and tells you the price after - and she was usually right, which was very tiresome of her.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I will."
        next: again
  walls:
    text: "Mortar wants lime, and lime wants a kiln, and a kiln wants a man who does nothing else all summer - and nobody here has ever had a summer like that. Drystone wants a winter and two good hands. My grandfather built the long wall by the beck and swore at every stone of it; I can show you the ones he swore at hardest. They're not old, these walls. They're patient. There's a difference, and it's most of what this village is."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I had not thought of it that way."
        next: again
  granary:
    text: "On staddles, aye - stone legs, with a flat cap-stone on every one. A mouse runs up the leg, meets the cap, hangs there upside down thinking about its choices, and drops off. Not a pretty answer. It's kept grain dry for two hundred years, so it's the right one. Tam will tell you exactly how many years. Tam will tell you exactly how many of anything."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Practical."
        next: again
  older:
    text: "Oh, now that's a question. The crags, and the cut in the east where the beck leaves. The crags are a line, not a scatter - stand on the lodge step at sundown and look south, you'll see it. Somebody put them along that edge, or something did, and it wasn't us. The cut's only water and time. We built between the two, walled it, and called it home. Everything else in this basin is older than us and doesn't much care. I find that a comfort, most days."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Thank you."
        next: again
  lodge_book:
    text: "\"The lodge book. Everyone who's sat by this fire, near enough - births, burials, who owes who a ewe. Strangers too.\" He wets the pen. \"Name?\" You give it. He writes it slowly, then reads it back aloud, the way people here say names - as if it might need to last. \"There. Now you've been here. You'd be surprised how few can say that and prove it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: strangers
        text: "Do many strangers come over the ridge?"
        next: strangers
      - id: back
        text: "Thank you."
        next: again
  strangers:
    text: "\"Now and then. Some come with a pack and a plan. Some come with nothing and no notion how they got here - you've a bit of that look, if you'll forgive me saying. The book has a few of those. Not many. Enough that I don't drop my cup.\" He drinks from it, to show you."
    choices:
      - id: back
        text: "That's oddly reassuring."
        next: again
  rim_stone:
    text: "\"The Rim Stone? Oh, it's a Waystone right enough - or it was. Cold since before my grandfather, and he was cold before most things.\" He counts on his fingers, then starts again. \"It's in the lodge book. Old Corra had it: 'Three hands and a name.' And then not another word on it for forty years, which was very like her. Three times with the flat of your hand - one after another, mind, it's not a dance - and then you tell it its name. The Rim Stone. As if you're reminding it.\" He lowers his hand. \"Nobody's tried in my time. Nobody here has ever wanted to be anywhere it went.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Three hands and a name. I'll remember."
        next: again
  personal:
    text: "Keeps me? Ha. Nothing keeps me - I keep it. That's a Veth joke; it's funnier if you're Veth. Someone has to remember why the doors are where they are, and Tam counts what comes in, and I remember who brought it. Only... I've started writing things down twice. Don't tell Tam. She'll want to count them."
    choices:
      - id: back
        text: "Your secret's safe."
        next: again
# Said in passing, unprompted, when the character comes near (the bark patch): each line while its conditions hold.
  story_note:
    text: Now then, that's my name, and it's still mine, last I checked. The rubbed bit... no, I won't fill that in for you. You're welcome at the
      lodge. I keep it from seven to nineteen, and the book stays there when I don't.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_records:
    text: Now then, the two old entries... roughly two hundred years apart, and both before you. The light's like what they wrote. Like isn't the
      same as certain. We've weathered it before, and that comforts me, and then I look at the mark beside your day and... no, I won't rub that
      out to make a better story.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_doors:
    text: Knock on that door, and the other, next time you're at the lodge. Aye, different, aren't they? We kept writing 'the door', and then the
      door was mended, and... where was I? The book. A name's useful when the thing doesn't stay the same.
    choices:
    - id: back
      text: I'll compare them at the lodge.
      next: again
  tell_cairnwold:
    text: "Berrin Garth keeps the lodge and remembers why every part of the village is the way it is, and he will tell you, warmly and at length. The walls are drystone, he says, because mortar wants lime and lime wants a kiln and a kiln wants a man with a whole summer, and nobody here has ever had a summer like that — drystone wants a winter and two good hands. The granary stands on staddles, stone legs with a flat cap on each, so a mouse climbs up and hangs there thinking about its choices. And if you ask what is older than the village, he points at the crag line on the south edge — put there by somebody, or something, and not by the village — and the cut in the east where the beck leaves, which is only water and time. We built between the two, he says, walled it, and called it home."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.cairnwold }]
        next: again

barks:
  - { text: "Now then. Mind the step - it's older than it looks, and so am I." }
  - { text: "Where was I... the long wall. No. The ewe. It'll come back to me." }
  - { text: "Wipe your feet. No - the other foot. There. Welcome." }
  - text: "Reading it? Good. Read it aloud some evening - the fire likes a story."
    conditions: [{ kind: visited, node: primer_given }]
  - text: "You're in the book now. Try not to make me write anything sad next to you."
    conditions: [{ kind: visited, node: lodge_book }]
