id: dialogue.cairnwold.berrin_garth
kind: dialogue
schema: 1
display_key: dialogue.cairnwold.berrin_garth.name
tags: [dialogue]
notes: "Berrin Garth, who keeps the long lodge and remembers the village. The place-lore node - why the walls are drystone, why the granary stands on staddles, what in the basin is older than the village - and the one who hands over the Resonance Primer, because a hall with a fire in it is where a village keeps its books. Offering the primer is NOT a once-only line: hearing the offer is not getting the book, so `books` stays open until `primer_given` has been reached, which is the only thing that marks it given (the Phase-1 technical audit, H-01). Voice (NPC_PERSONALITY_BIBLE.md): warm, rambling, fond of his village and his own stories, losing the thread and finding it again; Veth, and afraid of forgetting, so everything goes in the lodge book - strangers included."
participants: [npc.cairnwold.berrin_garth]
root_node: greet
nodes:
  greet:
    text: "Come in, come in, out of that wind - it's been at the door all morning like a dog that wants feeding. Berrin. I keep the lodge. Sweep it, mostly. And remember what it's for, which is the harder half."
    once: true
    next_if_exhausted: again
    choices:
      - id: recognition
        text: "Come in, come in — you've the coat for it, all down the collar. Timber does that. It tells on a man before he says a word."
        conditions: [{ kind: call, call_ref: call.woodsman }]
        next: recognised
      - id: books
        text: "Is there anything here I could learn from?"
        next: primer
      - id: walls
        text: "Why drystone? There is no mortar in any of it."
        next: walls
      - id: granary
        text: "The granary stands on stones."
        next: granary
      - id: book
        text: "What's the big book by the fire?"
        next: lodge_book
      - id: rim_stone
        text: "There's a standing stone up on the Rim. It's cold, and it doesn't answer."
        consequences: [{ command: start_quest, quest_ref: quest.main.road_east }]
        next: rim_stone
      # What Was Kept (owner, 2026-10-24, HERITAGE_DESIGN.md §3.1): Berrin keeps the lodge book, so the other half of a Veth oath is in it.
      - id: oath
        text: "My family's roll has an open line. Renn says the other half is in your book."
        conditions:
          - { kind: people, people_ref: people.veth }
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, objective: o_lodge_book, is: active }
        next: oath_half
      - id: hallows
        text: "About the Hallows' line."
        conditions:
          - { kind: visited, node: oath_half }
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, is: active }
          - { kind: visited, node: oath_kept, not: true }
          - { kind: visited, node: oath_released, not: true }
          - { kind: visited, node: oath_claimed, not: true }
        next: oath_half
      # The Unfinished Joint (owner, 2026-10-25, HERITAGE_DESIGN.md Â§3.2): the lodge book remembers the stone Cairnwold took from the crags.
      - id: crag_stone
        text: "There's a Kal hold in the south crags, and a stone gone from its door."
        conditions:
          - { kind: people, people_ref: people.kal }
          - { kind: quest_state, quest_ref: quest.heritage.unfinished_joint, objective: o_why, is: active }
        next: crag_stone
      - id: leave
        text: "Later."
  recognised:
    text: "Come in, come in — you've the coat for it, all down the collar. Timber does that. It tells on a man before he says a word."

  oath_half:
    text: "Your line, is it? Sit - no, stand, you'll want to see this. ... Here. The Hallows. They built this lodge, the Hallows did, and they're down to me and this book, near enough. 'Owed by your line to the Hallows: a winter's roof timber for the long lodge. Sworn at the waystation.' Two lifetimes ago, and never kept. They counted it, the Hallows. Every winter the roof leaked, they counted it again. I've been meaning to forget it for years, and I can't. It's written down."
    choices:
      - id: keep
        text: "Here's the timber. Four lengths, for the roof."
        conditions:
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, is: active }
          - { kind: visited, node: oath_kept, not: true }
          - { kind: visited, node: oath_released, not: true }
          - { kind: visited, node: oath_claimed, not: true }
          - { kind: has_item, item_ref: item.material.timber, count: 4 }
        consequences:
          - { command: transfer_item, item_ref: item.material.timber, count: 4, to: npc }
        next: oath_kept
      - id: keep_later
        text: "I'll bring the timber."
        conditions:
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, is: active }
          - { kind: visited, node: oath_kept, not: true }
          - { kind: visited, node: oath_released, not: true }
          - { kind: visited, node: oath_claimed, not: true }
        next: again
      - id: release
        text: "Would the Hallows release it, after so long?"
        conditions:
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, is: active }
          - { kind: visited, node: oath_kept, not: true }
          - { kind: visited, node: oath_released, not: true }
          - { kind: visited, node: oath_claimed, not: true }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.cairnwold.berrin_garth, dimension: respect, delta: -3, event: hallow_oath_released }
        next: oath_released
      - id: claim
        text: "My line was less changed than most. That oath never bound us."
        conditions:
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, is: active }
          - { kind: visited, node: oath_kept, not: true }
          - { kind: visited, node: oath_released, not: true }
          - { kind: visited, node: oath_claimed, not: true }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.cairnwold.berrin_garth, dimension: respect, delta: -10, event: hallow_oath_claimed }
        next: oath_claimed
  oath_kept:
    text: "Four lengths. Good straight ones, too. ... There. 'Kept.' In my hand, next to theirs. The roof will have them by the first frost, and the Hallows - well, the Hallows will have it written down, which is what they'd have wanted. Go and tell Renn. He'll want to close your line himself; keepers are fussy like that."
    choices:
      - id: back
        text: "I will."
        next: again
  oath_released:
    text: "Released. ... I can do that. I'm what's left to do it. There - 'released, by the Hallows' keeper, at the asking of the line that owed.' It's an honest word. It's not the same word as kept, but it's honest. Renn will close your line for you."
    choices:
      - id: back
        text: "Thank you, Berrin."
        next: again
  oath_claimed:
    text: "Less changed. ... I've heard that said before. Usually by someone who'd rather not pay. I'll write it down, because I write everything down - 'the line that owed says it was never bound.' It'll sit there next to the Hallows' line for as long as the book does. I'd not take that to Renn, if I were you. He won't close it."
    choices:
      - id: back
        text: "So be it."
        next: again
  again:
    text: "Sit, sit. The fire doesn't mind company, and at my age neither do I."
    choices:
      - id: books
        text: "Is there anything here I could learn from?"
        conditions:
          - { kind: visited, node: primer_given, not: true }
        next: primer
      - id: walls
        text: "About the walls."
        conditions: [{ kind: visited, node: walls, not: true }]
        next: walls
      - id: granary
        text: "About the granary."
        conditions: [{ kind: visited, node: granary, not: true }]
        next: granary
      - id: older
        text: "What is older than the village?"
        conditions: [{ kind: visited, node: older, not: true }]
        next: older
      - id: book
        text: "About the lodge book."
        conditions: [{ kind: visited, node: lodge_book, not: true }]
        next: lodge_book
      - id: personal
        text: "What keeps you here?"
        conditions: [{ kind: visited, node: personal, not: true }]
        next: personal
      - id: rim_stone
        text: "The standing stone up on the Rim."
        conditions: [{ kind: visited, node: rim_stone, not: true }]
        consequences: [{ command: start_quest, quest_ref: quest.main.road_east }]
        next: rim_stone
      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      # The Spill (docs/FIELD_RUINS.md): told, not read, and the standing work on its tenders.
      - id: ask_spill
        text: "Tell me about the iron on the top."
        next: tell_spill
      - id: take_rim_road
        text: "I'll keep the tenders back from the Rim road."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.rim_road, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.rim_road }]
        next: rim_road_taken
      - id: ask_cairnwold
        text: "Tell me about Cairnwold."
        next: tell_cairnwold

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_rim_stone_p2
        text: "Tell me about the rim stone."
        next: tell_rim_stone_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_folded_note_p2
        text: "Tell me about the folded note."
        next: tell_folded_note_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_wenna
        text: "Tell me about Wenna."
        next: tell_wenna

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      # What Was Kept (owner, 2026-10-24, HERITAGE_DESIGN.md §3.1): Berrin keeps the lodge book, so the other half of a Veth oath is in it.
      - id: oath
        text: "My family's roll has an open line. Renn says the other half is in your book."
        conditions:
          - { kind: people, people_ref: people.veth }
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, objective: o_lodge_book, is: active }
        next: oath_half
      - id: hallows
        text: "About the Hallows' line."
        conditions:
          - { kind: visited, node: oath_half }
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, is: active }
          - { kind: visited, node: oath_kept, not: true }
          - { kind: visited, node: oath_released, not: true }
          - { kind: visited, node: oath_claimed, not: true }
        next: oath_half
      # The Unfinished Joint (owner, 2026-10-25, HERITAGE_DESIGN.md Â§3.2): the lodge book remembers the stone Cairnwold took from the crags.
      - id: crag_stone
        text: "There's a Kal hold in the south crags, and a stone gone from its door."
        conditions:
          - { kind: people, people_ref: people.kal }
          - { kind: quest_state, quest_ref: quest.heritage.unfinished_joint, objective: o_why, is: active }
        next: crag_stone
      - id: leave
        text: "Later."
      - id: story_note
        text: Renn read your name on this note.
        next: story_note
        conditions:
        - kind: has_item
          item_ref: item.story.folded_note
      - id: story_records
        text: What do the old records say about the moss lights?
        next: story_records
        conditions:
        - kind: quest_state
          quest_ref: quest.main.moss_lights
          is: satisfied
          objective: o_lodge
      - id: story_doors
        text: How do you tell which door an old record means?
        next: story_doors
  primer:
    text: "Ah - now. Behind you, top shelf, the cupboard with the warped door. Nobody's opened it since we buried Wenna, and Wenna was the last of us who could make sense of what's in it. There's a primer - three small workings, one to strike, one to brace, one to mend. Take it. A book on a shelf is a promise nobody's keeping."
    choices:
      - id: take
        text: "Thank you. I will be careful."
        consequences:
          - { command: transfer_item, item_ref: item.tome.resonance_primer, count: 1, to: player }
          - { command: record_relationship_event, npc_ref: npc.cairnwold.berrin_garth, dimension: trust, delta: 5, event: given_the_primer }
        next: primer_given
      - id: not_yet
        text: "Not yet."
        next: again
  primer_given:
    text: "He watches you put it away and nods, as if something has been put back where it belongs. \"Mind the third working. The first two are honest. The third asks something of you. Wenna used to say it asks first and tells you the price after - and she was usually right, which was very tiresome of her.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I will."
        next: again
  walls:
    text: "Mortar wants lime, and lime wants a kiln, and a kiln wants a man who does nothing else all summer - and nobody here has ever had a summer like that. Drystone wants a winter and two good hands. My grandfather built the long wall by the beck and swore at every stone of it; I can show you the ones he swore at hardest. They're not old, these walls. They're patient. There's a difference, and it's most of what this village is."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I had not thought of it that way."
        next: again
  granary:
    text: "On staddles, aye - stone legs, with a flat cap-stone on every one. A mouse runs up the leg, meets the cap, hangs there upside down thinking about its choices, and drops off. Not a pretty answer. It's kept grain dry for two hundred years, so it's the right one. Tam will tell you exactly how many years. Tam will tell you exactly how many of anything."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Practical."
        next: again
  older:
    text: "Oh, now that's a question. The crags, and the cut in the east where the beck leaves. The crags are a line, not a scatter - stand on the lodge step at sundown and look south, you'll see it. Somebody put them along that edge, or something did, and it wasn't us. The cut's only water and time. We built between the two, walled it, and called it home. Everything else in this basin is older than us and doesn't much care. I find that a comfort, most days."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Thank you."
        next: again
  lodge_book:
    text: "\"The lodge book. Everyone who's sat by this fire, near enough - births, burials, who owes who a ewe. Strangers too.\" He wets the pen. \"Name?\" You give it. He writes it slowly, then reads it back aloud, the way people here say names - as if it might need to last. \"There. Now you've been here. You'd be surprised how few can say that and prove it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: strangers
        text: "Do many strangers come over the ridge?"
        next: strangers
      - id: back
        text: "Thank you."
        next: again
  strangers:
    text: "\"Now and then. Some come with a pack and a plan. Some come with nothing and no notion how they got here - you've a bit of that look, if you'll forgive me saying. The book has a few of those. Not many. Enough that I don't drop my cup.\" He drinks from it, to show you."
    choices:
      - id: back
        text: "That's oddly reassuring."
        next: again
  rim_stone:
    text: "\"The Rim Stone? Oh, it's a Waystone right enough - or it was. Cold since before my grandfather, and he was cold before most things.\" He counts on his fingers, then starts again. \"It's in the lodge book. Old Corra had it: 'Three hands and a name.' And then not another word on it for forty years, which was very like her. Three times with the flat of your hand - one after another, mind, it's not a dance - and then you tell it its name. The Rim Stone. As if you're reminding it.\" He lowers his hand. \"Nobody's tried in my time. Nobody here has ever wanted to be anywhere it went.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Three hands and a name. I'll remember."
        next: again
  personal:
    text: "Keeps me? Ha. Nothing keeps me - I keep it. That's a Veth joke; it's funnier if you're Veth. Someone has to remember why the doors are where they are, and Tam counts what comes in, and I remember who brought it. Only... I've started writing things down twice. Don't tell Tam. She'll want to count them."
    choices:
      - id: back
        text: "Your secret's safe."
        next: again
# Said in passing, unprompted, when the character comes near (the bark patch): each line while its conditions hold.
  story_note:
    text: Now then, that's my name, and it's still mine, last I checked. The rubbed bit... no, I won't fill that in for you. You're welcome at the
      lodge. I keep it from seven to nineteen, and the book stays there when I don't.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_records:
    text: Now then, the two old entries... roughly two hundred years apart, and both before you. The light's like what they wrote. Like isn't the
      same as certain. We've weathered it before, and that comforts me, and then I look at the mark beside your day and... no, I won't rub that
      out to make a better story.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_doors:
    text: Knock on that door, and the other, next time you're at the lodge. Aye, different, aren't they? We kept writing 'the door', and then the
      door was mended, and... where was I? The book. A name's useful when the thing doesn't stay the same.
    choices:
    - id: back
      text: I'll compare them at the lodge.
      next: again
  tell_spill:
    text: "Berrin Garth says the village has always kept off the top after dark, and nobody remembers being told to. The lodge book has one line on it, in Old Corra's hand and nothing round it: the top hums; leave it to hum. He reads that as permission to ignore it, he says, and he has, for forty years, very carefully. The things that walk the Spill pick up fallen iron and set it back where it does not fit, and the village calls them tenders, and leaves them to it."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_spill }]
        next: again
  crag_stone:
    text: "A hold. ... Well, that would explain the crags, wouldn't it - a line, not a scatter. I always said it wasn't us. Let me look. ... Here, my grandmother's hand: 'One dressed stone from the crag face, fit for a lintel, carted east and sold to the stone-buyers, the year the beck froze.' Cairnwold took it, and sold it on, and wrote it down, and never thought on it since. The Ondrek, that'll be. They pay fair, and they say it was never anyone. I don't know who's right. I only know we did it, and it's in the book. ... You climbed up there? Not flew? Shame. I've always wanted to see one of you try it. Don't ask me to your funerals, mind - your lot take a week over a burial, and I'd only cry at the wrong bits."
    choices:
      - id: back
        text: "Thank you, Berrin."
        consequences: [{ command: tell_lore, lore_ref: lore.brannock_stone }]   # K-1 (owner, 2026-10-26): east is a lead, not an objective
        next: again
  rim_road_taken:
    text: "\"Good. They come to the edge where the road climbs, now and then, and set a carter back where he doesn't fit.\" He winces at his own joke and writes it down anyway. \"Three of them, and I'll pay. Mind the big ones by the breaches - those aren't tenders, whatever they are.\""
    choices:
      - id: back
        text: "Three tenders."
        next: again
  tell_cairnwold:
    text: "Berrin Garth keeps the lodge and remembers why every part of the village is the way it is, and he will tell you, warmly and at length. The walls are drystone, he says, because mortar wants lime and lime wants a kiln and a kiln wants a man with a whole summer, and nobody here has ever had a summer like that — drystone wants a winter and two good hands. The granary stands on staddles, stone legs with a flat cap on each, so a mouse climbs up and hangs there thinking about its choices. And if you ask what is older than the village, he points at the crag line on the south edge — put there by somebody, or something, and not by the village — and the cut in the east where the beck leaves, which is only water and time. We built between the two, he says, walled it, and called it home."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.cairnwold }]
        next: again

  tell_rim_stone_p2:
    text: "Berrin Garth keeps the lodge book, and in it is the Rim Stone's rite. It is a Waystone, he says, or it was - cold since before his grandfather. Old Corra set it down as three hands and a name, and then wrote not another word on it for forty years. The rite is simple: three times with the flat of the hand, one after another, and then you tell the stone its name, as if reminding it. Nobody in the village has tried it in his time. Nobody here, he says, has ever wanted to be anywhere it went."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.rim_stone }]
        next: again

  tell_folded_note_p2:
    text: "Renn Vale reads it in a few flat words: Berrin Garth, Cairnwold lodge, the rest has been rubbed away, and why it was rubbed away is still the traveller's business. He does not try to fill the gap in, and he sends the traveller on to Berrin's door with the note as it is. Berrin himself, when he is shown it, will not fill the rubbed part in either — it is his name, he says, and it is still his, but the missing part stays missing. The note assigns no one a past; it only points to a person and a door, and leaves the rest unwritten."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.folded_note }]
        next: again

  tell_wenna:
    text: "Wenna was the last of Cairnwold who could make sense of the Resonance Primer's shelf, and the cupboard with the warped door has not been opened since they buried her. Berrin Garth says it plainly, without mourning in the voice but with a carefulness that amounts to it: nobody has opened it since we buried Wenna, and Wenna was the last of us who could make sense of what is in it. The primer is three small workings — one to strike, one to brace, one to mend — and the book sits behind the warped door as a promise nobody has kept."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.wenna }]
        next: again

barks:
  - { text: "Now then. Mind the step - it's older than it looks, and so am I." }
  - { text: "Where was I... the long wall. No. The ewe. It'll come back to me." }
  - { text: "Wipe your feet. No - the other foot. There. Welcome." }
  - text: "Reading it? Good. Read it aloud some evening - the fire likes a story."
    conditions: [{ kind: visited, node: primer_given }]
  - text: "You're in the book now. Try not to make me write anything sad next to you."
    conditions: [{ kind: visited, node: lodge_book }]
