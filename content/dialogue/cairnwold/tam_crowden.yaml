id: dialogue.cairnwold.tam_crowden
kind: dialogue
schema: 1
display_key: dialogue.cairnwold.tam_crowden.name
tags: [dialogue]
notes: Tam Crowden at the granary. Counts what comes off the moor - the region's own spawns on it (moor_strays, birch_boar, barrow_sentinel, gorge_spiders) are what she is counting. She posts two standing bounties (For the Pot, Hides for the Winter) and teaches the cookfire. Voice (NPC_PERSONALITY_BIBLE.md) - quick, anxious, kind, correcting her own numbers out loud; she counts everyone up the west end because her sister Halda went up the north slope after the wolves and did not come down (DIRECTION_AND_CONTENT_PLAN.md C.2d). Bringing her Halda's token from the den is the return choice of Halda's Tally (quest.ashen_hollow.haldas_tally, C.2d) - she takes it, trust +10, and gives Halda's Bow; once the character has told Renn they are keeping it (world.hollow.halda_tally_kept) she is not offered it.
participants: [npc.cairnwold.tam_crowden]
root_node: greet
nodes:
  greet:
    text: "\"Hold there - sorry - hold there a moment. Fifteen. Sixteen.\" She cuts a notch in a stick, frowns, and runs her thumb back along it. \"No. Fifteen. Tam. Nothing's wrong, I count everyone who comes up the west end, and you're the first today. The first person. There was a goat.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: moor
        text: "What is out on the moor?"
        next: moor
      - id: count
        text: "Why count everyone?"
        next: count
      - id: halda_token
        text: "I found this in the wolves' den."
        conditions:
          - { kind: has_item, item_ref: item.quest.halda_token }
          - { kind: world_state, flag_ref: world.hollow.halda_tally_kept, location_ref: location.outpost, min: 0, max: 0 }   # not once Renn was told it is kept
        consequences:
          - { command: transfer_item, item_ref: item.quest.halda_token, count: 1, to: npc }
          - { command: record_relationship_event, npc_ref: npc.cairnwold.tam_crowden, dimension: trust, delta: 10, event: brought_halda_home }
        next: halda
      - id: leave
        text: "Just passing."
  again:
    text: "Oh - you again. Good. That's you in, and out, and in. I like a number that comes back."
    choices:
      - id: moor
        text: "About the moor."
        conditions: [{ kind: visited, node: moor, not: true }]
        next: moor
      - id: count
        text: "What are you counting?"
        conditions: [{ kind: visited, node: count, not: true }]
        next: count
      - id: halda_token
        text: "I found this in the wolves' den."
        conditions:
          - { kind: has_item, item_ref: item.quest.halda_token }
          - { kind: world_state, flag_ref: world.hollow.halda_tally_kept, location_ref: location.outpost, min: 0, max: 0 }   # not once Renn was told it is kept
        consequences:
          - { command: transfer_item, item_ref: item.quest.halda_token, count: 1, to: npc }
          - { command: record_relationship_event, npc_ref: npc.cairnwold.tam_crowden, dimension: trust, delta: 10, event: brought_halda_home }
        next: halda
      - id: bow
        text: "You said there was something of Halda's."
        conditions:
          - { kind: visited, node: halda }
          - { kind: visited, node: bow_given, not: true }
        consequences:
          - { command: transfer_item, item_ref: item.weapon.haldas_bow, count: 1, to: player }
        next: bow_given
      - id: wolves
        text: "I've been hunting wolves."
        conditions:
          - { kind: has_item, item_ref: item.material.wolf_hide }
          - { kind: visited, node: wolves, not: true }
        next: wolves
      - id: work
        text: "Is there anything you're short of?"
        next: work
      - id: leave
        text: "Just passing."
  moor:
    text: "\"Boar in the birch, mostly - eleven this year, and worse in the autumn when the mast is down. Strays along the old line by the crags. Dogs gone wild, Durn says. Something that was never a dog, I say, because I've watched them run and they don't run like dogs. And up in the moss there are lights some nights. I don't count those. I tried. They won't keep still to be counted, and they don't add up when they do. Keep to the walls after dark and you'll be fine.\" A pause. \"Mostly.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I will keep to the walls."
        next: again
  count:
    text: "\"Sacks, mostly. Sixty-two in, as of this morning. Mice, none, thank the staddles. People up the west road and people down it.\" The knife stops on the stick. \"My sister went up the north slope the winter before last, after the wolves. Halda. She trapped up there. I counted her out.\" She turns the stick over in her hands. \"So I count. That's all it is. It's a granary thing.\""
    choices:
      - id: sorry
        text: "I'm sorry."
        next: again
      - id: look
        text: "If I go up there, I'll look for her."
        next: dont_look
  dont_look:
    text: "\"Don't. Please.\" It comes out too fast, and she laughs at herself, badly. \"Sorry. Only - don't go looking. If you go up, come back down. I can't count two.\""
    choices:
      - id: back
        text: "I'll come back down."
        next: again
  halda:
    text: "She has it out of your hand before you've finished holding it out - a hand's length of horn, notched along one edge. \"That's hers. That's Halda's tally. She notched every hide so nobody could argue her count.\" Her thumb walks the notches. \"Thirty-one. She always said she'd stop at thirty.\" She doesn't cry. She counts them again. \"Thank you. I'll keep it with the sacks. Somewhere it gets counted.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I'm glad it's home."
        next: halda_bow
  halda_bow:
    text: "\"Wait. Wait there - one moment.\" She goes into the granary and comes back with a bow wrapped in sacking, and holds it out at arm's length like it might go off. \"Hers. Ash and horn. She said it pulled a fraction sweeter than anything Durn sells, and she was right, and she never let him forget it. It's been on the third peg for two winters. I counted it every morning. I'd like it counted somewhere it gets used.\""
    choices:
      - id: bow
        text: "I'll use it well."
        conditions:
          - { kind: visited, node: halda }
          - { kind: visited, node: bow_given, not: true }
        consequences:
          - { command: transfer_item, item_ref: item.weapon.haldas_bow, count: 1, to: player }
        next: bow_given
      - id: later
        text: "Keep it a while longer."
        next: again
  bow_given:
    text: "\"There. One bow, out.\" She cuts a notch, and then, carefully, another beside it. \"And one tally, in. That comes out even. That comes out even, doesn't it?\" She nods before you can. \"Bring it back down. You and it, both, every time. I'm counting.\""
    choices:
      - id: back
        text: "Every time."
        next: again
  wolves:
    text: "\"Wolves.\" She looks at the hide a long moment. \"Up the north slope?\" Then she cuts a notch - a new stick, one she keeps in her apron, not the granary one. \"That's one fewer. I count those too.\""
    choices:
      - id: back
        text: "I'll keep at it."
        next: again
# Said in passing, unprompted, when the character comes near (the bark patch): each line while its conditions hold.
  work:
    text: "Short of - sorry, yes, I know exactly. Meat for the lodge pot, two portions, from anything with legs, though not - well. Small hides for the loft, two, before the cold, and I'd like them before, not after, after's no good. And you can cook what you catch, you know. There's a fire by the south wall. It isn't cooking. It'll do."
    choices:
      - id: take_pot
        text: "I'll bring meat for the pot."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.lodge_supplies, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.lodge_supplies }]
        next: pot_taken
      - id: take_hides
        text: "I'll bring you two hides."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.winter_hides, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.winter_hides }]
        next: hides_taken
      - id: give_meat
        text: "Two portions of meat."
        conditions:
          - { kind: quest_state, quest_ref: quest.bounty.lodge_supplies, is: active }
          - { kind: has_item, item_ref: item.material.raw_meat, count: 2 }
        consequences: [{ command: transfer_item, item_ref: item.material.raw_meat, count: 2, to: npc }]
        next: counted
      - id: give_hides
        text: "Two small hides."
        conditions:
          - { kind: quest_state, quest_ref: quest.bounty.winter_hides, is: active }
          - { kind: has_item, item_ref: item.material.small_hide, count: 2 }
        consequences: [{ command: transfer_item, item_ref: item.material.small_hide, count: 2, to: npc }]
        next: counted
      - id: cook
        text: "Show me the fire, then."
        conditions: [{ kind: visited, node: cooking, not: true }]
        consequences:
          - { command: teach, refs: [recipe.cooking.roast_meat] }
        next: cooking
      - id: back
        text: "Nothing today."
        next: again
  pot_taken:
    text: "Two portions. Hares on the moor, if you're quick. Hens, if you're not, and then we'll talk about the hens. There are five. There were six. I've counted."
    choices:
      - id: back
        text: "Not the hens."
        next: again
  hides_taken:
    text: "Hare or fox. Not wolf - it stinks the loft out, and anyway the wolf ones I keep on the other stick. Two. Two is the number."
    choices:
      - id: back
        text: "Hare or fox."
        next: again
  counted:
    text: "One, two. Counted. And again - one, two. Counted twice. Here, that's yours, I counted that too."
    choices:
      - id: back
        text: "Thanks, Tam."
        next: again
  cooking:
    text: "Meat on a stick, over the fire by the south wall. Turn it. Don't burn it. That's - that's three things. Turn it, don't burn it, and eat it. That's the whole of it, and you'd be surprised how many don't."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Turn it."
        next: again
barks:
  - { text: "Fourteen, fifteen... sixteen? Sixteen. Hm." }
  - { text: "In, and out, and in. Good. Good." }
  - { text: "Sixty-two sacks. Sixty-two. Don't let me say sixty-three." }
  - text: "Keep to the walls after dark. Mostly."
    conditions: [{ kind: visited, node: moor }]
  - text: "Thirty-one. Still thirty-one."
    conditions: [{ kind: visited, node: halda }]
  - text: "Wolf hide. From the north slope? ...One fewer, then."
    conditions: [{ kind: has_item, item_ref: item.material.wolf_hide }]
  - text: "Two hides. Hare or fox. Two. Two is the number."
    conditions: [{ kind: quest_state, quest_ref: quest.bounty.winter_hides, is: active }]
  - text: "One bow, out. Thirty-one, in. Even. That's even."
    conditions: [{ kind: visited, node: bow_given }]
