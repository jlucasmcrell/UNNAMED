  barrowworks_report:
    text: "\"That's a reading I didn't have.\" She opens her notebook. \"Start with what you saw. I'll keep what we think in the margin.\""
    once: true
    next_if_exhausted: again
    variants:
      - conditions: [{ kind: world_state, flag_ref: world.barrowworks.headworks_preserved, location_ref: location.barrowworks.headworks, min: 1 }]
        text: "\"Still moving, then. Good.\" She leaves a line clear beneath her notes. \"We can take another reading. That's one more chance to be wrong in a useful way.\""
      - conditions: [{ kind: world_state, flag_ref: world.barrowworks.headworks_dismantled, location_ref: location.barrowworks.headworks, min: 1 }]
        text: "Her pencil stops. \"All right. Tell me which joints came apart first. We can't take that reading again, but we can keep yours.\""
    choices:
      - id: back
        text: "I'll tell you what I saw."
        next: again
  notes:
    text: "\"Not the Primer - Berrin keeps that, in Cairnwold, if he can find the shelf. This is mine.\" She takes a gathering of pages from the back of her ledger and tears it free along a line she has clearly folded many times. \"A fair copy of the one working I trust in the field. Brace Ward. It holds the body for a few breaths while the ground decides what it's doing. Read it once and it stays with you. And don't push past what your body can hold. I've seen what that costs; I'll swear to it.\""
    choices:
      - id: take
        text: "Thank you. I'll be careful."
        consequences:
          - { command: transfer_item, item_ref: item.tome.field_notes, count: 1, to: player }
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.sel_arien, dimension: trust, delta: 5, event: given_the_notes }
        next: notes_given
  notes_given:
    text: "She watches you put the pages away. \"If it ever starts making sense, tell me how. In detail. I'll write it down.\""
    choices:
      - id: back
        text: "I will."
        next: again
  foldscar:
    text: "Foldscar. Three standing stones around something that isn't there any more - or isn't here. I have guesses about what they were for. I've graded them, and none is better than one chance in three, so I don't say them aloud."
    choices:
      - id: tavar
        text: "Something out there is wrong. What is it?"
        conditions:
          - { kind: quest_state, quest_ref: quest.ashen_hollow.three_quiet_stones, is: not_started }
          - { kind: visited, dialogue_ref: dialogue.ashen_hollow.tavar_orr, node: greet, not: true }
          - { kind: world_state, flag_ref: world.foldscar.steadied, location_ref: location.foldscar, min: 0, max: 0 }   # not once the fold is quiet (L-17)
        consequences: [{ command: start_quest, quest_ref: quest.ashen_hollow.three_quiet_stones }]
        next: tavar
      - id: why
        text: "Why survey it at all?"
        conditions: [{ kind: visited, node: personal, not: true }]
        next: personal
      - id: back
        text: "I see."
        next: again
  personal:
    text: "\"Because nobody has. Not properly. The Record has eleven lines on the Foldscar, and four of them contradict the other seven.\" She straightens a pen that was already straight. \"I came for a season. That was thirty-one years ago. Tavar says that's a long season. It felt recent.\""
    choices:
      - id: back
        text: "It's a long season."
        next: again
  tavar:
    text: "Tavar Orr. He guides my surveys. Three days ago he walked in among the Quiet Stones for a chain I'd dropped - my chain; that goes in the record - and he's still standing there. I can see him from the rise. I can't reach him. My hand stops a hand's width short, and his voice comes from the wrong side. The stones were turned out of line when we found them. They matter: two chances in three. I don't know how."
    choices:
      - id: stones
        text: "What would you do with the stones?"
        next: stones
      - id: go
        text: "I'll go and look."
        next: again
  stones:
    text: "If I knew, I'd have done it. My best guess: turn them square to the ring - the north stone, the south-west, the south-east - and the heart itself last. And the spider on the east side hunts by the ground, not by sight. Walk past it. Don't run. That part isn't a guess. I watched it take a deer."
    choices:
      - id: back
        text: "Walk, don't run."
        next: again
  tavar_back:
    text: "\"I know. I saw the ring go quiet from the rise, and then I saw him walk.\" She writes something, crosses it out, and writes it again more carefully. \"I'd no idea how to get him out - only that the stones were wrong. Thank you. That's going in the Record, under your name, exactly as it happened.\""
    choices:
      - id: back
        text: "He's asking after you."
        next: again
  strain:
    text: "Past your tolerance a working takes it out of your body instead. It won't refuse you. That's the danger. I've seen it, so I'll swear to that much."
    choices:
      - id: back
        text: "I'll remember."
        next: again
# Said in passing, unprompted, when the character comes near (the bark patch): each line while its conditions hold.
  spill:
    text: "\"The Spill. Cairnwold's word, and a good one.\" She turns back eleven pages without looking for them. \"The Record has it as a gate. Not a fold - a gate: made, or kept, and stopped partway, which is a thing I have read about twice and seen never. It hums because it is still pulling against whatever stopped it. There are three anchors round a court at the heart of it, and they hum louder.\" She grades it with her pencil. \"If they were stilled, I think it would settle shut. Two chances in three. And something keeps that court. Cairnwold won't go down into it, and Cairnwold is not easily frightened.\""
    choices:
      - id: go
        text: "I'll go and look."
        next: again
  spill_back:
    text: "She listens to all of it without writing, which is not like her, and then writes all of it at once. \"Shut. Not open. Good.\" From the back of her ledger she takes a shard of dark iron no longer than a finger and holds it a moment before she gives it over. \"This came off the Spill before I was born - the Survey has carried it ever since and never known what it was for. Each gate's iron is one thing; this is that gate's. Take it down into the court one day and listen. It will tell you it is home.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I'll keep it."
        next: again
  tell_hounds:
    text: "\"The hound. Fast, and it does not tire, and it does not circle - it comes and it keeps coming.\" She is writing while she talks. \"The bite is the part that kills people. Ember-hot: no guard turns it and no armour takes it, so don't answer it with the thing you were taught to answer a bite with. Watch for the tell and be somewhere else when it lands.\" She looks up. \"And bring me the cinder sac. Not for the kill. For what it does in a salve. I'll tell you, and you'll want to know why, and the honest answer is that I don't.\""
    choices:
      - id: back
        text: "I'll bring you one."
        consequences: [{ command: tell_lore, lore_ref: lore.ember_hounds }]
        next: again
  survey:
    text: "Yes. Two things, in order of how much I want them. Woundmoss from the Charwood patch - two handfuls; I'm comparing it with last season's and the difference worries me, about two chances in three. And boneleaf from the Foldscar's edge, if you'll go nearer the ring than I will. Note which way the veins run. Exactly. They shouldn't run the way they do."
    choices:
      - id: take_moss
        text: "I'll bring you woundmoss."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.survey_herbs, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.survey_herbs }]
        next: moss_taken
      - id: take_boneleaf
        text: "I'll bring boneleaf."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.wrong_leaves, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.wrong_leaves }]
        next: boneleaf_taken
      - id: give_moss
        text: "Two handfuls of woundmoss."
        conditions:
          - { kind: quest_state, quest_ref: quest.bounty.survey_herbs, is: active }
          - { kind: has_item, item_ref: item.material.herb_woundmoss, count: 2 }
        consequences: [{ command: transfer_item, item_ref: item.material.herb_woundmoss, count: 2, to: npc }]
        next: moss_paid
      - id: give_boneleaf
        text: "Two boneleaf, from the Foldscar."
        conditions:
          - { kind: quest_state, quest_ref: quest.bounty.wrong_leaves, is: active }
          - { kind: has_item, item_ref: item.material.boneleaf, count: 2 }
        consequences: [{ command: transfer_item, item_ref: item.material.boneleaf, count: 2, to: npc }]
        next: boneleaf_paid
      - id: salve
        text: "Can you teach me to make a salve?"
        conditions: [{ kind: visited, node: salve_lesson, not: true }]
        consequences:
          - { command: teach, refs: [recipe.herbal.salve_minor] }
        next: salve_lesson
      - id: cinder
        text: "What do you want the cinder sacs for?"
        conditions:
          - { kind: visited, node: salve_lesson }
          - { kind: visited, node: ember_lesson, not: true }
        consequences:
          - { command: teach, refs: [recipe.herbal.salve_ember] }
        next: ember_lesson
      - id: back
        text: "Not today."
        next: again
  moss_taken:
    text: "North side of the trunks, in the patch past the standing beams. Two handfuls. Don't wash it - washing it changes it, and then I'm measuring you, not the moss."
    choices:
      - id: back
        text: "Unwashed."
        next: again
  boneleaf_taken:
    text: "The pale bushes round the Foldscar's rim. There's a spider that considers the east side hers. I'd put her claim at three in three. Go round."
    choices:
      - id: back
        text: "I'll go round."
        next: again
  moss_paid:
    text: "Thank you. Thinner than last season's - recently, I mean; thirty years or so. That's the worrying part. Here. The Survey pays eventually. I pay now."
    choices:
      - id: back
        text: "Thank you."
        next: again
  boneleaf_paid:
    text: "The veins run outward from the tip. Of course they do. I'll write it down, and nobody will read it, and it will still be true. Take this."
    choices:
      - id: back
        text: "It's true, then."
        next: again
  salve_lesson:
    text: "Two handfuls of woundmoss worked down over a fire - any fire; the yard's will do - and a pinch of cotton-grass lint to bind it. It won't mend a bone. It will stop the bleeding while you walk back here to have the bone set. That's three things, in order. Don't improve them."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Moss, fire, lint."
        next: again
  ember_lesson:
    text: "\"You noticed. Good - nobody else has.\" She lowers her voice, though there's no one to hear. \"Work one into a finished salve over the fire and the mending runs twice as fast. I have no idea why. I've tried it eleven times and it worked eleven times, and I still won't put it in the Record until I know why. So it's not a secret. It's unfinished.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Unfinished. I'll keep it to myself."
        next: again
  story_grazers:
    text: The grazers were first recorded that week. That puts two observations close together; it doesn't establish their order, or their cause.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_order:
    text: The heading names an order. It doesn't say whether the ledger's last entry was followed. The other records aren't all accessible yet;
      don't fill their gaps with a better story.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_catalog_stopped_watch:
    text: Otherborn carry odd things. You aren't the first. May I record what you call it?
    choices:
    - id: name
      text: A watch. It used to tell the time.
      next: story_catalog_stopped_watch_named
    - id: back
      text: I'd rather keep it private.
      next: again
  story_catalog_stopped_watch_named:
    text: Stopped watch. I'll record that it no longer moves, and that you say it told the time. The object doesn't establish where it came from.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_catalog_brass_key:
    text: Otherborn carry odd things. You aren't the first. May I record what you call it?
    choices:
    - id: name
      text: A house key. I do not know a lock for it here.
      next: story_catalog_brass_key_named
    - id: back
      text: I'd rather keep it private.
      next: again
  story_catalog_brass_key_named:
    text: Brass key; intended lock unverified. I'll keep the shape in the record. I won't improve the account with an invented door.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_catalog_glass_marble:
    text: Otherborn carry odd things. You aren't the first. May I record what you call it?
    choices:
    - id: name
      text: A marble. A little glass ball.
      next: story_catalog_glass_marble_named
    - id: back
      text: I'd rather keep it private.
      next: again
  story_catalog_glass_marble_named:
    text: Glass marble. Round, transparent, carried by an Otherborn. That's an observation, not a theory of its arrival.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_catalog_unreadable_page:
    text: Otherborn carry odd things. You aren't the first. May I record what you call it?
    choices:
    - id: name
      text: I cannot read this printing either.
      next: story_catalog_unreadable_page_named
    - id: back
      text: I'd rather keep it private.
      next: again
  story_catalog_unreadable_page_named:
    text: Unreadable page, then. Neither of us reading it isn't evidence that it says nothing. I'll copy the shapes, not guess at the words.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_species_robin:
    text: Locally we call such things leakwild. If you know a name, I'll record your word, not improve it into an explanation.
    choices:
    - id: name
      text: I call it a robin.
      next: story_species_robin_named
    - id: back
      text: I'd rather leave it unnamed.
      next: again
  story_species_robin_named:
    text: Robin. Your word for it. The name doesn't tell us how it came here.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_species_dandelion:
    text: Locally we call such things leakwild. If you know a name, I'll record your word, not improve it into an explanation.
    choices:
    - id: name
      text: I call it a dandelion.
      next: story_species_dandelion_named
    - id: back
      text: I'd rather leave it unnamed.
      next: again
  story_species_dandelion_named:
    text: Dandelion. Your word for it. The name doesn't tell us how it came here.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  tell_otherfold:
    text: "An Otherfold is a bend in the ordinary shape of space and time, and it is the least strange thing the surveyor has a word for, which she says is the worrying part. A fold can join two far places. It can join two eras. It can join two realities. It can put a room inside itself so the inside is larger than the outside. It can shorten a road for a while, then let the road go back to its real length. Some folds rise on their own, and some are pinned in place on purpose, and some come undone."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.otherfold }]
        next: again

  tell_othergate:
    text: "An Othergate is the mouth of a road that runs through the Other, and it is a word for the opening rather than for any one shape of opening. Some rise on their own. Some are made. Some are a natural thing that has been steadied and kept. They do not look alike, and the surveyor says that anyone who tells you to know a gate by its shape has only ever seen one. An arch, a standing stone, a mirror, a well, a root, a ruin, a place where the ground simply stops being ground; any of these has been a gate somewhere."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.othergate }]
        next: again

  tell_otherway:
    text: "An Otherway is a road that runs through the Other, and the surveyor's first rule about them is that they do not lead where a road leads. Some are steady and mapped. Some change what they lead to while they are being walked. Some open only under a condition, or to a key, or to a knowing, or to a rite. Some are safe to the far end, and some hold a hazard between the mouth and the end. Some will carry a cart and a companion, and some will carry one person and nothing more."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.otherway }]
        next: again

  tell_pacha:
    text: "A Pacha is the whole of a place and its time: its space, its matter, its history and its laws, taken together as one thing. Sel Arien sets it out the way she sets out a measure. It is not a world, and not a plane, and not a dimension; a world is a thing that sits inside a Pacha, the way a room sits inside a house. Ask her for more and she will say the word matters because people keep using it wrongly, and that she keeps the word apart so the reading does not drift. One Pacha is not a part of a larger one."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.pacha }]
        next: again

  tell_pachakuti:
    text: "A Pachakuti is the turn between one Pacha and the next: the moment one whole reality moves over into another. It is not a natural thing, and it does not come on a schedule. Something causes it, and no one can say what. Sel Arien will not put a guess where the cause belongs. She writes the word, then leaves the space after it open, because the honest answer to what turns the worlds is that nobody knows, and a guess written down too soon begins to be read as a fact."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.pachakuti }]
        next: again

  tell_siann:
    text: "Sel Arien, the archivist who keeps her books at the survey table east of the lodge, is the Siann habit made flesh. The Record holds eleven lines on the Foldscar, and four of them contradict the other seven, so she grades her own guesses and says none of them aloud at better than one chance in three. She came out here for a season. That was thirty-one years ago, and when Tavar Orr tells her it was a long season, she answers only that it felt recent. She will take your account of a thing and forbid you to improve it, because to her the word, exactly as given, is the whole of what a witness is worth. That is the Siann way in one scholar: time spent like a surplus, and testimony held like the only thing that cannot be bought back."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.siann }]
        next: again

  tell_the_last_pachakuti:
    text: "Every people's account of itself hangs on the last Pachakuti, and the surveyor keeps the record of what the turn left behind in each of them. The Veth came through changed, quicker to learn and quicker to forget. The Kal were fixed to stone where the turn caught them, and a Kal caught when a world turns does not die; they set, all the way through. The Siann came through with no account of before, their oldest writing beginning after the turn, in the middle of a sentence. The turn is the hinge the whole of it swings on."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_last_pachakuti }]
        next: again

  tell_the_other:
    text: "The Other is the name the surveyor keeps for what stands behind ordinary reality, and she will not give it a shape. It may be a layer outside the world, or the space between places, or the space between times, or the structure through which distance and time can fold, or a gathering of places and times that cannot be reached. It may be several different things that people have wrongly put under one word. What she will say plainly is that no one people holds the whole of it, and that anyone who tells you otherwise is selling something."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_other }]
        next: again

  tell_the_siann_missing_page:
    text: "Ask a Siann what the missing part said, and the answer is a long one about something else. Sel Arien will confirm that the record begins mid-sentence, and grade that as a certainty, and then she will not go further. The oldest Siann know what is gone from the front of it, and they have kept that page closed for centuries, because to open it would be to admit that the Record, the whole standing of their people, set on exact testimony, begins with a gap they have known about and never once reported. That is the finding, and the surveyor leaves it where it stands."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_siann_missing_page }]
        next: again

  tell_the_silence:
    text: "The stories of what came before the last Pachakuti, and none of them agree. The Veth say the world ended. The Kal say it was made, and then left, the maker gone and the work standing. The Orenth say a door was left open. The Mor say their world was killed. The Constructed say theirs was written, and that the writing is still being read. Sel Arien has heard all five and writes none of them as fact, because no two of them agree, and a surveyor who picks one on the strength of a story well kept has stopped surveying."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_silence }]
        next: again

  tell_the_specification:
    text: "The Constructed hold that everything is a description being carried out, and they do not say it as a metaphor. A tree is a description running; a stone is a description running; a Constructed is a description running, and the running is the whole of what it is. They have no story of creation because they have the writing for it, and the writing has no author's name. The surveyor reports this exactly, because it is the rare doctrine that comes with its own pages, and she notes that a people who can prove they were made find the proving harder to bear than a people who only believe it."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_specification }]
        next: again

  tell_the_substrate:
    text: "The Vaskaal did not come through a Pacha. They came around them, across whatever it is that holds one Pacha apart from the next. Sel Arien records the crossing, then records what they will say about the space itself, which is almost nothing. They crossed it, and they are alive, and no one native to a Pacha is known to have done the same, because nothing native to that space is known to live in it. The surveyor has written the word substrate in the margin and left it there, unclaimed by anyone else."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_substrate }]
        next: again

  tell_the_veil:
    text: "The Veil is the name for the seam where ordinary reality gives onto the Other, and the surveyor is careful about the word. It need not be a skin or a wall. In some places it runs thin on its own. Old events have worn it. Magic pulls at it. Gates worked too often have frayed it. In a few places it has been pierced on purpose, or pinned open. Sel Arien treats the Veil as a line she can read rather than a thing she can see, and she warns against asking the word to be more solid than the fact."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.the_veil }]
        next: again

  tell_boneleaf_p2:
    text: "Sel Arien wants the leaves, and she wants you to note which way the veins run, exactly. They should not run the way they do, she says, and when the leaf comes back with its veins running outward from the tip she says it as if it were expected and still not true. I will write it down, she says, and nobody will read it, and it will still be true. That is the shape of the thing: a plant that grows only at the Foldscar and keeps whatever it knows in the wrong way its veins lie, and a surveyor who will record the fact and leave the meaning alone."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.boneleaf }]
        next: again

  tell_cinder_sac_p2:
    text: "Sel Arien buys the sacs, and if you press her for the reason she will shut the door even though no one is near, and tell you. Work one into a finished salve over the fire and the mending runs twice as fast. She has no idea why. She has tried it eleven times and it has worked eleven times, and she still will not write it down until she knows the reason, so it is not a secret but a thing unfinished. A thing that works and cannot say why is kept carefully and not called knowledge. That is the rule she keeps for the sacs, the same rule she keeps for the stones she will not name a people for."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.cinder_sac }]
        next: again

  tell_woundmoss_p2:
    text: "Sel Arien asks for two handfuls and no washing, and she will tell you why with the exactness she keeps for a measure. She is comparing this season's moss with last season's, and the difference worries her. It is thinner than it was, and recently so, and to her that is the part worth writing down. Washing it would change it, she says, and then she would be measuring you and not the moss. The moss still stops the bleeding. What she cannot say is how much longer it will, and she will not guess."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.woundmoss }]
        next: again

  tell_otherborn_p2:
    text: "The archivist has a rule for the word, and she states it over a stranger's odd belongings. Otherborn carry odd things, she says, and you are not the first. She will take a stopped watch, a brass key, a glass marble, an unreadable page, and she will write down what you call each of them, and she will not improve the account with an invented origin. The object does not establish where it came from, she says. That is an observation, and she will not let it become more than that."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.otherborn }]
        next: again

  tell_othermarked_p2:
    text: "The surveyor keeps the two words as a surveyor keeps two measures, and she will correct anyone who runs them together. Born to it is one thing, she says; marked by it is another, and the one says where a person came from while the other says what the world did to them on the way. She will not say which is the heavier thing to carry, because she has records of both and no scale that weighs them against each other. She writes the distinction, and leaves the pity out."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.othermarked }]
        next: again

  tell_otherwhen_p2:
    text: "The surveyor warns that a road which stops leading anywhere has a twin that stops leading anywhen, and the twin is the harder one to spot, because a person can see that the country is wrong but not that the hour is. Ask her how far back or forward, and she will say the question is already wrong: the far side of an Otherwhen is not a date but a place, stood at the wrong end of the year. She has no account of what it is like there. She will tell you exactly that, and nothing more."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.otherwhen }]
        next: again

  tell_otherwhere_p2:
    text: "The surveyor keeps the word for the moment a road stops being a road, and she says it plainly: a gate that leads somewhere is one thing, and a gate that leads elsewhere is another. That gate does not lead north, she will tell you; it leads Otherwhere. She will not say what is on the far side, because she has not stood there, and a surveyor who fills the far side in from a guess has stopped measuring. The word is the whole of what she knows, and she will not let it carry more than that."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.otherwhere }]
        next: again

  tell_otherwrought_p2:
    text: "The surveyor will tell you how to know one when you hold it, and it is not by any glow or mark. An Otherwrought thing is not a common object with a spell laid over it, she says; it is a thing made from the wrong side of the seam, and it shows in the way it sits in the hand and the way it answers work. She has handled a few, and she will not pretend they were easy. What she will not do is tell you where the rest of them are, because that would be a guess, and guesses are not for the Record."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.otherwrought }]
        next: again

  tell_long_survey:
    text: "The Long Survey is Sel Arien's work, and its seat is the survey table at the waystation, where she watches the Foldscar and the old workings around it. It surveys what nobody has properly surveyed: the Foldscar, three standing stones around something that is no longer there or never was, and the sealed ring under the hill. What it wants is the Quiet Stones set right — turned square to the ring, the heart steadied last — because a thing measured wrong can be put right, and a thing never measured cannot. It is a patient work, and a work of years; she came for a season, thirty-one years ago."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.long_survey }]
        next: again

