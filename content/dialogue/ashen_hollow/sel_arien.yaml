id: dialogue.ashen_hollow.sel_arien
kind: dialogue
schema: 1
display_key: dialogue.ashen_hollow.sel_arien.name
tags: [dialogue]
notes: Sel Arien, archivist and surveyor (content bible §9) - Foldscar framing and access to magic, uncertain rather than all-knowing. She gives her Field Notes (Brace Ward) - the Resonance Primer is Berrin's alone (owner, 2026-10-15, O-8) - and gives Quest 2, The Three Quiet Stones (M6) - her guide Tavar is caught in the Foldscar. Offering the notes is not a once-only line - hearing the offer is not getting them - and "notes_given", reached only when they have changed hands, is what marks them given (the Phase-1 technical audit, H-01). Voice (NPC_PERSONALITY_BIBLE.md) - a Siann, earnest and exact, who grades her own guesses, treats the newcomer as a witness, and keeps the Record.
participants: [npc.ashen_hollow.sel_arien]
root_node: greet
nodes:
  greet:
    text: "\"Careful with the table - half of what's on it is older than the waystation, and the other half is my handwriting, which is worse. Sel Arien. I survey the ruin south-east of here, when the spider lets me.\" She looks at you a moment longer than people usually do. \"You came over the ridge. One day you'll tell me what you saw. Exactly. Don't improve it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: recognition
        text: "Hold your hand out. … Yes. You've held something shut for a night and it cost you. That is in the hand."
        conditions: [{ kind: call, call_ref: call.ward_keeper }]
        next: recognised
      - id: recognition_2
        text: "You've had things apart. Not mine — ask first. Half of it's older than the waystation."
        conditions: [{ kind: call, call_ref: call.tinker }]
        next: recognised
      - id: recognition_3
        text: "You read. Thank the quiet for that. Most people who come off that road can't."
        conditions: [{ kind: call, call_ref: call.scholar }]
        next: recognised
      - id: recognition_4
        text: "Don't wash it. I mean it. Washing it changes it and then I am measuring you."
        conditions: [{ kind: call, call_ref: call.herbalist }]
        next: recognised
      - id: recognition_5
        text: "Put your odd things on the table. All of them. I have a page for this, and it is short."
        conditions: [{ kind: call, call_ref: call.fell_through }]
        next: recognised
      - id: recognition_6
        text: "You came over the ridge and you can already tell me which way it runs. Good. Write it down before somebody tells you what it was."
        conditions: [{ kind: call, call_ref: call.cartographers_apprentice }]
        next: recognised
      - id: books
        text: "Is there anything here I could learn from?"
        next: notes
      - id: ruin
        text: "What ruin?"
        next: foldscar
      - id: tavar_back
        text: "Tavar Orr's free. He was caught in the ruin."
        conditions: [{ kind: visited, dialogue_ref: dialogue.ashen_hollow.tavar_orr, node: greet }]
        consequences:
          - { command: start_quest, quest_ref: quest.ashen_hollow.three_quiet_stones }
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.sel_arien, dimension: trust, delta: 5, event: brought_tavar_back }
          - { command: report_act, act: switch_set, flag_ref: world.foldscar.steadied }   # the Long Survey learns the fold is quiet (WP6)
        next: tavar_back
      - id: leave
        text: "I'll leave you to it."
      - id: barrowworks_kept
        text: "I left the Barrowworks measure intact."
        conditions:
          - { kind: world_state, flag_ref: world.barrowworks.headworks_preserved, location_ref: location.barrowworks.headworks, min: 1 }
          - { kind: visited, node: barrowworks_report, not: true }
        consequences: [{ command: report_act, act: switch_set, flag_ref: world.barrowworks.headworks_preserved }]
        next: barrowworks_report
      - id: barrowworks_taken_apart
        text: "I dismantled the Barrowworks measure."
        conditions:
          - { kind: world_state, flag_ref: world.barrowworks.headworks_dismantled, location_ref: location.barrowworks.headworks, min: 1 }
          - { kind: visited, node: barrowworks_report, not: true }
        next: barrowworks_report
  recognised:
    text: "Hold your hand out. … Yes. You've held something shut for a night and it cost you. That is in the hand."






  again:
    text: "You again. Good. I've been talking to the stones, and they make poor witnesses."
    choices:
      # Offered until the notes have changed hands: leaving her at the offer, a full pack or a load in between loses nothing. A save that
