          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.sel_arien, dimension: trust, delta: 5, event: brought_tavar_back }
          - { command: report_act, act: switch_set, flag_ref: world.foldscar.steadied }   # the Long Survey learns the fold is quiet (WP6)
        next: tavar_back
      - id: survey
        text: "Does the Survey need anything collected?"
        next: survey
      - id: barrowworks_kept
        text: "I left the Barrowworks measure intact."
        conditions:
          - { kind: world_state, flag_ref: world.barrowworks.headworks_preserved, location_ref: location.barrowworks.headworks, min: 1 }
          - { kind: visited, node: barrowworks_report, not: true }
        consequences: [{ command: report_act, act: switch_set, flag_ref: world.barrowworks.headworks_preserved }]
        next: barrowworks_report
      - id: barrowworks_taken_apart
        text: "I dismantled the Barrowworks measure."
        conditions:
          - { kind: world_state, flag_ref: world.barrowworks.headworks_dismantled, location_ref: location.barrowworks.headworks, min: 1 }
          - { kind: visited, node: barrowworks_report, not: true }
        next: barrowworks_report
      # Spec 41: the beasts on this road, and what she wants them for. The page is hers; the herblore is a thing she says and will not write down.
      - id: ask_hounds
        text: "Tell me about the ember hounds."
        next: tell_hounds
      # What Stands on the Top (docs/FIELD_RUINS.md): the Spill, and the shard once the gate is still.
      - id: spill
        text: "Something hums on the top past Old Late. Do you know what it is?"
        conditions: [{ kind: quest_state, quest_ref: quest.field.what_stands_on_the_top, is: not_started }]
        consequences: [{ command: start_quest, quest_ref: quest.field.what_stands_on_the_top }]
        next: spill
      - id: spill_back
        text: "The gate on the top is still."
        conditions:
          - { kind: world_state, flag_ref: world.field.stilled, location_ref: location.field.stopped_gate, min: 1 }
          - { kind: visited, node: spill_back, not: true }
        consequences:
          - { command: start_quest, quest_ref: quest.field.what_stands_on_the_top }
          - { command: transfer_item, item_ref: item.quest.firstfold_shard, count: 1, to: player }
          - { command: report_act, act: switch_set, flag_ref: world.field.stilled }
        next: spill_back
      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
