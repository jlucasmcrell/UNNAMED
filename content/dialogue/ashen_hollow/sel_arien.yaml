  - { text: "Don't mind me. I'm measuring the stones' shadows. They're late." }
  - { text: "If you saw something odd on the road, I want it exactly. Don't improve it." }
  - text: "Read them yet? Tell me exactly what it felt like."
    conditions: [{ kind: visited, node: notes_given }]
