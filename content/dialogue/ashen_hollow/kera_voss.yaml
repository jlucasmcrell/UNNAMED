id: dialogue.ashen_hollow.kera_voss
kind: dialogue
schema: 1
display_key: dialogue.ashen_hollow.kera_voss.name
tags: [dialogue]
notes: Kera Voss, the smith (content bible §9) - teaches the forge, trades, and has an opinion of what you make. Asking her to teach starts Quest 1, Iron Under Ash (M5). Voice (NPC_PERSONALITY_BIBLE.md) - a Kal, loud and warm and blunt, who judges everything by how well it is made, people included, and calls the newcomer "new iron". Her one fear is the Foldscar - a Kal caught when a world turns does not die, it sets to stone (RACES.md, Kal).
participants: [npc.ashen_hollow.kera_voss]
root_node: greet
nodes:
  greet:
    text: "\"Ha - mind the anvil, it bites. Kera. Come here, let me look at you.\" She takes your hand and turns it over like a horseshoe she's thinking of buying. \"Good long bones. Not one callus. New iron, you are - never been near a fire.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Then teach me the forge."
        consequences:
          - { command: teach, refs: [recipe.smithing.iron_billet, recipe.smithing.march_spear] }
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.kera_voss, dimension: trust, delta: 5, event: asked_to_learn }
          - { command: start_quest, quest_ref: quest.ashen_hollow.iron_under_ash }
        next: lesson
      - id: wings
        text: "Are those wings?"
        next: wings
      - id: trade
        text: "What do you have for sale?"
        consequences: [{ command: open_service, service: trade }]
      - id: leave
        text: "Another time."
  again:
    text: "Back, and all your fingers still on. That's a good start."
    choices:
      - id: lamework
        text: "Can you teach me to make armour?"
        conditions:
          - { kind: visited, node: lesson }
          - { kind: visited, node: lamework, not: true }
        consequences:
          - { command: teach, refs: [recipe.smithing.lamework_jack, recipe.smithing.lame_coif, recipe.smithing.lame_sabatons] }
        next: lamework
      - id: teach
        text: "Teach me the forge."
        conditions: [{ kind: visited, node: lesson, not: true }]
        consequences:
          - { command: teach, refs: [recipe.smithing.iron_billet, recipe.smithing.march_spear] }
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.kera_voss, dimension: trust, delta: 5, event: asked_to_learn }
          - { command: start_quest, quest_ref: quest.ashen_hollow.iron_under_ash }
        next: lesson
      - id: where
        text: "Where do I find the iron?"
        conditions:
          - { kind: quest_state, quest_ref: quest.ashen_hollow.iron_under_ash, is: active }
          - { kind: quest_state, quest_ref: quest.ashen_hollow.iron_under_ash, objective: o_ore, is: satisfied, not: true }
        next: where
      - id: show_fine
        text: "I made a spear. Look."
        conditions:
          - { kind: has_item, item_ref: item.weapon.march_spear, quality_min: 1 }
          - { kind: visited, node: praised, not: true }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.kera_voss, dimension: respect, delta: 10, event: showed_fine_work }
        next: praised
      - id: show_spear
        text: "I made a spear. Look."
        conditions:
          - { kind: has_item, item_ref: item.weapon.march_spear }
          - { kind: has_item, item_ref: item.weapon.march_spear, quality_min: 1, not: true }
          - { kind: visited, node: judged, not: true }
        next: judged
      - id: sword
        text: "What do you make of this sword?"
        conditions:
          - { kind: has_item, item_ref: item.weapon.rusted_sword }
          - { kind: visited, node: sword, not: true }
        next: sword
      - id: tavar
        text: "You know Tavar?"
        conditions:
          - { kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr }
          - { kind: visited, node: tavar, not: true }
        next: tavar
      - id: steadied
        text: "The Foldscar's gone quiet."
        conditions:
          - { kind: visited, dialogue_ref: dialogue.ashen_hollow.tavar_orr, node: greet }   # Tavar is free only once the fold is quiet
          - { kind: visited, node: steadied, not: true }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.kera_voss, dimension: trust, delta: 5, event: quieted_the_fold }
        next: steadied
      - id: foldscar
        text: "Have you been out to the Foldscar?"
        conditions:
          - { kind: visited, dialogue_ref: dialogue.ashen_hollow.tavar_orr, node: greet, not: true }
          - { kind: visited, node: foldscar, not: true }
        next: foldscar
      - id: wings
        text: "About the wings."
        conditions: [{ kind: visited, node: wings, not: true }]
        next: wings
      - id: personal
        text: "What keeps a smith out here?"
        conditions: [{ kind: visited, node: personal, not: true }]
        next: personal
      - id: trade
        text: "What do you have for sale?"
        consequences: [{ command: open_service, service: trade }]
      - id: work
        text: "Need anything brought in?"
        next: work
      # The reachable portal seeds this offer flag in the intake hall's cell before entry.
      # With Barrowworks disabled the run holds no portals, so the offer stays hidden.
      - id: ring
        text: "What's the sealed ring under the hill?"
        conditions:
          - { kind: world_state, flag_ref: world.barrowworks.ring_accessible, location_ref: location.barrowworks.intake_hall, min: 1 }
          - { kind: visited, node: barrowworks, not: true }
        next: barrowworks
      - id: ring_again
        text: "About the ring under the hill."
        conditions:
          - { kind: world_state, flag_ref: world.barrowworks.ring_accessible, location_ref: location.barrowworks.intake_hall, min: 1 }
          - { kind: visited, node: barrowworks }
        next: barrowworks_again
      # o_done: telling her which way it went. Two replies because the design's choice is two answers and a
      # condition list is a conjunction, so one reply per ending is the only honest way to gate them.
      - id: ring_whole
        text: "I left the mechanism standing."
        conditions:
          - { kind: world_state, flag_ref: world.barrowworks.headworks_preserved, location_ref: location.barrowworks.headworks, min: 1 }
          - { kind: visited, node: barrowworks_told, not: true }
        next: barrowworks_told
      - id: ring_broken
        text: "I dismantled the measure."
        conditions:
          - { kind: world_state, flag_ref: world.barrowworks.headworks_dismantled, location_ref: location.barrowworks.headworks, min: 1 }
          - { kind: visited, node: barrowworks_told, not: true }
        consequences:
          - { command: report_act, act: switch_set, flag_ref: world.barrowworks.headworks_dismantled }
        next: barrowworks_told
      - id: leave
        text: "Nothing today."
      - id: story_cut
        text: What should I look for at Blackvein?
        next: story_cut
        consequences:
        - command: start_quest
          quest_ref: quest.main.closed_seam
      - id: story_ledger
        text: This fragment names an Order of the Lantern.
        next: story_ledger
        conditions:
        - kind: has_item
          item_ref: item.story.lantern_ledger
        consequences:
        - command: start_quest
          quest_ref: quest.main.closed_seam
        - command: start_quest
          quest_ref: quest.story.lantern_ledger
  # o_offer accepts either of these, so a character who comes back a second time still starts the quest.
  barrowworks:
    text: "She puts the hammer down, which she does not often. \"Service ring. Thirteen rooms under the Ashen Hollow, and a sealed door the strata never shut.\" She looks at you the way she looks at a weld. \"They built it to gauge something and never finished the job - the readings are cut into its walls, or so the notice says. I want to know what it measures. And I want to know what you think we should do about the thing that measures it. The way in is under the hill. Go on - I'll want your bones the right shape when you come back out.\""
    once: true
    next_if_exhausted: barrowworks_again
    choices:
      - id: accept
        text: "I'll find out what it measures."
        consequences:
          - { command: start_quest, quest_ref: quest.barrowworks.unfinished_measure }
          # The wedge has to be taught somewhere or `o_wedge` can never be crafted: crafting refuses a recipe the
          # character does not know (Crafting.cs:164) and nothing taught this one (review B3b).
          - { command: teach, refs: [recipe.smithing.fitting_wedge] }
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.kera_voss, dimension: trust, delta: 5, event: asked_about_the_ring }
        next: again
  barrowworks_again:
    text: "\"The ring. Readings on the walls, and a machine at the bottom of it nobody finished.\" She turns a billet over. \"Bring me what it says. And bring me your own mind about it - that's the part I can't do from here.\""
    choices:
      # The offer is repeated here because `barrowworks` above is spent once heard: a character who listens and
      # walks away without answering would otherwise lose the quest for good. SOC001 refused the first version
      # of this for exactly that reason. Gated on the quest not being started, so it disappears once taken.
      - id: accept
        text: "I'll find out what it measures."
        conditions: [{ kind: quest_state, quest_ref: quest.barrowworks.unfinished_measure, is: not_started }]
        consequences:
          - { command: start_quest, quest_ref: quest.barrowworks.unfinished_measure }
          # The wedge has to be taught somewhere or `o_wedge` can never be crafted: crafting refuses a recipe the
          # character does not know (Crafting.cs:164) and nothing taught this one (review B3b).
          - { command: teach, refs: [recipe.smithing.fitting_wedge] }
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.kera_voss, dimension: trust, delta: 5, event: asked_about_the_ring }
        next: again
      - id: back
        text: "I'll come back with it."
        next: again
  # o_tell: the character has made the choice and comes back to say which. Kera takes either, which the design
  # is explicit about - preserve or dismantle, neither is a failure.
  barrowworks_told:
    text: "\"So.\" She doesn't ask which way you went; she watches your hands instead, which is how she asks everything. Then she nods, once, and goes back to the fire. \"Right. That's the measure finished, then - one way or the other. Not many people get to say that about a thing that big.\""
    once: true
    variants:
      - conditions: [{ kind: world_state, flag_ref: world.barrowworks.headworks_preserved, location_ref: location.barrowworks.headworks, min: 1 }]
        text: "\"Left it running?\" She turns the billet once. \"All right. Keep the drawings. A machine nobody understands is a fine argument for better drawings.\""
      - conditions: [{ kind: world_state, flag_ref: world.barrowworks.headworks_dismantled, location_ref: location.barrowworks.headworks, min: 1 }]
        text: "\"Two ingots, and the machine's done taking up the room.\" She nods. \"I can work with that. Tell Sel before she goes down there with a notebook and finds a pile of joints.\""
    next_if_exhausted: again
    choices:
      - id: back
        text: "It's done."
        next: again
  lesson:
    text: "Good! Then bring me iron. Blackvein Cut - the old quarry, south off the road. There's a seam on the floor of it; break me some ore out. Ore goes in the hearth and comes out a billet, if you keep the fire honest. A billet and a straight ash haft - Charwood's thick with ash - and the anvil makes you a spear. Make it yourself, bring it here, and I'll tell you the truth about it. And don't blame the iron. It's always the hands."
    once: true
    next_if_exhausted: again
    choices:
      - id: thanks
        text: "I'll bring you a spear."
        next: again
  where:
    text: "South down the road to the quarry mouth, then past the overlook to the floor. Seam's on the west face - black, like somebody spilled the night on it. Things walk down there. Bone things. Badly made, and they don't know it. Hit them at the joints - that's where anything made badly gives first."
    choices:
      - id: back
        text: "The joints. Right."
        next: again
  praised:
    text: "She sights down the shaft, flexes it against the anvil horn, raps the socket with a knuckle. \"Ha! Straight. Point holds. Socket's snug. That's made well, new iron - and I don't say made well about my own cousins.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "Thank you."
        next: again
  judged:
    text: "Hm. It'll hold. Mostly. See here - the socket's loose, you hurried the quench. Don't be sorry, be slower. The next one'll be better. They always are, if you're paying attention."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I'll try again."
        next: again
  wings:
    text: "Something behind her shoulders shifts under the harness, like a sail deciding against it. \"They fold. They're not for flying - not in this air, and not with my supper in me. Good for coming down off a roof slow. Good for keeping the forge draught off in winter. Don't touch them. I'd take your arm off, and then I'd feel bad, and then where would we be.\""
    choices:
      - id: back
        text: "Hands to myself."
        next: again
  sword:
    text: "\"That? That's not a sword, that's a warning. Somebody let it sleep wet for a year.\" She runs a thumb down the flat anyway, and her face softens. \"...Edge is still in there, if you go looking. Old iron's like that. Keep it oiled until you've something better - and you will, if you listen to me.\""
    choices:
      - id: back
        text: "I'll oil it."
        next: again
  tavar:
    text: "\"The walker! Sel's been sick with it - come here.\" She claps Tavar on the shoulder, and her hand lands a finger's width from where his shoulder is. She looks at her hand. \"...Ha. Still a bit late, are you?\" \"Only on the left,\" says Tavar. \"Well, stand on my right, then. I'm not chasing you round my own forge.\""
    choices:
      - id: back
        text: "He's with me now."
        next: again
  foldscar:
    text: "The noise goes out of her all at once. \"No. And I won't.\" She sets the hammer down, which she has not done since you arrived. \"You know what happens to a Kal caught when a world turns? We don't die. We set. Stone, all the way through, standing where we stood. That ring out there is a world half-turning all day long. I'll make you anything you like to carry out there. I'm not carrying me.\""
    choices:
      - id: back
        text: "I understand."
        next: again
  steadied:
    text: "\"Quiet.\" She says it like she's testing the word for cracks. \"Quiet's not gone. Quiet's not gone.\" Then she laughs, too loud, and claps you on the arm hard enough to hurt. \"Ha! All right. All right. Thank you, new iron. I might walk out to the edge of it one day. In a month. With a rope.\""
    choices:
      - id: back
        text: "I'll hold the rope."
        next: again
  personal:
    text: "The road! Everything that breaks between the ridge and Vessmere comes past this anvil sooner or later - hinges, cart-tyres, Renn's terrible roof. I like a place where things need mending. And Durn's up the other end of it, in Cairnwold. Says four words a day, and three of them are 'no'. We disagree about everything but iron."
    choices:
      - id: back
        text: "Sounds like a friendship."
        next: again
# Said in passing, unprompted, when the character comes near (the bark patch): each line while its conditions hold.
  work:
    text: "Ha! Need anything. Ore, new iron - always ore. The seam's finite and I'm not. Two lumps from wherever you find them: the shelf, the old spoil heaps, those rotten crags past Cairnwold. And stop wasting arrows - I'll show you how to make your own."
    choices:
      - id: take_ore
        text: "Two lumps of ore. I'll bring them."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.shelf_iron, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.shelf_iron }]
        next: ore_taken
      - id: give_ore
        text: "Here's your ore."
        conditions:
          - { kind: quest_state, quest_ref: quest.bounty.shelf_iron, is: active }
          - { kind: has_item, item_ref: item.material.iron_ore, count: 2 }
        consequences: [{ command: transfer_item, item_ref: item.material.iron_ore, count: 2, to: npc }]
        next: ore_paid
      - id: fletch
        text: "Show me how to make arrows."
        conditions: [{ kind: visited, node: fletching, not: true }]
        consequences:
          - { command: teach, refs: [recipe.fletching.arrows, recipe.fletching.hunting_bow] }
        next: fletching
      - id: silk
        text: "Could I string a bow with spider silk?"
        conditions:
          - { kind: visited, node: fletching }
          - { kind: visited, node: silk_string, not: true }
        consequences:
          - { command: teach, refs: [recipe.fletching.hunting_bow_silk] }
        next: silk_string
      - id: back
        text: "Later."
        next: again
  silk_string:
    text: "\"Ha! Now you're thinking like a Kal.\" She pulls a hank of grey thread off a nail behind the bellows. \"Dragline. I lash handles with it. Two strands, twisted, waxed - better than cotton grass, and it doesn't sulk in the wet. Mind, you've to take it off the spider first, and the spider has views.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "The spider has views."
        next: again
  ore_taken:
    text: "The spoil at the old cut gives a lump or two a day if you turn it over. Don't you strike the seam for it - that's for real work. Go on. Shoo."
    choices:
      - id: back
        text: "Two lumps."
        next: again
  ore_paid:
    text: "Ha! Rusty, lumpy, perfect. Coin's on the bench - and don't count it in front of me, it's rude."
    choices:
      - id: back
        text: "Thanks, Kera."
        next: again
  fletching:
    text: "Arrows! A smith's afterthought - so think about them after. Split an ash haft into shafts, feather them - hen feathers do, the hens won't miss them - and that's a dozen. A bow's two hafts, a small hide for the grip and a string. Spin the string from the cotton grass in Cairnwold's moss. Or don't, and find out why you should. Bench, not my anvil."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "The bench, then."
        next: again
  story_cut:
    text: Look at the joins beside the iron, new iron. A cut edge isn't the same as a natural break. Gather what you need, try the forge, then tell
      me what you've seen. If I'm not there, find me when I'm back at work, seven to nineteen.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_ledger:
    text: Ha! That's a cut edge. Look at the spacing, new iron. Worked out? No. Someone shut it. That's a maker's cut. Not the same as knowing the
      maker.
    choices:
    - id: compare
      text: I can see the join. I cannot date it.
      next: story_ledger_read
    - id: back
      text: I want to compare it with the face again.
      next: again
  story_ledger_read:
    text: Order of the Lantern. An incomplete list, and a lantern-forge east. Keep the reading separate from the theory. Sel can compare it with
      the other records when those are reachable.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  lamework:
    text: "Small lames, new iron. A jack over your vest, a coif that leaves your face out, and sabatons over your boots. Let each lame move with its neighbour. If your ankle can't bend, you've made an expensive bucket."
    choices:
      - id: back
        text: "I'll try it at the anvil."
        next: again
barks:
  - { text: "Ha! Look at that weld. I'm talking to the hinge, not you." }
  - { text: "Hand me the - no. Never mind. Wings are quicker." }
  - { text: "Mind the anvil. It bites." }
  - text: "Blackvein's south, new iron. The ore won't walk up here on its own."
    conditions:
      - { kind: quest_state, quest_ref: quest.ashen_hollow.iron_under_ash, is: active }
      - { kind: quest_state, quest_ref: quest.ashen_hollow.iron_under_ash, objective: o_ore, is: satisfied, not: true }
  - text: "There's my spear-maker! Walk tall, new iron."
    conditions: [{ kind: visited, node: praised }]
  - text: "Walker! Keep up - oh. You are."
    conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr }]
  - text: "Quiet out east today. Ha. I'll take it."
    conditions: [{ kind: visited, dialogue_ref: dialogue.ashen_hollow.tavar_orr, node: greet }]
  - text: "Ore, new iron? Two lumps. I'm not fussy. I'm a bit fussy."
    conditions: [{ kind: quest_state, quest_ref: quest.bounty.shelf_iron, is: active }]
