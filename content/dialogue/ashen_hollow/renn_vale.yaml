id: dialogue.ashen_hollow.renn_vale
kind: dialogue
schema: 1
display_key: dialogue.ashen_hollow.renn_vale.name
tags: [dialogue]
notes: Renn Vale, the waystation's steward (content bible §9) - orientation, and acknowledging what the character has done. PROTOTYPE.md's branching conversation (its keeper's seven nodes and two branch points). Voice (NPC_PERSONALITY_BIBLE.md) - a Veth host who has met every kind of stranger and still makes up the bed; the cast's one true deadpan; keeps the waystation's book of travellers.
participants: [npc.ashen_hollow.renn_vale]
root_node: greet
nodes:
  greet:
    text: "Off the road in one piece. Good - I've only the one spare bed, and it's for people in one piece. I'm Renn Vale. I keep this waystation, such as it is, and such as Kera's left of the roof. Take this torch; the cave road is dark. It goes in your off hand. Kera keeps cheap bedroll and fire kits if you mean to sleep out."
    once: true
    next_if_exhausted: again
    choices:
      - id: place
        text: "What is this place?"
        next: place
      - id: work
        text: "Is there work here?"
        next: work
      # Heritage (owner, 2026-10-24, HERITAGE_DESIGN.md): Renn keeps the waystation's book, so he is the Veth keeper - he reads a Veth roll's
      # open line for What Was Kept, and re-copies a roll a Veth has lost.
      - id: roll
        text: "Will you read something for me? It's my family's roll."
        conditions:
          - { kind: people, people_ref: people.veth }
          - { kind: has_item, item_ref: item.heritage.kept_roll }
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, objective: o_roll, is: active }
        next: kept_roll
      - id: record
        text: "The oath's settled. Will you close the line?"
        conditions:
          - { kind: people, people_ref: people.veth }
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, objective: o_recorded, is: active }
        next: roll_recorded
      - id: recopy
        text: "I've lost my family's roll."
        conditions:
          - { kind: people, people_ref: people.veth }
          - { kind: has_item, item_ref: item.heritage.kept_roll, not: true }
        consequences:
          - { command: transfer_item, item_ref: item.heritage.kept_roll, count: 1, to: player }
        next: recopied
      - id: leave
        text: "I'll look around."
  again:
    text: "Traveller. What'll it be - a bed, directions, or someone to tell you you're doing fine?"
    choices:
      - id: place
        text: "Tell me about the waystation."
        next: place
      - id: work
        text: "Who needs a hand?"
        next: work
      # Spec 15: the room - a bed to the hour the character asks for, the world going on while they sleep, and a save to wake into.
      - id: bed
        text: "Have you a bed for the night?"
        next: bed
      - id: iron
        text: "I've been down in Blackvein Cut."
        conditions:
          - { kind: has_item, item_ref: item.material.iron_ore }
          - { kind: visited, node: shelf_news, not: true }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.renn_vale, dimension: respect, delta: 5, event: went_to_the_cut }
        next: shelf_news
      - id: spear
        text: "What do you make of this?"
        conditions: [{ kind: has_item, item_ref: item.weapon.march_spear }]
        next: spear
      # Halda's Tally (C.2d): only while the character carries her tally and has not told him they are keeping it, then her line.
      - id: tally
        text: "I found this in the wolves' den. Do you know it?"
        conditions:
          - { kind: has_item, item_ref: item.quest.halda_token }
          - { kind: world_state, flag_ref: world.hollow.halda_tally_kept, location_ref: location.outpost, min: 0, max: 0 }
          - { kind: quest_state, quest_ref: quest.ashen_hollow.haldas_tally, is: completed, not: true }
        consequences:
          - { command: start_quest, quest_ref: quest.ashen_hollow.haldas_tally }
        next: tally
      - id: trapline
        text: "About Halda's line."
        conditions: [{ kind: world_state, flag_ref: world.hollow.halda_tally_kept, location_ref: location.outpost, min: 1 }]
        next: trapline
      - id: personal
        text: "How did you end up keeping this place?"
        conditions:
          - { kind: visited, node: work }
          - { kind: visited, node: personal, not: true }
        next: personal
      - id: notices
        text: "Anything posted for the road?"
        next: notices
      # The playtest's closing beat: offered once all four story quests are done, and once only.
      - id: farewell
        text: "I think I've seen this stretch of the road."
        conditions:
          - { kind: quest_state, quest_ref: quest.ashen_hollow.iron_under_ash, is: completed }
          - { kind: quest_state, quest_ref: quest.ashen_hollow.three_quiet_stones, is: completed }
          - { kind: quest_state, quest_ref: quest.cairnwold.iron_from_the_moor, is: completed }
          - { kind: quest_state, quest_ref: quest.cairnwold.what_the_bog_kept, is: completed }
          - { kind: quest_state, quest_ref: quest.ashen_hollow.end_of_playtest, is: not_started }
        consequences: [{ command: start_quest, quest_ref: quest.ashen_hollow.end_of_playtest }]
        next: farewell
      # Spec 41: what the waystation believes about the stone down the road, and about the folk it blames for it. Both tell a page of the
      # journal. The Quiet-folk page is the belief; the Survey's last page corrects it once the Foldscar is quiet.
      - id: ask_old_late
        text: "Tell me about Old Late."
        next: tell_old_late
      - id: ask_quiet_folk
        text: "Tell me about the Quiet-folk."
        next: tell_quiet_folk
      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_ashen_hollow
        text: "Tell me about Ashen Hollow."
        next: tell_ashen_hollow

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_veth
        text: "Tell me about the Veth."
        next: tell_veth

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_wayhold
        text: "Tell me about the Wayhold."
        next: tell_wayhold

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_ashen_waystone_p2
        text: "Tell me about the ashen waystone."
        next: tell_ashen_waystone_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_folded_note_p2
        text: "Tell me about the folded note."
        next: tell_folded_note_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_halda_crowden_p2
        text: "Tell me about Halda Crowden."
        next: tell_halda_crowden_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_tavars_afternoon_p2
        text: "Tell me about Tavar's afternoon."
        next: tell_tavars_afternoon_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_vessmere
        text: "Tell me about Vessmere."
        next: tell_vessmere

      # Heritage (owner, 2026-10-24, HERITAGE_DESIGN.md): Renn keeps the waystation's book, so he is the Veth keeper - he reads a Veth roll's
      # open line for What Was Kept, and re-copies a roll a Veth has lost.
      - id: roll
        text: "Will you read something for me? It's my family's roll."
        conditions:
          - { kind: people, people_ref: people.veth }
          - { kind: has_item, item_ref: item.heritage.kept_roll }
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, objective: o_roll, is: active }
        next: kept_roll
      - id: record
        text: "The oath's settled. Will you close the line?"
        conditions:
          - { kind: people, people_ref: people.veth }
          - { kind: quest_state, quest_ref: quest.heritage.what_was_kept, objective: o_recorded, is: active }
        next: roll_recorded
      - id: recopy
        text: "I've lost my family's roll."
        conditions:
          - { kind: people, people_ref: people.veth }
          - { kind: has_item, item_ref: item.heritage.kept_roll, not: true }
        consequences:
          - { command: transfer_item, item_ref: item.heritage.kept_roll, count: 1, to: player }
        next: recopied
      - id: leave
        text: "Nothing for now."
      - id: story_begin_accounts
        text: Before I carry an account, I want to see the road for myself.
        conditions:
        - kind: quest_state
          quest_ref: quest.main.three_accounts
          is: not_started
        consequences:
        - command: start_quest
          quest_ref: quest.main.three_accounts
        next: story_route
      - id: story_accounts
        text: Let me compare the accounts before I choose a letter.
        conditions:
        - kind: world_state
          flag_ref: world.main.carrier
          min: 0
          max: 0
          location_ref: location.outpost
        - kind: quest_state
          quest_ref: quest.main.three_accounts
          objective: o_field
          is: satisfied
        next: story_accounts
      - id: story_note
        text: Can you read what is left of this folded note?
        next: story_note
        conditions:
        - kind: has_item
          item_ref: item.story.folded_note
        - kind: quest_state
          quest_ref: quest.main.folded_note
          is: completed
          not: true
        consequences:
        - command: start_quest
          quest_ref: quest.main.folded_note
      - id: story_road_east
        text: What should I know before I take the road east?
        next: story_road_east
        conditions:
        - kind: quest_state
          quest_ref: quest.main.wrong_side
          is: completed
        - kind: quest_state
          quest_ref: quest.main.road_east
          is: available
        consequences:
        - command: start_quest
          quest_ref: quest.main.road_east
  tell_old_late:
    text: "\"The giant down the east road. Nobody here cut it and nobody here remembers it arriving, so we tell it instead.\" He sets his cloth down. \"The Quiet-folk raised it as a marker, before the road was a road. Crowned it, left it to hold the crossing, walked on. That's the version. I was told it, I've told it a hundred times, and I'll tell you honestly that I cannot name who told me first.\" He shrugs. \"Ask Sel. She'll give you a measurement instead of a story, and you can decide which one you'd rather carry.\""
    choices:
      - id: back
        text: "I'll walk out and look at it."
        consequences: [{ command: tell_lore, lore_ref: lore.old_late }]
        next: again
  tell_quiet_folk:
    text: "\"The ones who raised the stones, in the version I was told: gone, and no writing of theirs that anybody can read, and that is supposed to explain why the stones are quiet.\" He stops, and something in his face is careful. \"I'll say this much for free, because you'll hear the rest of it at the forge. It's a good story for a fire. It is not a thing I have ever been able to point at.\""
    choices:
      - id: back
        text: "Then I'll ask Sel what she can point at."
        consequences: [{ command: tell_lore, lore_ref: lore.quiet_folk }]
        next: again
  farewell:
    text: "He opens the book, finds your line and reads it back to himself. \"Blackvein. The Foldscar. Durn's seam. Mara's bog.\" He looks up. \"Most of my guests manage the privy.\" He turns the book round and holds out the pen. \"That's this stretch of the road. Berrin knows the Rim Stone's rite; wake it before you head east. Write yourself in properly: name, road, where you're bound. And thank you. The roofs are dry, the stones are quiet and nobody I liked got eaten. I'll call that a season.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: sign
        text: "I'll write myself in."
        next: signed
  signed:
    text: "He reads what you wrote, upside down, and nods as if it were a bill he'd expected. \"Bound somewhere. Good. The bed's still yours if the road brings you back - and it will. Roads do.\""
    choices:
      - id: back
        text: "Thank you, Renn."
        next: again
  roll_recorded:
    text: "\"Let's see it. ... 'Kept,' in Berrin's hand. Good. Then here's mine.\" He writes, and dries it with his sleeve. \"Your line's closed. You're the one who closed it, so the roll's yours to keep now - properly, I mean. Keeper. It's the only word we Veth use on purpose.\""
    variants:
      - conditions: [{ kind: quest_state, quest_ref: quest.heritage.what_was_kept, objective: o_release, is: satisfied }]
        text: "\"Let's see it. ... 'Released.' Berrin's an honest man; he'd not write that lightly. It's not kept, but it's settled, and settled is a thing a keeper can close.\" He writes. \"There. Your line's closed, and you're the one who closed it. The roll's yours to keep now - properly. Keeper.\""
    choices:
      - id: back
        text: "Thank you, keeper."
        next: again
  kept_roll:
    text: "A Veth roll. You don't see many carried this far out. ... Your last line's open: a name, a word given, and no mark that it was kept. That's a waystation oath - made before a keeper and written twice, once on the giver's roll and once on the receiver's. The other half went into a Cairnwold family's roll, up the north road. They'll have kept it. We Veth are bad at a great many things, but forgetting a debt isn't one of them."
    choices:
      - id: back
        text: "Then I'll go to Cairnwold."
        next: again
  recopied:
    text: "Lost it. Well. A keeper keeps copies, or what is the point of us. ... There - your line as my book has it, every name and the open one at the end. Try not to lose this one. Ink comes up that road twice a year."
    choices:
      - id: back
        text: "Thank you, keeper."
        next: again
  place:
    text: "Ashen Hollow. A stop on the old road between the quarry and the woods: a bed, a meal and a roof, in that order of reliability. Kera has the smithy up by the waystone. Sel keeps her books at the survey table east of here, where she can watch the Foldscar. The Foldscar has not yet thought of anything to do about it."
    choices:
      - id: back
        text: "Thanks."
        next: again
  work:
    text: "Kera needs iron and a steady pair of hands. Sel needs someone who reads more than they swing. Between them they'll have you working before you've found the privy. It's behind the lodge."
    choices:
      - id: back
        text: "I'll ask them."
        next: again
  bed:
    text: "Bed's five coin, paid to me and not to the road. The covered stair outside the east door takes you to the guest rooms. Yours is the first room on the right, with its own cot. Take a moment to rest. You'll be fit for the road again; the world keeps its own hours."
    choices:
      - id: take
        text: "I'll take a room and rest."
        consequences:
          - { command: rent_room }
      - id: not_tonight
        text: "Not tonight."
        next: again
  shelf_news:
    text: "And came back carrying ore. Then you've met what walks down there and you're still breathing, which puts you ahead of a fair few of my guests. Kera will want that iron. She'll also want to tell you what's wrong with it."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "It was close."
        next: again
  spear:
    text: "One of Kera's? No - yours. It has the look of a first try. It'll keep a wolf honest, and that's all a first try has to do."
    choices:
      - id: back
        text: "It will."
        next: again
  personal:
    text: "\"I started with a bed, a meal and a roof to keep sound. Apparently that makes me a steward.\" He wipes his hands on the cloth at his belt, though they are clean. \"Everyone who comes through goes in the book - name, road, where they're bound. Most are bound somewhere. The ones who aren't, I find something for. We Veth keep things. Roads. Promises. People who turn up.\""
    choices:
      - id: back
        text: "I'll try to be bound somewhere."
        next: again
  tally:
    text: "He turns it over once and doesn't need to again. \"A trapper's tally. Halda Crowden's - she notched one for every hide, so nobody at Cairnwold could argue her count. She's in my book: Halda, the north slope, bound for her snares. Two winters back. Nobody's written the other half.\" He sets it on the counter between you. \"Her sister Tam keeps the granary at Cairnwold, and counts everyone up the west road because of it. Or you keep it, and walk Halda's line - the snares are still out on the slope, and they don't know she's gone. Either's honest. Only one of them is kind.\""
    choices:
      - id: keep
        text: "I'll keep it, and walk her line."
        conditions: [{ kind: world_state, flag_ref: world.hollow.halda_tally_kept, location_ref: location.outpost, min: 0, max: 0 }]
        consequences:
          - { command: set_world_flag, flag_ref: world.hollow.halda_tally_kept, value: 1 }
        next: kept
      - id: tam
        text: "Tam should have it."
        next: to_tam
      - id: back
        text: "Let me think on it."
        next: again
  to_tam:
    text: "Cairnwold, east along the road, the granary by the west end. She'll have counted you before you get there. Give it her yourself - I'd only write it down, and she's had enough of things being written down."
    choices:
      - id: back
        text: "I'll take it to her."
        next: again
  kept:
    text: "\"Then it's yours.\" He writes a line in the book and blots it. \"Her snares run along the north slope either side of the den - pelt snares and larder snares, the old cord ones. Check them once a day; they'll fill again by morning. And the den was her cache before it was the wolves'. Whatever's in it was hers. Now it's whoever walks her line.\""
    choices:
      - id: back
        text: "I'll walk it."
        next: again
  trapline:
    text: "North slope, either side of the den. Pelts on one, meat on the other, once a day. Halda walked it before breakfast. I'm not saying you have to. I'm saying she did."
    choices:
      - id: back
        text: "Before breakfast."
        next: again
# Said in passing, unprompted, when the character comes near (the bark patch): each line while its conditions hold.
  notices:
    text: "The Wayhold posts what the road needs and I read it out, since half the road can't. Wolves, timber, the roof. Three wolves off the road and the Wayhold pays. Six lengths of timber and so do I, out of the same purse. It all goes back up in the morning whether anyone's done it or not. Pick one, traveller."
    choices:
      - id: take_wolves
        text: "I'll take the wolf bounty."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.road_wolves, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.road_wolves }]
        next: wolves_taken
      - id: take_timber
        text: "I'll bring timber."
        conditions: [{ kind: quest_state, quest_ref: quest.bounty.crossing_timber, is: available }]
        consequences: [{ command: start_quest, quest_ref: quest.bounty.crossing_timber }]
        next: timber_taken
      - id: give_timber
        text: "Six lengths of timber. Sound."
        conditions:
          - { kind: quest_state, quest_ref: quest.bounty.crossing_timber, is: active }
          - { kind: has_item, item_ref: item.material.timber, count: 6 }
        consequences: [{ command: transfer_item, item_ref: item.material.timber, count: 6, to: npc }]
        next: timber_paid
      - id: back
        text: "Not today."
        next: again
  wolves_taken:
    text: "Three. Anywhere between here and Cairnwold. I don't need ears, tails or a story - I'll hear. The purse opens when the third one's down, not before. Mind your own hide while you're at it."
    choices:
      - id: back
        text: "Three, then."
        next: again
  timber_taken:
    text: "Deadfall, not green wood. There's a sound trunk down east of the yard and more along the road. Green wood warps, the roof leaks, and I'm reading this notice out again. Six lengths. Bring them here."
    choices:
      - id: back
        text: "Six lengths."
        next: again
  timber_paid:
    text: "Sound. That's the north roof, a bed that stays dry and one fewer notice. From the Wayhold, not me - I only hold the purse. Write yourself in the book on the way out."
    choices:
      - id: back
        text: "I will."
        next: again
  story_route:
    text: Ridge, shrine, the road between. Walk it before you decide what you've seen. The letters can wait.
    choices:
    - id: back
      text: I'll look from the shrine and come back.
      next: again
  story_accounts:
    text: "Renn unfolds the map beside three accounts. \"Tavar's afternoon and Berrin's old record. Neither's going in the fire. Three accounts, traveller.
      Which are you carrying?\""
    choices:
    - id: carry_wayhold
      text: The Wayhold letter. Keep the road record with it.
      next: story_wayhold
    - id: carry_survey
      text: Sel's account. The readings need another reader.
      next: story_survey
    - id: carry_cairnwold
      text: Berrin's letter. Keep the village's experience in it.
      next: story_cairnwold
    - id: defer
      text: I'm not choosing yet.
      next: again
  story_wayhold:
    text: The roadwarden at the Vessmere stone. Read it, pack it, keep it dry.
    choices:
    - id: back
      text: I'll keep it safe.
      next: again
  story_survey:
    text: Keeper Daun. Sel's named her. Take the observation with the question.
    choices:
    - id: back
      text: I'll take both.
      next: again
  story_cairnwold:
    text: Factor Ilesa. Berrin knows her. There's a name for the far end of your road.
    choices:
    - id: back
      text: I'll find her.
      next: again
  story_note:
    text: Berrin Garth. Cairnwold lodge. The rest's been rubbed away. Why it was rubbed away is still your business.
    choices:
    - id: take
      text: I'll take it to him.
      next: story_note_road
    - id: remember
      text: I remember more than this says.
      next: story_note_road
    - id: uncertain
      text: I can't place that part of the journey.
      next: story_note_road
    - id: back
      text: I'll keep it private for now.
      next: again
  story_note_road:
    text: Road east, lodge door, old man with the book. Berrin keeps it from seven to nineteen. If you meet him elsewhere, ask him there.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  story_road_east:
    text: Tavar puts that afternoon at the hour you crossed the ridge. That's close enough to keep in the record, traveller. Berrin's got an older
      bleed in his book. Keep both dates. Neither tells me what started this one.
    choices:
    - id: rite
      text: I'll ask Berrin about the Rim Stone.
      next: story_east_rite
    - id: back
      text: I'm not leaving yet.
      next: again
  story_east_rite:
    text: Berrin has the rite in his lodge book. The Rim Stone's on the road east. Wake it, learn it, choose where you'll return. Those are separate
      decisions. Keep the account dry. The roadwarden's going to want to read it.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  tell_ashen_hollow:
    text: "The steward's account, Renn Vale's, for anyone who asks what this place is: a stop on the old road between the quarry and the woods - a bed, a meal and a roof, in that order of reliability. The book by the door has every guest's name in it, their road and where they were bound, and he will read a line back to you if you think you have been misremembered. He keeps the roofs dry and the stone quiet and counts a season good if nobody he liked got eaten. When he says the hollow has not yet thought of anything to do about the Foldscar, he means that he has, and that there is nothing in the waystation's hands to do it with."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.ashen_hollow }]
        next: again

  tell_veth:
    text: "The steward of the waystation puts it in his own words, to anyone who writes a name in his book. We Veth keep things, he says — roads, promises, people who turn up. He does not call it faith and he does not need to: keeping is the act itself, a duty carried the way another people carries a prayer. The book by his door holds every guest's name and road, and he will read a line back to you if you think you have been misremembered. That is the whole of his people's religion in one ledger, and it asks nothing of the dead and nothing of any maker. It only asks that the thing be written, and that the writing be kept."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.veth }]
        next: again

  tell_wayhold:
    text: "The steward explains how it runs, in his deadpan, to anyone who asks after the notices. The Wayhold posts what the road needs, and he reads it out, since half the road cannot; three wolves off the road and the Wayhold pays, six lengths of timber and so does he, out of the same purse, and it all goes back up in the morning whether anyone has done the work or not. When he pays, he is careful to say it is from the Wayhold and not from him — he only holds the purse. And when the accounts go east, the roadwarden at the Vessmere stone is the one who takes the Wayhold's letter, keep it dry. The order, in short, is the road's memory and the road's hand."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.wayhold }]
        next: again

  tell_ashen_waystone_p2:
    text: "Renn Vale's word for the stone is as spare as the stone itself: the smithy is up by the waystone, he says, and that is where a traveller's road begins. A traveller who falls on the road — who can go no further — comes back to themselves at the Ashen Waystone, and the waystation's people take that as given and ask no more of it than the stone will say. Nobody at the hollow claims to know the deeper working of it, and the Survey does not pretend to. The stone stands, the traveller returns, and the road goes on."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.ashen_waystone }]
        next: again

  tell_folded_note_p2:
    text: "Renn Vale reads it in a few flat words: Berrin Garth, Cairnwold lodge, the rest has been rubbed away, and why it was rubbed away is still the traveller's business. He does not try to fill the gap in, and he sends the traveller on to Berrin's door with the note as it is. Berrin himself, when he is shown it, will not fill the rubbed part in either — it is his name, he says, and it is still his, but the missing part stays missing. The note assigns no one a past; it only points to a person and a door, and leaves the rest unwritten."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.folded_note }]
        next: again

  tell_halda_crowden_p2:
    text: "Renn Vale knew her from the book: Halda, the north slope, bound for her snares, two winters back, and nobody has written the other half. When the tally is carried to him he reads it without needing to turn it over twice — a trapper's tally, notched for every hide — and he sets the choice down plainly: take it home to Tam, or keep it and walk Halda's line, because the snares are still out on the slope and they do not know she is gone. Either is honest, he says. Only one of them is kind. Her bow, ash and horn, still sits on the third peg."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.halda_crowden }]
        next: again

  tell_tavars_afternoon_p2:
    text: "The timing will not settle. Tavar places his long afternoon at the hour the traveller crossed the ridge, and Berrin Garth's lodge book has an older record in it that does not fit that week. Keep both dates, Renn says, because neither tells him what started this one. The accounts do not line up, and no one will force them: not the surveyor, who will not stretch one record over the gap, and not the steward, who will not rub one out to make the story tidier. So the afternoon stays where Tavar put it, and the older record stays older."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.tavars_afternoon }]
        next: again

  tell_vessmere:
    text: "Vessmere is the far end of the road, the name the road gives to where it finally runs out of the hollow's country. Renn Vale's word for it is short: when the accounts go east, the Wayhold's letter is carried to the roadwarden at the Vessmere stone — read it, pack it, keep it dry. It is not a village and not a waystation; it is a stone and a roadwarden, where the road's letters are read at the far end and the road's own word is kept. A traveller hears of it long before they reach it, and mostly as a place letters are bound for."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.vessmere }]
        next: again

