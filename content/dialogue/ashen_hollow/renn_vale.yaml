id: dialogue.ashen_hollow.renn_vale
kind: dialogue
schema: 1
display_key: dialogue.ashen_hollow.renn_vale.name
tags: [dialogue]
notes: Renn Vale, the waystation's steward (content bible §9) - orientation, and acknowledging what the character has done. PROTOTYPE.md's branching conversation (its keeper's seven nodes and two branch points).
participants: [npc.ashen_hollow.renn_vale]
root_node: greet
nodes:
  greet:
    text: "Off the road in one piece. I'm Renn Vale; I keep this waystation, such as it is."
    once: true
    next_if_exhausted: again
    choices:
      - id: place
        text: "What is this place?"
        next: place
      - id: work
        text: "Is there work here?"
        next: work
      - id: leave
        text: "I'll look around."
  again:
    text: "What do you need?"
    choices:
      - id: place
        text: "Tell me about the waystation."
        next: place
      - id: work
        text: "Who needs a hand?"
        next: work
      - id: iron
        text: "I've been down in Blackvein Cut."
        conditions:
          - { kind: has_item, item_ref: item.material.iron_ore }
          - { kind: visited, node: shelf_news, not: true }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.renn_vale, dimension: respect, delta: 5, event: went_to_the_cut }
        next: shelf_news
      - id: spear
        text: "What do you make of this?"
        conditions: [{ kind: has_item, item_ref: item.weapon.march_spear }]
        next: spear
      - id: leave
        text: "Nothing for now."
  place:
    text: "Ashen Hollow: a stop on the old road, between the quarry and the woods. Kera has the smithy up by the waystone. Sel keeps her books at the survey table east of here, where she can watch the Foldscar."
    choices:
      - id: back
        text: "Thanks."
        next: again
  work:
    text: "Kera needs iron and a steady pair of hands. Sel needs someone who reads more than they swing. Either would do you more good than wandering."
    choices:
      - id: back
        text: "I'll ask them."
        next: again
  shelf_news:
    text: "And came back carrying ore. Then you've met what walks down there, and you're still breathing. Kera will want that iron."
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "It was close."
        next: again
  spear:
    text: "One of Kera's? No - yours. It has the look of a first try. It'll keep a wolf honest."
    choices:
      - id: back
        text: "It will."
        next: again
