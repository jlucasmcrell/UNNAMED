id: dialogue.ashen_hollow.tavar_orr
kind: dialogue
schema: 1
display_key: dialogue.ashen_hollow.tavar_orr.name
tags: [dialogue]
notes: Tavar Orr (content bible §9, §17). Voice (NPC_PERSONALITY_BIBLE.md) - an Orenth guide, easy and unhurried, who makes his losses small with gallows humour and keeps the Orenth ledger of what each crossing cost. He can be spoken to only once the Foldscar is steadied - the fold around him lifts with it - so every line here is spoken by a man already free. Hearing his first line ends Quest 2. Asked, he joins the character (M6), and is told to wait or follow here or with the companion key.
participants: [npc.ashen_hollow.tavar_orr]
root_node: greet
nodes:
  greet:
    text: "He takes a step towards you, and this time his shadow keeps up. \"You're not Sel. Did she send you, or do you just go about turning stones?\""
    once: true
    next_if_exhausted: again
    choices:
      # Hearing this line completes Quest 2, so "Sel sent me" asks whether she ever gave it, not whether it is still open.
      - id: sent
        text: "Sel sent me."
        conditions: [{ kind: quest_state, quest_ref: quest.ashen_hollow.three_quiet_stones, is: not_started, not: true }]
        consequences:
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.tavar_orr, dimension: trust, delta: 10, event: freed_from_the_fold }
        next: caught
      - id: found
        text: "The stones were out of line. I put them right."
        conditions: [{ kind: quest_state, quest_ref: quest.ashen_hollow.three_quiet_stones, is: not_started }]
        consequences:
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.tavar_orr, dimension: trust, delta: 10, event: freed_from_the_fold }
        next: caught
  caught:
    text: "\"Three days, Sel will say. For me it was one long afternoon where everything arrived a breath late. I could see the waystation smoke. I heard you coming from the wrong side.\" He opens and closes his hands, as if checking they are his."
    choices:
      - id: stones
        text: "What were the stones for?"
        next: stones
      - id: join
        text: "Walk back with me."
        conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr, not: true }]
        consequences: [{ command: recruit_companion }]
        next: joined
      - id: ledger
        text: "Did it cost you anything?"
        next: ledger
      - id: home
        text: "Sel's been watching for you."
        next: again
  stones:
    text: "\"Holding something shut, or holding it still - I couldn't tell you which. Somebody turned them out of line before we ever came out here. Not me.\" A beat. \"I'd remember. Probably.\""
    choices:
      - id: back
        text: "Then somebody else has been out here."
        next: again
  again:
    text: "\"Still here. Still on time, too.\""
    choices:
      # His first line is spent once heard, but not his thanks: a character who walked away before answering can still answer him
      # (the Phase-1 technical audit, L-18). Reaching "caught" is what marks it answered.
      - id: sent
        text: "Sel sent me."
        conditions:
          - { kind: visited, node: caught, not: true }
          - { kind: quest_state, quest_ref: quest.ashen_hollow.three_quiet_stones, is: not_started, not: true }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.tavar_orr, dimension: trust, delta: 10, event: freed_from_the_fold }
        next: caught
      - id: found
        text: "The stones were out of line. I put them right."
        conditions:
          - { kind: visited, node: caught, not: true }
          - { kind: quest_state, quest_ref: quest.ashen_hollow.three_quiet_stones, is: not_started }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.ashen_hollow.tavar_orr, dimension: trust, delta: 10, event: freed_from_the_fold }
        next: caught
      - id: stones
        text: "What were the stones for?"
        conditions: [{ kind: visited, node: stones, not: true }]
        next: stones
      - id: join
        text: "Walk back with me."
        conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr, not: true }]
        consequences: [{ command: recruit_companion }]
        next: joined
      - id: wait
        text: "Wait here."
        conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr, order: follow }]
        consequences: [{ command: order_companion, order: wait }]
        next: waiting
      - id: follow
        text: "Come on - with me."
        conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr, order: wait }]
        consequences: [{ command: order_companion, order: follow }]
        next: following
      # Spec 41: what the fold was, from the only person who has been inside one. He tells it plainly; he does not perform it.
      - id: ask_the_fold
        text: "Tell me about the fold - what it was like, in there."
        conditions: [{ kind: visited, node: tell_the_fold, not: true }]
        consequences: [{ command: tell_lore, lore_ref: lore.tavar_and_the_fold }]
        next: tell_the_fold
      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_orenth
        text: "Tell me about the orenth"
        next: tell_orenth

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_tavar_and_the_fold
        text: "Tell me about tavar and the fold"
        next: tell_tavar_and_the_fold

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_orenth_p2
        text: "Tell me about the orenth"
        next: tell_orenth_p2

      # Spec 41: told, not read. The page is the telling, so the two cannot drift.
      - id: ask_tavar_and_the_fold_p2
        text: "Tell me about tavar and the fold"
        next: tell_tavar_and_the_fold_p2

      - id: leave
        text: "Take a moment. I'll see you at the waystation."
        conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr, not: true }]
      - id: done
        text: "Nothing. Let's go on."
        conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr }]
      - id: story_afternoon
        text: When was your long afternoon?
        next: story_afternoon
        consequences:
        - command: start_quest
          quest_ref: quest.main.wrong_side
  tell_the_fold:
    text: "\"Nothing hurt,\" he says, and takes his time about it. \"That's the part nobody expects. I walked in after a chain and I did not walk out, and it stopped being an afternoon. The others went on having one. I could see the rise from where I stood and nobody on it could get a hand to me - a hand's width short, every time.\" He turns his cup around. \"It wasn't another place. It was this place, a breath out of step, and I was in the step. If I'd called it a place I think I'd have made it one.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: back
        text: "I'm glad it's quiet."
        next: again
  ledger:
    text: "\"Three days, give or take. Cheap, for a crossing I never meant to make.\" He pats a coat pocket; something in it is the shape of a small book. \"We keep a ledger - what each crossing took. I'll put it under 'things I've lost', between my mother's name and a very good knife.\" He smiles as if that were the joke, and not the list."
    choices:
      - id: back
        text: "Then let's not lose anything else."
        next: again
  joined:
    text: "\"Back to the waystation? I'll walk behind you. I've had enough of being in front of things.\""
    choices:
      - id: ok
        text: "Stay close."
  waiting:
    text: "\"Here. Fine. Don't make it three days.\""
    choices:
      - id: ok
        text: "I won't."
  following:
    text: "\"Lead on. I'll be right behind you. Give or take.\""
    choices:
      - id: ok
        text: "This way."
# Said in passing, unprompted, when the character comes near (the bark patch). Every line waits until he is free: before then he stands
# in the fold and says nothing to anyone.
  story_afternoon:
    text: Three days, Sel will say. For me it was one long afternoon. The light was there when you came over the ridge. I heard you coming from
      the wrong side.
    choices:
    - id: first
      text: Then I'll hear your account before I take it to anyone else.
      next: story_heard
      conditions:
      - kind: world_state
        flag_ref: world.main.gauge_seen
        location_ref: location.outpost
        min: 0
        max: 0
      - kind: visited
        node: story_heard
        not: true
      consequences:
      - command: record_relationship_event
        npc_ref: npc.ashen_hollow.tavar_orr
        dimension: trust
        delta: 5
        event: story_heard_tavar_first
    - id: later
      text: Tell me what you remember. I won't put a date to it for you.
      next: story_heard
  story_heard:
    text: Good. I've lost enough without losing the telling of it.
    choices:
    - id: back
      text: I'll keep looking.
      next: again
  tell_orenth:
    text: "Tavar Orr, the guide Sel Arien hires for her surveys, carries the ledger the way another man carries a purse. Three days in the fold, he says, and for him it was one long afternoon — cheap, for a crossing he never meant to make. He will write it down, he says, under things he has lost, between his mother's name and a very good knife, and he smiles as if that were the joke and not the list. The man lost time and does not pretend it cost him nothing; he only keeps the account, because an Orenth who does not keep the account is an Orenth who will one day be asked for more than he has left. His shadow keeps up with him now, which is how the waystation knows he is whole enough to walk."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.orenth }]
        next: again

  tell_tavar_and_the_fold:
    text: "Tavar Orr's account, given afterwards, plainly and without performance. He walked in among the stones for a dropped chain and did not walk out. From the rise he could be seen standing; from the rise he could not be reached, and a hand stopped a hand's width short of him. His voice came from the wrong side. He says the worst of it was that nothing hurt and nothing hurried: the afternoon simply did not end, and the others went on having one. He does not describe the fold as another place. He says it was this place, standing a breath out of step, and that he was in it, and that the sun kept going over."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.tavar_and_the_fold }]
        next: again

  tell_orenth_p2:
    text: "Tavar Orr, the guide Sel Arien hires for her surveys, carries the ledger the way another man carries a purse. Three days in the fold, he says, and for him it was one long afternoon — cheap, for a crossing he never meant to make. He will write it down, he says, under things he has lost, between his mother's name and a very good knife, and he smiles as if that were the joke and not the list. The man lost time and does not pretend it cost him nothing; he only keeps the account, because an Orenth who does not keep the account is an Orenth who will one day be asked for more than he has left. His shadow keeps up with him now, which is how the waystation knows he is whole enough to walk."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.orenth }]
        next: again

  tell_tavar_and_the_fold_p2:
    text: "Tavar Orr's account, given afterwards, plainly and without performance. He walked in among the stones for a dropped chain and did not walk out. From the rise he could be seen standing; from the rise he could not be reached, and a hand stopped a hand's width short of him. His voice came from the wrong side. He says the worst of it was that nothing hurt and nothing hurried: the afternoon simply did not end, and the others went on having one. He does not describe the fold as another place. He says it was this place, standing a breath out of step, and that he was in it, and that the sun kept going over."
    choices:
      - id: back
        text: "I will remember it."
        consequences: [{ command: tell_lore, lore_ref: lore.tavar_and_the_fold }]
        next: again

barks:
  - text: "Still here. Still on time."
    conditions: [{ kind: visited, node: greet }]
  - text: "That sounded like it came from the left. Was it the left?"
    conditions: [{ kind: visited, node: greet }]
  - text: "Mud. Honest stuff, mud."
    conditions: [{ kind: visited, node: greet }]
  - text: "Behind you. Give or take."
    conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr, order: follow }]
  - text: "Waiting. I'm good at it now. Had practice."
    conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr, order: wait }]
# Said on the road while he travels with the character (WP15b party banter): where they are, and what was just done. The party's voice says
# at most one line in a while (config.party banter).
banter:
  - text: "I'd rather not stand here long. Last time, leaving took three days."
    conditions: [{ kind: near, location_ref: location.foldscar }]
  - text: "Waystation smoke. Right where I left it. Give or take."
    conditions: [{ kind: near, location_ref: location.outpost }]
  - text: "That goes in the ledger. Paid in full, for once."
    conditions: [{ kind: deed, deed: killed, creature_ref: creature.undead.bone_walker_husk, within_s: 60 }]
  - text: "If I fall behind, it's the mud. Not the other thing."
    conditions: [{ kind: companion_present, npc_ref: npc.ashen_hollow.tavar_orr, order: follow }]
