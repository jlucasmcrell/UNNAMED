id: dialogue.teacher.enchanting
kind: dialogue
schema: 1
display_key: dialogue.teacher.enchanting.name
tags: [dialogue]
notes: "The enchanting teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.enchanting]
root_node: greet
nodes:
  greet:
    text: "You want the metal to remember a word. Metal remembers everything you do to it, which is the difficulty."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.enchanting.inscribe_scroll, ability.catalogue.enchanting.rune_channel, ability.catalogue.enchanting.anchor_a_working, ability.catalogue.enchanting.a_working_in_the_world] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are speaking to it. Say something it can keep."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.enchanting.inscribe_scroll, ability.catalogue.enchanting.rune_channel, ability.catalogue.enchanting.anchor_a_working, ability.catalogue.enchanting.a_working_in_the_world] }
        next: lesson
  lesson:
    text: "Enchanting is not adding. It is persuading a thing to stay itself while carrying something else."
