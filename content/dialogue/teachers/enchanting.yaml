id: dialogue.teacher.enchanting
kind: dialogue
schema: 1
display_key: dialogue.teacher.enchanting.name
tags: [dialogue]
notes: "The enchanting teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.enchanting]
root_node: greet
nodes:
  greet:
    text: "\"You want the enchanting? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.enchanting.inscribe_scroll, ability.catalogue.enchanting.rune_channel, ability.catalogue.enchanting.anchor_a_working, ability.catalogue.enchanting.stability, ability.catalogue.enchanting.the_pattern_that_holds, ability.catalogue.enchanting.a_working_in_the_world] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.enchanting.inscribe_scroll, ability.catalogue.enchanting.rune_channel, ability.catalogue.enchanting.anchor_a_working, ability.catalogue.enchanting.stability, ability.catalogue.enchanting.the_pattern_that_holds, ability.catalogue.enchanting.a_working_in_the_world] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
