id: dialogue.teacher.evasion
kind: dialogue
schema: 1
display_key: dialogue.teacher.evasion.name
tags: [dialogue]
notes: "The evasion teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.evasion]
root_node: greet
nodes:
  greet:
    text: "You do not beat a blow. You withdraw the place it was going to land."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.evasion.sidestep, ability.catalogue.evasion.read_the_windup, ability.catalogue.evasion.slip, ability.catalogue.evasion.recover_footing, ability.catalogue.evasion.rolling_fall, ability.catalogue.evasion.read_the_press, ability.catalogue.evasion.endure, ability.catalogue.evasion.borrowed_momentum, ability.catalogue.evasion.nothing_to_hit] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are dodging with your feet. Bring your shoulders - they are half of you."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.evasion.sidestep, ability.catalogue.evasion.read_the_windup, ability.catalogue.evasion.slip, ability.catalogue.evasion.recover_footing, ability.catalogue.evasion.rolling_fall, ability.catalogue.evasion.read_the_press, ability.catalogue.evasion.endure, ability.catalogue.evasion.borrowed_momentum, ability.catalogue.evasion.nothing_to_hit] }
        next: lesson
  lesson:
    text: "Three avoided blows is how this is learned. Not one. Three, honestly."
