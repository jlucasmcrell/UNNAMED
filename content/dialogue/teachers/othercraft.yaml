id: dialogue.teacher.othercraft
kind: dialogue
schema: 1
display_key: dialogue.teacher.othercraft.name
tags: [dialogue]
notes: "The othercraft teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.othercraft]
root_node: greet
nodes:
  greet:
    text: "The Other is not a power. It is a place that answers in a language your hands do not speak."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.othercraft.fold_step, ability.catalogue.othercraft.fold_lance, ability.catalogue.othercraft.fold_lance_guarded, ability.catalogue.othercraft.fold_seal_pylon, ability.catalogue.othercraft.rift_tap, ability.catalogue.othercraft.the_closing] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You paid in memory. It is gone. Turn around, that is where it was."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.othercraft.fold_step, ability.catalogue.othercraft.fold_lance, ability.catalogue.othercraft.fold_lance_guarded, ability.catalogue.othercraft.fold_seal_pylon, ability.catalogue.othercraft.rift_tap, ability.catalogue.othercraft.the_closing] }
        next: lesson
  lesson:
    text: "Make the anchor before you reach. A reach without an anchor is a kindness the Other declines."
