id: dialogue.teacher.herbalism
kind: dialogue
schema: 1
display_key: dialogue.teacher.herbalism.name
tags: [dialogue]
notes: "The herbalism teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.herbalism]
root_node: greet
nodes:
  greet:
    text: "\"You want the herbalism? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.herbalism.read_the_leaf, ability.catalogue.herbalism.preserve_potency, ability.catalogue.herbalism.the_four_nodes, ability.catalogue.herbalism.the_right_ground] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.herbalism.read_the_leaf, ability.catalogue.herbalism.preserve_potency, ability.catalogue.herbalism.the_four_nodes, ability.catalogue.herbalism.the_right_ground] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
