id: dialogue.teacher.herbalism
kind: dialogue
schema: 1
display_key: dialogue.teacher.herbalism.name
tags: [dialogue]
notes: "The herbalism teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.herbalism]
root_node: greet
nodes:
  greet:
    text: "Woundmoss is the one with the pale seam. Greyveil lichen is the one that will kill you. They grow together. Deliberately."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.herbalism.read_the_leaf, ability.catalogue.herbalism.preserve_potency] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You picked the wrong stage. Wrong stage is not medicine, it is a rumour."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.herbalism.read_the_leaf, ability.catalogue.herbalism.preserve_potency] }
        next: lesson
  lesson:
    text: "Read the leaf, then the ground under it. The plant tells you what it is good for by where it chose to live."
