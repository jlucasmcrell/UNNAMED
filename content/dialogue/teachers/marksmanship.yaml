id: dialogue.teacher.marksmanship
kind: dialogue
schema: 1
display_key: dialogue.teacher.marksmanship.name
tags: [dialogue]
notes: "The marksmanship teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.marksmanship]
root_node: greet
nodes:
  greet:
    text: "\"You want the marksmanship? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.marksmanship.judge_the_range, ability.catalogue.marksmanship.wind_and_drop, ability.catalogue.marksmanship.read_the_tell, ability.catalogue.marksmanship.the_vital_not_the_body, ability.catalogue.marksmanship.placed_shot, ability.catalogue.marksmanship.second_shot, ability.catalogue.marksmanship.one_arrow_one_answer, ability.catalogue.marksmanship.name_the_place] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.marksmanship.judge_the_range, ability.catalogue.marksmanship.wind_and_drop, ability.catalogue.marksmanship.read_the_tell, ability.catalogue.marksmanship.the_vital_not_the_body, ability.catalogue.marksmanship.placed_shot, ability.catalogue.marksmanship.second_shot, ability.catalogue.marksmanship.one_arrow_one_answer, ability.catalogue.marksmanship.name_the_place] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
