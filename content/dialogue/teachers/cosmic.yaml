id: dialogue.teacher.cosmic
kind: dialogue
schema: 1
display_key: dialogue.teacher.cosmic.name
tags: [dialogue]
notes: "The cosmic teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.cosmic]
root_node: greet
nodes:
  greet:
    text: "\"You want the cosmic? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.cosmic.read_the_tide, ability.catalogue.cosmic.weigh_and_pull, ability.catalogue.cosmic.star_iron, ability.catalogue.cosmic.the_long_view, ability.catalogue.cosmic.an_observatory_for_othertides] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.cosmic.read_the_tide, ability.catalogue.cosmic.weigh_and_pull, ability.catalogue.cosmic.star_iron, ability.catalogue.cosmic.the_long_view, ability.catalogue.cosmic.an_observatory_for_othertides] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
