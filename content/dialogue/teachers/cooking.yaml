id: dialogue.teacher.cooking
kind: dialogue
schema: 1
display_key: dialogue.teacher.cooking.name
tags: [dialogue]
notes: "The cooking teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.cooking]
root_node: greet
nodes:
  greet:
    text: "Sit. Eat this. Then we will talk about what is wrong with it, which is not the taste."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.cooking.roast_meat, ability.catalogue.cooking.field_torch_by_fire, ability.catalogue.cooking.woundmoss_tea, ability.catalogue.cooking.provision_for_a_road, ability.catalogue.cooking.a_meal_that_matters] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You burned the bottom. That is not a mistake, that is a habit."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.cooking.roast_meat, ability.catalogue.cooking.field_torch_by_fire, ability.catalogue.cooking.woundmoss_tea, ability.catalogue.cooking.provision_for_a_road, ability.catalogue.cooking.a_meal_that_matters] }
        next: lesson
  lesson:
    text: "Heat is patience with a deadline. Learn the deadline and you stop guessing."
