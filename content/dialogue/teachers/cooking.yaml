id: dialogue.teacher.cooking
kind: dialogue
schema: 1
display_key: dialogue.teacher.cooking.name
tags: [dialogue]
notes: "The cooking teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.cooking]
root_node: greet
nodes:
  greet:
    text: "\"You want the cooking? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.cooking.roast_meat, ability.catalogue.cooking.field_torch_by_fire, ability.catalogue.cooking.woundmoss_tea, ability.catalogue.cooking.provision_for_a_road, ability.catalogue.cooking.a_meal_that_matters, ability.catalogue.cooking.feed_a_village] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.cooking.roast_meat, ability.catalogue.cooking.field_torch_by_fire, ability.catalogue.cooking.woundmoss_tea, ability.catalogue.cooking.provision_for_a_road, ability.catalogue.cooking.a_meal_that_matters, ability.catalogue.cooking.feed_a_village] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
