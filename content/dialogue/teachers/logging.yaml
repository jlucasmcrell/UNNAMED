id: dialogue.teacher.logging
kind: dialogue
schema: 1
display_key: dialogue.teacher.logging.name
tags: [dialogue]
notes: "The woodcutting teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.logging]
root_node: greet
nodes:
  greet:
    text: "\"You want the woodcutting? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.logging.fell_where_it_falls, ability.catalogue.logging.season_and_stack, ability.catalogue.logging.feller_s_eye, ability.catalogue.logging.the_standing_crop] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.logging.fell_where_it_falls, ability.catalogue.logging.season_and_stack, ability.catalogue.logging.feller_s_eye, ability.catalogue.logging.the_standing_crop] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
