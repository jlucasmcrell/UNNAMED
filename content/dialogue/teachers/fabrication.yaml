id: dialogue.teacher.fabrication
kind: dialogue
schema: 1
display_key: dialogue.teacher.fabrication.name
tags: [dialogue]
notes: "The fabrication and machining teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.fabrication]
root_node: greet
nodes:
  greet:
    text: "\"You want the fabrication and machining? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.fabrication.cold_work_native_metal, ability.catalogue.fabrication.reproduce_a_firstfold_form, ability.catalogue.fabrication.pack_a_gland, ability.catalogue.fabrication.turn_a_true_shaft, ability.catalogue.fabrication.optics, ability.catalogue.fabrication.sustain_a_machine_without_parts] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.fabrication.cold_work_native_metal, ability.catalogue.fabrication.reproduce_a_firstfold_form, ability.catalogue.fabrication.pack_a_gland, ability.catalogue.fabrication.turn_a_true_shaft, ability.catalogue.fabrication.optics, ability.catalogue.fabrication.sustain_a_machine_without_parts] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
