id: dialogue.teacher.survival
kind: dialogue
schema: 1
display_key: dialogue.teacher.survival.name
tags: [dialogue]
notes: "The survival teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.survival]
root_node: greet
nodes:
  greet:
    text: "Nothing here will kill you quickly except the cold, and that is the slowest thing there is."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.survival.fire_in_the_wet, ability.catalogue.survival.set_snare, ability.catalogue.survival.improvised_shelter, ability.catalogue.survival.cold_camp, ability.catalogue.survival.weatherproof, ability.catalogue.survival.live_off_the_land, ability.catalogue.survival.keeper_of_the_camp] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You built a fire in the open. The wind has been waiting for you all evening."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.survival.fire_in_the_wet, ability.catalogue.survival.set_snare, ability.catalogue.survival.improvised_shelter, ability.catalogue.survival.cold_camp, ability.catalogue.survival.weatherproof, ability.catalogue.survival.live_off_the_land, ability.catalogue.survival.keeper_of_the_camp] }
        next: lesson
  lesson:
    text: "Shelter, water, fire, food. In that order, and you may only skip what you already have."
