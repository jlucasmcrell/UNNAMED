id: dialogue.teacher.thrown
kind: dialogue
schema: 1
display_key: dialogue.teacher.thrown.name
tags: [dialogue]
notes: "The thrown and sling teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.thrown]
root_node: greet
nodes:
  greet:
    text: "Distance, weight, wind. In that order. Miss the order and you have only thrown a rock at a friend."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.thrown.quick_throw, ability.catalogue.thrown.shield_lodging, ability.catalogue.thrown.lure_stone, ability.catalogue.thrown.gap_throw, ability.catalogue.thrown.atlatl_cast, ability.catalogue.thrown.parting_throw, ability.catalogue.thrown.running_throw, ability.catalogue.thrown.brace_of_knives, ability.catalogue.thrown.throw_any_weapon, ability.catalogue.thrown.unerring_hand, ability.catalogue.thrown.sling_lob, ability.catalogue.thrown.sling_skip_shot, ability.catalogue.thrown.sling_unseen_arc] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Your stance is a suggestion. Make it a statement."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.thrown.quick_throw, ability.catalogue.thrown.shield_lodging, ability.catalogue.thrown.lure_stone, ability.catalogue.thrown.gap_throw, ability.catalogue.thrown.atlatl_cast, ability.catalogue.thrown.parting_throw, ability.catalogue.thrown.running_throw, ability.catalogue.thrown.brace_of_knives, ability.catalogue.thrown.throw_any_weapon, ability.catalogue.thrown.unerring_hand, ability.catalogue.thrown.sling_lob, ability.catalogue.thrown.sling_skip_shot, ability.catalogue.thrown.sling_unseen_arc] }
        next: lesson
  lesson:
    text: "Let go where you want it to land, not where you want it to leave."
