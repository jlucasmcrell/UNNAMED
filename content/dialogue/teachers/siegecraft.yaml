id: dialogue.teacher.siegecraft
kind: dialogue
schema: 1
display_key: dialogue.teacher.siegecraft.name
tags: [dialogue]
notes: "The siegecraft teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.siegecraft]
root_node: greet
nodes:
  greet:
    text: "You are aiming at people. Engines are for places."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.siegecraft.serve_a_siege_engine] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Lay it again. Slower."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.siegecraft.serve_a_siege_engine] }
        next: lesson
  lesson:
    text: "Span, load, sight. Then the wall decides the rest."
