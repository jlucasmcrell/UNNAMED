id: dialogue.teacher.mechanisms
kind: dialogue
schema: 1
display_key: dialogue.teacher.mechanisms.name
tags: [dialogue]
notes: "The mechanisms teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.mechanisms]
root_node: greet
nodes:
  greet:
    text: "\"You want the mechanisms? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.mechanisms.lock_and_key, ability.catalogue.mechanisms.escapement, ability.catalogue.mechanisms.gauge_and_calibrate, ability.catalogue.mechanisms.the_engine_that_holds_itself, ability.catalogue.mechanisms.drone_discipline, ability.catalogue.mechanisms.gate_frame, ability.catalogue.mechanisms.gate_tuner] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.mechanisms.lock_and_key, ability.catalogue.mechanisms.escapement, ability.catalogue.mechanisms.gauge_and_calibrate, ability.catalogue.mechanisms.the_engine_that_holds_itself, ability.catalogue.mechanisms.drone_discipline, ability.catalogue.mechanisms.gate_frame, ability.catalogue.mechanisms.gate_tuner] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
