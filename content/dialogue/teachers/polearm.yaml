id: dialogue.teacher.polearm
kind: dialogue
schema: 1
display_key: dialogue.teacher.polearm.name
tags: [dialogue]
notes: "The spear and polearm teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.polearm]
root_node: greet
nodes:
  greet:
    text: "Stand back. Further. Further than you think. There. Now you can reach me and I cannot reach you - that is the entire trade."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.polearm.hold_the_point, ability.catalogue.polearm.giving_ground, ability.catalogue.polearm.haft_guard, ability.catalogue.polearm.set_against_the_charge, ability.catalogue.polearm.shorten_the_grip, ability.catalogue.polearm.pull_down, ability.catalogue.polearm.pinning_thrust, ability.catalogue.polearm.beak_at_reach, ability.catalogue.polearm.tip_discipline, ability.catalogue.polearm.master_of_distance] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Closer than yesterday. That is not a compliment yet."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.polearm.hold_the_point, ability.catalogue.polearm.giving_ground, ability.catalogue.polearm.haft_guard, ability.catalogue.polearm.set_against_the_charge, ability.catalogue.polearm.shorten_the_grip, ability.catalogue.polearm.pull_down, ability.catalogue.polearm.pinning_thrust, ability.catalogue.polearm.beak_at_reach, ability.catalogue.polearm.tip_discipline, ability.catalogue.polearm.master_of_distance] }
        next: lesson
  lesson:
    text: "The point is the threat. The butt is the argument. Learn which one is talking."
