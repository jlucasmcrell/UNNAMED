id: dialogue.teacher.nature
kind: dialogue
schema: 1
display_key: dialogue.teacher.nature.name
tags: [dialogue]
notes: "The nature teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.nature]
root_node: greet
nodes:
  greet:
    text: "Wood has a temper and a season. Speak to it in heat, and it will answer in winter."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.nature.bramble_snare, ability.catalogue.nature.ask_the_green, ability.catalogue.nature.quiet_the_animal, ability.catalogue.nature.weather_turn, ability.catalogue.nature.the_ground_s_own_answer] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You asked for growth. The soil is not ready and the moon is wrong."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.nature.bramble_snare, ability.catalogue.nature.ask_the_green, ability.catalogue.nature.quiet_the_animal, ability.catalogue.nature.weather_turn, ability.catalogue.nature.the_ground_s_own_answer] }
        next: lesson
  lesson:
    text: "Weather, root, and patience. That is what makes a thing grow, and only one of them is yours."
