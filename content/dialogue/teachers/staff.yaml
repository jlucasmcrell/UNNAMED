id: dialogue.teacher.staff
kind: dialogue
schema: 1
display_key: dialogue.teacher.staff.name
tags: [dialogue]
notes: "The staff teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.staff]
root_node: greet
nodes:
  greet:
    text: "\"You want the staff? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.staff.two_ended_guard, ability.catalogue.staff.leg_sweep, ability.catalogue.staff.grip_shift, ability.catalogue.staff.trap_and_twist, ability.catalogue.staff.vault, ability.catalogue.staff.strike_and_cast, ability.catalogue.staff.whirling_screen, ability.catalogue.staff.ground_the_ward, ability.catalogue.staff.pivot_on_the_staff, ability.catalogue.staff.ring_of_the_staff] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.staff.two_ended_guard, ability.catalogue.staff.leg_sweep, ability.catalogue.staff.grip_shift, ability.catalogue.staff.trap_and_twist, ability.catalogue.staff.vault, ability.catalogue.staff.strike_and_cast, ability.catalogue.staff.whirling_screen, ability.catalogue.staff.ground_the_ward, ability.catalogue.staff.pivot_on_the_staff, ability.catalogue.staff.ring_of_the_staff] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
