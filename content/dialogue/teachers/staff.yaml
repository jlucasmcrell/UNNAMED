id: dialogue.teacher.staff
kind: dialogue
schema: 1
display_key: dialogue.teacher.staff.name
tags: [dialogue]
notes: "The staff teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.staff]
root_node: greet
nodes:
  greet:
    text: "A stick. You are laughing. Everyone laughs at the stick first. Walk at me."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.staff.two_ended_guard, ability.catalogue.staff.leg_sweep, ability.catalogue.staff.grip_shift, ability.catalogue.staff.trap_and_twist, ability.catalogue.staff.strike_and_cast, ability.catalogue.staff.whirling_screen, ability.catalogue.staff.ground_the_ward, ability.catalogue.staff.pivot_on_the_staff, ability.catalogue.staff.ring_of_the_staff] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "The stick is still teaching you, then."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.staff.two_ended_guard, ability.catalogue.staff.leg_sweep, ability.catalogue.staff.grip_shift, ability.catalogue.staff.trap_and_twist, ability.catalogue.staff.strike_and_cast, ability.catalogue.staff.whirling_screen, ability.catalogue.staff.ground_the_ward, ability.catalogue.staff.pivot_on_the_staff, ability.catalogue.staff.ring_of_the_staff] }
        next: lesson
  lesson:
    text: "Both ends are the weapon, and so is the middle if you are honest about your hands."
