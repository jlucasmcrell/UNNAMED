id: dialogue.teacher.tracking
kind: dialogue
schema: 1
display_key: dialogue.teacher.tracking.name
tags: [dialogue]
notes: "The tracking teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.tracking]
root_node: greet
nodes:
  greet:
    text: "Ground remembers. You are walking on a diary and asking me to read it aloud."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.tracking.read_the_ground, ability.catalogue.tracking.trail_sign, ability.catalogue.tracking.follow_the_quarry, ability.catalogue.tracking.predator_s_bearing, ability.catalogue.tracking.walk_their_road, ability.catalogue.tracking.read_the_wake, ability.catalogue.tracking.what_the_trail_refuses_to_say] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are looking for a footprint. Look for where the ground stopped being itself."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.tracking.read_the_ground, ability.catalogue.tracking.trail_sign, ability.catalogue.tracking.follow_the_quarry, ability.catalogue.tracking.predator_s_bearing, ability.catalogue.tracking.walk_their_road, ability.catalogue.tracking.read_the_wake, ability.catalogue.tracking.what_the_trail_refuses_to_say] }
        next: lesson
  lesson:
    text: "Speed, weight, intent. Every sign writes all three, and one of them is always a lie."
