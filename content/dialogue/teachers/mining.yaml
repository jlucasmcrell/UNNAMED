id: dialogue.teacher.mining
kind: dialogue
schema: 1
display_key: dialogue.teacher.mining.name
tags: [dialogue]
notes: "The mining teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.mining]
root_node: greet
nodes:
  greet:
    text: "\"You want the mining? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.mining.read_the_face, ability.catalogue.mining.iron_seam, ability.catalogue.mining.timber_and_prop, ability.catalogue.mining.loose_iron, ability.catalogue.mining.deep_seam, ability.catalogue.mining.the_stair_in_the_rock] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.mining.read_the_face, ability.catalogue.mining.iron_seam, ability.catalogue.mining.timber_and_prop, ability.catalogue.mining.loose_iron, ability.catalogue.mining.deep_seam, ability.catalogue.mining.the_stair_in_the_rock] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
