id: dialogue.teacher.mining
kind: dialogue
schema: 1
display_key: dialogue.teacher.mining.name
tags: [dialogue]
notes: "The mining teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.mining]
root_node: greet
nodes:
  greet:
    text: "Read the face before you hit it. That crack is not a wrinkle, it is a plan the rock already has."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.mining.read_the_face, ability.catalogue.mining.iron_seam, ability.catalogue.mining.timber_and_prop, ability.catalogue.mining.loose_iron, ability.catalogue.mining.deep_seam, ability.catalogue.mining.the_stair_in_the_rock] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You swing at the middle. The middle is where it is weakest and where it kicks."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.mining.read_the_face, ability.catalogue.mining.iron_seam, ability.catalogue.mining.timber_and_prop, ability.catalogue.mining.loose_iron, ability.catalogue.mining.deep_seam, ability.catalogue.mining.the_stair_in_the_rock] }
        next: lesson
  lesson:
    text: "Follow the seam, not the ore. The seam is the honest line."
