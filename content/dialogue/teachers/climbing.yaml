id: dialogue.teacher.climbing
kind: dialogue
schema: 1
display_key: dialogue.teacher.climbing.name
tags: [dialogue]
notes: "The climbing teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.climbing]
root_node: greet
nodes:
  greet:
    text: "\"You want the climbing? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.climbing.three_points, ability.catalogue.climbing.tie_in, ability.catalogue.climbing.traverse, ability.catalogue.climbing.scramble_the_slope, ability.catalogue.climbing.free_solo_the_honest_face, ability.catalogue.climbing.anchor_and_haul, ability.catalogue.climbing.the_high_route] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.climbing.three_points, ability.catalogue.climbing.tie_in, ability.catalogue.climbing.traverse, ability.catalogue.climbing.scramble_the_slope, ability.catalogue.climbing.free_solo_the_honest_face, ability.catalogue.climbing.anchor_and_haul, ability.catalogue.climbing.the_high_route] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
