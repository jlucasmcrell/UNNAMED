id: dialogue.teacher.smithing
kind: dialogue
schema: 1
display_key: dialogue.teacher.smithing.name
tags: [dialogue]
notes: "The smithing teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.smithing]
root_node: greet
nodes:
  greet:
    text: "\"You want the smithing? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.smithing.iron_billet, ability.catalogue.smithing.forge_weld, ability.catalogue.smithing.case_and_temper, ability.catalogue.smithing.march_spear, ability.catalogue.smithing.lamework, ability.catalogue.smithing.read_the_ring, ability.catalogue.smithing.charcoal_steel, ability.catalogue.smithing.named_work] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.smithing.iron_billet, ability.catalogue.smithing.forge_weld, ability.catalogue.smithing.case_and_temper, ability.catalogue.smithing.march_spear, ability.catalogue.smithing.lamework, ability.catalogue.smithing.read_the_ring, ability.catalogue.smithing.charcoal_steel, ability.catalogue.smithing.named_work] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
