id: dialogue.teacher.smithing
kind: dialogue
schema: 1
display_key: dialogue.teacher.smithing.name
tags: [dialogue]
notes: "The smithing teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.smithing]
root_node: greet
nodes:
  greet:
    text: "Plate does not make you safe. It makes you slow and confident, which is worse. Now walk."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.smithing.iron_billet, ability.catalogue.smithing.forge_weld, ability.catalogue.smithing.case_and_temper, ability.catalogue.smithing.march_spear, ability.catalogue.smithing.lamework, ability.catalogue.smithing.read_the_ring, ability.catalogue.smithing.charcoal_steel, ability.catalogue.smithing.named_work, ability.catalogue.smithing.bloomery_smelt, ability.catalogue.smithing.charcoal_steel_charge, ability.catalogue.smithing.temper_and_draw] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are carrying it, not wearing it. Different verbs, different deaths."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.smithing.iron_billet, ability.catalogue.smithing.forge_weld, ability.catalogue.smithing.case_and_temper, ability.catalogue.smithing.march_spear, ability.catalogue.smithing.lamework, ability.catalogue.smithing.read_the_ring, ability.catalogue.smithing.charcoal_steel, ability.catalogue.smithing.named_work, ability.catalogue.smithing.bloomery_smelt, ability.catalogue.smithing.charcoal_steel_charge, ability.catalogue.smithing.temper_and_draw] }
        next: lesson
  lesson:
    text: "The armour buys you one mistake. Choose the mistake before the fight starts."
