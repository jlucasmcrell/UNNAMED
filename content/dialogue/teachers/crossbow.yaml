id: dialogue.teacher.crossbow
kind: dialogue
schema: 1
display_key: dialogue.teacher.crossbow.name
tags: [dialogue]
notes: "The crossbow teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.crossbow]
root_node: greet
nodes:
  greet:
    text: "It is a machine, not a bow. Treat it like a machine, and it will only fail the way you made it fail."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.crossbow.braced_aim, ability.catalogue.crossbow.field_maintenance, ability.catalogue.crossbow.overwatch, ability.catalogue.crossbow.walking_span, ability.catalogue.crossbow.stock_strike, ability.catalogue.crossbow.rune_channel_bolt, ability.catalogue.crossbow.heavy_bolt_drive, ability.catalogue.crossbow.repeating_stream, ability.catalogue.crossbow.line_breaker, ability.catalogue.crossbow.trigger_discipline] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Span it properly. It will tell you, loudly, if you do not."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.crossbow.braced_aim, ability.catalogue.crossbow.field_maintenance, ability.catalogue.crossbow.overwatch, ability.catalogue.crossbow.walking_span, ability.catalogue.crossbow.stock_strike, ability.catalogue.crossbow.rune_channel_bolt, ability.catalogue.crossbow.heavy_bolt_drive, ability.catalogue.crossbow.repeating_stream, ability.catalogue.crossbow.line_breaker, ability.catalogue.crossbow.trigger_discipline] }
        next: lesson
  lesson:
    text: "A crossbow does not care about your arms. It cares about your patience at the worst moment."
