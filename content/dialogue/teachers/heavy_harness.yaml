id: dialogue.teacher.heavy_harness
kind: dialogue
schema: 1
display_key: dialogue.teacher.heavy_harness.name
tags: [dialogue]
notes: "The harness and powered armour teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.heavy_harness]
root_node: greet
nodes:
  greet:
    text: "A plant is a heavy animal that cannot move. Harness it as an animal, not as a building."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.heavy_harness.hold_a_harness] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You found the load. You have not found the counter-load."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.heavy_harness.hold_a_harness] }
        next: lesson
  lesson:
    text: "Every pull has an answer. If you cannot see it, you are the answer."
