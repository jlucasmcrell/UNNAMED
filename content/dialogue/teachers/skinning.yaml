id: dialogue.teacher.skinning
kind: dialogue
schema: 1
display_key: dialogue.teacher.skinning.name
tags: [dialogue]
notes: "The skinning teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.skinning]
root_node: greet
nodes:
  greet:
    text: "Off clean means the buyer cannot tell it was hurried. Slow hands, fast knife."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.skinning.off_clean, ability.catalogue.skinning.cure_in_the_field, ability.catalogue.skinning.read_the_pelt, ability.catalogue.skinning.a_beast_s_own_armour] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You nicked it. That nick is a week off the price."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.skinning.off_clean, ability.catalogue.skinning.cure_in_the_field, ability.catalogue.skinning.read_the_pelt, ability.catalogue.skinning.a_beast_s_own_armour] }
        next: lesson
  lesson:
    text: "Cure it in the field or lose it in a day. Salt and smoke are both cheaper than regret."
