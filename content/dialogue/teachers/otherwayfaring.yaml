id: dialogue.teacher.otherwayfaring
kind: dialogue
schema: 1
display_key: dialogue.teacher.otherwayfaring.name
tags: [dialogue]
notes: "The otherwayfaring teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.otherwayfaring]
root_node: greet
nodes:
  greet:
    text: "The step is not walking. Walking is leaving somewhere. This is arriving without the road agreeing."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.otherwayfaring.read_a_route, ability.catalogue.otherwayfaring.walk_it_steady, ability.catalogue.otherwayfaring.rope_and_anchor, ability.catalogue.otherwayfaring.chart_it, ability.catalogue.otherwayfaring.arrive] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are paying the debt out of memory. Pick a smaller memory."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.otherwayfaring.read_a_route, ability.catalogue.otherwayfaring.walk_it_steady, ability.catalogue.otherwayfaring.rope_and_anchor, ability.catalogue.otherwayfaring.chart_it, ability.catalogue.otherwayfaring.arrive] }
        next: lesson
  lesson:
    text: "Four, eight, twelve paces. Past twelve and something notices you have arrived."
