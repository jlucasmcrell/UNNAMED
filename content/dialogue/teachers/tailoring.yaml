id: dialogue.teacher.tailoring
kind: dialogue
schema: 1
display_key: dialogue.teacher.tailoring.name
tags: [dialogue]
notes: "The tailoring teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.tailoring]
root_node: greet
nodes:
  greet:
    text: "Clothing is a lie people agree with. Your job is to make it a useful lie."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.tailoring.measure_and_cut, ability.catalogue.tailoring.mend_and_turn, ability.catalogue.tailoring.wool_trousers, ability.catalogue.tailoring.dye_and_mark, ability.catalogue.tailoring.robe_under_armour, ability.catalogue.tailoring.the_cut_that_reads_high_born, ability.catalogue.tailoring.a_wardrobe_not_a_costume] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "It is fitting your body. It should fit a body. Start with the shoulders."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.tailoring.measure_and_cut, ability.catalogue.tailoring.mend_and_turn, ability.catalogue.tailoring.wool_trousers, ability.catalogue.tailoring.dye_and_mark, ability.catalogue.tailoring.robe_under_armour, ability.catalogue.tailoring.the_cut_that_reads_high_born, ability.catalogue.tailoring.a_wardrobe_not_a_costume] }
        next: lesson
  lesson:
    text: "Cut for movement, then take in for shape. Not the other way round, never the other way."
