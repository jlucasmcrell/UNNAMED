id: dialogue.teacher.lockpicking
kind: dialogue
schema: 1
display_key: dialogue.teacher.lockpicking.name
tags: [dialogue]
notes: "The locks and mechanisms teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.lockpicking]
root_node: greet
nodes:
  greet:
    text: "\"You want the locks and mechanisms? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.lockpicking.pick_a_lock, ability.catalogue.lockpicking.ring_of_keys, ability.catalogue.lockpicking.seals_and_latches, ability.catalogue.lockpicking.read_the_mechanism, ability.catalogue.lockpicking.the_safe_option, ability.catalogue.lockpicking.vault_discipline] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.lockpicking.pick_a_lock, ability.catalogue.lockpicking.ring_of_keys, ability.catalogue.lockpicking.seals_and_latches, ability.catalogue.lockpicking.read_the_mechanism, ability.catalogue.lockpicking.the_safe_option, ability.catalogue.lockpicking.vault_discipline] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
