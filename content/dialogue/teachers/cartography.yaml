id: dialogue.teacher.cartography
kind: dialogue
schema: 1
display_key: dialogue.teacher.cartography.name
tags: [dialogue]
notes: "The cartography teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.cartography]
root_node: greet
nodes:
  greet:
    text: "\"You want the cartography? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.cartography.survey_the_ground, ability.catalogue.cartography.grade_your_confidence, ability.catalogue.cartography.triangulate, ability.catalogue.cartography.copy_and_combine, ability.catalogue.cartography.chart_a_route_as_a_place] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.cartography.survey_the_ground, ability.catalogue.cartography.grade_your_confidence, ability.catalogue.cartography.triangulate, ability.catalogue.cartography.copy_and_combine, ability.catalogue.cartography.chart_a_route_as_a_place] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
