id: dialogue.teacher.armoursmithing
kind: dialogue
schema: 1
display_key: dialogue.teacher.armoursmithing.name
tags: [dialogue]
notes: "The armoursmithing teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.armoursmithing]
root_node: greet
nodes:
  greet:
    text: "It should sound bored. If it rings, it has opinions, and armour with opinions kills its wearer."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.armoursmithing.fit_to_a_body, ability.catalogue.armoursmithing.lame_and_lace, ability.catalogue.armoursmithing.close_the_gaps, ability.catalogue.armoursmithing.layer_for_the_weather, ability.catalogue.armoursmithing.phase_laminate, ability.catalogue.armoursmithing.harness_for_a_heavy_frame, ability.catalogue.armoursmithing.a_suit_that_is_worn] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Wear it an hour. Then tell me which joint complained. That is the flaw, not your shape."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.armoursmithing.fit_to_a_body, ability.catalogue.armoursmithing.lame_and_lace, ability.catalogue.armoursmithing.close_the_gaps, ability.catalogue.armoursmithing.layer_for_the_weather, ability.catalogue.armoursmithing.phase_laminate, ability.catalogue.armoursmithing.harness_for_a_heavy_frame, ability.catalogue.armoursmithing.a_suit_that_is_worn] }
        next: lesson
  lesson:
    text: "Protection is not thickness. It is deflection and a seam that does not find the body."
