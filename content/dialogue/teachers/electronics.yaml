id: dialogue.teacher.electronics
kind: dialogue
schema: 1
display_key: dialogue.teacher.electronics.name
tags: [dialogue]
notes: "The electrics and electronics teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.electronics]
root_node: greet
nodes:
  greet:
    text: "\"You want the electrics and electronics? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.electronics.cell_and_coil, ability.catalogue.electronics.close_a_circuit, ability.catalogue.electronics.signal, ability.catalogue.electronics.damper_field, ability.catalogue.electronics.rift_tap] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.electronics.cell_and_coil, ability.catalogue.electronics.close_a_circuit, ability.catalogue.electronics.signal, ability.catalogue.electronics.damper_field, ability.catalogue.electronics.rift_tap] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
