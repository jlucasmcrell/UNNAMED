id: dialogue.teacher.transmutation
kind: dialogue
schema: 1
display_key: dialogue.teacher.transmutation.name
tags: [dialogue]
notes: "The transmutation teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.transmutation]
root_node: greet
nodes:
  greet:
    text: "\"You want the transmutation? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.transmutation.temper_edge, ability.catalogue.transmutation.soften_stone, ability.catalogue.transmutation.reinforce_the_seam, ability.catalogue.transmutation.reading_the_grain, ability.catalogue.transmutation.coldbloom_pressing] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.transmutation.temper_edge, ability.catalogue.transmutation.soften_stone, ability.catalogue.transmutation.reinforce_the_seam, ability.catalogue.transmutation.reading_the_grain, ability.catalogue.transmutation.coldbloom_pressing] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
