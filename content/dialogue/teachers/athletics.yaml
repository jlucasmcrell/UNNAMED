id: dialogue.teacher.athletics
kind: dialogue
schema: 1
display_key: dialogue.teacher.athletics.name
tags: [dialogue]
notes: "The athletics teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.athletics]
root_node: greet
nodes:
  greet:
    text: "\"You want the athletics? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.athletics.hard_going, ability.catalogue.athletics.carry_the_load, ability.catalogue.athletics.vault_and_roll, ability.catalogue.athletics.climb_charge, ability.catalogue.athletics.haul_as_a_team, ability.catalogue.athletics.second_wind] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.athletics.hard_going, ability.catalogue.athletics.carry_the_load, ability.catalogue.athletics.vault_and_roll, ability.catalogue.athletics.climb_charge, ability.catalogue.athletics.haul_as_a_team, ability.catalogue.athletics.second_wind] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
