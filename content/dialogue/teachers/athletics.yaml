id: dialogue.teacher.athletics
kind: dialogue
schema: 1
display_key: dialogue.teacher.athletics.name
tags: [dialogue]
notes: "The athletics teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.athletics]
root_node: greet
nodes:
  greet:
    text: "Easy walking teaches nothing. You want this to hurt a little, in a way you chose."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.athletics.carry_the_load] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are breathing wrong. That is not a moral point, it is why you slowed down."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.athletics.carry_the_load] }
        next: lesson
  lesson:
    text: "Long effort, short recovery. The recovery is the training; the effort is only the bill."
