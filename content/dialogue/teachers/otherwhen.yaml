id: dialogue.teacher.otherwhen
kind: dialogue
schema: 1
display_key: dialogue.teacher.otherwhen.name
tags: [dialogue]
notes: "The otherwhen teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.otherwhen]
root_node: greet
nodes:
  greet:
    text: "I keep the record of moments that have been amended. Your request has been amended once already."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.otherwhen.stillhour, ability.catalogue.otherwhen.the_echo_of_a_deed, ability.catalogue.otherwhen.hold_the_hour, ability.catalogue.otherwhen.what_a_place_remembers] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You have been here before. This is a correction, not a repetition."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.otherwhen.stillhour, ability.catalogue.otherwhen.the_echo_of_a_deed, ability.catalogue.otherwhen.hold_the_hour, ability.catalogue.otherwhen.what_a_place_remembers] }
        next: lesson
  lesson:
    text: "A moment is a page. Changing it leaves the old ink; the ink is what notices you."
