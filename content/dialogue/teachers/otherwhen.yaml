id: dialogue.teacher.otherwhen
kind: dialogue
schema: 1
display_key: dialogue.teacher.otherwhen.name
tags: [dialogue]
notes: "The otherwhen teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.otherwhen]
root_node: greet
nodes:
  greet:
    text: "\"You want the otherwhen? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.otherwhen.stillhour, ability.catalogue.otherwhen.the_echo_of_a_deed, ability.catalogue.otherwhen.hold_the_hour, ability.catalogue.otherwhen.what_a_place_remembers] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.otherwhen.stillhour, ability.catalogue.otherwhen.the_echo_of_a_deed, ability.catalogue.otherwhen.hold_the_hour, ability.catalogue.otherwhen.what_a_place_remembers] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
