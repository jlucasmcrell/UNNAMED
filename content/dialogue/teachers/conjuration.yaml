id: dialogue.teacher.conjuration
kind: dialogue
schema: 1
display_key: dialogue.teacher.conjuration.name
tags: [dialogue]
notes: "The conjuration teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.conjuration]
root_node: greet
nodes:
  greet:
    text: "\"You want the conjuration? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.conjuration.passage, ability.catalogue.conjuration.scrap_sentinel, ability.catalogue.conjuration.calling_under_contract, ability.catalogue.conjuration.bind_with_a_term, ability.catalogue.conjuration.the_door_that_stays] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.conjuration.passage, ability.catalogue.conjuration.scrap_sentinel, ability.catalogue.conjuration.calling_under_contract, ability.catalogue.conjuration.bind_with_a_term, ability.catalogue.conjuration.the_door_that_stays] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
