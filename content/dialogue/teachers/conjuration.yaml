id: dialogue.teacher.conjuration
kind: dialogue
schema: 1
display_key: dialogue.teacher.conjuration.name
tags: [dialogue]
notes: "The conjuration teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.conjuration]
root_node: greet
nodes:
  greet:
    text: "You want to make a thing that was not here. Then first learn what here means, and be polite about it."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.conjuration.passage, ability.catalogue.conjuration.scrap_sentinel, ability.catalogue.conjuration.bind_with_a_term, ability.catalogue.conjuration.the_door_that_stays] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You conjured it. You did not ask where it came from."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.conjuration.passage, ability.catalogue.conjuration.scrap_sentinel, ability.catalogue.conjuration.bind_with_a_term, ability.catalogue.conjuration.the_door_that_stays] }
        next: lesson
  lesson:
    text: "Every made thing answers to the shape of the hole it came out of. Make the hole first."
