id: dialogue.teacher.weaponsmithing
kind: dialogue
schema: 1
display_key: dialogue.teacher.weaponsmithing.name
tags: [dialogue]
notes: "The weaponsmithing teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.weaponsmithing]
root_node: greet
nodes:
  greet:
    text: "\"You want the weaponsmithing? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.weaponsmithing.cut_and_thrust_geometry, ability.catalogue.weaponsmithing.haft_and_socket, ability.catalogue.weaponsmithing.grip_for_a_hand, ability.catalogue.weaponsmithing.balanced_for_one_mode, ability.catalogue.weaponsmithing.production_slow_strike, ability.catalogue.weaponsmithing.conductor_blade, ability.catalogue.weaponsmithing.a_weapon_with_a_name, ability.catalogue.weaponsmithing.conductor_blades] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.weaponsmithing.cut_and_thrust_geometry, ability.catalogue.weaponsmithing.haft_and_socket, ability.catalogue.weaponsmithing.grip_for_a_hand, ability.catalogue.weaponsmithing.balanced_for_one_mode, ability.catalogue.weaponsmithing.production_slow_strike, ability.catalogue.weaponsmithing.conductor_blade, ability.catalogue.weaponsmithing.a_weapon_with_a_name, ability.catalogue.weaponsmithing.conductor_blades] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
