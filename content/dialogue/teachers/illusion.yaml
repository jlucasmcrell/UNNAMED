id: dialogue.teacher.illusion
kind: dialogue
schema: 1
display_key: dialogue.teacher.illusion.name
tags: [dialogue]
notes: "The illusion teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.illusion]
root_node: greet
nodes:
  greet:
    text: "\"You want the illusion? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.illusion.stillwater_veil, ability.catalogue.illusion.false_step, ability.catalogue.illusion.the_wrong_shape, ability.catalogue.illusion.disbelieve, ability.catalogue.illusion.a_room_that_was_not] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.illusion.stillwater_veil, ability.catalogue.illusion.false_step, ability.catalogue.illusion.the_wrong_shape, ability.catalogue.illusion.disbelieve, ability.catalogue.illusion.a_room_that_was_not] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
