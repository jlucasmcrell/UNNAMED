id: dialogue.teacher.divination
kind: dialogue
schema: 1
display_key: dialogue.teacher.divination.name
tags: [dialogue]
notes: "The divination teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.divination]
root_node: greet
nodes:
  greet:
    text: "\"You want the divination? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.divination.read_the_trace, ability.catalogue.divination.detect_working, ability.catalogue.divination.circle_of_recall, ability.catalogue.divination.sense_the_seam, ability.catalogue.divination.the_confident_wrong, ability.catalogue.divination.a_thing_that_has_not_happened] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.divination.read_the_trace, ability.catalogue.divination.detect_working, ability.catalogue.divination.circle_of_recall, ability.catalogue.divination.sense_the_seam, ability.catalogue.divination.the_confident_wrong, ability.catalogue.divination.a_thing_that_has_not_happened] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
