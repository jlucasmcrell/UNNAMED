id: dialogue.teacher.prospecting
kind: dialogue
schema: 1
display_key: dialogue.teacher.prospecting.name
tags: [dialogue]
notes: "The prospecting teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.prospecting]
root_node: greet
nodes:
  greet:
    text: "\"You want the prospecting? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.prospecting.ground_colour, ability.catalogue.prospecting.pan_and_wash, ability.catalogue.prospecting.stonesense_reading, ability.catalogue.prospecting.the_seam_before_you_dig] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.prospecting.ground_colour, ability.catalogue.prospecting.pan_and_wash, ability.catalogue.prospecting.stonesense_reading, ability.catalogue.prospecting.the_seam_before_you_dig] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
