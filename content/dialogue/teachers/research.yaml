id: dialogue.teacher.research
kind: dialogue
schema: 1
display_key: dialogue.teacher.research.name
tags: [dialogue]
notes: "The research teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.research]
root_node: greet
nodes:
  greet:
    text: "\"You want the research? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.research.read_the_shelf, ability.catalogue.research.reproduce_a_result, ability.catalogue.research.the_experiment, ability.catalogue.research.reverse_a_method, ability.catalogue.research.a_formula_of_your_own] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.research.read_the_shelf, ability.catalogue.research.reproduce_a_result, ability.catalogue.research.the_experiment, ability.catalogue.research.reverse_a_method, ability.catalogue.research.a_formula_of_your_own] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
