id: dialogue.teacher.swimming
kind: dialogue
schema: 1
display_key: dialogue.teacher.swimming.name
tags: [dialogue]
notes: "The swimming teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.swimming]
root_node: greet
nodes:
  greet:
    text: "\"You want the swimming? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.swimming.stay_up, ability.catalogue.swimming.cold_water, ability.catalogue.swimming.cross_with_a_load, ability.catalogue.swimming.weirs_and_currents, ability.catalogue.swimming.water_rescue, ability.catalogue.swimming.shed_the_weight] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.swimming.stay_up, ability.catalogue.swimming.cold_water, ability.catalogue.swimming.cross_with_a_load, ability.catalogue.swimming.weirs_and_currents, ability.catalogue.swimming.water_rescue, ability.catalogue.swimming.shed_the_weight] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
