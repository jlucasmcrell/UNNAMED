id: dialogue.teacher.herbal_medicine
kind: dialogue
schema: 1
display_key: dialogue.teacher.herbal_medicine.name
tags: [dialogue]
notes: "The herbcraft and physick teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.herbal_medicine]
root_node: greet
nodes:
  greet:
    text: "Most of what people call medicine is tea with a story attached. Some of it works, and the story helps."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.herbal_medicine.poultice, ability.catalogue.herbal_medicine.tea_for_what_ails, ability.catalogue.herbal_medicine.dose, ability.catalogue.herbal_medicine.bitterroot_and_heartleaf, ability.catalogue.herbal_medicine.the_long_illness] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Wrong part of the plant. The root, not the leaf, and not in that season."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.herbal_medicine.poultice, ability.catalogue.herbal_medicine.tea_for_what_ails, ability.catalogue.herbal_medicine.dose, ability.catalogue.herbal_medicine.bitterroot_and_heartleaf, ability.catalogue.herbal_medicine.the_long_illness] }
        next: lesson
  lesson:
    text: "Dose and timing. A good herb at the wrong hour is a poison with good manners."
