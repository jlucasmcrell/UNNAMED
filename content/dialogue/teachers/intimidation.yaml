id: dialogue.teacher.intimidation
kind: dialogue
schema: 1
display_key: dialogue.teacher.intimidation.name
tags: [dialogue]
notes: "The intimidation teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.intimidation]
root_node: greet
nodes:
  greet:
    text: "You are trying to be frightening. Frightening is a budget. Spend it once."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.intimidation.stand_like_you_mean_it, ability.catalogue.intimidation.name_the_consequence, ability.catalogue.intimidation.pressure, ability.catalogue.intimidation.the_wrong_kind_of_calm] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Too much. Now they must fight you to keep their pride."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.intimidation.stand_like_you_mean_it, ability.catalogue.intimidation.name_the_consequence, ability.catalogue.intimidation.pressure, ability.catalogue.intimidation.the_wrong_kind_of_calm] }
        next: lesson
  lesson:
    text: "Leave them a way out that is cheaper than the way through."
