id: dialogue.teacher.projector
kind: dialogue
schema: 1
display_key: dialogue.teacher.projector.name
tags: [dialogue]
notes: "The otherwrought projectors teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.projector]
root_node: greet
nodes:
  greet:
    text: "A projector throws something that arrives. Where it arrives is your entire job."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.projector.charge_discipline, ability.catalogue.projector.long_sight, ability.catalogue.projector.recoil_that_pays] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You sighted on the far bank. The thing flew to the near one. Interesting."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.projector.charge_discipline, ability.catalogue.projector.long_sight, ability.catalogue.projector.recoil_that_pays] }
        next: lesson
  lesson:
    text: "Clean, seat, charge. A misfire is almost always one of those three, in reverse order."
