id: dialogue.teacher.masonry
kind: dialogue
schema: 1
display_key: dialogue.teacher.masonry.name
tags: [dialogue]
notes: "The masonry teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.masonry]
root_node: greet
nodes:
  greet:
    text: "This wall is older than the word for wall. It will still be here when the word is gone. Listen."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.masonry.drystone, ability.catalogue.masonry.foot_and_course, ability.catalogue.masonry.mortared_coursing, ability.catalogue.masonry.arch_and_lintel, ability.catalogue.masonry.repair_the_old_work, ability.catalogue.masonry.curtain_and_tower, ability.catalogue.masonry.read_the_fall, ability.catalogue.masonry.build_for_a_thousand_years] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are laying on top. Nothing is built on top. It is built *from*."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.masonry.drystone, ability.catalogue.masonry.foot_and_course, ability.catalogue.masonry.mortared_coursing, ability.catalogue.masonry.arch_and_lintel, ability.catalogue.masonry.repair_the_old_work, ability.catalogue.masonry.curtain_and_tower, ability.catalogue.masonry.read_the_fall, ability.catalogue.masonry.build_for_a_thousand_years] }
        next: lesson
  lesson:
    text: "Every stone has a seat it wants. Find it, or the building finds it for you, later, and loudly."
