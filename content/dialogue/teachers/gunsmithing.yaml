id: dialogue.teacher.gunsmithing
kind: dialogue
schema: 1
display_key: dialogue.teacher.gunsmithing.name
tags: [dialogue]
notes: "The gunsmithing teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.gunsmithing]
root_node: greet
nodes:
  greet:
    text: "Powder is a patient thing. It waits for you to be careless, and it brings friends."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.gunsmithing.powder_charge] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You measured the bore by eye. The bore is not impressed."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.gunsmithing.powder_charge] }
        next: lesson
  lesson:
    text: "Barrel, breech, then charge. Never the other way, and never while anyone is in front."
