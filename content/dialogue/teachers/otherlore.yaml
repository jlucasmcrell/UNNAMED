id: dialogue.teacher.otherlore
kind: dialogue
schema: 1
display_key: dialogue.teacher.otherlore.name
tags: [dialogue]
notes: "The otherlore teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.otherlore]
root_node: greet
nodes:
  greet:
    text: "Every door here has been opened before you were born. I can tell you by whom, and what it cost."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.otherlore.name_the_thing, ability.catalogue.otherlore.read_the_ground, ability.catalogue.otherlore.read_the_wake, ability.catalogue.otherlore.the_words_are_not_the_thing, ability.catalogue.otherlore.mark_and_meaning, ability.catalogue.otherlore.what_the_quiet_stones_hold] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You asked what happened. Ask instead who is not in the record."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.otherlore.name_the_thing, ability.catalogue.otherlore.read_the_ground, ability.catalogue.otherlore.read_the_wake, ability.catalogue.otherlore.the_words_are_not_the_thing, ability.catalogue.otherlore.mark_and_meaning, ability.catalogue.otherlore.what_the_quiet_stones_hold] }
        next: lesson
  lesson:
    text: "Read the absence. The omission is the oldest sentence in the world."
