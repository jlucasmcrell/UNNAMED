id: dialogue.teacher.dagger
kind: dialogue
schema: 1
display_key: dialogue.teacher.dagger.name
tags: [dialogue]
notes: "The dagger teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.dagger]
root_node: greet
nodes:
  greet:
    text: "Short blade, small room, bad manners. Sit. You are too tall for this already."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.dagger.gap_thrust, ability.catalogue.dagger.inside_step, ability.catalogue.dagger.seize_and_stab, ability.catalogue.dagger.off_hand_parry, ability.catalogue.dagger.hidden_draw, ability.catalogue.dagger.quiet_blade, ability.catalogue.dagger.mercy_stroke, ability.catalogue.dagger.every_seam] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Still standing in doorways like you own them. Good - that is where it works."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.dagger.gap_thrust, ability.catalogue.dagger.inside_step, ability.catalogue.dagger.seize_and_stab, ability.catalogue.dagger.off_hand_parry, ability.catalogue.dagger.hidden_draw, ability.catalogue.dagger.quiet_blade, ability.catalogue.dagger.mercy_stroke, ability.catalogue.dagger.every_seam] }
        next: lesson
  lesson:
    text: "A dagger is not a small sword. It is a conversation held much too close."
