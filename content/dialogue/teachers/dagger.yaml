id: dialogue.teacher.dagger
kind: dialogue
schema: 1
display_key: dialogue.teacher.dagger.name
tags: [dialogue]
notes: "The dagger teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.dagger]
root_node: greet
nodes:
  greet:
    text: "\"You want the dagger? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.dagger.gap_thrust, ability.catalogue.dagger.inside_step, ability.catalogue.dagger.seize_and_stab, ability.catalogue.dagger.off_hand_parry, ability.catalogue.dagger.hidden_draw, ability.catalogue.dagger.quiet_blade, ability.catalogue.dagger.punch_through, ability.catalogue.dagger.mercy_stroke, ability.catalogue.dagger.every_seam] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.dagger.gap_thrust, ability.catalogue.dagger.inside_step, ability.catalogue.dagger.seize_and_stab, ability.catalogue.dagger.off_hand_parry, ability.catalogue.dagger.hidden_draw, ability.catalogue.dagger.quiet_blade, ability.catalogue.dagger.punch_through, ability.catalogue.dagger.mercy_stroke, ability.catalogue.dagger.every_seam] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
