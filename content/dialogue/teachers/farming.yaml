id: dialogue.teacher.farming
kind: dialogue
schema: 1
display_key: dialogue.teacher.farming.name
tags: [dialogue]
notes: "The farming and husbandry teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.farming]
root_node: greet
nodes:
  greet:
    text: "You will lose a crop. Decide now which one, and the year will still be yours."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.farming.sow_and_hoe] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Your soil is tired. Feed it before you ask anything of it."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.farming.sow_and_hoe] }
        next: lesson
  lesson:
    text: "Rotate, rest, and put back more than you take. That is the whole of it, and nobody believes it."
