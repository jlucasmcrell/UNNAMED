id: dialogue.teacher.farming
kind: dialogue
schema: 1
display_key: dialogue.teacher.farming.name
tags: [dialogue]
notes: "The farming and husbandry teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.farming]
root_node: greet
nodes:
  greet:
    text: "\"You want the farming and husbandry? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.farming.sow_and_hoe, ability.catalogue.farming.herd_and_staddle, ability.catalogue.farming.the_bad_year] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.farming.sow_and_hoe, ability.catalogue.farming.herd_and_staddle, ability.catalogue.farming.the_bad_year] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
