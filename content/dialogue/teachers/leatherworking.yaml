id: dialogue.teacher.leatherworking
kind: dialogue
schema: 1
display_key: dialogue.teacher.leatherworking.name
tags: [dialogue]
notes: "The leatherwork teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.leatherworking]
root_node: greet
nodes:
  greet:
    text: "\"You want the leatherwork? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.leatherworking.tan_and_cure, ability.catalogue.leatherworking.stitch_that_grips, ability.catalogue.leatherworking.hide_vest, ability.catalogue.leatherworking.harness_and_strap, ability.catalogue.leatherworking.gambeson, ability.catalogue.leatherworking.a_sheath_that_waits, ability.catalogue.leatherworking.hide_of_a_beast_that_bit_you] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.leatherworking.tan_and_cure, ability.catalogue.leatherworking.stitch_that_grips, ability.catalogue.leatherworking.hide_vest, ability.catalogue.leatherworking.harness_and_strap, ability.catalogue.leatherworking.gambeson, ability.catalogue.leatherworking.a_sheath_that_waits, ability.catalogue.leatherworking.hide_of_a_beast_that_bit_you] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
