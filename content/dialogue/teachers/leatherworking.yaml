id: dialogue.teacher.leatherworking
kind: dialogue
schema: 1
display_key: dialogue.teacher.leatherworking.name
tags: [dialogue]
notes: "The leatherwork teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.leatherworking]
root_node: greet
nodes:
  greet:
    text: "A hide is skin with no opinions left. That makes it easier than people, and less forgiving."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.leatherworking.tan_and_cure, ability.catalogue.leatherworking.stitch_that_grips, ability.catalogue.leatherworking.hide_vest, ability.catalogue.leatherworking.harness_and_strap, ability.catalogue.leatherworking.gambeson, ability.catalogue.leatherworking.a_sheath_that_waits] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are cutting a shape. Cut a fit."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.leatherworking.tan_and_cure, ability.catalogue.leatherworking.stitch_that_grips, ability.catalogue.leatherworking.hide_vest, ability.catalogue.leatherworking.harness_and_strap, ability.catalogue.leatherworking.gambeson, ability.catalogue.leatherworking.a_sheath_that_waits] }
        next: lesson
  lesson:
    text: "Stretch and set. The mistake most people make is being gentle at the wrong moment."
