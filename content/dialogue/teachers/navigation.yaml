id: dialogue.teacher.navigation
kind: dialogue
schema: 1
display_key: dialogue.teacher.navigation.name
tags: [dialogue]
notes: "The navigation teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.navigation]
root_node: greet
nodes:
  greet:
    text: "\"You want the navigation? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.navigation.roads_water_and_stars, ability.catalogue.navigation.by_rumour, ability.catalogue.navigation.bearings_by_stars, ability.catalogue.navigation.get_the_party_home] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.navigation.roads_water_and_stars, ability.catalogue.navigation.by_rumour, ability.catalogue.navigation.bearings_by_stars, ability.catalogue.navigation.get_the_party_home] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
