id: dialogue.teacher.carpentry
kind: dialogue
schema: 1
display_key: dialogue.teacher.carpentry.name
tags: [dialogue]
notes: "The carpentry and construction teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.carpentry]
root_node: greet
nodes:
  greet:
    text: "Wood is honest. You can hear where it wants to break if you stop talking."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.carpentry.pad_and_footing, ability.catalogue.carpentry.wall_and_doorway, ability.catalogue.carpentry.roof_and_ridge, ability.catalogue.carpentry.blueprint, ability.catalogue.carpentry.stores_and_cellar, ability.catalogue.carpentry.plant_cover, ability.catalogue.carpentry.bridge_the_gap, ability.catalogue.carpentry.settlement, ability.catalogue.carpentry.frame_and_brace] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "Your joint is a wish. Make it a wedge."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.carpentry.pad_and_footing, ability.catalogue.carpentry.wall_and_doorway, ability.catalogue.carpentry.roof_and_ridge, ability.catalogue.carpentry.blueprint, ability.catalogue.carpentry.stores_and_cellar, ability.catalogue.carpentry.plant_cover, ability.catalogue.carpentry.bridge_the_gap, ability.catalogue.carpentry.settlement, ability.catalogue.carpentry.frame_and_brace] }
        next: lesson
  lesson:
    text: "The grain picks the cut. If you disagree with it, the beam will disagree with you in winter."
