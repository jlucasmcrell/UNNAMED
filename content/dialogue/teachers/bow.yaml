id: dialogue.teacher.bow
kind: dialogue
schema: 1
display_key: dialogue.teacher.bow.name
tags: [dialogue]
notes: "The bow teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.bow]
root_node: greet
nodes:
  greet:
    text: "\"You want the bow? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.bow.steady_draw, ability.catalogue.bow.quick_loose, ability.catalogue.bow.field_fletching, ability.catalogue.bow.arced_shot, ability.catalogue.bow.pinning_shot, ability.catalogue.bow.step_and_loose, ability.catalogue.bow.point_blank, ability.catalogue.bow.silent_shot, ability.catalogue.bow.weak_point_shot, ability.catalogue.bow.split_second, ability.catalogue.bow.charge_pierce] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.bow.steady_draw, ability.catalogue.bow.quick_loose, ability.catalogue.bow.field_fletching, ability.catalogue.bow.arced_shot, ability.catalogue.bow.pinning_shot, ability.catalogue.bow.step_and_loose, ability.catalogue.bow.point_blank, ability.catalogue.bow.silent_shot, ability.catalogue.bow.weak_point_shot, ability.catalogue.bow.split_second, ability.catalogue.bow.charge_pierce] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
