id: dialogue.teacher.demolition
kind: dialogue
schema: 1
display_key: dialogue.teacher.demolition.name
tags: [dialogue]
notes: "The demolition teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.demolition]
root_node: greet
nodes:
  greet:
    text: "I am the document that says which part comes down. You are the part that must not be standing near it."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.demolition.lay_a_charge, ability.catalogue.demolition.demolish_a_building] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You cleared the building. You did not clear the roof."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.demolition.lay_a_charge, ability.catalogue.demolition.demolish_a_building] }
        next: lesson
  lesson:
    text: "Charge, path, distance. The charge is arithmetic; the other two are your life."
