id: dialogue.teacher.demolition
kind: dialogue
schema: 1
display_key: dialogue.teacher.demolition.name
tags: [dialogue]
notes: "The demolition teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.demolition]
root_node: greet
nodes:
  greet:
    text: "\"You want the demolition? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.demolition.lay_a_charge, ability.catalogue.demolition.demolish_a_building] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.demolition.lay_a_charge, ability.catalogue.demolition.demolish_a_building] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
