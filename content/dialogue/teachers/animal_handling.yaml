id: dialogue.teacher.animal_handling
kind: dialogue
schema: 1
display_key: dialogue.teacher.animal_handling.name
tags: [dialogue]
notes: "The animal handling teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.animal_handling]
root_node: greet
nodes:
  greet:
    text: "Do not reach. Wait. He is reading you and you are failing the interview."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.animal_handling.read_temperament, ability.catalogue.animal_handling.silent_signals, ability.catalogue.animal_handling.taming_by_habituation, ability.catalogue.animal_handling.teach_commands, ability.catalogue.animal_handling.pack_tactics, ability.catalogue.animal_handling.through_fire_and_fold] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You moved first. He noticed. Try again tomorrow."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.animal_handling.read_temperament, ability.catalogue.animal_handling.silent_signals, ability.catalogue.animal_handling.taming_by_habituation, ability.catalogue.animal_handling.teach_commands, ability.catalogue.animal_handling.pack_tactics, ability.catalogue.animal_handling.through_fire_and_fold] }
        next: lesson
  lesson:
    text: "Food, patience, and no sudden hands. That is the whole of handling; the rest is their temperament."
