id: dialogue.teacher.music
kind: dialogue
schema: 1
display_key: dialogue.teacher.music.name
tags: [dialogue]
notes: "The music teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.music]
root_node: greet
nodes:
  greet:
    text: "You want to make a sound people keep. Then you must be willing to be quiet at the right moment."
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.music.the_working_song, ability.catalogue.music.playing_the_room, ability.catalogue.music.the_old_songs, ability.catalogue.music.a_wake_for_the_dead] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "You are playing loudly. Loud is not the same as heard."
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.music.the_working_song, ability.catalogue.music.playing_the_room, ability.catalogue.music.the_old_songs, ability.catalogue.music.a_wake_for_the_dead] }
        next: lesson
  lesson:
    text: "Rhythm first, then tone, then everything you want to say."
