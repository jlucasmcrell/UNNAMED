id: dialogue.teacher.music
kind: dialogue
schema: 1
display_key: dialogue.teacher.music.name
tags: [dialogue]
notes: "The music teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.music]
root_node: greet
nodes:
  greet:
    text: "\"You want the music? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.music.the_working_song, ability.catalogue.music.playing_the_room, ability.catalogue.music.the_old_songs, ability.catalogue.music.a_wake_for_the_dead] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.music.the_working_song, ability.catalogue.music.playing_the_room, ability.catalogue.music.the_old_songs, ability.catalogue.music.a_wake_for_the_dead] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
