id: dialogue.teacher.mace_hammer
kind: dialogue
schema: 1
display_key: dialogue.teacher.mace_hammer.name
tags: [dialogue]
notes: "The hammer teacher: one lesson list, everything they know at its band. D13 catalogue pass."
participants: [npc.teacher.mace_hammer]
root_node: greet
nodes:
  greet:
    text: "\"You want the hammer? Then you pay for it and you bring the hands for it.\""
    once: true
    next_if_exhausted: again
    choices:
      - id: teach
        text: "Teach me what you know of it."
        consequences:
          - { command: teach, refs: [ability.catalogue.mace_hammer.drive_through_the_guard, ability.catalogue.mace_hammer.bell_ringer, ability.catalogue.mace_hammer.beak_strike, ability.catalogue.mace_hammer.short_grip, ability.catalogue.mace_hammer.counterweight_recovery, ability.catalogue.mace_hammer.dent_the_harness, ability.catalogue.mace_hammer.rivet_breaker, ability.catalogue.mace_hammer.fault_strike, ability.catalogue.mace_hammer.fell_the_armoured] }
        next: lesson
      - id: leave
        text: "Another time."
  again:
    text: "\"Back for more, then.\""
    choices:
      - id: teach
        text: "Teach me."
        consequences:
          - { command: teach, refs: [ability.catalogue.mace_hammer.drive_through_the_guard, ability.catalogue.mace_hammer.bell_ringer, ability.catalogue.mace_hammer.beak_strike, ability.catalogue.mace_hammer.short_grip, ability.catalogue.mace_hammer.counterweight_recovery, ability.catalogue.mace_hammer.dent_the_harness, ability.catalogue.mace_hammer.rivet_breaker, ability.catalogue.mace_hammer.fault_strike, ability.catalogue.mace_hammer.fell_the_armoured] }
        next: lesson
  lesson:
    text: "The lesson goes as far as your hands carry it. Come back when the band moves."
