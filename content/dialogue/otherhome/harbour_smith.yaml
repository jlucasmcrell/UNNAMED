id: dialogue.otherhome.harbour_smith
kind: dialogue
schema: 1
display_key: dialogue.otherhome.harbour_smith.name
tags: [dialogue]
notes: Dema Orsk, the harbour's smith - the quay's ironwork, the boats' fittings, and the Assize's chain, all mended in the same hour. She teaches the blade and the forge by her own lines; her voice is a working harbour's, short and exact.
participants: [npc.otherhome.harbour_smith]
root_node: greet
nodes:
  greet:
    text: "\"Mind the iron - it's still deciding what shape it wants.\" She doesn't look up. \"You're the one the clerk wrote down. Good. Somebody's been bending my boat-hooks out of true and I'd like to know who.\""
    choices:
      - id: chain_fit
        text: "About the Assize's chain."
        conditions: [{ kind: quest_state, quest_ref: quest.otherhome.held_by_the_chain, is: active }]
        next: chain_fit
      - id: teach
        text: "Teach me the forge."
        consequences:
          - { command: teach, refs: [recipe.smithing.iron_billet, recipe.smithing.march_spear, recipe.smithing.lame_coif] }
          - { command: record_relationship_event, npc_ref: npc.otherhome.harbour_smith, dimension: trust, delta: 4, event: asked_to_learn }
        next: lesson
      - id: trade
        text: "What have you got that's finished?"
        next: again
  lesson:
    text: "\"Billet first. You don't make a spear out of impatience.\" She sets the tongs in your hand and closes your fingers round them, hard. \"That's the whole of it. The rest is how long you're willing to be wrong about the heat.\""
    next: again
  chain_fit:
    text: "\"Two billets, and one of them's been in the sea.\" She turns it, finds the sound side, sets it down anyway. \"It'll go in the chain. Floats new, splice honest - all a chain needs to be believed.\""
    choices:
      - id: give
        text: "Here they are - two billets."
        conditions: [{ kind: has_item, item_ref: item.material.iron_ingot, count: 2 }]
        consequences:
          - { command: transfer_item, item_ref: item.material.iron_ingot, count: 2, to: npc }
          - { command: record_relationship_event, npc_ref: npc.otherhome.harbour_smith, dimension: trust, delta: 5, event: brought_the_chain_iron }
        next: again
      - id: later
        text: "I'll bring them."
        next: again
  again:
    text: "\"Still here? Then here - hold this while I lace the coffin.\""
    choices:
      - id: chain_fit
        text: "About the Assize's chain."
        conditions: [{ kind: quest_state, quest_ref: quest.otherhome.held_by_the_chain, is: active }]
        next: chain_fit

