id: dialogue.otherhome.assize_sergeant
kind: dialogue
schema: 1
display_key: dialogue.otherhome.assize_sergeant.name
tags: [dialogue]
notes: Sergeant Iva Tarn, the Assize's sergeant - holds the Drowned Gate's ring and drills the watch, because a ring is held with a shaft's length of clearance. She teaches the long thrust.
participants: [npc.otherhome.assize_sergeant]
root_node: greet
nodes:
  greet:
    text: "\"The Gate stays shut. That's not a threat, it's a rota.\" She plants the butt of the shaft on the stone, once. \"You're the one the clerk wrote down. Good - then you can hold a line.\""
    choices:
      - id: chain
        text: "The chain between the buoys has slipped its floats."
        conditions:
          - { kind: quest_state, quest_ref: quest.otherhome.held_by_the_chain, is: not_started }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.otherhome.assize_sergeant, dimension: respect, delta: 5, event: took_the_line_job }
          - { command: start_quest, quest_ref: quest.otherhome.held_by_the_chain }
        next: chain
      - id: teach
        text: "Drill me, then."
        consequences:
          - { command: teach, refs: [ability.polearm.long_thrust] }
          - { command: record_relationship_event, npc_ref: npc.otherhome.assize_sergeant, dimension: trust, delta: 4, event: asked_to_learn }
        next: lesson
      - id: gate
        text: "What's on the other side of it?"
        next: again
      - id: report
        text: "The line's walked. It holds."
        conditions: [{ kind: quest_state, quest_ref: quest.otherhome.held_by_the_chain, is: active }]
        next: line
      - id: witness
        text: "The Exchange needs a line of its tariff witnessed."
        conditions: [{ kind: quest_state, quest_ref: quest.otherhome.week_is_the_fee, objective: o_assize, is: active }]
        next: witness
  lesson:
    text: "\"Long thrust isn't a reach, it's a decision you make early.\" She steps back and marks the stone with her heel. \"Past that mark, you've committed. So commit on purpose.\""
    next: again
  again:
    text: "\"Rota's the rota. If you're not drilling you're carrying.\""
    choices:
      - id: chain
        text: "About the chain."
        conditions:
          - { kind: quest_state, quest_ref: quest.otherhome.held_by_the_chain, is: not_started }
        consequences:
          - { command: record_relationship_event, npc_ref: npc.otherhome.assize_sergeant, dimension: respect, delta: 5, event: took_the_line_job }
          - { command: start_quest, quest_ref: quest.otherhome.held_by_the_chain }
        next: chain
      - id: witness
        text: "The Exchange needs a line of its tariff witnessed."
        conditions: [{ kind: quest_state, quest_ref: quest.otherhome.week_is_the_fee, objective: o_assize, is: active }]
        next: witness
      - id: gate
        text: "What's on the other side of it?"
        next: again
  chain:
    text: "\"It has.\" The shaft comes down once, and stays down. \"When that chain is down, every hull that crosses the line is a forfeit I have to argue, and I am not paid to argue. Dema mends iron. Two billets and she'll set it.\" A nod at the mouth. \"Then walk the line out to the ring and tell me it holds.\""
    choices:
      - id: take
        text: "Two billets to the smith, then the line."
        next: again
  line:
    text: "\"Held, is it.\" It is the closest thing to pleasure the rota allows. \"Then the line is a line again and the Assize thanks you. Dormancy is not licence - the terms say it twice - and a line nobody can cross is the whole of what I am for.\" Coin, counted out. \"The forfeit. It has been in my coat since the last hull.\""
    choices:
      - id: back
        text: "Then it's held."
  witness:
    text: "\"Witnessed.\" The mark goes down beside the amendment, unhurried. \"An amended line wants a second hand, or it is just a line somebody changed. The Exchange writes plainly and still wants the witness. Sensible people.\""
    choices:
      - id: back
        text: "I'll tell her it's witnessed."

