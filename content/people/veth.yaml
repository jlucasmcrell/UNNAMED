name: Veth
notes: The touched lineage (RACES.md §1). Playable since the slice (E14 / OD-08, DCP:912), and one of the four peoples a character can be made from since 2026-10-24 (owner). Suggest names are the owner-approved working list (owner, 2026-10-06, "Draft list for review"; canon proposals/new/playtest/VETH_NAMES_AND_GRAZERS.md as recorded in docs/restore/OWNER_RULINGS_2026-10-05_to_14.txt) - a short given name and a land-or-work surname, old roots vess, tal, lind, ren, ost, pel. They are working names until the owner reviews them; the list makes no leaning by body or pronouns.
playable: true
card:
  epithet: The touched lineage
  summary: Ordinary humans, insofar as that word means anything here - their ancestors survived a Pachakuti. The majority, and the least examined.
  body: Slightly long forearms and shins, long fingers, unusually mobile joints, reflective irises.
  leans_toward: Melee and ranged.
  trade_off: Learn anything fast, then stall - the best swordsman alive is not Veth.
traits:                            # RACES.md §1; RACE_ABILITIES_PROPOSAL.md §1, §3.1 (owner-approved 2026-10-24)
  attribute_grant: { agility: 1 }
  free_attribute_points: 1         # +1 to any attribute, the player's choice
  free_attribute_default: agility    # quick start: the Veth lean, and no number in play today moves
  mantle_bonus_m: 0.15             # supple
learning:
  rate_by_band: [[0, 150], [30, 125], [60, 100]]   # fastest skill acquisition
  aptitude_percent: { melee: 110, ranged: 110 }
  mastery_ceiling: 90              # lowest skill cap
  novelty_percent: 150             # quick study
