tags: [lore, history]
title: The Last Pachakuti
category: history
notes: "The transition every people's origin account hangs on, from docs/MYTHOLOGY.md, The Pachakuti and The Silence. A surveyor's account of what the last turn did to the peoples; told by Sel Arien, read in the entry's own book, and the cause left unnamed as canon leaves it. Page 3 is the Vaskaal's outside record (readable.the_last_pachakuti_ii)."
pages:
  - page: 1
    text: >
      Every people's account of itself hangs on the last Pachakuti, and the surveyor keeps the record of what the
      turn left behind in each of them. The Veth came through changed, quicker to learn and quicker to forget. The
      Kal were fixed to stone where the turn caught them, and a Kal caught when a world turns does not die; they
      set, all the way through. The Siann came through with no account of before, their oldest writing beginning
      after the turn, in the middle of a sentence. The turn is the hinge the whole of it swings on.
    sources:
      - { how: told, ref: dialogue.ashen_hollow.sel_arien }
  - page: 2
    text: >
      What caused the turn, the book does not say, because no one knows, and the surveyor will not let a blank be
      filled with a guess and then read as history. She notes instead that the turn was not a natural thing, and
      was not expected, and that its cause is the one fact every people is missing at the same time, which is
      rare in a world where every people is missing a different thing. The book ends there, at the missing cause,
      and the surveyor holds that the honest place to end it.
    sources:
      - { how: inspected, ref: readable.the_last_pachakuti }
  - page: 3
    text: >
      The one people who were not in it, and their account sits outside the hinge. Every people's story hangs on
      the last Pachakuti, and no two agree on what came before. The Vaskaal do not tell a story; they keep a
      record, and they can say what the world was like before the last turn and after it, from outside, and mean
      it plainly. The turn that is every native people's hinge is, to them, weather they watched pass. Their
      record does not name a cause and does not need one. The hinge, they say, is only a door the sky went
      through, and they were never in the room.
    sources:
      - { how: inspected, ref: readable.the_last_pachakuti_ii }
