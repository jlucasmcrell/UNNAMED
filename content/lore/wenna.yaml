title: Wenna
category: history
notes: "Written from Berrin Garth's lines on the primer (content/dialogue/cairnwold/berrin_garth.yaml: nobody has opened it since we buried Wenna, the last of us who could make sense of the shelf, and her warning about the third working). In-world, both pages are Berrin's telling (dialogue.cairnwold.berrin_garth)."
pages:
  - page: 1
    text: >
      Wenna was the last of Cairnwold who could make sense of the Resonance Primer's shelf, and the cupboard with
      the warped door has not been opened since they buried her. Berrin Garth says it plainly, without mourning in
      the voice but with a carefulness that amounts to it: nobody has opened it since we buried Wenna, and Wenna was
      the last of us who could make sense of what is in it. The primer is three small workings — one to strike, one
      to brace, one to mend — and the book sits behind the warped door as a promise nobody has kept.
    sources:
      - { how: told, ref: dialogue.cairnwold.berrin_garth }
  - page: 2
    text: >
      Wenna left one warning behind, and Berrin hands it over with the book. Mind the third working, she used to
      say: the first two are honest, and the third asks something of you — it asks first and tells you the price
      after, and she was usually right about it, which Berrin allows was very tiresome of her. It is the last of her
      that the village has, a caution passed on with a book, and it has kept the shelf shut longer than any lock
      would have. A book on a shelf is a promise nobody is keeping, Berrin says, and Wenna is the reason nobody there
      has dared break it.
    sources:
      - { how: told, ref: dialogue.cairnwold.berrin_garth }
