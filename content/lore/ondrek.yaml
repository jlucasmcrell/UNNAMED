title: The Ondrek
category: peoples
notes: "Written from docs/MYTHOLOGY.md §Ondrek and docs/RACES.md §8 — thinking stone, the only people who read raw material as memory, at war with the Kal over the Kal stone, quietly ending, no creation account, the record as doctrine. In-world, both pages are one book (readable.ondrek), because no Ondrek stands in the frontier to be asked."
pages:
  - page: 1
    text: >
      The Ondrek are thinking stone, and whether they are Kal, or not only Kal, is the whole dispute and it is not
      settled here. They are the only people who read raw material the way others read a page, touching a stone and
      knowing its history as their own body performs a work flesh cannot. They have no account of their own making:
      they simply are, and then stop being, and they have built an entire tradition around refusing to pretend
      otherwise, so that an Ondrek scholar who invents an answer is disgraced. Their doctrine is the record — what
      is known is stone, what is stone is known, and anything else is opinion.
    sources:
      - { how: inspected, ref: readable.ondrek }
  - page: 2
    text: >
      They are few and old and quietly ending, and they know it, and they do not know why, and they will not paper
      the not-knowing over. They live inside other peoples' abandoned works and regard the walls as relatives, and
      theirs is the only culture with no hunger for land, because land is the one thing they do not consume. They
      are at war with the Kal — the Ondrek call it an argument and the Kal call it a desecration — because they
      quarry the stone the Kal hold to be waiting ancestors, and they claim to be able to tell stone that was once
      Kal from stone that never was. What they want is to continue, and they are aware that the price of continuing
      may be another people's graves.
    sources:
      - { how: inspected, ref: readable.ondrek }
