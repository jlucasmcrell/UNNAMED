title: The Road's grave
category: history
notes: "D18 SYSTEMS (needed-2): the page the-road's marker opens."
pages:
  - page: 1
    sources:
      - { how: inspected, ref: readable.road_basin_rim }
    text: >
      A stone set where the ground allows it, its face worked plain. The name on it is the name the place keeps, and under the name a line that says what the one under it was: a hand that worked here, and not a monument. Travellers set a small stone at its foot, and the pile grows by one every season.
