        text: "The Spill and the Stopped Gate: Red Echo and Monolith Megastructure environment kits from Fab, used under the Fab Standard License. The gate tender and the Gate Warden are built on Stan - The Golem by ShyrAssets (fab.com/listings/0a80c04e-ad02-4bf3-a059-f98ee9bf782e), CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/); changes: the body replaced with Red Echo pieces, rescaled rig, original animations."
