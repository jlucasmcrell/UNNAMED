  - id: ai
    title: "Use of AI in this game"
    entries:
      - ledger: [G01, G02, G03, AU05]
        text: "Some content was made with generative AI tools run locally: sound effects, ambience and the opening cue (Stable Audio); remaining image-to-3D props and flora (TRELLIS and Pixal3D); interface icons (Z-Image Turbo); magic effect flipbooks. Ambient chat: 3,000 World and Local lines were written with generative AI (DeepSeek); these lines are marked ai_generated in the content. AI-generated image textures accompany the remaining image-to-3D props and flora, UI icons and magic flipbooks. The current wardrobe uses scanned Poly Haven and ambientCG PBR materials. The opening narration and the spoken lines of the main characters of Ashen Hollow and Cairnwold were generated with ElevenLabs text-to-speech, an online service, and chosen by the developer; the game itself never connects to it, and every voiced line is also shown as text. The music was composed with ElevenLabs Music, an online service, and chosen by the developer; the game never connects to it either. The recorded sound libraries and the Fab, Cosmos and WildMesh assets were not fed to any AI model."
