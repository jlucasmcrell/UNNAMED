# OTHERREACH credits: the Credits screen reads this file (src/Presentation/Ui/CreditsPanel.cs); nothing on that screen is written in code.
# Source of truth for what to credit: ASSET_REBUILD/LICENCE_LEDGER_20261017.md. The ledger row id is in `ledger` (the maintainer's key; not shown).
#
# studio:  the first line of the screen.
# sections: shown in this order. Each has a title and entries. An entry is `text` (shown verbatim: the form its licence requires) and
#           optionally `lines` (indented lines under it) and `url`.
#   binds:   model-id prefixes (a prefix ends in "_"), or exact ids, from the art bindings that this entry credits. Content.Tests
#            fails when a model the game binds matches no entry here and is not under `first_party`.
#   ledger:  ledger ids this entry covers.
# first_party: model-id prefixes built in house (own geometry with CC0 textures, credited under the Poly Haven / ambientCG lines) or
#           made with the AI tools named in the disclosure. Not a third-party source, so they need no entry of their own.
#
# Source-of-truth note: the entries are the CREDITS_DRAFT.md text; "Pending, if adopted" items of the draft are in only once they are bound.

