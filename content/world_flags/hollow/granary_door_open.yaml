id: world.hollow.granary_door_open
kind: world_flag
schema: 1
display_key: world.hollow.granary_door_open.name
tags: [world_flag]
notes: >-
  Whether the door of the granary stands open. Set by interaction (SYSTEMS.md S-22); persisted in its cell's delta.
  It has its OWN flag rather than sharing the smithy's, because the region validator refuses two doors on one flag
  (WLD004/WLD013) - a single flag would throw both open at once and the two buildings would stop being separately
  enterable.
type: bool
default: 0
owning_system: S-22
