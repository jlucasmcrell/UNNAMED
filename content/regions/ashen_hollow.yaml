# Where the player may build (M7): boxes on the 3 m building lattice, clear of authored geometry, spawns and NPC stands.
# It sits on the four-cell corner (100, 100), so a structure there straddles both seams (ROADMAP M7 exit).
build_areas:
  - { key: build_area.hollow_crossing, box_m: [87, 87, 114, 114], max_pieces: 256 }
# Switches (M6): each stands on a structure and sets a world flag in its cell, once, when every flag it requires is set there.
# The three Quiet Stones and the Foldscar's heart (bible §16).
switches:
  - key: switch.stone_north
    structure: rock_stone_north
    flag_ref: world.foldscar.stone_north_aligned
    name: north Quiet Stone
    verb: Turn
    done_text: "The stone grinds a hand's width round and stops, square to the ring. The air beside it goes still."
  - key: switch.stone_southwest
    structure: rock_stone_southwest
    flag_ref: world.foldscar.stone_southwest_aligned
    name: south-west Quiet Stone
    verb: Turn
    done_text: "The stone turns with a sound that arrives a moment late, and settles square to the ring."
  - key: switch.stone_southeast
    structure: rock_stone_southeast
    flag_ref: world.foldscar.stone_southeast_aligned
    name: south-east Quiet Stone
    verb: Turn
    done_text: "The stone comes round into line. For a moment your shadow points two ways, then one."
  - key: switch.foldscar_heart
    structure: rock_foldscar_heart
    flag_ref: world.foldscar.steadied
    requires: [world.foldscar.stone_north_aligned, world.foldscar.stone_southwest_aligned, world.foldscar.stone_southeast_aligned]
    name: heart of the Foldscar
    verb: Steady
    locked_text: "It slides out from under your hand. Somewhere in the ring a Quiet Stone is still out of line."
    done_text: "The heart holds. The ring goes quiet all at once, and across it Tavar's shadow catches up with him."
# Barriers (M6): a footprint that blocks until a world flag in its cell is set - the fold that holds Tavar (bible §16, §17).
barriers:
  - key: barrier.foldscar_fold
    flag_ref: world.foldscar.steadied
    circle_m: [145, 42, 3]
    height_m: 2.6
    prompt: "Tavar Orr, half a breath out of true - your hand stops short of him"
