  - { npc_ref: npc.ashen_hollow.renn_vale, position_m: [46.5, 126.2], facing_deg: 90 }   # the lodge, facing its door
  - { npc_ref: npc.ashen_hollow.sel_arien, position_m: [72, 122], facing_deg: 135 }    # her survey area, looking towards the Foldscar
  - { npc_ref: npc.ashen_hollow.kera_voss, position_m: [61.6, 139.6], facing_deg: 300 }  # the smithy, by the anvil
