# G1, G2 and G3, from the design's edge list. G3 is the one the quest opens with a fitting wedge (o_open).
doors:
  - { key: door.barrowworks.g1, flag_ref: world.barrowworks.gate_g1_open, box_m: [66.0, 31.0, 66.8, 34.0], height_m: 2.4 }
  - { key: door.barrowworks.g2, flag_ref: world.barrowworks.gate_g2_open, box_m: [79.2, 58.5, 80.0, 61.5], height_m: 2.4 }
  - { key: door.barrowworks.g3, flag_ref: world.barrowworks.gate_g3_open, box_m: [48.5, 118.2, 51.5, 119.0], height_m: 2.4 }
containers: []
