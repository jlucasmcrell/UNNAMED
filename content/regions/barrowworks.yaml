switches:
  - key: switch.barrowworks.notice
    structure: r02_notice_board
    flag_ref: world.barrowworks.withdrawal_notice_read
    name: withdrawal notice
    verb: Read
    done_text: "A withdrawal notice, cut into the board and painted over twice. The service ring is closed pending a measurement that was never completed, and the signature at the foot has been struck through so hard the chisel went through the board."
  - key: switch.barrowworks.fitting_note
    structure: r07_fitting_stand
    flag_ref: world.barrowworks.fitting_note_read
    name: fitting note
    verb: Read
    done_text: "A stand of thin boards, each one a note about how a part was fitted - what it was cut to, what it was cut for, and by whose hand. The last board is blank except for a taper drawn on it and a single word: unfinished."
  - key: switch.barrowworks.diagram_rack
    structure: r07_diagram_rack
    flag_ref: world.barrowworks.diagram_rack_read
    name: diagram rack
    verb: Read
    done_text: "Rack after rack of the same drawing, each a little further from the last, and none of them finished. Whatever the ring was built to gauge, the measuring of it was still being worked out when the works stopped."
    recipe_ref: recipe.smithing.fitting_wedge
  - key: switch.barrowworks.blind_ledger
    structure: r09_blind_ledger
    flag_ref: world.barrowworks.blind_store_read
    name: blind store ledger
    verb: Read
    done_text: "A ledger in a room nothing was ever taken out of. Every column is a measurement of the same thing, taken again and again over years, and every one of them is short of the last. The final page is dated the day the works stopped, and the number on it is not a measurement at all - it is the width of the gap between what the ring gauged and what it was meant to."
  - key: switch.barrowworks.headworks_preserve
    structure: r12_preserve_control
    flag_ref: world.barrowworks.headworks_preserved
    name: retaining saddle - preserve the measure
    verb: Lock
    excludes: [world.barrowworks.headworks_dismantled]
    requirements:
      - { flag_ref: world.barrowworks.withdrawal_notice_read, location_ref: location.barrowworks.intake_hall }
      - { flag_ref: world.barrowworks.fitting_note_read, location_ref: location.barrowworks.gauge_archive }
      - { flag_ref: world.barrowworks.diagram_rack_read, location_ref: location.barrowworks.gauge_archive }
      - { flag_ref: world.barrowworks.ring_custodian_defeated, location_ref: location.barrowworks.r11_measuring_court }
    locked_text: 'Read the notice, fitting note and diagram, and stop the Custodian first. Working either saddle settles the choice.'
    done_text: "The measure is a beam of fitted segments, each one cut to a tolerance nothing in the ring could hold, and the whole of it is still true. Whatever it was for, it was made to outlast the works that built it, and it has. You leave it standing."
  - key: switch.barrowworks.headworks_dismantle
    structure: r12_dismantle_control
    flag_ref: world.barrowworks.headworks_dismantled
    name: release saddle - dismantle the measure
    verb: Open
    reward: { item_ref: item.material.iron_ingot, count: 2 }
    excludes: [world.barrowworks.headworks_preserved]
    requirements:
      - { flag_ref: world.barrowworks.withdrawal_notice_read, location_ref: location.barrowworks.intake_hall }
      - { flag_ref: world.barrowworks.fitting_note_read, location_ref: location.barrowworks.gauge_archive }
      - { flag_ref: world.barrowworks.diagram_rack_read, location_ref: location.barrowworks.gauge_archive }
      - { flag_ref: world.barrowworks.ring_custodian_defeated, location_ref: location.barrowworks.r11_measuring_court }
    locked_text: 'Read the notice, fitting note and diagram, and stop the Custodian first. Working either saddle settles the choice.'
    done_text: "The measure comes apart at the joints, because it was built to. Every segment is a length of good ash haft and a plate of worked iron, and the ring has no one left in it to measure anything with. You take it apart for what it is made of."
barriers:
